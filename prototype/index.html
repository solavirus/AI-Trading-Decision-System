/** Sprint 3.6A.2, Phase C — reuses the existing, already-tested backend write
 * (`cancelProtectionOrderOnBinanceTestnet()`/`DELETE /fapi/v1/algoOrder`) verbatim; this is only a
 * new frontend call site. Cancel Algo Order's real response carries no status field to sync an App-
 * owned local order from — a successful DELETE is itself the deterministic fact, so the local
 * STOP_LOSS/TAKE_PROFIT RealOrder (if any) is marked CANCELLED directly, same as how
 * cancelRealOrderOnTestnet() already treats a deterministic outcome. */
async function cancelAlgoOrderOnTestnet(connectionId, algoId){
  let connections;
  try{
    const res=await fetch(`${BACKEND_URL}/api/exchange/connections`);
    const json=await res.json();
    if(!json.ok) return {ok:false, error:'无法读取交易所连接列表'};
    connections=json.connections;
  }catch(e){ return {ok:false, error:'无法读取交易所连接列表'}; }
  const connection=connections.find(c=>c.id===connectionId);
  if(!connection || connection.environment!=='TESTNET') return {ok:false, error:'当前连接不是 TESTNET 环境，本版本不支持撤单'};

  let json;
  try{
    const res=await fetch(`${BACKEND_URL}/api/exchange/connections/${connectionId}/algo-orders/${encodeURIComponent(algoId)}`, {method:'DELETE'});
    json=await res.json();
  }catch(e){ return {ok:false, error:'撤单结果未知，请重新查询交易所保护单状态，避免重复操作。', ambiguous:true}; }
  if(!json.ok) return {ok:false, error:(json.error&&json.error.message)||'撤单失败', ambiguous:json.ambiguous===true};

  const localOrder=Object.values(loadRealOrders()).find(o=>o.exchangeOrderId===algoId && (o.role==='STOP_LOSS'||o.role==='TAKE_PROFIT'));
  if(localOrder){
    localOrder.status='CANCELLED';
    localOrder.sync={lastSyncedAt:new Date().toISOString(), lastSyncStatus:'SUCCESS', lastSyncError:null};
    saveRealOrder(localOrder);
  }
  return {ok:true, result:json.result};
}

/** "今日重要事件" — was a hand-written mock array (TODAY_EVENTS) that never got connected to
 * the real Xoomar calendar data added later, even after the 宏观经济 card itself went live.
 * Reads the same Store.live.macro the card uses (items with id starting "cal-"), parsing the
 * "MM/DD HH:MM（影响）" value string macro.ts builds. No separate mock fallback — same
 * loading/stub/error honesty rule as everything else. */
function renderTodayEvents(){
  const meta=Store.liveMeta.macro, live=Store.live.macro;
  if(!meta||meta.status==='loading') return `<div class="empty-hint" style="padding:10px">${iconStatusLoading()} 正在获取…</div>`;
  if(meta.status!=='ok'||!live) return `<div class="empty-hint" style="padding:10px">${iconStatusError()} 暂无真实事件数据${meta.error?`<div style="font-size:11px;color:var(--text-3);margin-top:4px">${escapeAttr(meta.error)}</div>`:''}</div>`;
  const events=live.itemsRaw.filter(it=>it.id.startsWith('cal-'));
  if(events.length===0) return `<div class="empty-hint" style="padding:10px">近期没有已知的重要事件</div>`;
  return events.map(e=>{
    const m=e.value.match(/^(\d{2}\/\d{2}) (\d{2}:\d{2})（(.+)）$/);
    const dateTime=m?`${m[1]} ${m[2]}`:e.value, impact=m?m[3]:'';
    const cls=impact.includes('高')?'pill-red':impact.includes('中')?'pill-amber':'pill-gray';
    return `<div class="event-chip"><span class="flag">${iconCalendar(15)}</span><div><div>${e.label}</div><div class="t">${dateTime}</div></div>${impact?`<span class="pill ${cls}">${impact}</span>`:''}</div>`;
  }).join('');
}

/** Lightweight periodic refresh for just the ticker strip's numbers — hits the same /api/prices
 * + /api/marketcap the full initLiveData() cycle uses, but only touches #ticker-strip's innerHTML
 * (never calls render()), so it can't interrupt a search input, an open modal, or anything else
 * on the page. Silently keeps the last known-good numbers on a transient fetch failure — this is
 * a background convenience poll, not the authoritative connection-status check (that's still
 * initLiveData()'s job). No-ops entirely when off the dashboard route (element won't exist). */
async function refreshTickerPrices(){
  if(document.hidden) return;
  if(!document.getElementById('ticker-strip')) return;
  try{
    const [pricesRes,marketCapRes]=await Promise.all([
      fetch(BACKEND_URL+'/api/prices'),
      fetch(BACKEND_URL+'/api/marketcap'),
    ]);
    if(pricesRes.ok){
      const prices=await pricesRes.json();
      prices.forEach(p=>{ const a=ASSETS.find(x=>x.symbol===p.symbol); if(a){ a.price=p.price; a.change=p.changePct; } });
    }
    if(marketCapRes.ok){
      Store.marketCap=await marketCapRes.json();
      Store.marketCapMeta={status:'ok',updatedAt:Date.now()};
    }
  }catch(err){ /* transient miss — leave last known-good numbers on screen, try again next tick */ }
  const el=document.getElementById('ticker-strip');
  if(el) el.innerHTML=renderTickerStrip();
}

function strategyNextAction(order){
  if(order.status==='ARMED'){
    const h=monitoringHealthLabel(order);
    if(h.state==='STARTING') return '监控正在启动，尚未完成第一次检查';
    if(h.state==='STALE') return '监控可能异常（'+h.detail+'），触发条件暂时无法确认';
    return '等待触发条件满足（监控运行正常）';
  }
  const m={
    READY:'等待你选择立即执行或加入监控待执行', WAITING_TRIGGER:'等待你手动执行',
    PAUSED:'已暂停，需手动恢复才会继续监控',
    TRIGGERED:'正在运行执行保护与风险检查', EXECUTION_BLOCKED:'需要你查看阻止原因并决定是否重新监控',
    ENTRY_SUBMITTED:'等待交易所成交确认', PARTIALLY_FILLED:'等待剩余数量成交或到期处理',
    POSITION_ACTIVE:'已进入持仓管理，交由 Position/Allocation/Protection 处理',
    EXPIRED:'已失效，不会再产生新的入场敞口', CANCELLED:'已取消', COMPLETED:'无需操作，可查看交易详情了解结果', ERROR:'出现错误，需要你查看后决定是否重试',
  };
  return m[order.status]||'';
}

const MONITOR_TICK_MS_KNOWN=15000;
const MONITOR_STALE_THRESHOLD_MS=MONITOR_TICK_MS_KNOWN*3;
function monitoringHealthLabel(order){
  const ms=order.monitoringState;
  if(!ms||!ms.lastCheckedAt) return {state:'STARTING', label:'正在启动', cls:'pill-gray', detail:'尚未完成第一次检查'};
  const sinceChecked=Date.now()-new Date(ms.lastCheckedAt).getTime();
  if(sinceChecked>MONITOR_STALE_THRESHOLD_MS) return {state:'STALE', label:'异常', cls:'pill-red', detail:'监控长时间未更新'};
  if(!ms.lastObservedDataAt||(Date.now()-new Date(ms.lastObservedDataAt).getTime())>MONITOR_STALE_THRESHOLD_MS){
    return {state:'STALE', label:'异常', cls:'pill-amber', detail:'行情长时间未更新'};
  }
  return {state:'RUNNING', label:'正常', cls:'pill-green', detail:'最近检查 '+relTimeReal(new Date(ms.lastCheckedAt).getTime())};
}

/** Sprint 3.6B.2.1, Section 9/10 — "current" and "historical" are now two genuinely separate backend
 * fields, not one field read two ways: `order.execution.protectionStatus` is frozen the instant
 * `status` becomes COMPLETED (never repurposed to describe current truth — Section 3), so it always
 * renders as "历史". Current-after-close truth comes from `order.execution.postCloseProtectionState`
 * (`reconcileClosedPositionProtection()`, backend) — never assumed "no protection" just because the
 * Position is gone; `null`/`PENDING` genuinely means "not yet confirmed", shown honestly as 核实中. */
const POST_CLOSE_PROTECTION_LABEL={ORPHANED_PROTECTION:'⚠ 遗留保护单', CONFIRMED_NONE:'当前无活动保护', PENDING:'核实中', READ_FAILED:'无法核实'};
function renderStrategyOrderProtectionRow(order){
  if(!(order.execution&&order.execution.filledQuantity>0)) return '';
  const ps=order.execution.protectionStatus;
  if(order.status==='COMPLETED'){
    const pcs=order.execution.postCloseProtectionState; // null | PENDING | ORPHANED_PROTECTION | CONFIRMED_NONE | READ_FAILED
    const label=POST_CLOSE_PROTECTION_LABEL[pcs]||POST_CLOSE_PROTECTION_LABEL.PENDING;
    const cls=pcs==='ORPHANED_PROTECTION'?'pill-red':pcs==='CONFIRMED_NONE'?'pill-gray':pcs==='READ_FAILED'?'pill-amber':'pill-amber';
    const historical=`<span class="small-note">历史（持仓期间）：${escapeAttr(PROTECTION_STATUS_LABEL[ps]||ps)}</span>`;
    if(pcs==='ORPHANED_PROTECTION'){
      // Sprint 3.7, Section 67 — `activeOrphanProtectionOrderIds` (backend, set alongside
      // `postCloseProtectionState` by reconcileClosedPositionProtection()) holds only the
      // exchangeOrderIds the MOST RECENT real read confirmed are still live — never the full
      // historical `protectionOrders` array, which also includes orders the exchange itself later
      // REJECTED/CANCELED (a real, disclosed count-precision bug found during 3.6B.2.1's own real
      // TESTNET verification: 2 historical orders, only 1 genuinely still live).
      const activeIds=new Set(order.execution.activeOrphanProtectionOrderIds||[]);
      const orphanOrders=(order.execution.protectionOrders||[]).filter(p=>p.exchangeOrderId&&activeIds.has(p.exchangeOrderId));
      const detail=orphanOrders.map(p=>{
        const triggerPrice=p.role==='STOP_LOSS'?order.executionIntent.stopLoss:(order.executionIntent.takeProfit||[])[p.targetIndex||0]?.price;
        return `${p.role==='STOP_LOSS'?'STOP_MARKET':'TAKE_PROFIT_MARKET'} · trigger ${triggerPrice!=null?triggerPrice:'—'} · qty ${p.quantity!=null?p.quantity:'—'}`;
      }).join('<br>');
      return `<div class="row"><span class="k">保护状态</span><span class="v"><span class="pill ${cls}">${label} ${orphanOrders.length}笔</span> ${historical}
        <div class="small-note" style="margin-top:4px">持仓已关闭，但本策略提交的止损/止盈仍在交易所生效，未自动撤销：<br>${detail}</div>
        <div style="margin-top:6px"><span data-action="nav" data-href="#/account" style="cursor:pointer; color:var(--primary)">前往账户查看 →</span></div></span></div>`;
    }
    return `<div class="row"><span class="k">保护状态</span><span class="v"><span class="pill ${cls}">当前：${label}</span> ${historical}</span></div>`;
  }
  return `<div class="row"><span class="k">保护状态</span><span class="v"><span class="pill ${ps==='PROTECTED'?'pill-green':(ps==='PROTECTION_FAILED'||ps==='PROTECTION_UNVERIFIED')?'pill-red':'pill-amber'}">${escapeAttr(PROTECTION_STATUS_LABEL[ps]||ps)}</span></span></div>`;
}

/** Sprint 3.6B.1, Section 3/5 — DISPLAY-ONLY mirror, never a decision-maker. The backend
 * (monitorEngine.ts) now independently completes the ENTIRE headless lifecycle — order reconciliation,
 * fill detection, position sync, allocation, protection creation AND verification — with no browser
 * required (Section 2/4/14). This function's only remaining job is to give the browser something
 * genuinely real to LOOK AT: it creates/updates a local RealOrder/RealTrade mirror from the backend's
 * already-confirmed `StrategyOrder.execution` state, using the EXISTING `applyOrderSubmissionSuccess()`
 * for the entry order shape and a plain field-copy (never a fresh decision) for protection. It
 * deliberately no longer calls `reconcileTradeProtection()` — that would be a SECOND, independent
 * protection decision-maker racing the backend's own (Section 5: "do not leave two independent
 * reconciliation owners"). `syncPositionsFromExchange()` is still called — it is a pure read+mirror,
 * never a decision, so calling it here is safe and keeps the local Position display fresh. */
async function reconcileAutoSubmittedStrategyOrders(){
  const candidates=(Store.strategyOrders||[]).filter(o=>
    ['ENTRY_SUBMITTED','PARTIALLY_FILLED','POSITION_ACTIVE'].includes(o.status)
    && o.submission && o.submission.exchangeOrderId && o.submission.exchangeConnectionId
  );
  for(const so of candidates){
    try{
      const connectionId=so.submission.exchangeConnectionId;
      let trade, order;
      if(so.tradeId){
        trade=getRealTradeById(so.tradeId);
        order=trade?Object.values(loadRealOrders()).find(o=>o.tradeId===trade.tradeId && o.role==='ENTRY'):null;
        if(!trade || !order) continue; // local mirror was deleted (e.g. Data Management reset) — never recreate silently
      } else {
        const res=await fetch(`${BACKEND_URL}/api/exchange/connections/${connectionId}/order?symbol=${encodeURIComponent(so.symbol)}&orderId=${encodeURIComponent(so.submission.exchangeOrderId)}`);
        const json=await res.json();
        if(!json.ok) continue;
        const snapshot=json.snapshot;
        const now=new Date().toISOString();
        trade={
          schemaVersion:'real-v1', tradeId:genTradeId(), symbol:so.symbol, thesisDirection:so.direction,
          analysisId:so.analysisId||null, scenarioPlanId:so.scenarioPlanId||null,
          status:'PLANNED', openedAt:null, closedAt:null, orderIds:[], positionId:null,
          createdAt:now, updatedAt:now, protectionStatus:'NOT_REQUIRED',
        };
        order={
          schemaVersion:'real-v1', orderId:genOrderId(), tradeId:trade.tradeId,
          executionId:null, analysisId:so.analysisId, scenarioPlanId:so.scenarioPlanId,
          symbol:so.symbol, side:so.direction==='LONG'?'BUY':'SELL', intent:'OPEN', role:'ENTRY',
          orderType:so.executionIntent.entryType, quantity:null,
          limitPrice:so.executionIntent.entryType==='LIMIT'?so.executionIntent.entryPrice:null, stopPrice:null,
          status:'DRAFT', filled:{quantity:0, averagePrice:null},
          createdAt:now, submittedAt:null, updatedAt:now, exchangeOrderId:null,
          sync:{lastSyncedAt:null, lastSyncStatus:null, lastSyncError:null}, exchangeSnapshot:null,
          clientOrderId:null, pendingClientOrderId:null, exchangeConnectionId:null,
        };
        trade.orderIds=[order.orderId];
        saveRealTrade(trade); saveRealOrder(order);
        applyOrderSubmissionSuccess(order, trade, snapshot, connectionId, Store.exchangeConnections||[]);
        await linkStrategyOrderToRealOrder(so.strategyOrderId, trade.tradeId, order.orderId);
        so.tradeId=trade.tradeId;
      }

      // Position display mirror — pure read, safe to call every time (never decides anything).
      await syncPositionsFromExchange(connectionId);

      // Protection — MIRROR the backend's already-verified truth, never re-decide it locally.
      const freshTrade=getRealTradeById(trade.tradeId);
      if(freshTrade && so.execution && freshTrade.protectionStatus!==so.execution.protectionStatus){
        freshTrade.protectionStatus=so.execution.protectionStatus;
        saveRealTrade(freshTrade);
      }
      if(so.execution && Array.isArray(so.execution.protectionOrders)){
        const localOrders=loadRealOrders();
        so.execution.protectionOrders.forEach(po=>{
          if(!po.exchangeOrderId) return; // not yet confirmed by the backend — nothing real to mirror
          const already=Object.values(localOrders).find(o=>o.tradeId===trade.tradeId && o.exchangeOrderId===po.exchangeOrderId);
          if(already) return; // idempotent — never create a second local record for the same real order
          const now=new Date().toISOString();
          saveRealOrder({
            schemaVersion:'real-v1', orderId:genProtectionOrderId(), tradeId:trade.tradeId,
            executionId:null, analysisId:so.analysisId, scenarioPlanId:so.scenarioPlanId,
            symbol:so.symbol, side:so.direction==='LONG'?'SELL':'BUY', intent:'CLOSE', role:po.role,
            orderType: po.role==='STOP_LOSS'?'STOP_MARKET':'TAKE_PROFIT_MARKET',
            quantity:po.quantity, limitPrice:null, stopPrice:null,
            status:'SUBMITTED', filled:{quantity:0, averagePrice:null},
            createdAt:now, submittedAt:now, updatedAt:now,
            exchangeOrderId:po.exchangeOrderId, clientOrderId:po.pendingClientOrderId,
            pendingClientOrderId:null, exchangeConnectionId:connectionId,
            targetIndex:po.targetIndex, portion:null,
          });
        });
      }
    }catch(e){ /* transient — retried on next load, never partial/duplicate (idempotent on tradeId/exchangeOrderId presence) */ }
  }
}
async function loadMonitoringPageData(){
  try{
    Store.strategyOrders=await fetchStrategyOrders();
    await reconcileAutoSubmittedStrategyOrders();
  }catch(e){ Store.strategyOrders=Store.strategyOrders||[]; }
  const mp=ensureMonitoringPageState();
  try{ mp.killSwitch=await fetchKillSwitchState(); }catch(e){ mp.killSwitch=null; }
  if(!mp.policyEditing){ try{ mp.autoRiskPolicy=await fetchAutoRiskPolicy(); }catch(e){ mp.autoRiskPolicy=null; } }
  if(!mp.autonomousPolicyEditing){ try{ const r=await fetchAutonomousPolicy(); mp.autonomousPolicy=r.policy; mp.autonomousReadiness=r.readiness; }catch(e){ mp.autonomousPolicy=null; mp.autonomousReadiness=null; } }
  try{ mp.autonomousScheduler=await fetchAutonomousSchedulerStatus(); }catch(e){ mp.autonomousScheduler=null; }
  try{ mp.autonomousCycles=await fetchAutonomousCycles(20); }catch(e){ mp.autonomousCycles=null; }
  // Sprint 3.9.1.1, Section 23 — minimal Monitoring wiring: is ANY allowed symbol currently running
  // an analysis (Scheduled or Manual, doesn't matter — Section 12.D's "one run per symbol" already
  // guarantees at most one). Sequential, not Promise.all — allowedSymbols is a handful at most.
  mp.activeAnalysisRun=null;
  const allowedSymbols=(mp.autonomousPolicy&&mp.autonomousPolicy.allowedSymbols)||[];
  for(const s of allowedSymbols){
    const run=await fetchActiveAnalysisRun(s);
    if(run){ mp.activeAnalysisRun=run; break; }
  }
  if(currentRoute()[0]==='monitoring'){ document.getElementById('app').innerHTML=renderMonitoringPage(); wireInteractions(); }
}
function startMonitoringEventStream(){
  const mp=ensureMonitoringPageState();
  if(mp._es) return;
  let es;
  try{ es=new EventSource(`${BACKEND_URL}/api/strategy/stream`); }catch(e){ return; }
  mp._es=es;
  let refreshTimer=null;
  es.onmessage=()=>{
    if(refreshTimer) clearTimeout(refreshTimer);
    refreshTimer=setTimeout(()=>{ if(currentRoute()[0]==='monitoring') loadMonitoringPageData(); }, 1500);
  };
  es.onerror=()=>{ /* EventSource auto-reconnects; REST reload above stays the truth source regardless */ };
}
function teardownMonitoringEventStream(){
  const mp=ensureMonitoringPageState();
  if(mp._es){ try{ mp._es.close(); }catch(e){} mp._es=null; }
}
function initMonitoringPage(){
  loadMonitoringPageData();
  startMonitoringEventStream();
}

 * `Store.mostRecentAnalysisRecord` (unified, backend, both sources — populated lazily by
 * `loadMostRecentAnalysisRecord()`, same lazy-then-re-render pattern `render()` already uses for
 * `Store.strategyOrders`) takes priority once loaded; falls back to the local-only
 * `getMostRecentAiResponseRecord()` (Manual-only, but available instantly, no network round-trip) so
 * the very first paint isn't just "暂无" while the backend fetch is still in flight. */
/** Sprint 3.8C.3, Section 13 — "Legacy record 如果 source 无法确定：显示历史记录，不要猜". A record
 * cached by `cacheAnalysisRecordLocally()` (Sprint 3.9+) always has a real `source`; a record from
 * BEFORE Sprint 3.9 (when `source` didn't exist as a concept at all) has none — `undefined` is kept
 * as `undefined` here, never silently defaulted to `'MANUAL'`. `sourceLabelFor()` below is the one
 * place that turns `undefined` into the honest "历史记录" label. */
function mostRecentAnalysisForHomepage(){
  if(Store.mostRecentAnalysisRecord) return {
    analysisId:Store.mostRecentAnalysisRecord.analysisId, generatedAt:Store.mostRecentAnalysisRecord.completedAt,
    response:Store.mostRecentAnalysisRecord.response, source:Store.mostRecentAnalysisRecord.source,
  };
  const local=getMostRecentAiResponseRecord();
  return local ? {analysisId:local.analysisId, generatedAt:local.generatedAt, response:local.response, source:local.source} : null;
}
/** Sprint 3.8C.3, Section 13 — the ONE place `source` (or its absence) becomes display text/pill
 * class. `MANUAL`/`SCHEDULED` are real, backend-asserted values; anything else (including
 * `undefined`/`null`, always a pre-3.9 record) is "历史记录" — never guessed as either. */
function sourceLabelFor(source){
  if(source==='SCHEDULED') return '自动分析';
  if(source==='MANUAL') return '手动分析';
  return '历史记录';
}
function sourcePillClassFor(source){
  if(source==='SCHEDULED') return 'pill-amber';
  if(source==='MANUAL') return 'pill-primary';
  return 'pill-gray';
}
async function loadMostRecentAnalysisRecord(){
  try{
    const res=await fetch(`${BACKEND_URL}/api/analysis/records?limit=1`);

    const rec=(json.ok && json.records && json.records[0] && json.records[0].status==='COMPLETED') ? json.records[0] : null;
    Store.mostRecentAnalysisRecord=rec; // null = "checked, none yet" — never re-fetched again this session, matches the Store.strategyOrders lazy-load precedent
  }catch(err){ Store.mostRecentAnalysisRecord=null; }
  if((currentRoute()[0]||'dashboard')==='dashboard') render();
}

 * `openModal()` system is the smallest addition that satisfies "one unified list, both sources,
 * clickable". Always fetches fresh from the backend (Section 28 — this list's truth is
 * `analysis_records.json`, never a localStorage read that would silently miss every Scheduled entry). */
async function openAnalysisHistoryModal(){
  openModal(`<div class="modal-head"><h3>分析历史</h3><button class="close-x" onclick="closeModal()">✕</button></div>
    <div id="analysis-history-body"><div class="empty-hint" style="padding:20px">${iconStatusLoading()} 加载中…</div></div>`);

  try{
    const res=await fetch(`${BACKEND_URL}/api/analysis/records?limit=30`);
    const json=await res.json();
    if(json.ok) records=json.records;
  }catch(err){ /* rendered as empty below */ }

  if(!body) return; // modal was closed before the fetch resolved
  if(!records.length){ body.innerHTML=`<div class="empty-hint" style="padding:20px">暂无分析历史</div>`; return; }
  // Sprint 3.8E.1, Section 1/11 — every record is now clickable, not just COMPLETED ones: a FAILED
  // analysis still opens (to the new raw-evidence detail modal below), it just no longer routes to
  // the Strategy page (which requires a validated decision that a FAILED run never produced).
  body.innerHTML=`<div class="kv-list">${records.map(r=>{
    const sourceLabel=sourceLabelFor(r.source);
    const pillClass=sourcePillClassFor(r.source);
    const statusText=ANALYSIS_STATUS_LABEL[r.status]||r.status;

    </div>`;
  }).join('')}</div>`;
}

/** Sprint 3.8E.1 — Analysis Observability Recovery. The one place a real, persisted AnalysisRecord's
 * full evidence chain (Input -> Built Prompt -> AI Raw Response -> Parsed Response -> Validation ->
 * Final Status) can be inspected, regardless of whether the analysis ultimately COMPLETED or FAILED.
 * Reuses the existing modal/kv-list/raw-json/pill/details CSS — no new visual language introduced,
 * per Section 11's "不要重新设计整个分析页面，只做 Truth Wiring". */
const ANALYSIS_STATUS_LABEL={COMPLETED:'已完成', SNAPSHOT_FAILED:'数据采集失败', AI_FAILED:'AI 分析失败', VALIDATION_FAILED:'响应校验失败', CANCELLED:'已取消', COLLECTING:'进行中', RETRYING_SNAPSHOT:'重试中', ANALYZING:'分析中'};
const ANALYSIS_FAILURE_STAGE_LABEL={CONFIG:'AI 连接配置', SOURCES:'数据源采集', ACCOUNT_SNAPSHOT:'账户/持仓快照', CANCELLED:'用户取消', AI_PROVIDER:'AI 请求', PARSE:'响应 JSON 解析', SCHEMA_VALIDATION:'响应 Schema 校验'};

function arDetailSection(title, bodyHtml, open){
  return `<details ${open?'open':''} style="margin-top:10px; border:1px solid var(--border); border-radius:10px; padding:8px 12px">
    <summary style="cursor:pointer; font-weight:700; font-size:13px">${title}</summary>
    <div style="margin-top:8px">${bodyHtml}</div>
  </details>`;
}
function arJsonBlock(value){
  if(value==null || value==='') return `<div class="empty-hint" style="padding:12px">无数据</div>`;
  const text = typeof value==='string' ? value : JSON.stringify(value,null,2);
  return `<div class="raw-json" style="max-height:40vh">${escapeAttr(text)}</div>`;
}

/** Last-opened record — lets the Export button reuse the already-fetched full record instead of a
 * second network round-trip; cleared implicitly whenever a different record is opened. */
let __analysisRecordDetailCache=null;

async function openAnalysisRecordDetailModal(analysisId){
  openModal(`<div class="modal-head"><h3>分析详情</h3><button class="close-x" onclick="closeModal()">✕</button></div>
    <div id="analysis-detail-body"><div class="empty-hint" style="padding:20px">${iconStatusLoading()} 加载中…</div></div>`);
  document.getElementById('modal-body').classList.add('modal-wide');
  let record=null, runFallback=null;
  try{
    const res=await fetch(`${BACKEND_URL}/api/analysis/records/${encodeURIComponent(analysisId)}`);
    const json=await res.json();
    if(json.ok) record=json.record;
  }catch(e){ /* rendered as not-found below */ }
  const body=document.getElementById('analysis-detail-body');
  if(!body) return; // modal was closed before the fetch resolved
  if(!record){ body.innerHTML=`<div class="empty-hint" style="padding:20px">未找到该分析记录（analysisId: ${escapeAttr(analysisId)}）</div>`; return; }

  // Section 7/14 — when the run never even reached BUILDING_PAYLOAD (payload is null — e.g. a
  // SNAPSHOT_FAILED before any real Input Data existed), fall back to the real, backend-owned
  // AnalysisRun's own per-source progress (Sprint 3.9.1.1) as the best available "Data Source
  // Status" — never fabricated, just a different real source for the same underlying truth.
  if(!record.payload){
    try{
      const runRes=await fetch(`${BACKEND_URL}/api/analysis/runs/${encodeURIComponent(analysisId)}`);
      const runJson=await runRes.json();
      if(runJson.ok) runFallback=runJson.run;
    }catch(e){ /* no fallback available — rendered as-is below */ }
  }
  __analysisRecordDetailCache=record;

  const statusLabel=ANALYSIS_STATUS_LABEL[record.status]||record.status;
  const failureStageLabel=record.failureStage ? (ANALYSIS_FAILURE_STAGE_LABEL[record.failureStage]||record.failureStage) : null;
  const isFailed=record.status!=='COMPLETED';

  const headerHtml=`<div class="kv-list" style="margin-bottom:6px">
    <div class="row"><span class="k">analysisId</span><span class="v mono" style="font-size:11px">${escapeAttr(record.analysisId)}</span></div>
    <div class="row"><span class="k">模式</span><span class="v"><span class="pill ${sourcePillClassFor(record.source)}">${sourceLabelFor(record.source)}</span> ${escapeAttr(record.symbol)}</span></div>
    <div class="row"><span class="k">创建 / 完成</span><span class="v mono">${escapeAttr(fmtDateTime(new Date(record.createdAt)))} → ${record.completedAt?escapeAttr(fmtDateTime(new Date(record.completedAt))):'—'}</span></div>
    <div class="row"><span class="k">分析状态</span><span class="v"><span class="pill ${isFailed?'pill-red':'pill-green'}">${escapeAttr(statusLabel)}</span></span></div>
    ${failureStageLabel?`<div class="row"><span class="k">失败阶段</span><span class="v">${escapeAttr(failureStageLabel)}</span></div>`:''}
    ${record.failureReason?`<div class="row"><span class="k">错误</span><span class="v" style="color:var(--red)">${escapeAttr(record.failureReason)}</span></div>`:''}
  </div>`;

  const dataSourceBody = record.payload
    ? `<div class="kv-list" style="margin-bottom:6px"><div class="row"><span class="k">数据质量</span><span class="v mono">不可用 ${record.payload.dataQuality.unavailableSources.length} · 部分 ${record.payload.dataQuality.partialSources.length} · 过期 ${record.payload.dataQuality.staleSources.length}</span></div></div>`
      + (record.payload.sourceSnapshots||[]).map((s)=>`<div class="row"><span class="k">${escapeAttr(s.name)}</span><span class="v">${s.status==='available'?'<span class="pill pill-green">available</span>':'<span class="pill pill-amber">partial</span>'} <span class="small-note">更新于 ${escapeAttr(fmtDateTime(new Date(s.updatedAt)))}</span></span></div>`).join('')
      + (record.payload.positionContext!==undefined ? `<div class="row"><span class="k">持仓上下文</span><span class="v">${record.payload.positionContext?('存在真实持仓：'+escapeAttr(record.payload.positionContext.side)):'确认无持仓'}</span></div>` : '')
    : (runFallback
        ? `<div class="small-note" style="margin-bottom:8px">本次分析在产生 Input Data 之前即已终止；以下为该分析任务自身记录的真实数据源采集进度。</div>`
          + (runFallback.sources||[]).map((s)=>`<div class="row"><span class="k">${escapeAttr(s.label)}</span><span class="v">${escapeAttr(s.status)}${s.lastError?(' · <span style="color:var(--red)">'+escapeAttr(s.lastError)+'</span>'):''}</span></div>`).join('')
          + (runFallback.accountSnapshot ? `<div class="row"><span class="k">账户/持仓快照</span><span class="v">${escapeAttr(runFallback.accountSnapshot.status)}${runFallback.accountSnapshot.lastError?(' · <span style="color:var(--red)">'+escapeAttr(runFallback.accountSnapshot.lastError)+'</span>'):''}</span></div>` : '')
        : `<div class="empty-hint" style="padding:12px">本次分析在产生任何输入数据之前即已终止，且对应的实时任务记录已不可用。</div>`);

  const inputBody = record.payload ? arJsonBlock(record.payload) : `<div class="empty-hint" style="padding:12px">无（本次分析未能产生 Input Data / Analysis Payload）</div>`;
  const promptBody = record.builtPrompt ? arJsonBlock(record.builtPrompt) : `<div class="empty-hint" style="padding:12px">无（本次分析未能到达 Prompt 构建阶段）</div>`;
  const rawResponseBody = (record.aiRawResponseText!=null && record.aiRawResponseText!=='') ? arJsonBlock(record.aiRawResponseText)
    : (record.aiRawResponseText==='' ? `<div class="empty-hint" style="padding:12px">AI 请求本身失败，未产生任何响应内容（见上方错误）</div>` : `<div class="empty-hint" style="padding:12px">无（本次分析未能到达 AI 调用阶段）</div>`);
  const parsedBody = record.parsedResponseRaw ? arJsonBlock(record.parsedResponseRaw) : `<div class="empty-hint" style="padding:12px">${record.failureStage==='PARSE'?'AI 原始响应不是合法 JSON，无法解析':'无'}</div>`;
  const validationBody = record.status==='COMPLETED'
    ? `<div class="row"><span class="k">结果</span><span class="v" style="color:var(--green)">通过</span></div>`
    : (record.failureStage==='PARSE'||record.failureStage==='SCHEMA_VALIDATION'
        ? `<div class="row"><span class="k">结果</span><span class="v" style="color:var(--red)">失败</span></div><div class="row"><span class="k">原因</span><span class="v">${escapeAttr(record.failureReason||'')}</span></div>`
        : `<div class="empty-hint" style="padding:12px">本次分析未到达响应校验阶段</div>`);

  body.innerHTML = `
    ${headerHtml}
    ${arDetailSection('数据源状态', dataSourceBody, true)}
    ${arDetailSection('输入数据（Analysis Payload）', inputBody, false)}
    ${arDetailSection('最终 Prompt', promptBody, false)}
    ${arDetailSection('AI 原始响应', rawResponseBody, false)}
    ${arDetailSection('解析结果（Parsed Response）', parsedBody, false)}
    ${arDetailSection('校验结果（Validation）', validationBody, true)}
    <div style="margin-top:14px; display:flex; gap:10px; justify-content:flex-end">
      ${record.status==='COMPLETED'?`<button class="btn" data-action="view-recent-analysis" data-analysis-id="${escapeAttr(record.analysisId)}" onclick="closeModal()">查看策略 →</button>`:''}
      <button class="btn btn-primary" data-action="export-analysis-record" data-analysis-id="${escapeAttr(record.analysisId)}">导出 JSON</button>
    </div>
  `;
}

/** Sprint 3.8E.1, Section 12 — client-side only; the record was already fetched in full by
 * openAnalysisRecordDetailModal() above, so no new backend export endpoint is needed. Field-
 * allowlisted (never a raw dump of whatever the backend happened to return) — this is what
 * guarantees no future backend-added field can leak into an export without a conscious decision to
 * add it here too. `aiRawResult.connectionId` is deliberately excluded (an internal reference id,
 * not needed for evidence review); no field here ever carries an API key/Authorization
 * header/secret — none of `record`'s fields ever did, confirmed by reading payloadBuilder.ts/
 * promptBuilder.ts/ai/engine.ts's own persistence boundaries. */
function exportAnalysisRecord(analysisId){
  const record=__analysisRecordDetailCache;
  if(!record || record.analysisId!==analysisId){ toast('请先打开该分析的详情后再导出'); return; }
  const exportObj={
    analysisId:record.analysisId, mode:record.source, symbol:record.symbol,
    createdAt:record.createdAt, completedAt:record.completedAt,
    status:record.status, failureStage:record.failureStage, failureReason:record.failureReason,
    dataSourceSummary: record.payload ? {
      sources:(record.payload.sourceSnapshots||[]).map((s)=>({id:s.id,name:s.name,status:s.status,updatedAt:s.updatedAt})),
      dataQuality:record.payload.dataQuality,
    } : null,
    input:record.payload,
    builtPrompt:record.builtPrompt,
    aiCallMetadata: record.aiRawResult ? {provider:record.aiRawResult.provider, model:record.aiRawResult.model, latencyMs:record.aiRawResult.latencyMs, status:record.aiRawResult.status} : null,
    aiRawResponse:record.aiRawResponseText,
    parsedResponse:record.parsedResponseRaw,
    validation: record.status==='COMPLETED' ? {result:'pass'} : ((record.failureStage==='PARSE'||record.failureStage==='SCHEMA_VALIDATION') ? {result:'fail', reason:record.failureReason} : null),
    finalResponse:record.response,
  };
  const blob=new Blob([JSON.stringify(exportObj,null,2)], {type:'application/json'});
  const url=URL.createObjectURL(blob);
  const a=document.createElement('a');
  a.href=url; a.download=`analysis_${record.analysisId}.json`;
  document.body.appendChild(a); a.click(); document.body.removeChild(a);
  URL.revokeObjectURL(url);
  toast('已导出');
}

/* ---------- Strategy generation (LEGACY / MOCK-ONLY — see the Signal model comment above) ---------- */
function generateStrategy(){
  const d=Store.draft;
  const a=assetOf(d.asset);
  const contrib=[];
  d.weights.forEach(w=>{
    const def=WEIGHT_DEFS.find(x=>x.key===w.key);
    const sig=signalFor(d.asset,w.key);
    contrib.push({label:def.label,icon:def.icon,weight:Number(w.weight),score:Math.round(sig*Number(w.weight)*1.4)});
  });
  d.evidence.forEach(ev=>{
    const sig=signalForText(ev.label);
    contrib.push({label:ev.label,icon:EVIDENCE_TYPE_ICON[ev.type]||'📎',weight:Number(ev.weight),score:Math.round(sig*Number(ev.weight)*1.4)});
  });
  contrib.forEach(c=>c.score=clamp(c.score,-100,100));
  const net=contrib.reduce((s,c)=>s+c.score,0);
  const direction = net>=0 ? 'long':'short';
  const strength=clamp(Math.abs(net)/(contrib.length*40),0,1);
  const confidence=Math.round(clamp(52+strength*43,50,96));

  const price=a.price;
  const entryLo = direction==='long'? price*0.9985 : price*0.9995;
  const entryHi = direction==='long'? price*1.0015 : price*1.0025;
  const entryMid=(entryLo+entryHi)/2;
  const stopLoss = direction==='long'? entryLo*0.976 : entryHi*1.024;
  const takeProfit = direction==='long'? entryHi*1.048 : entryLo*0.952;
  const risk=Math.abs(entryMid-stopLoss), reward=Math.abs(takeProfit-entryMid);
  const rr='1:'+(reward/risk).toFixed(2);
  const hold = strength>0.6 ? '1-3 天' : '2-4 天';
  const invalidation = direction==='long'
    ? `跌破关键支撑 ${fmtPrice(stopLoss*0.995,a.decimals)}`
    : `突破关键阻力 ${fmtPrice(stopLoss*1.005,a.decimals)}`;

  const reasoning=buildReasoning(direction,contrib);

  d.strategy={
    direction,confidence,entryLo,entryHi,entryMid,stopLoss,takeProfit,rr,hold,invalidation,
    contrib:contrib.sort((x,y)=>Math.abs(y.score)-Math.abs(x.score)),
    reasoning,
    generatedAt:new Date(MOCK_NOW),
    decimals:a.decimals,
  };
  saveDraft();
}

   AI text — only reads the already-validated, already-persisted AIResponse the Sprint 3.2C Parser
   produced. Reuses the frozen Strategy UI's visual language (card/section-title/pill/tabs/

   the isolation comments on generateStrategy()/renderStrategy()) — this never touches

/** "Current" analysis = the most recent real Analysis Payload built this session — the same
 * Store field openPromptPreviewModal() already uses to look up its Prompt Record. No new Store
 * field was invented for this notion of "current analysisId". */
function getCurrentAnalysisId(){
  return (Store.lastAnalysisPayload && Store.lastAnalysisPayload.analysisId) || null;

/** Sprint 3.8 — #/strategy always resolves via getCurrentAnalysisId() (Store.lastAnalysisPayload,
 * in-memory only, set by startAnalysisRunner()). Opening a PAST analysis from Homepage's "最近一次
 *分析" link would otherwise hit missing_analysis_id even though a valid, persisted AIResponseRecord
 * exists — this rehydrates Store.lastAnalysisPayload from the already-persisted AnalysisPayload
 * (qa_analysis_payloads) before navigating, no new AI/network call involved. */
/** Sprint 3.9, Section 11/33 — a SCHEDULED analysis never has a local `qa_analysis_payloads` entry
 * (it was never built by this browser at all — Section 28: Scheduled truth is backend-owned). Falls
 * back to `GET /api/analysis/records/:id` and caches it locally (same shim `startAnalysisRunner()`
 * uses) before navigating, so opening a Scheduled record from Homepage/History works exactly like
 * opening a Manual one. */
async function openAnalysisResult(analysisId){
  let payload=getAnalysisPayload(analysisId);
  if(!payload){
    try{
      const res=await fetch(`${BACKEND_URL}/api/analysis/records/${encodeURIComponent(analysisId)}`);
      const json=await res.json();
      if(json.ok && json.record && json.record.status==='COMPLETED'){
        cacheAnalysisRecordLocally(json.record);
        payload=json.record.payload;
      }
    }catch(err){ /* fall through to the not-found toast below */ }
  }
  // Sprint 3.8 hotfix — a missing AnalysisPayload must never silently fall through to whatever
  // Store.lastAnalysisPayload already happened to hold (a different, possibly-stale analysis from
  // earlier in the session) — that would open the WRONG analysis's Strategy page with no indication
  // anything was wrong. An honest, explicit failure instead.
  if(!payload){
    toast('该历史分析的详细数据已不存在，无法打开。');
    return;
  }
  Store.lastAnalysisPayload=payload;
  navigate('#/strategy');
}

/** Defensive shape check on an ALREADY-PERSISTED record — never re-validates raw AI text (that's
 * the Parser's job, out of scope here) and never re-applies any AI_RESPONSE_SPEC rule. Only guards
 * against a corrupted/hand-edited localStorage entry, so Strategy fails loudly
 * (invalid_response_record) instead of throwing mid-render.
 * Sprint 3.3D-B: checks the v2 shape (scenarioPlans/sourceAssessments) — a stored v1 record
 * (tradingPlan/weightContribution) is caught earlier, by isUnsupportedResponseVersion() below, so
 * it never reaches this check at all. */
function isValidStoredResponseRecord(record){
  if(!record || typeof record!=='object') return false;
  const r=record.response;
  if(!r || typeof r!=='object') return false;
  if(!r.summary || !r.decision || !Array.isArray(r.scenarioPlans) || !Array.isArray(r.sourceAssessments)) return false;
  if(!Array.isArray(r.reasoning) || !Array.isArray(r.risks) || !Array.isArray(r.evidence)) return false;
  return true;
}

/** Version gate, checked BEFORE the v2 shape check — a stored major-1 record is not "malformed",
 * it's simply a contract this UI doesn't render (Sprint 3.3D-A's clean major-version cutover; see
 * AI_RESPONSE_SPEC.md's Historical (major-version-1) Records section). This is a plain string
 * check, not a Parser re-run — Strategy never re-validates AI_RESPONSE_SPEC rules, same philosophy
 * as isValidStoredResponseRecord() above. */
function isUnsupportedResponseVersion(record){
  const m=/^(\d+)\./.exec(String(record && record.responseVersion));
  return !m || Number(m[1])!==2;
}

/** Resolves what #/strategy should show. 4 explicit failure codes (never a silent mock fallback),
 * or {ok:true, record}. */
function resolveStrategyView(){
  const analysisId=getCurrentAnalysisId();
  if(!analysisId) return {ok:false, code:'missing_analysis_id', analysisId:null};
  const record=getAiResponseRecord(analysisId);
  if(!record) return {ok:false, code:'response_record_not_found', analysisId};
  if(isUnsupportedResponseVersion(record)) return {ok:false, code:'unsupported_response_version', analysisId, responseVersion:record.responseVersion};
  if(!isValidStoredResponseRecord(record)) return {ok:false, code:'invalid_response_record', analysisId};
  return {ok:true, record};
}

/** Sprint 3.3D-B: v2 ScenarioPlan.entry formatter — MARKET/LIMIT show one price, ZONE shows a
 * range, CONDITIONAL shows its description (AI_RESPONSE_SPEC.md v2.0.0's Numeric Precision rule:
 * a WAIT plan may describe a future condition instead of a fabricated price). Returns null (never
 * a fabricated "0"/"—") only when there is truly nothing to show — the caller renders that as an
 * honest empty state, never a fake placeholder number. */
function formatScenarioEntry(entry, decimals){
  if(!entry) return null;
  if(entry.type==='CONDITIONAL') return entry.description ? `条件入场：${entry.description}` : null;
  if(entry.type==='ZONE'){
    if(entry.from==null || entry.to==null) return entry.description || null;
    return `入场区间：${fmtPrice(entry.from,decimals)} – ${fmtPrice(entry.to,decimals)}`;
  }
  if(entry.value==null) return entry.description || null;
  return `${entry.type==='MARKET'?'市价':'限价'}：${fmtPrice(entry.value,decimals)}`;
}
/** stopLoss/takeProfit items share the same {value?, description?} shape — value wins when
 * present (it's a real number the Parser already validated for an executable ENTER primary),
 * description is the WAIT/ALTERNATIVE fallback. Never fabricates a number for a null/empty item. */
function formatScenarioLevel(level, decimals){
  if(!level) return null;
  if(level.value!=null) return fmtPrice(level.value,decimals);
  return level.description || null;
}

/** Sprint 3.5D-B.1, Task 13/17 — renders an absolute expiresAt in the VIEWER's own local time zone
 * (never a hardcoded "UTC+8") with an explicit offset label, so "有效至" is never ambiguous the way
 * a bare "2026-08-10 17:00" would be. Returns null for a missing/invalid timestamp — the caller
 * falls back to reviewHorizon.description (never a fabricated date). */
function fmtExpiresAtWithZone(iso){
  if(!isNonEmptyString(iso)) return null;
  const d=new Date(iso);
  if(isNaN(d.getTime())) return null;
  const offsetMin=-d.getTimezoneOffset();
  const sign=offsetMin>=0?'+':'-';
  const abs=Math.abs(offsetMin);
  const oh=Math.floor(abs/60), om=abs%60;
  const offsetLabel = om===0 ? `UTC${sign}${oh}` : `UTC${sign}${oh}:${String(om).padStart(2,'0')}`;
  return `${fmtDateTime(d)} ${offsetLabel}`;
}

function groupReasoningByStance(reasoning){
  return {
    support: reasoning.filter(r=>r.stance==='SUPPORT'),
    oppose: reasoning.filter(r=>r.stance==='OPPOSE'),
    neutral: reasoning.filter(r=>r.stance==='NEUTRAL'),
  };
}

/** Title/description/importance only — never the model's internal chain-of-thought, which
 * AI_RESPONSE_SPEC.md never exposes to begin with (these ARE the approved reasoning summaries). */
function realReasonPanel(tab, reasoning){
  const groups=groupReasoningByStance(reasoning);
  const list=groups[tab]||[];
  if(!list.length) return `<div class="empty-hint" style="padding:20px">暂无内容</div>`;
  return `<ul class="reason-list">${list.map((it,i)=>`
    <li><span class="n">${i+1}</span>
      <div>
        <div class="fw">${escapeAttr(it.title)}</div>
        <div style="font-size:12.5px; color:var(--text-2); margin-top:2px">${escapeAttr(it.description)}</div>
        <div class="small-note" style="margin-top:4px">重要度 ${it.importance}/100 · 证据：${escapeAttr((it.evidenceReferences||[]).join('、'))}</div>
      </div>
    </li>`).join('')}</ul>`;
}

/** Looks up a display name/icon for a SourceAssessment.sourceId — WEIGHT_DEFS for the 11 system
 * sources (existing display names, reused, never re-derived), the matching additionalEvidence
 * entry for an evidence-sourced id, or the raw sourceId itself as a last resort. (Sprint 3.3D-B:
 * renamed from weightContributionDisplayName() — same lookup, v2's SourceAssessment uses the same
 * sourceId space as v1's WeightContribution did.) */
function sourceAssessmentDisplayName(sourceId, payload){
  const def=WEIGHT_DEFS.find(w=>w.key===sourceId);
  if(def) return {label:def.label, icon:def.icon};
  const ev=payload && Array.isArray(payload.additionalEvidence) ? payload.additionalEvidence.find(e=>e.id===sourceId) : null;
  if(ev) return {label:ev.title||ev.type||sourceId, icon:'📎'};
  return {label:sourceId, icon:'🔹'};
}
/** Sprint 3.3D-B: renamed from influenceLevelPillClass() — same LOW/MEDIUM/HIGH -> pill mapping,
 * now used for SourceAssessment.evidenceStrength (v2 dropped the numeric influenceLevel it used
 * to describe). */
function evidenceStrengthPillClass(level){ return level==='HIGH' ? 'pill-primary' : level==='MEDIUM' ? 'pill-amber' : 'pill-gray'; }
function riskImpactPillClass(impact){ return impact==='HIGH' ? 'pill-red' : impact==='MEDIUM' ? 'pill-amber' : 'pill-gray'; }

/** Source-level direction (Task 18: LONG/SHORT/NEUTRAL allowed here, unlike the final decision).
 * Reuses the same green/red convention as the top-level direction; NEUTRAL is deliberately
 * "quieter" (muted text color, gray pill) so it doesn't visually compete with a real LONG/SHORT
 * read from other sources in the same list. */
function sourceDirectionColor(direction){ return direction==='LONG' ? 'var(--green)' : direction==='SHORT' ? 'var(--red)' : 'var(--text-3)'; }
function sourceDirectionLabel(direction){ return {LONG:'LONG ↑', SHORT:'SHORT ↓', NEUTRAL:'NEUTRAL —'}[direction] || direction; }

/** ScenarioPlan.priority display (Task 8) — PRIMARY visually strongest (pill-primary), the other
 * two intentionally quieter. Only these 3 values are ever valid (Parser-enforced); no ranking
 * beyond them is invented here. */
function scenarioPriorityMeta(priority){
  return {
    PRIMARY: {label:'主要方案', pillClass:'pill-primary'},
    ALTERNATIVE: {label:'备选方案', pillClass:'pill-amber'},
    INVALIDATION: {label:'失效方案', pillClass:'pill-gray'},
  }[priority] || {label:priority, pillClass:'pill-gray'};
}

/** Sprint 3.3D-B: one ScenarioPlan -> one card, reusing the existing plan-item/plan-grid/pill
 * visual language (same classes the old single-plan Trading Plan module already used). Makes the
 * decision.action (now) vs plan.action (once triggered) distinction explicit in wording (Task 9)
 * rather than relying on the reader to infer it, and tags the PRIMARY plan "当前可执行" only when
 * decision.action='ENTER' actually makes it so (Task 11) — never for a WAIT PRIMARY, which is a
 * real plan but not yet actionable.
 * Sprint 3.3D-C: minimal display additions for the v2.1 completeness fields — invalidation and
 * reviewHorizon get compact rows (still no raw JSON dump); a "可结构化监控" badge appears only when
 * isMachineEvaluableTrigger() (system-side, not an AI-declared flag) confirms triggerStructured
 * uses only supported metrics/operators. No NOTIFY/AUTO buttons, no monitoring — display only. */
function renderScenarioPlanCard(plan, decision, decimals, analysisId){
  const meta=scenarioPriorityMeta(plan.priority);
  const isActionableNow = plan.priority==='PRIMARY' && decision.action==='ENTER';
  const entryText=formatScenarioEntry(plan.entry, decimals);
  const slText=formatScenarioLevel(plan.stopLoss, decimals);
  const tpTexts=(plan.takeProfit||[]).map(tp=>formatScenarioLevel(tp,decimals)).filter(Boolean);
  const canMonitor=isMachineEvaluableTrigger(plan.triggerStructured);
  const expiresAtText=plan.reviewHorizon?fmtExpiresAtWithZone(plan.reviewHorizon.expiresAt):null;
  // Sprint 3.5D-B.1, Task 21 — 手动执行/触发时提醒 must respect execution readiness (the SAME
  // evaluateScenarioExecutionReadiness() the Parser/Execution/TESTNET gates use, Task 20) — a
  // numerically incomplete plan (e.g. a historical CONDITIONAL-only record, Task 24) never reaches
  // TESTNET submission just because a user manually patches values downstream in Execution.
  const readiness=evaluateScenarioExecutionReadiness(plan, decision, new Date());
  // Sprint 3.4B, Task 7/6: NOTIFY eligibility is a SYSTEM determination (reuses the exact same
  // isMachineEvaluableTrigger() the badge already used since 3.3D-C) — never trusted from AI text.
  const relevantDraft=analysisId?findRelevantExecutionDraft(analysisId, plan.id):null;
  return `<div class="card-pad" style="border:1px solid var(--border); border-radius:10px; margin-bottom:10px; padding:14px">
    <div style="display:flex; align-items:center; justify-content:space-between; gap:10px; flex-wrap:wrap; margin-bottom:8px">
      <div style="display:flex; align-items:center; gap:8px; flex-wrap:wrap">
        <span class="pill ${meta.pillClass}">${meta.label}</span>
        ${isActionableNow?`<span class="pill pill-primary">当前可执行</span>`:''}
        ${canMonitor?`<span class="pill pill-gray">可结构化监控</span>`:''}
        ${!readiness.ready?`<span class="pill pill-red">缺少可执行数值参数</span>`:''}
        ${scenarioMonitorBadge(relevantDraft)}
        <span style="font-weight:700">${escapeAttr(plan.title)}</span>
      </div>
      <span style="font-size:12.5px; font-weight:700; color:${plan.direction==='LONG'?'var(--green)':'var(--red)'}">${plan.direction==='LONG'?'LONG ↑':'SHORT ↓'}</span>
    </div>
    <div class="small-note" style="margin-bottom:6px">${decision.action==='WAIT'?'等待条件':'触发条件'}：${escapeAttr(plan.trigger)}</div>
    <div class="small-note" style="margin-bottom:10px">${decision.action==='WAIT'?`满足以后：自动提交${entryText?escapeAttr(entryText):'入场订单'}`:'现在执行：'+(entryText?escapeAttr(entryText):'按下方参数下单')}</div>
    ${(entryText||slText||tpTexts.length||plan.holdingPeriod||expiresAtText) ? `<div class="plan-grid">
      ${entryText?`<div class="plan-item"><span class="pic">🎯</span><div><div class="pk">入场</div><div class="pv mono">${escapeAttr(entryText)}</div></div></div>`:''}
      ${slText?`<div class="plan-item"><span class="pic">🛡️</span><div><div class="pk">止损</div><div class="pv mono down">${escapeAttr(slText)}</div></div></div>`:''}
      ${tpTexts.length?`<div class="plan-item"><span class="pic">🚩</span><div><div class="pk">止盈</div><div class="pv mono up">${tpTexts.map((t,i)=>tpTexts.length>1?`TP${i+1}: ${t}`:t).join('、')}</div></div></div>`:''}
      ${plan.holdingPeriod?`<div class="plan-item"><span class="pic">⏱️</span><div><div class="pk">建议持仓周期</div><div class="pv">${escapeAttr(plan.holdingPeriod)}</div></div></div>`:''}
      ${expiresAtText?`<div class="plan-item"><span class="pic">⏳</span><div><div class="pk">有效至</div><div class="pv mono">${escapeAttr(expiresAtText)}</div></div></div>`:''}
    </div>` : ''}
    ${plan.invalidation && plan.invalidation.description?`<div class="small-note" style="margin-top:8px">方案失效条件：${escapeAttr(plan.invalidation.description)}</div>`:''}
    ${plan.reviewHorizon && plan.reviewHorizon.description?`<div class="small-note" style="margin-top:4px">有效/复核周期：${escapeAttr(plan.reviewHorizon.description)}</div>`:''}
    ${plan.rationale?`<div style="font-size:12.5px; color:var(--text-2); margin-top:8px">${escapeAttr(plan.rationale)}</div>`:''}
    ${!readiness.ready?`<div class="small-note" style="margin-top:8px; color:var(--red)">该方案缺少可执行数值参数：${escapeAttr(readiness.reasons.join('；'))}</div>`:''}
    <div style="display:flex; gap:8px; align-items:center; margin-top:10px; flex-wrap:wrap">
      ${readiness.ready
        ? `<button class="btn ${isActionableNow?'btn-primary':'btn-secondary'} btn-sm" data-action="manual-execute-scenario" data-analysis-id="${escapeAttr(analysisId)}" data-plan-id="${escapeAttr(plan.id)}">手动执行</button>`
        : `<button class="btn btn-secondary btn-sm" disabled title="方案缺少可执行数值参数">手动执行</button>`}
      ${!readiness.ready ? ''
        : canMonitor
          ? `<button class="btn btn-secondary btn-sm" data-action="notify-execute-scenario" data-analysis-id="${escapeAttr(analysisId)}" data-plan-id="${escapeAttr(plan.id)}">触发时提醒</button>`
          : `<span class="small-note">该方案暂不支持自动条件监控</span>`}
      ${readiness.ready && mapScenarioTriggerToStrategyTrigger(plan.triggerStructured)
        ? `<button class="btn btn-secondary btn-sm" data-action="arm-strategy-order" data-analysis-id="${escapeAttr(analysisId)}" data-plan-id="${escapeAttr(plan.id)}">加入监控待执行</button>`

}

/** Maps one validated v2 AIResponseRecord into the frozen 5-module Strategy layout (Summary /

 * Sprint 3.3D-B, replacing the old singular Trading Plan / Weight Contribution; modules 1/4/5 keep
 * their v1 shape almost unchanged since reasoning/risks/evidence didn't change in AI_RESPONSE_SPEC
 * v2.0.0. Execution wiring is explicitly out of scope, so no "执行策略" action is offered here.

/** Sprint 3.9, Section 27 — "如果存在 Position Management Decision：在分析详情里增加一个简洁区块".
 * Renders nothing (empty string) when the analysis had no existing position — every pre-3.9 record,
 * and every Manual/Scheduled record for a symbol with no open position, is completely unaffected.
 * Deliberately just a label + rationale, no action buttons — Section 17: this version only records
 * the recommendation, it never offers a way to execute it. */
function renderPositionManagementBlock(pm){
  if(!pm) return '';
  const actionMeta={
    HOLD:{label:'继续持有', pillClass:'pill-gray'},
    ADJUST_SL:{label:'建议调整止损', pillClass:'pill-amber'},

  }[pm.action] || {label:pm.action, pillClass:'pill-gray'};

  if(pm.action==='ADJUST_SL' && pm.newStopLoss!=null) detailParts.push(`建议新止损：${fmt(pm.newStopLoss,2)}`);
  if(pm.action==='ADJUST_TP' && pm.newTakeProfit!=null) detailParts.push(`建议新止盈：${fmt(pm.newTakeProfit,2)}`);

      <span class="small-note">置信度 ${pm.confidence}%</span>

    </div>
    <div style="font-size:12.5px; color:var(--text-2)">${escapeAttr(pm.rationale)}</div>

  </div>`;
}

/** #/strategy's single entry point (Sprint 3.3A) — replaces the old Store.draft.strategy guard.
 * Never falls back to the legacy mock renderStrategy(). */
function renderStrategyPage(){
  const view=resolveStrategyView();
  if(!view.ok) return renderStrategyUnavailable(view.code, view.analysisId);
  return renderStrategyReal(view.record);
}

/* ---------- Sprint 3.4A: real ExecutionDraft (MANUAL only) ----------
   Connects a real Strategy v2 ScenarioPlan to a real, mutable ExecutionDraft. Completely separate
   from the legacy mock Store.draft.strategy/ensureExecDraft()/renderExecution()/confirmExecution()
   below — those are unreachable dead code (generateStrategy() has zero call sites, confirmed by
   search), kept only for isolation per this project's established convention, and the real v2 path
   never touches them. Core boundary: AIResponse (ScenarioPlan) is immutable; ExecutionDraft is
   mutable. The draft never copies the whole ScenarioPlan — only analysisId + scenarioPlanId are
   stored, and the original recommendation is always re-resolved from the immutable
   AIResponseRecord, so "what did AI recommend" can never drift from "what did the user do." */
function genExecutionId(){ return 'EX'+Date.now().toString(36).toUpperCase()+Math.random().toString(36).slice(2,6).toUpperCase(); }

function loadExecutionDrafts(){
  try{ const raw=localStorage.getItem('qa_execution_drafts'); if(raw) return JSON.parse(raw); }catch(e){}
  return {};
}
function saveExecutionDraftMap(map){ localStorage.setItem('qa_execution_drafts', JSON.stringify(map)); }
function getExecutionDraft(executionId){ return loadExecutionDrafts()[executionId]||null; }
/** Never overwrites an unrelated draft — writes only this one key into the map, same pattern as
 * saveAnalysisPayload()/savePromptRecord() elsewhere in this file. */
function saveExecutionDraft(draft){
  draft.updatedAt=new Date().toISOString();
  const map=loadExecutionDrafts();
  map[draft.executionId]=draft;
  saveExecutionDraftMap(map);
  return draft;
}

function isValidExecutionDraft(draft){
  return !!draft && typeof draft==='object' && isNonEmptyString(draft.analysisId) && isNonEmptyString(draft.scenarioPlanId)
    && ['DRAFT','CONFIRMED','CANCELLED'].includes(draft.status);
}

/** Resolves the immutable AI recommendation a draft points at — never re-parses raw AI text, never
 * re-runs the Parser, only reads the already-validated AIResponseRecord (same trust model as
 * resolveStrategyView()). */
function resolveScenarioPlan(analysisId, scenarioPlanId){
  const record=getAiResponseRecord(analysisId);
  if(!record) return null;
  const plan=(record.response.scenarioPlans||[]).find(p=>p.id===scenarioPlanId);
  return plan ? {record, plan} : null;
}

/** Task 18 (3.4A) / Task 8 (3.4B): reopening an existing DRAFT (e.g. a page reload landing back on
 * #/execution/:id) never creates anything — this is the only creation path. Reuses an existing
 * non-terminal draft for the same (analysisId, scenarioPlanId, executionMode) rather than minting a
 * duplicate: for MANUAL, any status='DRAFT' draft (unchanged 3.4A behavior); for NOTIFY, one whose
 * triggerStatus is still PENDING or TRIGGERED (i.e. genuinely still "in flight" — a CONFIRMED/
 * CANCELLED/INVALIDATED/EXPIRED draft is terminal and a fresh click starts a new one). */
function createOrReuseExecutionDraft(analysisId, scenarioPlanId, executionMode){
  executionMode = executionMode || 'MANUAL';
  const existing=Object.values(loadExecutionDrafts()).find(d=>
    d.analysisId===analysisId && d.scenarioPlanId===scenarioPlanId && d.executionMode===executionMode && d.status==='DRAFT'
    && (executionMode!=='NOTIFY' || ['PENDING','TRIGGERED'].includes(d.triggerStatus))
  );
  if(existing) return existing;
  const now=new Date().toISOString();
  const draft={
    executionId:genExecutionId(),
    analysisId, scenarioPlanId,
    executionMode, // 'MANUAL' | 'NOTIFY' (Sprint 3.4B) — AUTO is future scope, never generated here
    createdAt:now, updatedAt:now,
    userOverrides:{ entry:null, stopLoss:null, takeProfit:null, positionSize:null, leverage:null, notes:'', orderResolution:null },
    status:'DRAFT',
    // Sprint 3.4B: TriggerStatus is a SEPARATE axis from `status` — status is what the USER has done
    // with the draft (still deciding / confirmed / cancelled); triggerStatus is what the MONITOR has
    // observed (not watching / watching / fired / voided / timed out / stopped). MANUAL never gets
    // monitored, so it starts (and stays) NOT_MONITORED.
    triggerStatus: executionMode==='NOTIFY' ? 'PENDING' : 'NOT_MONITORED',
    monitoring: executionMode==='NOTIFY' ? { startedAt:now, lastCheckedAt:null, triggeredAt:null, invalidatedAt:null, expiredAt:null, lastObservedDataAt:null } : null,
  };
  saveExecutionDraft(draft);
  return draft;
}

/** Resolves everything renderExecutionDraftPage()/confirmExecutionDraft() need in one place — the
 * single source of truth for "is this executionId usable right now," so render and confirm can
 * never disagree about validity. */
function resolveExecutionView(executionId){
  if(!isNonEmptyString(executionId)) return {ok:false, code:'missing_execution_id', executionId:null};
  const draft=getExecutionDraft(executionId);
  if(!draft) return {ok:false, code:'execution_draft_not_found', executionId};
  if(!isValidExecutionDraft(draft)) return {ok:false, code:'invalid_execution_draft', executionId};
  const record=getAiResponseRecord(draft.analysisId);
  if(!record) return {ok:false, code:'analysis_response_not_found', executionId};
  if(isUnsupportedResponseVersion(record)) return {ok:false, code:'unsupported_response_version', executionId};
  const plan=(record.response.scenarioPlans||[]).find(p=>p.id===draft.scenarioPlanId);
  if(!plan) return {ok:false, code:'scenario_plan_not_found', executionId};
  const payload=getAnalysisPayload(draft.analysisId);
  return {ok:true, executionId, draft, record, plan, payload, decision:record.response.decision};
}

/** Task 10 — the ONE place AI ScenarioPlan + user overrides are combined into what the user would
 * actually act on. Used by both rendering (so the form's starting values are correct) and
 * confirmation (so "what was confirmed" is computed identically to what was shown) — no duplicated
 * resolution logic. An absent/null override field means "use the AI recommendation as-is." */
function effectiveExecutionPlan(plan, overrides){
  const o=overrides||{};
  return {
    direction:plan.direction,
    entry: o.entry!=null ? o.entry : plan.entry,
    stopLoss: o.stopLoss!=null ? o.stopLoss : plan.stopLoss,
    takeProfit: o.takeProfit!=null ? o.takeProfit : plan.takeProfit,
    positionSize: o.positionSize!=null ? o.positionSize : null, // AI never recommends this — no AI fallback exists
    leverage: o.leverage!=null ? o.leverage : null,              // same — user-only field
    holdingPeriod:plan.holdingPeriod,
    reviewHorizon:plan.reviewHorizon,
    notes: o.notes||'',
  };
}

/** Lazily snapshots the AI's current value into userOverrides on first touch of that field GROUP
 * only (Task 10: "do not blindly copy all AI values into overrides during draft creation") — entry/
 * stopLoss/takeProfit are each snapshotted independently, only when the user actually edits
 * something inside that group, never all three at once and never at draft-creation time. */
function exec2EnsureOverrideEntry(draft, plan){ if(!draft.userOverrides.entry) draft.userOverrides.entry={...plan.entry}; return draft.userOverrides.entry; }
function exec2EnsureOverrideStopLoss(draft, plan){ if(!draft.userOverrides.stopLoss) draft.userOverrides.stopLoss={...plan.stopLoss}; return draft.userOverrides.stopLoss; }
function exec2EnsureOverrideTakeProfit(draft, plan){ if(!draft.userOverrides.takeProfit) draft.userOverrides.takeProfit=plan.takeProfit.map(tp=>({...tp})); return draft.userOverrides.takeProfit; }

/** Sprint 3.5D-E, Task C — the take-profit portion rule, enforced everywhere a full trade plan is
 * considered eligible for TESTNET submission. AI_RESPONSE_SPEC.md does not currently define a
 * `portion` field (checked before writing this — Task A's "Before Coding" inspection), so this is
 * purely a `userOverrides`-side concept: if a `takeProfit[i].portion` happens to already be present
 * (e.g. carried through from `plan.takeProfit[i].portion` on first touch, Task C's "if AI already
 * provides portion, use it as the initial suggested value"), it is used as-is; otherwise the user MUST
 * fill it in — this function never invents an equal split. Every rule is strict, not clamped: >0 per
 * target, sum EXACTLY 100 (floating-point tolerance 1e-6 only, never a real rounding allowance). */
function validateTakeProfitPortions(takeProfitList){
  const list=takeProfitList||[];
  if(list.length===0) return {ok:false, reason:'至少需要一个止盈目标'};
  let sum=0;
  for(let i=0;i<list.length;i++){
    const p=list[i].portion;
    if(!isFiniteNumber(p)) return {ok:false, reason:`止盈目标 ${i+1} 缺少止盈比例（portion）`};
    if(p<=0) return {ok:false, reason:`止盈目标 ${i+1} 的止盈比例必须大于 0`};
    sum+=p;
  }
  if(Math.abs(sum-100)>1e-6) return {ok:false, reason:`全部止盈比例之和必须恰好为 100%（当前为 ${sum}%）`};
  return {ok:true};
}

/* ---------- Sprint 3.4C: real Order + Trade domain objects (v1) ----------
   Per the approved Sprint 3.4C design report: ExecutionDraft (user intent) -> Order (an instruction
   intended for a venue) -> Position (actual exposure) -> Trade (the whole lifecycle). This sprint
   implements Order + Trade only. Position is deliberately NOT implemented — no exchange fills exist
   in this prototype, and a Position must only ever be derived from a real fill (never from
   confirmation alone), so creating one now would be fake. CONFIRMED still never means submitted/
   filled/opened — it only unlocks local Trade(PLANNED) + Order(DRAFT) creation. */

function genOrderId(){ return 'OR'+Date.now().toString(36).toUpperCase()+Math.random().toString(36).slice(2,6).toUpperCase(); }
function genTradeId(){ return 'TR'+Date.now().toString(36).toUpperCase()+Math.random().toString(36).slice(2,6).toUpperCase(); }

const REAL_ORDER_STATUS_LABEL={DRAFT:'草稿',SUBMITTED:'已提交',PARTIALLY_FILLED:'部分成交',FILLED:'已成交',CANCELLED:'已取消',REJECTED:'被拒绝',EXPIRED:'已过期'};
const REAL_TRADE_STATUS_LABEL={PLANNED:'计划中',OPENING:'开仓中',OPEN:'持仓中',CLOSING:'平仓中',CLOSED:'已平仓',CANCELLED:'已取消'};

/** Separate persistence keys (design report Task 28/5) — never mixed with qa_execution_drafts
 * (different lifecycle length) and never qa_trades (legacy mock, fake PnL, incompatible semantics). */
function loadRealOrders(){
  try{ const raw=localStorage.getItem('qa_orders'); if(raw) return JSON.parse(raw); }catch(e){}
  return {};
}
function saveRealOrderMap(map){ localStorage.setItem('qa_orders', JSON.stringify(map)); }
function saveRealOrder(order){ order.updatedAt=new Date().toISOString(); const map=loadRealOrders(); map[order.orderId]=order; saveRealOrderMap(map); return order; }
function getRealOrderById(orderId){ return loadRealOrders()[orderId]||null; }

function loadRealTrades(){
  try{ const raw=localStorage.getItem('qa_trades_real'); if(raw) return JSON.parse(raw); }catch(e){}
  return {};
}
function saveRealTradeMap(map){ localStorage.setItem('qa_trades_real', JSON.stringify(map)); }
function saveRealTrade(trade){ trade.updatedAt=new Date().toISOString(); const map=loadRealTrades(); map[trade.tradeId]=trade; saveRealTradeMap(map); return trade; }
function getRealTradeById(tradeId){ return loadRealTrades()[tradeId]||null; }
/** Idempotency key (Task 8): one confirmed ExecutionDraft never produces more than one initial
 * RealTrade — this is the lookup confirmExecutionDraft() checks before creating anything. */
function getRealTradeByExecutionId(executionId){
  return Object.values(loadRealTrades()).find(tr=>Array.isArray(tr.executionIds) && tr.executionIds.includes(executionId)) || null;
}

/** The ONE place a ScenarioPlan's effective entry resolves into something an Order can actually use
 * (design report Task 8-13). Returns {ok:false, reason} — never a fabricated price/type — when the
 * plan isn't yet resolvable (ZONE/CONDITIONAL without a user-chosen executable price); confirmation
 * itself is blocked on {ok:false} rather than creating a half-usable Order. */
function resolveEntryOrderSpec(plan, effective, userOverrides){
  const entryType=plan.entry.type;
  const resolution=(userOverrides && userOverrides.orderResolution) || {};
  if(entryType==='MARKET') return {ok:true, orderType:'MARKET', limitPrice:null};
  if(entryType==='LIMIT'){
    if(!isFiniteNumber(effective.entry.value)) return {ok:false, reason:'该方案是限价入场，请先在"你的执行参数"中填写有效的限价数值，再确认执行。'};
    return {ok:true, orderType:'LIMIT', limitPrice:effective.entry.value};
  }
  if(entryType==='ZONE'){
    if(!isFiniteNumber(resolution.price)) return {ok:false, reason:'该方案是区间入场，请先在"实际订单"中填写你要挂单的具体价格，再确认执行。'};
    return {ok:true, orderType:'LIMIT', limitPrice:resolution.price};
  }
  if(entryType==='CONDITIONAL'){
    if(resolution.type==='MARKET') return {ok:true, orderType:'MARKET', limitPrice:null};
    if(resolution.type==='LIMIT' && isFiniteNumber(resolution.price)) return {ok:true, orderType:'LIMIT', limitPrice:resolution.price};
    return {ok:false, reason:'该方案是条件入场，请先在"实际订单"中选择市价，或选择限价并填写价格，再确认执行。'};
  }
  return {ok:false, reason:'未知的入场类型，无法生成订单。'};
}
