<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Quant Assistant · 交互原型</title>
<style>
:root{
  /* Wizard Notebook Design System (量化/quant-assistant-wizard-prototype/docs/, 2026-08-05):
     exact tokens from design-tokens.json / wizard-tokens.css — reference-master.png is the
     approved final visual master, these values are read directly from its design-tokens.json,
     not re-derived. --ink kept as the var name for backward compat with existing SVG/CSS refs. */
  --bg:#F6F0E3; --card:#FFFDF7; --muted:#F2EBDD; --border:rgba(38,35,31,.16); --card-border:rgba(38,35,31,.82); --chip-border:rgba(81,75,67,.20);
  --ink:#26231F; --text:#26231F; --text-2:#514B43; --text-3:#81786C;
  --primary:#2CA8D6; --secondary:#6FCBEA; --primary-light:#E7F5FA; --primary-dark:#1C7FA3;
  --green:#198754; --green-light:#E3F3EA; --red:#D84D43; --red-light:#FBEAE8;
  --amber:#E68B20; --amber-light:#FCF0DF; --gold:#E3A62F; --skyblue:#3FA9D6; --blue:#4A90E2; --track:#EFE7D6;
  --radius:16px; --radius-sm:12px; --radius-tag:8px;
  --shadow:0 2px 0 rgba(38,35,31,.10), 0 8px 20px rgba(67,53,34,.035);
  --sketch-shadow:0 2px 0 rgba(38,35,31,.10), 0 8px 20px rgba(67,53,34,.035);
  --sidebar-w:264px;
}
:root[data-theme="dark"]{
  --bg:#211C15; --card:#2B2419; --muted:#332B1F; --border:rgba(240,232,212,.14); --card-border:rgba(240,232,212,.55); --chip-border:rgba(240,232,212,.16);
  --ink:#EDE6D8; --text:#EDE6D8; --text-2:#B0A695; --text-3:#7A6F5F;
  --primary:#5FC3EA; --secondary:#8FD8F5; --primary-light:#163542; --primary-dark:#3FA0C9;
  --green:#4FBF83; --green-light:#1E2E22; --red:#E2685E; --red-light:#3A211D;
  --amber:#E0A24F; --amber-light:#3A2C15; --gold:#E0BB5C; --skyblue:#6BD4F5; --blue:#6BA8EA; --track:#3A3225;
  --shadow:0 2px 0 rgba(0,0,0,.3), 0 8px 20px rgba(0,0,0,.25);
  --sketch-shadow:0 2px 0 rgba(0,0,0,.3), 0 8px 20px rgba(0,0,0,.25);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#211C15; --card:#2B2419; --muted:#332B1F; --border:rgba(240,232,212,.14); --card-border:rgba(240,232,212,.55); --chip-border:rgba(240,232,212,.16);
    --ink:#EDE6D8; --text:#EDE6D8; --text-2:#B0A695; --text-3:#7A6F5F;
    --primary:#5FC3EA; --secondary:#8FD8F5; --primary-light:#163542; --primary-dark:#3FA0C9;
    --green:#4FBF83; --green-light:#1E2E22; --red:#E2685E; --red-light:#3A211D;
    --amber:#E0A24F; --amber-light:#3A2C15; --gold:#E0BB5C; --skyblue:#6BD4F5; --blue:#6BA8EA; --track:#3A3225;
    --shadow:0 2px 0 rgba(0,0,0,.3), 0 8px 20px rgba(0,0,0,.25);
    --sketch-shadow:0 2px 0 rgba(0,0,0,.3), 0 8px 20px rgba(0,0,0,.25);
  }
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{
  background-color:var(--bg); color:var(--text);
  background-image:
    radial-gradient(rgba(38,35,31,.035) .55px, transparent .7px),
    linear-gradient(90deg, rgba(130,100,55,.018), transparent 38%, rgba(130,100,55,.012));
  background-size:5px 5px, 100% 100%;
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif;
  font-size:14px; line-height:1.5; overflow-x:hidden;
}
:root[data-theme="dark"] body{background-image:none}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) body{background-image:none}}
a{color:inherit}
button{font-family:inherit; cursor:pointer}
input,select,textarea{font-family:inherit; font-size:14px}
::-webkit-scrollbar{width:8px; height:8px}
::-webkit-scrollbar-thumb{background:var(--border); border-radius:8px}

#shell{display:flex; min-height:100vh}

/* Sidebar */
#sidebar{
  width:var(--sidebar-w); flex-shrink:0; background:var(--card); border-right:1px solid rgba(38,35,31,.45);
  display:flex; flex-direction:column; position:fixed; top:0; bottom:0; left:0; z-index:50;
}
:root[data-theme="dark"] #sidebar{border-right-color:rgba(240,232,212,.3)}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) #sidebar{border-right-color:rgba(240,232,212,.3)}}
.brand{display:flex; align-items:center; gap:10px; padding:26px 20px 22px}
.brand-logo{width:32px;height:32px;border-radius:9px;background:linear-gradient(135deg,var(--primary),var(--primary-dark));display:flex;align-items:center;justify-content:center;color:#fff;font-weight:700;font-size:15px;flex-shrink:0}
.brand-name{font-weight:700; font-size:15px; letter-spacing:.2px}
.sidebar-mascot{display:flex; justify-content:center; padding:4px 0 2px; position:relative}
.sidebar-star{position:absolute}
.sidebar-mascot .s1{top:2px; left:34%}
.sidebar-mascot .s2{bottom:10px; right:32%}
.nav{padding:6px 12px; display:flex; flex-direction:column; gap:2px; flex:1; overflow-y:auto}
.nav-item{
  display:flex; align-items:center; gap:11px; padding:13px 14px; border-radius:12px; color:var(--text-2);
  font-size:14px; font-weight:500; text-decoration:none; border:1.25px solid transparent; background:transparent; width:100%; text-align:left;
}
.nav-item .ic{width:18px; text-align:center; font-size:15px; display:inline-flex; align-items:center; justify-content:center; flex-shrink:0}
.nav-item:hover{background:var(--muted); color:var(--text)}
.nav-item.active{background:var(--primary-light); color:var(--primary); border-color:rgba(44,168,214,.35)}
.nav-item.disabled{opacity:.4; cursor:not-allowed}
.nav-item.disabled:hover{background:transparent; color:var(--text-2)}
.sidebar-foot{padding:14px 12px; border-top:1px solid var(--border); display:flex; flex-direction:column; gap:10px}
.acct-card{background:var(--bg); border-radius:10px; padding:10px 12px; display:flex; align-items:center; gap:10px}
.acct-ic{flex-shrink:0}
.acct-name{font-size:12.5px; font-weight:600}
.acct-status{font-size:11px; color:var(--green); display:flex; align-items:center; gap:4px}
.acct-status .dot{width:6px;height:6px;border-radius:50%;background:var(--green)}
.foot-row{display:flex; align-items:center; justify-content:space-between; padding:2px 4px; font-size:12.5px; color:var(--text-2)}
.switch{position:relative; width:36px; height:20px; background:var(--track); border-radius:20px; border:none; cursor:pointer; flex-shrink:0}
.switch.on{background:var(--primary)}
.switch::after{content:'';position:absolute; top:2px; left:2px; width:16px; height:16px; border-radius:50%; background:#fff; transition:transform .15s}
.switch.on::after{transform:translateX(16px)}
.link-btn{background:none;border:none;color:var(--text-2);font-size:12.5px;cursor:pointer;text-align:left;padding:6px 4px;display:flex;align-items:center;gap:7px; border-radius:6px}
.link-btn:hover{background:var(--muted)}
.link-btn:hover{color:var(--primary)}

/* Main */
#main{margin-left:var(--sidebar-w); flex:1; min-width:0; display:flex; flex-direction:column}
.page{padding:26px 32px 60px; max-width:1400px; width:100%; margin:0 auto}
.page-narrow{max-width:1060px}

/* Typography */
h1.pg-title{font-size:24px; font-weight:700; margin:0 0 4px}
.pg-sub{color:var(--text-2); font-size:13.5px; margin:0 0 22px}
.section-title{font-size:15px; font-weight:700; margin:0 0 14px; display:flex; align-items:center; gap:8px}
.badge-num{display:inline-flex; align-items:center; justify-content:center; width:20px; height:20px; border-radius:50%; background:var(--primary); color:#fff; font-size:11.5px; font-weight:700}

/* Card */
.card{background:var(--card); border:1px solid var(--border); border-radius:var(--radius); box-shadow:var(--shadow)}
.card-pad{padding:20px}
.grid{display:grid; gap:16px}
.g2{grid-template-columns:repeat(2,1fr)}
.g3{grid-template-columns:repeat(3,1fr)}
.g4{grid-template-columns:repeat(4,1fr)}
.g6{grid-template-columns:repeat(6,1fr)}
@media(max-width:1100px){.g4{grid-template-columns:repeat(2,1fr)}.g3{grid-template-columns:repeat(2,1fr)}.g6{grid-template-columns:repeat(3,1fr)}}
@media(max-width:700px){.g2,.g3,.g4,.g6{grid-template-columns:1fr}}

/* Buttons */
.btn{display:inline-flex; align-items:center; gap:7px; padding:9px 16px; border-radius:9px; border:1px solid var(--border); background:var(--card); color:var(--text); font-size:13.5px; font-weight:600; transition:transform .15s ease, box-shadow .15s ease, border-color .15s ease, background .15s ease}
.btn:hover{border-color:var(--primary); transform:translateY(-1px); box-shadow:0 4px 12px rgba(44,168,214,.15)}
.btn-primary{background:var(--primary); border-color:var(--primary); color:#fff}
.btn-primary:hover{background:var(--primary-dark); border-color:var(--primary-dark); box-shadow:0 4px 14px rgba(44,168,214,.32)}
.btn-primary:disabled{opacity:.45; cursor:not-allowed}
.btn-primary:disabled:hover{background:var(--primary); border-color:var(--primary)}
/* Hand-drawn doodle treatment for the header's "新建交易实验" CTA specifically (user request,
   2026-08-05, revised) — scoped to .btn-doodle, not the whole button system, so every other
   button on the page keeps the clean professional look from the reference-master.png pass.
   Revised per follow-up: plain font (reverted from the STXingkai doodle-font attempt), no solid
   fill, thick dashed border carries the hand-drawn read instead, sized up from btn-lg. */
.btn-doodle{position:relative; background:var(--card); color:var(--primary); border:3px dashed var(--primary); border-radius:14px 22px 12px 20px; transform:rotate(-1deg); font-family:inherit; font-size:16px; padding:15px 28px}
.btn-doodle:hover{transform:rotate(-1deg) translateY(-1px); background:var(--primary-light); border-color:var(--primary-dark)}
.btn-danger{color:var(--red); border-color:var(--red-light)}
.btn-danger:hover{background:var(--red-light); border-color:var(--red)}
.btn-block{width:100%; justify-content:center; padding:12px}
.btn-lg{padding:13px 18px; font-size:14.5px}
.btn-sm{padding:6px 11px; font-size:12.5px}
.btn-ghost{border-color:transparent; background:transparent}
.btn-ghost:hover{background:var(--bg); border-color:transparent}
.icon-btn{width:32px;height:32px;display:inline-flex;align-items:center;justify-content:center;border-radius:8px;border:1px solid var(--border);background:var(--card)}
.icon-btn:hover{border-color:var(--primary)}

/* Pills / tags */
.pill{display:inline-flex; align-items:center; gap:5px; padding:3px 10px; border-radius:20px; font-size:12px; font-weight:700}
.pill-green{background:var(--green-light); color:var(--green)}
.pill-red{background:var(--red-light); color:var(--red)}
.pill-amber{background:var(--amber-light); color:var(--amber)}
.pill-primary{background:var(--primary-light); color:var(--primary)}
.pill-gray{background:var(--track); color:var(--text-2)}

.up{color:var(--green)} .down{color:var(--red)} .muted{color:var(--text-2)} .fw{font-weight:700}
.mono{font-variant-numeric:tabular-nums}

/* Dashboard — "wizard's research notebook" theme (2026-08-05 redesign per
   Quant Assistant UI Redesign Spec v1.0: professional SaaS cards first, illustration is only a
   sparse accent — replaced the earlier thick 2px comic-style ink border + flat sticker shadow
   with a 1px "fountain pen" border and a soft paper shadow; the corner radii are barely
   mismatched (a fountain-pen wobble, not a hand-drawn/comic one) rather than uniform. */
/* DoodleCard technique, ported verbatim from quant-assistant-wizard-prototype/src/styles/
   wizard-tokens.css: a pen-thin (1.25px) card border plus a second, barely-offset inner border
   on ::after (inset 2px on two sides, rotated 0.08deg) for the "hand-drawn, not comic" wobble —
   replaces the earlier asymmetric-border-radius/flat-sticker-shadow approach entirely. */
.sketch-card{position:relative; border:1.25px solid var(--card-border); border-radius:var(--radius); background:rgba(255,253,247,.94); box-shadow:var(--sketch-shadow); transition:transform 160ms ease, box-shadow 160ms ease}
.sketch-card:hover{transform:translateY(-1px); box-shadow:0 3px 0 rgba(38,35,31,.11), 0 12px 24px rgba(67,53,34,.05)}
:root[data-theme="dark"] .sketch-card{background:rgba(43,36,25,.94)}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .sketch-card{background:rgba(43,36,25,.94)}}
:root[data-theme="dark"] .sketch-card:hover{box-shadow:0 3px 0 rgba(0,0,0,.4), 0 12px 24px rgba(0,0,0,.3)}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .sketch-card:hover{box-shadow:0 3px 0 rgba(0,0,0,.4), 0 12px 24px rgba(0,0,0,.3)}}
.sketch-card::after{content:''; position:absolute; inset:2px -1px -1px 2px; border:1px solid rgba(38,35,31,.10); border-radius:inherit; pointer-events:none; transform:rotate(.08deg)}
:root[data-theme="dark"] .sketch-card::after{border-color:rgba(240,232,212,.10)}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .sketch-card::after{border-color:rgba(240,232,212,.10)}}
.top-banner{display:flex; gap:10px; align-items:stretch; margin-bottom:14px; flex-wrap:wrap}
.events-card{flex:1.4; min-width:320px}
.events-row{display:flex; gap:7px; flex-wrap:wrap; align-items:center}
.event-chip{display:flex; align-items:center; gap:9px; background:var(--bg); border:1.5px solid var(--border); border-radius:12px; padding:8px 12px 8px 8px; font-size:12.5px}
.event-chip .flag{font-size:15px; width:26px; height:26px; border-radius:50%; background:var(--card); border:1.5px solid var(--border); display:flex; align-items:center; justify-content:center; flex-shrink:0}
.event-chip .t{color:var(--text-2); font-size:11.5px}
/* Row layout (2026-08-05, user-requested deviation from reference-master.png's column cards):
   .top-banner's align-items:stretch means this whole strip is forced to match the events card's
   height, which grows with real event-count. Column cards turned that extra height into one
   dead blank rectangle per card; stacking as 3 rows with `.ticker{flex:1}` spreads it across 3
   cards instead, and letting `.ticker-spark svg{width/height:100%}` override the chart's own
   width/height attributes (`preserveAspectRatio="none"` already set) means each row's chart
   genuinely stretches to fill whatever height it's given, rather than leaving blank space below
   a fixed-size chart — the excess height becomes more chart, not empty padding. */
.ticker-strip{flex:1.6; min-width:420px; display:flex; flex-direction:column; gap:8px}
.ticker{background:var(--card); padding:10px 16px; overflow:hidden; display:flex; align-items:center; gap:14px; flex:1; min-height:60px}
.ticker-ic{flex-shrink:0}
.ticker-info{flex-shrink:0; display:flex; flex-direction:column; gap:1px; min-width:96px}
.ticker .lbl{font-size:11px; color:var(--text-2); font-weight:600; letter-spacing:.3px}
.ticker .val{font-size:19px; font-weight:700; margin:1px 0}
.ticker-pct{font-size:12.5px; font-weight:700}
.ticker-spark{flex:1; align-self:stretch; min-width:0; min-height:0}
.ticker-spark svg{width:100%; height:100%; display:block}
/* CSS Grid rows are sized by the tallest card in that row — even with align-items:start, a
   short card just sits at the top of a row track a taller sibling (e.g. 新闻资讯) forced tall,
   leaving dead space below it before the next row starts. CSS multi-column packs cards greedily
   within each column instead (no row tracks to reserve), which is the actual "no empty space"
   masonry behavior wanted here — still pure CSS, no JS measurement/reflow needed. */
/* Reference-master.png reads as 4 independent per-column stacks (col1: market→etf→stablecoin,
   col2: technical→onchain→liquidation, ...), not a synced row grid and not CSS multi-column's
   height-balanced column-major fill (which reorders cards away from reading order). Built as 4
   explicit flex-column wrappers in JS (renderDashboard's cardColumns), each stacking every 4th
   card in DASHBOARD_SOURCES order — a card's own height never affects its row-siblings' start
   position, matching the reference, while preserving left-to-right/top-to-bottom reading order. */
.src-grid{display:flex; gap:10px; align-items:flex-start}
.src-col{flex:1; min-width:0; display:flex; flex-direction:column; gap:10px}
@media(max-width:1200px){.src-grid{flex-wrap:wrap}.src-col{flex-basis:calc(50% - 5px)}}
@media(max-width:640px){.src-col{flex-basis:100%}}
/* Height follows content, not fixed — each card shows at most a few items (see
   renderGenericLiveItems' cap) so nothing grows unbounded, and nothing needs to scroll
   internally either, since "还有 N 条 →" hands overflow off to 查看详情 instead of duplicating it. */
.src-card{padding:16px; display:flex; flex-direction:column; min-height:120px}
.src-head{display:flex; align-items:flex-start; justify-content:space-between; margin-bottom:12px}
.src-head-right{display:flex; align-items:center; gap:8px}
.ns-gear-btn{width:24px; height:24px; border-radius:6px; flex-shrink:0}
.ns-gear-btn:hover{border-color:var(--primary); color:var(--primary)}
/* 新闻源管理 modal */
.ns-table{width:100%; border-collapse:collapse; font-size:12.5px}
.ns-table th{text-align:left; font-size:11px; color:var(--text-2); font-weight:600; padding:8px 10px; border-bottom:1px solid var(--border); white-space:nowrap}
.ns-table td{padding:10px; border-bottom:1px solid var(--border); vertical-align:middle; white-space:nowrap}
.ns-table tr:last-child td{border-bottom:none}
.ns-check{display:inline-block; width:16px; height:16px; border-radius:50%; border:1.5px solid var(--border)}
.ns-status{display:flex; align-items:center; gap:8px; font-size:11.5px; color:var(--text-2)}
.ns-type-card{border:1.5px solid var(--border); border-radius:12px; padding:20px 12px; cursor:pointer; display:flex; flex-direction:column; align-items:center; text-align:center; gap:8px; background:var(--card)}
.ns-type-card:hover{border-color:var(--primary)}
.ns-type-card .ic{width:44px; height:44px; border-radius:50%; background:var(--muted); display:flex; align-items:center; justify-content:center}
.ns-type-card .t{font-weight:700; font-size:13.5px; margin-top:2px}
.ns-type-card .d{font-size:11px; color:var(--text-2)}
.src-title-row{display:flex; align-items:center; gap:10px}
.src-icon{display:flex;align-items:center;justify-content:center;flex-shrink:0}
.src-name{font-weight:700; font-size:16px}
.src-desc{font-size:11.5px; color:var(--text-3)}
.src-time{font-size:11px; color:var(--text-3); white-space:nowrap}
.src-body{flex:1; display:flex; flex-direction:column; gap:7px; font-size:13px}
/* Root cause of the "I/B/I/T/(/i/S..." vertical letter-stacking bug: .v had flex-shrink:0, so
   when a VALUE itself was long text (not a short number/%), it refused to shrink at all and
   squeezed .k down toward zero width — and overflow-wrap:break-word on a near-zero-width box
   breaks between every single character. Fix: let the row wrap (value drops to its own line
   with full width to wrap normally) instead of letting either side get crushed to nothing. */
.src-line{display:flex; flex-wrap:wrap; align-items:baseline; justify-content:space-between; gap:2px 8px}
.src-line .k{color:var(--text-2); min-width:0; overflow-wrap:break-word; flex:1 1 auto}
.src-line .v{font-weight:700; text-align:right; min-width:0; overflow-wrap:break-word; flex:0 1 auto; max-width:100%}
.src-more{font-size:12px; color:var(--primary); font-weight:600; background:none; border:none; padding:2px 0; text-align:left; cursor:pointer}
.src-more:hover{text-decoration:underline}
.src-foot{margin-top:12px; display:flex; justify-content:flex-end}
.src-foot-chart{width:90px; height:20px; opacity:.55}
.src-foot a{font-size:12.5px; color:var(--primary); font-weight:600; text-decoration:none; display:flex; align-items:center; gap:4px}
.add-src-card{position:relative; border:1.75px dashed rgba(38,35,31,.45); display:flex; align-items:center; justify-content:center; flex-direction:column; gap:8px; color:var(--text-3); min-height:120px; cursor:pointer; background:transparent; border-radius:var(--radius)}
.add-src-book{position:absolute; bottom:10px; right:12px; --ink:var(--primary); opacity:.8}
.add-src-card:hover{border-color:var(--primary); color:var(--primary)}
.add-src-card .plus{width:38px;height:38px;border-radius:50%;border:2px solid currentColor;display:flex;align-items:center;justify-content:center;font-size:18px}

/* page header w/ back */
.pg-header{display:flex; align-items:center; justify-content:space-between; margin-bottom:20px; gap:16px; flex-wrap:wrap}
.pg-header-left{display:flex; align-items:center; gap:12px}
.dash-header{position:relative; align-items:flex-end; min-height:78px}
/* Absolute + left:50% centers the mascot on the header's own midpoint regardless of how wide
   the greeting text or button end up being — flexbox space-between drifted it toward the button
   since the greeting block's natural width already ate most of the left gap. */
.dash-mascot{position:absolute; left:50%; top:-6px; transform:translateX(-38%)}
.spark-star{position:absolute; z-index:1}
.dash-mascot .s1{top:-4px; left:-2px}
.dash-mascot .s2{bottom:18px; right:-6px}
.back-btn{display:flex;align-items:center;justify-content:center;width:34px;height:34px;border-radius:9px;border:1px solid var(--border);background:var(--card)}
.back-btn:hover{border-color:var(--primary)}
.pg-header h1{margin:0; font-size:19px}
.header-actions{display:flex; gap:10px; align-items:center}

/* Research */
.field-row{display:grid; grid-template-columns:1fr 1fr 1fr; gap:14px; margin-bottom:20px}
.field{display:flex; flex-direction:column; gap:6px}
.field label{font-size:12.5px; font-weight:600; color:var(--text-2)}
.field select, .field input[type=text], .field input[type=number], .field input[type=password]{
  padding:9px 11px; border-radius:9px; border:1px solid var(--border); background:var(--bg); color:var(--text); width:100%;
}
.weight-total{display:flex; align-items:center; gap:8px; font-size:13px; font-weight:700}
.weight-item{display:grid; grid-template-columns:26px 1.4fr 2fr 90px 30px; align-items:center; gap:12px; padding:11px 4px; border-bottom:1px solid var(--border)}
.weight-item:last-child{border-bottom:none}
.wi-icon{font-size:16px; text-align:center}
.wi-label{font-weight:700; font-size:13.5px}
.wi-desc{color:var(--text-3); font-size:11.5px; margin-top:1px}
.wi-slider{width:100%}
.wi-slider input[type=range]{width:100%; accent-color:var(--primary)}
.wi-val{display:flex; align-items:center; gap:4px}
.wi-val input{width:52px; padding:6px 7px; border-radius:7px; border:1px solid var(--border); background:var(--bg); color:var(--text); text-align:right}
.wi-del{background:none;border:none;color:var(--text-3); font-size:15px}
.wi-del:hover{color:var(--red)}
.ev-card{border:1px solid var(--border); border-radius:12px; padding:14px; margin-bottom:12px}
.ev-card:last-child{margin-bottom:0}
.ev-card-head{display:flex; align-items:center; gap:10px; margin-bottom:12px}
.ev-card-head select{padding:6px 8px; border-radius:7px; border:1px solid var(--border); background:var(--bg); color:var(--text); font-weight:600; font-size:12.5px}
.ev-weight-inline{display:flex; align-items:center; gap:5px; margin-left:auto; font-size:12px; color:var(--text-2); font-weight:600}
.ev-weight-inline input{width:48px; padding:6px 7px; border-radius:7px; border:1px solid var(--border); background:var(--bg); color:var(--text); text-align:right}
.ev-text-fields{display:flex; flex-direction:column; gap:8px}
.ev-text-fields input, .ev-text-fields textarea{padding:8px 10px; border-radius:8px; border:1px solid var(--border); background:var(--bg); color:var(--text); font-size:12.5px; width:100%}
.ev-text-fields textarea{resize:vertical; min-height:44px}
.ev-dropzone{border:1.5px dashed var(--border); border-radius:10px; padding:16px; display:flex; align-items:center; gap:12px; cursor:pointer; background:var(--bg)}
.ev-dropzone:hover, .ev-dropzone:focus{border-color:var(--primary); outline:none}
.ev-dropzone.dragover{border-color:var(--primary); background:var(--primary-light)}
.ev-dropzone input[type=file]{position:absolute; width:1px; height:1px; opacity:0; overflow:hidden}
.ev-dz-icon{font-size:22px; flex-shrink:0}
.ev-dz-text b{color:var(--text); font-weight:700}
.ev-dz-text{font-size:12px; color:var(--text-2)}
.ev-file-preview{display:flex; align-items:center; gap:12px; background:var(--bg); border-radius:10px; padding:10px 12px}
.ev-file-thumb{width:46px;height:46px;border-radius:8px;object-fit:cover; flex-shrink:0; background:var(--card); border:1px solid var(--border)}
.ev-file-icon{width:46px;height:46px;border-radius:8px;display:flex;align-items:center;justify-content:center;font-size:19px;background:var(--card);border:1px solid var(--border);flex-shrink:0}
.ev-file-name{font-weight:700; font-size:12.5px}
.ev-file-meta{font-size:11px; color:var(--text-3)}
.ev-file-remove{margin-left:auto; background:none;border:none;color:var(--text-3); font-size:12px; flex-shrink:0}
.ev-file-remove:hover{color:var(--red)}
.ev-caption{margin-top:10px}
.weight-hint{display:flex; align-items:center; justify-content:space-between; background:var(--bg); border-radius:10px; padding:12px 14px; margin-top:14px; font-size:12.5px; color:var(--text-2); gap:12px}

/* Strategy */
.steps-row{display:flex; align-items:center; gap:0; margin-bottom:20px; overflow-x:auto}
.step{display:flex; flex-direction:column; align-items:center; gap:6px; min-width:112px; text-align:center}
.step .circ{width:34px;height:34px;border-radius:50%;background:var(--green-light); color:var(--green); display:flex; align-items:center; justify-content:center; font-size:15px; font-weight:700}
.step .lbl{font-size:11.5px; font-weight:600}
.step .st{font-size:10.5px; color:var(--green)}
.step-line{flex:1; height:2px; background:var(--border); min-width:16px; margin-bottom:24px}
.donut-wrap{display:flex; flex-direction:column; align-items:center; gap:6px; padding:10px 0}
.donut{width:118px;height:118px;border-radius:50%; position:relative; background:conic-gradient(var(--dc,var(--green)) calc(var(--pct)*1%), var(--track) 0)}
.donut::before{content:'';position:absolute; inset:11px; background:var(--card); border-radius:50%}
.donut-inner{position:absolute; inset:0; display:flex; flex-direction:column; align-items:center; justify-content:center}
.donut-inner .pct{font-size:22px; font-weight:800}
.donut-inner .sub{font-size:10.5px; color:var(--text-2)}
.plan-grid{display:grid; grid-template-columns:1fr 1fr; gap:16px 22px}
.plan-item{display:flex; gap:10px; align-items:flex-start}
.plan-item .pic{font-size:16px}
.plan-item .pk{font-size:11.5px; color:var(--text-2)}
.plan-item .pv{font-size:14px; font-weight:700; margin-top:1px}
.contrib-row{display:grid; grid-template-columns:1.3fr 3fr 56px 90px; align-items:center; gap:12px; padding:9px 2px; font-size:13px}
.contrib-track{position:relative; height:8px; background:var(--track); border-radius:6px}
.contrib-fill{position:absolute; top:0; height:8px; border-radius:6px}
.contrib-mid{position:absolute; left:50%; top:-3px; width:2px; height:14px; background:var(--border)}
.tabs{display:flex; gap:4px; border-bottom:1px solid var(--border); margin-bottom:14px}
.tab-btn{padding:9px 14px; font-size:13px; font-weight:600; color:var(--text-2); background:none; border:none; border-bottom:2px solid transparent; margin-bottom:-1px}
.tab-btn.active{color:var(--primary); border-color:var(--primary)}
.reason-list{margin:0; padding-left:0; list-style:none; display:flex; flex-direction:column; gap:10px}
.reason-list li{display:flex; gap:10px; font-size:13.5px}
.reason-list .n{width:20px;height:20px;border-radius:6px;background:var(--primary-light); color:var(--primary); font-size:11px; font-weight:700; display:flex; align-items:center; justify-content:center; flex-shrink:0; margin-top:1px}
.next-actions{display:flex; flex-direction:column; gap:10px}
.next-actions .btn{justify-content:space-between}

/* Execution */
.exec-choice-row{display:grid; grid-template-columns:repeat(3,1fr); gap:12px; margin-bottom:22px}
.exec-choice{border:1.5px solid var(--border); border-radius:12px; padding:14px 16px; cursor:pointer; display:flex; gap:10px; align-items:flex-start; background:var(--card)}
.exec-choice.sel{border-color:var(--primary); background:var(--primary-light)}
.exec-choice .ic{font-size:18px}
.exec-choice .t{font-weight:700; font-size:13.5px}
.exec-choice .d{font-size:11.5px; color:var(--text-2); margin-top:2px}
.dir-toggle{display:flex; gap:8px}
.dir-btn{flex:1; padding:9px; border-radius:9px; border:1.5px solid var(--border); background:var(--bg); font-weight:700; text-align:center; font-size:13px}
.dir-btn.long.sel{border-color:var(--green); background:var(--green-light); color:var(--green)}
.dir-btn.short.sel{border-color:var(--red); background:var(--red-light); color:var(--red)}
.adjust-table{width:100%; border-collapse:collapse; font-size:12.5px}
.adjust-table th{text-align:left; color:var(--text-2); font-weight:600; padding:6px 8px; font-size:11.5px}
.adjust-table td{padding:6px 8px; vertical-align:top}
.adjust-table input{width:100%; padding:6px 8px; border-radius:7px; border:1px solid var(--border); background:var(--bg); color:var(--text)}
textarea.notes{width:100%; min-height:70px; padding:10px; border-radius:9px; border:1px solid var(--border); background:var(--bg); color:var(--text); resize:vertical}

/* Trade list */
.stat-strip{display:grid; grid-template-columns:repeat(6,1fr); gap:14px; margin-bottom:20px}
.stat-box{padding:16px}
.stat-box .lbl{font-size:11.5px; color:var(--text-2); font-weight:600}
.stat-box .val{font-size:20px; font-weight:800; margin-top:6px}
.filters-row{display:flex; gap:10px; align-items:center; margin-bottom:14px; flex-wrap:wrap}
.search-box{flex:1; min-width:200px; display:flex; align-items:center; gap:8px; border:1px solid var(--border); border-radius:9px; padding:8px 12px; background:var(--card)}
.search-box input{border:none; outline:none; background:transparent; width:100%; color:var(--text)}
.filters-row select{padding:8px 10px; border-radius:9px; border:1px solid var(--border); background:var(--card); color:var(--text)}
.subtabs{display:flex; gap:4px; margin-bottom:14px; border-bottom:1px solid var(--border)}
.subtab{padding:9px 4px; margin-right:20px; font-weight:700; font-size:13.5px; color:var(--text-2); background:none; border:none; border-bottom:2px solid transparent; margin-bottom:-1px}
.subtab.active{color:var(--primary); border-color:var(--primary)}
table.trades{width:100%; border-collapse:collapse}
table.trades th{text-align:left; font-size:11.5px; color:var(--text-2); font-weight:600; padding:10px 12px; border-bottom:1px solid var(--border)}
table.trades td{padding:12px; border-bottom:1px solid var(--border); font-size:13px; vertical-align:middle}
table.trades tr:last-child td{border-bottom:none}
table.trades tr.rowlink:hover{background:var(--bg); cursor:pointer}
.sym-cell{display:flex; align-items:center; gap:10px}
.sym-ic{width:30px;height:30px;border-radius:50%; display:flex; align-items:center; justify-content:center; font-size:13px; font-weight:800; color:#fff; flex-shrink:0}
.sym-sub{font-size:11px; color:var(--text-3)}
.dir-lbl{display:flex; align-items:center; gap:4px; font-weight:700}
.info-banner{display:flex; align-items:center; gap:10px; background:var(--primary-light); border-radius:12px; padding:14px 18px; margin-top:20px; font-size:12.5px; color:var(--text-2); justify-content:space-between; flex-wrap:wrap}
.legend-row{display:flex; gap:18px; flex-wrap:wrap}
.legend-item{display:flex; gap:6px}
.legend-item b{color:var(--text)}
.dropdown-menu{position:absolute; right:0; top:36px; background:var(--card); border:1px solid var(--border); border-radius:10px; box-shadow:var(--shadow); min-width:140px; z-index:60; overflow:hidden}
.dropdown-menu button{display:block; width:100%; text-align:left; padding:9px 12px; background:none; border:none; font-size:12.5px; color:var(--text)}
.dropdown-menu button:hover{background:var(--bg)}
.dropdown-wrap{position:relative; display:inline-block}

/* Trade detail */
.dt-header{display:flex; align-items:flex-start; justify-content:space-between; gap:20px; margin-bottom:22px; flex-wrap:wrap}
.dt-title-row{display:flex; align-items:center; gap:12px; flex-wrap:wrap}
.dt-meta-row{display:flex; gap:26px; margin-top:12px; flex-wrap:wrap}
.dt-meta{display:flex; flex-direction:column; gap:3px}
.dt-meta .k{font-size:11px; color:var(--text-3)}
.dt-meta .v{font-size:13px; font-weight:700}
.dt-pnl{text-align:right}
.dt-pnl .k{font-size:12px; color:var(--text-2)}
.dt-pnl .v{font-size:26px; font-weight:800}
.conf-ring{width:44px;height:44px;border-radius:50%; position:relative; background:conic-gradient(var(--primary) calc(var(--pct)*1%), var(--track) 0)}
.conf-ring::before{content:'';position:absolute; inset:4px; background:var(--card); border-radius:50%}
.conf-ring span{position:absolute; inset:0; display:flex; align-items:center; justify-content:center; font-size:10.5px; font-weight:800}
.two-col{display:grid; grid-template-columns:1.05fr .95fr; gap:18px; align-items:start}
@media(max-width:1000px){.two-col{grid-template-columns:1fr}}
.kv-list{display:flex; flex-direction:column; gap:10px}
.kv-list .row{display:flex; justify-content:space-between; font-size:13px}
.kv-list .row .k{color:var(--text-2)}
.kv-list .row .v{font-weight:700}
.reason-chip{display:flex; align-items:flex-start; gap:8px; font-size:12.5px; padding:5px 0}
.chart-tabs{display:flex; gap:6px}
.chart-tab{padding:5px 11px; border-radius:7px; border:1px solid var(--border); background:var(--card); font-size:12px; font-weight:600}
.chart-tab.active{background:var(--primary); border-color:var(--primary); color:#fff}
.range-bar-wrap{position:relative; margin-top:22px; padding-top:26px}
.range-static-row{display:flex; justify-content:space-between; font-size:12px; font-weight:700; margin-top:8px}
.range-static-row .sl{color:var(--red)}
.range-static-row .tp{color:var(--green)}
.range-bar{position:relative; height:8px; border-radius:6px; background:linear-gradient(90deg,var(--red-light),var(--track) 45%,var(--track) 55%,var(--green-light))}
.range-endpoint{position:absolute; top:-2px; width:2px; height:12px; border-radius:1px}
.range-cur-dot{position:absolute; top:-4px; width:11px; height:11px; border-radius:50%; background:var(--text); border:2px solid var(--card); box-shadow:0 0 0 1px var(--border); transform:translateX(-50%); z-index:2}
.range-cur-tag{position:absolute; top:0; transform:translateX(-50%); font-size:11px; font-weight:700; white-space:nowrap; background:var(--card); border:1px solid var(--border); padding:2px 8px; border-radius:20px; box-shadow:var(--shadow)}
.timeline{display:flex; flex-direction:column}
.tl-item{display:flex; gap:14px; position:relative; padding-bottom:22px}
.tl-item:last-child{padding-bottom:0}
.tl-item .dotwrap{display:flex; flex-direction:column; align-items:center}
.tl-item .dot{width:14px;height:14px;border-radius:50%; background:var(--primary); border:3px solid var(--primary-light); flex-shrink:0; z-index:1}
.tl-item.pending .dot{background:var(--track); border-color:var(--track)}
.tl-item .line{flex:1; width:2px; background:var(--border); margin-top:2px}
.tl-item .tl-title{font-weight:700; font-size:13.5px}
.tl-item .tl-time{font-size:11.5px; color:var(--text-3); margin-left:8px; font-weight:500}
.tl-item .tl-desc{font-size:12.5px; color:var(--text-2); margin-top:3px}
.actions-grid{display:grid; grid-template-columns:1fr 1fr; gap:10px}
.action-btn{display:flex; align-items:center; gap:10px; padding:12px 14px; border-radius:10px; border:1px solid var(--border); background:var(--card); text-align:left}
.action-btn:hover{border-color:var(--primary)}
.action-btn .ic{font-size:17px}
.action-btn .t{font-weight:700; font-size:12.5px}
.action-btn .d{font-size:11px; color:var(--text-3)}
.note-box{background:var(--bg); border-radius:10px; padding:14px; font-size:13px; color:var(--text-2); min-height:20px; white-space:pre-wrap}

/* Toast / modal */
#toast-wrap{position:fixed; bottom:22px; right:22px; z-index:200; display:flex; flex-direction:column; gap:8px}
.toast{background:var(--text); color:var(--bg); padding:11px 16px; border-radius:10px; font-size:13px; box-shadow:var(--shadow); opacity:0; transform:translateY(8px); transition:all .2s; max-width:320px}
.toast.show{opacity:1; transform:translateY(0)}
:root[data-theme="dark"] .toast{background:#EDEEF3; color:#1A1D29}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .toast{background:#EDEEF3; color:#1A1D29}}

#modal-bg{position:fixed; inset:0; background:rgba(15,17,25,.5); z-index:150; display:none; align-items:center; justify-content:center; padding:20px}
#modal-bg.show{display:flex}
.modal{background:var(--card); border-radius:16px; max-width:640px; width:100%; max-height:85vh; overflow-y:auto; padding:24px; box-shadow:var(--shadow)}
.modal.modal-wide{max-width:900px}

/* Analysis Runner overlay (Sprint 3.2A UI, Sprint 3.2B real logic) — deliberately its own dark,
   monospace, minimally-rounded look, not the app's warm wizard-notebook theme: "should feel like
   Bloomberg Terminal... not consumer chat applications" per explicit product direction for this
   one surface. Fixed dark palette regardless of the app's own light/dark toggle (a terminal is
   always dark) — the only intentionally non-theme-aware component in this file. A separate overlay
   (not #modal-bg) so it can omit backdrop-click-to-dismiss and X-to-close entirely: dismissal is
   only ever through the Cancel/Retry/Close/查看Prompt buttons this component controls itself. */
#analysis-runner-bg{position:fixed; inset:0; background:rgba(4,6,9,.78); z-index:300; display:none; align-items:center; justify-content:center; padding:20px}
#analysis-runner-bg.show{display:flex}
.ar-panel{width:480px; max-width:100%; max-height:88vh; overflow-y:auto; background:#0B0E14; border:1px solid #232A36; border-radius:6px; color:#E4E8F0; font-family:'SFMono-Regular',Consolas,'Liberation Mono',Menlo,monospace; box-shadow:0 24px 64px rgba(0,0,0,.55)}
.ar-head{padding:20px 22px 14px; border-bottom:1px solid #1B212B}
.ar-title{font-size:15px; font-weight:700; letter-spacing:.2px; display:flex; align-items:center; justify-content:space-between; gap:12px}
.ar-subtitle{font-size:12px; color:#8A93A6; margin-top:5px; font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif}
.ar-timer{font-size:12px; color:#5FE3A6; font-variant-numeric:tabular-nums; flex-shrink:0}
.ar-stages{padding:14px 22px; display:flex; flex-direction:column; gap:1px}
.ar-stage{display:flex; align-items:center; gap:10px; padding:6px 0; font-size:12.5px}
.ar-stage .ic{width:14px; text-align:center; flex-shrink:0; font-size:12px}
.ar-stage .lbl{flex:1; color:#7C8598; font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif}
.ar-stage.running .lbl{color:#E4E8F0; font-weight:600}
.ar-stage.running .ic{color:#E8B93F}
.ar-stage.success .ic{color:#5FE3A6}
.ar-stage.success .lbl{color:#7C8598}
.ar-stage.failed .ic{color:#F0576B}
.ar-stage.failed .lbl{color:#F0576B; font-weight:600}
.ar-stage.waiting .ic, .ar-stage.skipped .ic{color:#333B48}
.ar-stage.waiting .lbl, .ar-stage.skipped .lbl{color:#4A5163}
.ar-stage-sub{font-size:11px; color:#8A93A6; margin-top:2px; font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif}
.ar-stage.failed .ar-stage-sub{color:#F0576B}
.ar-stage.running .ar-stage-sub{color:#E8B93F}
.ar-hint{margin:0 22px 10px; font-size:11px; color:#5A6377; font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif}
.ar-banner{margin:0 22px 14px; padding:11px 13px; border-radius:4px; font-size:12px; line-height:1.6; font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif}
.ar-banner.err{background:#241318; border:1px solid #4A2229; color:#F0A0AC}
.ar-banner-detail{margin-top:6px; font-size:11.5px; opacity:.85}
.ar-diagnostics{margin:0 22px 14px; padding:12px 14px; border-radius:4px; background:#0F1319; border:1px solid #232A36}
.ar-diag-title{font-size:11px; font-weight:700; color:#5FE3A6; letter-spacing:.4px; margin-bottom:8px; font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif}
.ar-diag-row{display:flex; justify-content:space-between; gap:12px; font-size:11.5px; padding:3px 0; color:#8A93A6}
.ar-diag-row span:last-child{color:#C7CDDA; text-align:right}
/* Sticky, not just bottom-of-flow — with Developer Diagnostics on, the panel (11 collect stages +
   a diagnostics block + up to 4 local stages) routinely exceeds typical viewport height, and a
   non-sticky footer scrolled fully out of view below the fold (caught in a real screenshot during
   this sprint's verification). #ar-panel is the scroll container (overflow-y:auto), so sticky
   here pins to ITS viewport, not the page's. */
.ar-foot{position:sticky; bottom:0; padding:16px 22px 20px; border-top:1px solid #1B212B; background:#0B0E14; display:flex; gap:10px; justify-content:flex-end; font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif}
.ar-btn{padding:9px 16px; border-radius:4px; border:1px solid #2B323F; background:#141922; color:#C7CDDA; font-size:12.5px; font-weight:600; cursor:pointer}
.ar-btn:hover:not(:disabled){border-color:#4A5566}
.ar-btn:disabled{opacity:.4; cursor:not-allowed}
.ar-btn-primary{background:#1E88E5; border-color:#1E88E5; color:#fff}
.ar-btn-primary:hover:not(:disabled){background:#1976D2}
.ar-btn-danger{border-color:#4A2229; color:#F0576B}
.ar-btn-danger:hover:not(:disabled){background:#241318}
.market-tabs{display:flex; gap:6px; flex-wrap:wrap; margin-bottom:16px}
.market-tab{padding:6px 12px; border-radius:20px; border:1.5px solid var(--border); background:var(--bg); color:var(--text-2); font-size:12.5px; font-weight:700}
.market-tab.active{border-color:var(--primary); background:var(--primary-light); color:var(--primary)}
.detail-overview{display:flex; align-items:center; justify-content:space-between; flex-wrap:wrap; gap:16px; background:var(--bg); border-radius:12px; padding:14px 16px}
.detail-price{flex-shrink:0}
.detail-stat-grid{display:grid; grid-template-columns:repeat(3,1fr); gap:8px 20px; flex:1; min-width:280px}
.dstat{display:flex; flex-direction:column; gap:2px}
.dstat .k{font-size:11px; color:var(--text-3)}
.dstat .v{font-size:13px; font-weight:700}
.chart-block{background:var(--bg); border-radius:8px; overflow:hidden}
.raw-json{background:var(--bg); border-radius:10px; padding:12px 14px; font-size:11px; overflow-x:auto; max-height:160px; overflow-y:auto; color:var(--text-2); white-space:pre-wrap; word-break:break-all}
.dist-row{display:grid; grid-template-columns:76px 1fr 68px; align-items:center; gap:10px; font-size:11.5px; margin-bottom:6px}
.dist-label{font-weight:700}
.dist-track{height:8px; background:var(--track); border-radius:6px; overflow:hidden}
.dist-fill{height:100%; background:var(--primary)}
.dist-val{text-align:right; color:var(--text-2)}
.modal-head{display:flex; justify-content:space-between; align-items:center; margin-bottom:16px}
.modal-head h3{margin:0; font-size:16px}
.close-x{background:none;border:none;font-size:18px;color:var(--text-2)}

.disclaimer{text-align:center; color:var(--text-3); font-size:11.5px; margin-top:26px}
.empty-hint{text-align:center; padding:40px 20px; color:var(--text-3)}
.small-note{font-size:11.5px; color:var(--text-3); margin-top:6px}

@media(max-width:900px){
  #sidebar{width:64px}
  .brand-name,.nav-item span:not(.ic),.acct-card,.foot-row span,.link-btn{display:none}
  #main{margin-left:64px}
  .field-row{grid-template-columns:1fr}
  .stat-strip{grid-template-columns:repeat(3,1fr)}
  .two-col{grid-template-columns:1fr}
  .exec-choice-row{grid-template-columns:1fr}
}

<body>
<div id="shell">
  <aside id="sidebar"></aside>
  <div id="main"><div id="app" class="page"></div></div>
</div>
<div id="toast-wrap"></div>
<div id="modal-bg"><div class="modal" id="modal-body"></div></div>
<div id="analysis-runner-bg"><div id="analysis-runner-body"></div></div>

<script>
/* ---------- Utilities ---------- */
function el(html){const t=document.createElement('template');t.innerHTML=html.trim();return t.content.firstElementChild;}
function hashSeed(str){let h=0;for(let i=0;i<str.length;i++){h=(h<<5)-h+str.charCodeAt(i);h|=0;}return Math.abs(h);}
function mulberry32(a){return function(){a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return ((t^t>>>14)>>>0)/4294967296;};}
function rngFor(str){return mulberry32(hashSeed(str));}
function fmt(n,d=2){if(n===null||n===undefined||isNaN(n))return '--';return n.toLocaleString('en-US',{minimumFractionDigits:d,maximumFractionDigits:d});}
function fmtPrice(n,decimals){return fmt(n,decimals);}
function fmtSigned(n,d=2){const s=n>=0?'+':'';return s+fmt(n,d);}
function fmtPct(n,d=2){const s=n>=0?'+':'';return s+fmt(n,d)+'%';}
function uid(){return 'T'+Math.random().toString(36).slice(2,9).toUpperCase();}
function clamp(v,a,b){return Math.max(a,Math.min(b,v));}
const MOCK_NOW = new Date('2024-05-20T15:32:00');
function fmtDateTime(d){const p=n=>String(n).padStart(2,'0');return `${d.getFullYear()}-${p(d.getMonth()+1)}-${p(d.getDate())} ${p(d.getHours())}:${p(d.getMinutes())}`;}
function fmtDuration(from){let ms=MOCK_NOW-from; if(ms<0)ms=0; const mins=Math.floor(ms/60000); const days=Math.floor(mins/1440); const hrs=Math.floor((mins%1440)/60); const m=mins%60;
  if(days>0) return `${days}天${hrs}小时`; if(hrs>0) return `${hrs}小时${m}分`; return `${m}分钟`;}
function relTime(from){const mins=Math.floor((MOCK_NOW-from)/60000); if(mins<60) return mins+'分钟前'; if(mins<1440) return Math.floor(mins/60)+'小时前'; return Math.floor(mins/1440)+'天前';}

function toast(msg){
  const wrap=document.getElementById('toast-wrap');
  const t=el(`<div class="toast">${msg}</div>`);
  wrap.appendChild(t);
  requestAnimationFrame(()=>t.classList.add('show'));
  setTimeout(()=>{t.classList.remove('show'); setTimeout(()=>t.remove(),250);},2600);
}
function openModal(html){document.getElementById('modal-body').innerHTML=html; document.getElementById('modal-bg').classList.add('show');}
function closeModal(){document.getElementById('modal-bg').classList.remove('show');}
document.getElementById('modal-bg').addEventListener('click',e=>{if(e.target.id==='modal-bg')closeModal();});

function sparkline(seed,w,h,color,points=24){
  const rng=rngFor(seed); let v=0.5; const pts=[];
  for(let i=0;i<points;i++){v+=(rng()-0.48)*0.18; v=clamp(v,0.05,0.95); pts.push(v);}
  const step=w/(points-1);
  const coords=pts.map((p,i)=>[i*step,h-p*h]);
  const line=coords.map((c,i)=>(i===0?'M':'L')+c[0].toFixed(1)+','+c[1].toFixed(1)).join(' ');
  const area=line+` L${w},${h} L0,${h} Z`;
  const cid='g'+hashSeed(seed);
  return `<svg width="${w}" height="${h}" viewBox="0 0 ${w} ${h}" preserveAspectRatio="none">
    <defs><linearGradient id="${cid}" x1="0" y1="0" x2="0" y2="1"><stop offset="0%" stop-color="${color}" stop-opacity="0.35"/><stop offset="100%" stop-color="${color}" stop-opacity="0"/></linearGradient></defs>
    <path d="${area}" fill="url(#${cid})" stroke="none"/>
    <path d="${line}" fill="none" stroke="${color}" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/>
  </svg>`;
}

function priceChart(seed,w,h,basePrice,entry,sl,tp,color){
  const rng=rngFor(seed); let v=0.5; const n=44; const pts=[];
  for(let i=0;i<n;i++){v+=(rng()-0.47)*0.22; v=clamp(v,0.04,0.96); pts.push(v);}
  const step=w/(n-1);
  const coords=pts.map((p,i)=>[i*step,h-p*h]);
  const line=coords.map((c,i)=>(i===0?'M':'L')+c[0].toFixed(1)+','+c[1].toFixed(1)).join(' ');
  const area=line+` L${w},${h} L0,${h} Z`;
  const cid='pc'+hashSeed(seed);
  function yFor(price){ // map price around basePrice range to chart y using min/max of pts * some range guess
    const lo=Math.min(sl,tp,entry)*0.985, hi=Math.max(sl,tp,entry)*1.015;
    const t=clamp((price-lo)/(hi-lo),0,1);
    return h-t*h;
  }
  const yEntry=h*0.55, ySl=h*0.82, yTp=h*0.22, yCur=coords[coords.length-1][1];
  return `<svg width="100%" height="${h}" viewBox="0 0 ${w} ${h}" preserveAspectRatio="none" style="display:block">
    <defs><linearGradient id="${cid}" x1="0" y1="0" x2="0" y2="1"><stop offset="0%" stop-color="${color}" stop-opacity="0.30"/><stop offset="100%" stop-color="${color}" stop-opacity="0"/></linearGradient></defs>
    <line x1="0" y1="${yTp}" x2="${w}" y2="${yTp}" stroke="var(--green)" stroke-width="1" stroke-dasharray="4 3"/>
    <line x1="0" y1="${yEntry}" x2="${w}" y2="${yEntry}" stroke="var(--primary)" stroke-width="1" stroke-dasharray="4 3"/>
    <line x1="0" y1="${ySl}" x2="${w}" y2="${ySl}" stroke="var(--red)" stroke-width="1" stroke-dasharray="4 3"/>
    <path d="${area}" fill="url(#${cid})" stroke="none"/>
    <path d="${line}" fill="none" stroke="${color}" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
    <circle cx="${w-2}" cy="${yCur}" r="3.2" fill="${color}"/>
  </svg>`;
}

/* ---------- Witch-cat illustrations (Dashboard visual theme, 2026-08-05) ----------
   Hand-authored inline SVG (no external art/CDN — Artifact's CSP blocks outbound requests
   anyway, and this keeps the page a single self-contained file). These are simplified flat
   "cute mascot" shapes, not literal reproductions of a painted watercolor reference — that
   level of texture isn't practical to hand-author as SVG paths, so the goal here is capturing
   the same silhouette/palette/spirit at a level that stays maintainable. */

    <path d="M34 15c5 5 23 5 28 0" stroke="#6E5DD8" stroke-width="3" stroke-linecap="round"/>

/* ---------- Hand-drawn outline icon system (UI Redesign Spec v1.0, 2026-08-05) ----------
   "Replace all icons... hand drawn outline icons... black ink + colored accent, consistent
   stroke... Never use Emoji." — replaces the emoji previously used for the sidebar nav and the
   11 dashboard module badges. Shared 24x24 viewBox, --ink stroke, one small filled accent shape
   per icon for the "colored accent" requirement. Status glyphs (🟢⚪⚠⏳, previously used in
   liveBadge()/liveOnlyState()/the Detail Page loading states) are also converted below
   (iconStatusLive/Stub/Error/Loading) — Dashboard-scoped, so in-scope for this redesign, unlike
   the Research/Strategy pages' weight-total ✓/⚠ which stay untouched (out of scope). */
function oi(inner,size){
  size=size||20;
  return `<svg width="${size}" height="${size}" viewBox="0 0 24 24" fill="none" stroke="var(--ink)" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" style="display:block">${inner}</svg>`;
}

function iconBook(size){return oi(`<path d="M12 6.5 C10 5 7 4.5 4 5 V18 C7 17.5 10 18 12 19.5 C14 18 17 17.5 20 18 V5 C17 4.5 14 5 12 6.5 Z"/><line x1="12" y1="6.5" x2="12" y2="19.5"/>`,size);}
function iconSpellbook(size){return oi(`<rect x="5" y="4" width="14" height="16" rx="1.5"/><line x1="8" y1="4" x2="8" y2="20"/><path d="M13 8.5 L13.6 10.1 L15.2 10.5 L13.6 10.9 L13 12.5 L12.4 10.9 L10.8 10.5 L12.4 10.1 Z" fill="var(--gold)" stroke="none"/>`,size);}
function iconOwl(size){return oi(`<path d="M12 3 L9.5 6 M12 3 L14.5 6"/><ellipse cx="12" cy="13" rx="7" ry="8"/><circle cx="9" cy="11" r="2.1"/><circle cx="15" cy="11" r="2.1"/><circle cx="9" cy="11" r=".7" fill="var(--ink)" stroke="none"/><circle cx="15" cy="11" r=".7" fill="var(--ink)" stroke="none"/><path d="M12 13 L11 15 L13 15 Z" fill="var(--gold)" stroke="none"/>`,size);}
function iconCoin(size){return oi(`<circle cx="12" cy="12" r="8"/><circle cx="12" cy="12" r="5" stroke="var(--gold)"/><line x1="12" y1="9" x2="12" y2="15" stroke="var(--gold)"/>`,size);}

function iconCrystalBall(size){return oi(`<circle cx="12" cy="10" r="6"/><path d="M7 18 L17 18 L15 20 H9 Z" fill="var(--skyblue)" fill-opacity=".25"/><path d="M9 8 Q12 6 15 8" stroke-width="1" opacity=".6"/>`,size);}

/** Reference-master.png shows a waving-hand glyph next to the greeting — likely a literal Unicode

function iconWave(size){return oi(`<path d="M7 21c-2 0-3.2-1.4-3.2-3.4V13c0-1 .8-1.8 1.7-1.8s1.7.8 1.7 1.8v2.2"/><path d="M7.2 13.2V8.6c0-1 .8-1.8 1.7-1.8s1.7.8 1.7 1.8v4.4"/><path d="M10.6 12.6V7.4c0-1 .8-1.8 1.7-1.8s1.7.8 1.7 1.8v6"/><path d="M14 13.2V9.6c0-1 .8-1.8 1.7-1.8s1.7.8 1.7 1.8v6.6c0 3.4-2.2 5.8-5.7 5.8H13c-2.2 0-3.6-.7-4.8-2.3"/>`,size);}
/** Per-module icon renderer lookup — spec's suggested mapping (crystal ball for sentiment, money

/** seed determines the jagged shape (deterministic, matches sparkline()'s rngFor/hashSeed
 * helpers) — drawn with more amplitude and fewer points than sparkline() so it reads as a
 * mountain silhouette rather than a price line. */
function mountainSpark(seed,w,h,color){
  const rng=rngFor(seed); let v=0.3; const n=9; const pts=[];
  for(let i=0;i<n;i++){ v+=(rng()-0.35)*0.5; v=clamp(v,0.08,0.9); pts.push(v); }
  const step=w/(n-1);
  const coords=pts.map((p,i)=>[i*step,h-p*h]);
  const line=coords.map((c,i)=>(i===0?'M':'L')+c[0].toFixed(1)+','+c[1].toFixed(1)).join(' ');
  const area=line+` L${w},${h} L0,${h} Z`;
  const cid='ms'+hashSeed(seed);
  return `<svg width="${w}" height="${h}" viewBox="0 0 ${w} ${h}" preserveAspectRatio="none" style="display:block">
    <defs><linearGradient id="${cid}" x1="0" y1="0" x2="0" y2="1"><stop offset="0%" stop-color="${color}" stop-opacity="0.4"/><stop offset="100%" stop-color="${color}" stop-opacity="0.05"/></linearGradient></defs>
    <path d="${area}" fill="url(#${cid})" stroke="none"/>
    <path d="${line}" fill="none" stroke="${color}" stroke-width="1.6" stroke-linejoin="round" stroke-linecap="round"/>
  </svg>`;
}
/* ---------- Market Detail Page charts (DATA_SOURCE_SPEC.md, 2026-08-05) ----------
   Real OHLCV from pipeline's /api/market/detail (Binance klines), not deterministic mock data
   like sparkline()/priceChart() above — these three render whatever the backend returns. */
function candlestickChart(klines,w,h){
  if(!klines||klines.length===0) return `<div class="empty-hint" style="padding:20px; font-size:12px">暂无K线数据</div>`;
  const lo=Math.min(...klines.map(k=>k.low)), hi=Math.max(...klines.map(k=>k.high));
  const pad=(hi-lo)*0.06||1; const lo2=lo-pad, hi2=hi+pad;
  const y=v=>h-((v-lo2)/(hi2-lo2))*h;
  const n=klines.length, cw=w/n, bodyW=Math.max(1.5,cw*0.6);
  const bars=klines.map((k,i)=>{
    const cx=i*cw+cw/2, up=k.close>=k.open, color=up?'var(--green)':'var(--red)';
    const yO=y(k.open), yC=y(k.close), yH=y(k.high), yL=y(k.low);
    const bodyTop=Math.min(yO,yC), bodyH=Math.max(1,Math.abs(yC-yO));
    return `<line x1="${cx.toFixed(1)}" y1="${yH.toFixed(1)}" x2="${cx.toFixed(1)}" y2="${yL.toFixed(1)}" stroke="${color}" stroke-width="1"/><rect x="${(cx-bodyW/2).toFixed(1)}" y="${bodyTop.toFixed(1)}" width="${bodyW.toFixed(1)}" height="${bodyH.toFixed(1)}" fill="${color}"/>`;
  }).join('');
  return `<svg width="100%" height="${h}" viewBox="0 0 ${w} ${h}" preserveAspectRatio="none" style="display:block">${bars}</svg>`;
}
function volumeBarsChart(klines,w,h){
  if(!klines||klines.length===0) return '';
  const maxV=Math.max(...klines.map(k=>k.volume))||1;
  const n=klines.length, cw=w/n, barW=Math.max(1.5,cw*0.6);
  const bars=klines.map((k,i)=>{
    const cx=i*cw+cw/2, up=k.close>=k.open, bh=Math.max(1,(k.volume/maxV)*h);
    return `<rect x="${(cx-barW/2).toFixed(1)}" y="${(h-bh).toFixed(1)}" width="${barW.toFixed(1)}" height="${bh.toFixed(1)}" fill="${up?'var(--green)':'var(--red)'}" opacity=".5"/>`;
  }).join('');
  return `<svg width="100%" height="${h}" viewBox="0 0 ${w} ${h}" preserveAspectRatio="none" style="display:block">${bars}</svg>`;
}
function lineChartFromSeries(values,w,h,color){
  if(!values||values.length<2) return `<div class="empty-hint" style="padding:10px; font-size:11.5px">数据点不足，暂无法绘制</div>`;
  const lo=Math.min(...values), hi=Math.max(...values), range=(hi-lo)||1;
  const step=w/(values.length-1);
  const coords=values.map((v,i)=>[i*step, h-((v-lo)/range)*h]);
  const line=coords.map((c,i)=>(i===0?'M':'L')+c[0].toFixed(1)+','+c[1].toFixed(1)).join(' ');
  const area=line+` L${w},${h} L0,${h} Z`;
  const cid='lc'+Math.floor(Math.random()*1e6);
  return `<svg width="100%" height="${h}" viewBox="0 0 ${w} ${h}" preserveAspectRatio="none" style="display:block">
    <defs><linearGradient id="${cid}" x1="0" y1="0" x2="0" y2="1"><stop offset="0%" stop-color="${color}" stop-opacity="0.3"/><stop offset="100%" stop-color="${color}" stop-opacity="0"/></linearGradient></defs>
    <path d="${area}" fill="url(#${cid})" stroke="none"/>
    <path d="${line}" fill="none" stroke="${color}" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/>
  </svg>`;
}
/** Generic bucketed bar chart — used by Liquidation's 1H/4H/24H history charts (bars = usd per
 * bucket), unlike volumeBarsChart() above which is Market-specific (colored per-candle up/down). */
function barChart(values,w,h,color){
  if(!values||values.length===0) return `<div class="empty-hint" style="padding:10px; font-size:11.5px">暂无数据</div>`;
  const maxV=Math.max(...values,1);
  const n=values.length, cw=w/n, barW=Math.max(2,cw*0.65);
  const bars=values.map((v,i)=>{
    const cx=i*cw+cw/2, bh=Math.max(1,(v/maxV)*h);
    return `<rect x="${(cx-barW/2).toFixed(1)}" y="${(h-bh).toFixed(1)}" width="${barW.toFixed(1)}" height="${bh.toFixed(1)}" fill="${color}" opacity=".75" rx="1.5"/>`;
  }).join('');
  return `<svg width="100%" height="${h}" viewBox="0 0 ${w} ${h}" preserveAspectRatio="none" style="display:block">${bars}</svg>`;
}
/** Category breakdown (asset/exchange distribution) as ranked label+bar+value rows — clearer
 * than an unlabeled SVG bar chart when the point is comparing named categories, not a time series. */
function distRows(items,totalUsd,labelKey){
  if(!items||items.length===0) return `<div class="empty-hint" style="padding:10px; font-size:11.5px">暂无数据</div>`;
  return items.map(it=>{
    const label=it[labelKey];
    const pct=totalUsd>0?(it.usd/totalUsd*100):0;
    return `<div class="dist-row">
      <div class="dist-label">${label}</div>
      <div class="dist-track"><div class="dist-fill" style="width:${pct.toFixed(1)}%"></div></div>
      <div class="dist-val mono">${(it.usd/1e6).toFixed(2)}M</div>
    </div>`;
  }).join('');
}

/** Detects which of the 4 supported file kinds an uploaded/dropped/pasted file is, from its MIME
 * type first and its extension as a fallback (clipboard-pasted files and some browsers/OSes don't
 * always set a reliable MIME type). Returns null for anything unsupported — callers must not
 * guess a type for a file this can't classify. */
function detectFileEvidenceType(file){
  const name=(file.name||'').toLowerCase();
  const mime=file.type||'';
  if(mime.startsWith('image/')) return '截图';
  if(mime==='application/pdf'||name.endsWith('.pdf')) return 'PDF';
  if(mime==='text/markdown'||name.endsWith('.md')||name.endsWith('.markdown')) return 'Markdown';
  if(mime==='text/plain'||name.endsWith('.txt')) return 'TXT';
  return null;
}

/* ---------- Live data (via the local pipeline/ backend, see pipeline/src/server.ts) ----------
   The browser never calls exchanges/RSS/etc. directly anymore — CORS blocked some of them (RSS
   feeds), and even the ones that allowed CORS couldn't safely hold API keys client-side, and

   which does the real fetching/computing/OKX-fallback and returns plain JSON.
   Every one of the 11 dashboard sources goes through this same path now. If a source has no real
   provider at all (ETF flow, liquidation) the backend itself reports status:'stub' and says so —
   the frontend never fabricates numbers to fill the gap, matching real data or an honest failure/

const BACKEND_URL='http://localhost:8787';
const ALL_SOURCE_KEYS=DASHBOARD_SOURCES.map(s=>s.key);

function fmtClock(ts){const d=new Date(ts);const p=n=>String(n).padStart(2,'0');return `${p(d.getHours())}:${p(d.getMinutes())}:${p(d.getSeconds())}`;}
/** Real wall-clock relative time for live data (unlike relTime() above, which is pinned to the
 * mock trading data's fixed MOCK_NOW and would be wrong here). */
function relTimeReal(ts){
  const mins=Math.floor((Date.now()-ts)/60000);
  if(mins<1) return '刚刚';
  if(mins<60) return mins+'分钟前';
  if(mins<1440) return Math.floor(mins/60)+'小时前';
  return Math.floor(mins/1440)+'天前';
}

/* ---------- Fresh source snapshot conversion (Sprint 3.2B, replaces Sprint 2.1's Research Data
   Adapter) ----------
   The Sprint 2.1 adapter (researchSourceSummaryFor()/getResearchSourceSummaries()) read whatever
   Dashboard's own polling had already loaded into Store.live/Store.liveMeta — exactly the
   "Dashboard data reused as Analysis data" pattern the frozen Analysis Snapshot Integrity decision
   prohibits. Deleted; buildAnalysisPayload() no longer reads Store.live at all. In its place,
   freshSourceResultToSnapshot() below converts ONE just-fetched SourceResult (from a real
   GET /api/sources/:key?fresh=1 call the Analysis Runner makes on Run Analysis — see
   startAnalysisRunner()) into the same ResearchSourceSummary shape the Payload has always used, so
   downstream code (filterSourceSnapshotsToAsset()/summarizeNewsSnapshot()/buildAnalysisPayload())
   is unaffected by where the data actually came from.

   @typedef {{
     id: string, name: string,
     status: 'available'|'partial'|'unavailable',
     updatedAt: string,
     values: Array<{label:string, value:string|number, unit?:string}>,
     summary?: string, detailRoute?: string|null, error?: string|null
   }} ResearchSourceSummary */

/** Only Market and Liquidation have a real dedicated Detail Page (DATA_SOURCE_SPEC.md's
 * Connector→Normalize→Snapshot buildout so far) — everything else opens the generic item-list
 * modal, which isn't a distinct "detail route." Honest null for the other 9, not a fake path. */
const RESEARCH_DETAIL_ROUTES={ market:'market-detail', liquidation:'liquidation-detail' };

/** No 'loading'/'stale' states here (unlike the old Dashboard-cache adapter) — this is only ever
 * called on a SourceResult that was just fetched moments ago as part of the current Analysis Run,
 * so "stale" can't apply. Status mapping matches the Analysis Snapshot Integrity decision's
 * Validation Rules: 'ok' -> available, 'stub' -> partial (a real, valid response — just from a
 * source with no full backend integration yet — never a failure), and this function is never even
 * called for a source whose collection failed (see arCollectOneSource() — a failed/errored source
 * never reaches Freeze Snapshot at all, the whole analysis cancels first per Step 6). */
function freshSourceResultToSnapshot(key, result){
  const def=DASHBOARD_SOURCES.find(s=>s.key===key);
  const status = result.status==='stub' ? 'partial' : 'available';
  const values=(result.itemsRaw||[]).map(it=>({label:it.label, value:it.value}));
  return {
    id:key,
    name:def?def.name:key,
    status,
    updatedAt:new Date(result.fetchedAt||Date.now()).toISOString(),
    values,
    summary:result.note||undefined,
    detailRoute:RESEARCH_DETAIL_ROUTES[key]||null,
    error:null,
  };
}

function liveBadge(key){
  const meta=Store.liveMeta[key];
  if(!meta||meta.status==='loading') return `<span class="src-time">${iconStatusLoading()} 获取实时数据…</span>`;
  if(meta.status==='ok') return `<span class="src-time" style="color:var(--green);font-weight:600">${iconStatusLive()} 实时 ${fmtClock(meta.updatedAt)}</span>`;
  if(meta.status==='stub') return `<span class="src-time" style="color:var(--text-3)">${iconStatusStub()} 暂未接入</span>`;
  return `<span class="src-time" style="color:var(--text-3)">${iconStatusError()} 连接失败</span>`;
}
/** Never show fabricated numbers once we're actually trying to be real: only real data, an
 * explicit loading state, an explicit "not integrated yet" (stub) state, or an explicit failure
 * with the real error message — no silent fallback that could be mistaken for current data. The
 * small book/scroll doodle here is purely decorative (UI Redesign Spec v1.0's "Empty States"
 * section) — it never replaces the real status text underneath it. */
function liveOnlyState(key){
  const meta=Store.liveMeta[key];
  const doodle=`<div style="opacity:.35; margin-bottom:6px">${iconScroll(22)}</div>`;
  if(!meta||meta.status==='loading') return `<div class="empty-hint" style="padding:22px 8px">${doodle}${iconStatusLoading()} 正在获取实时数据…</div>`;
  if(meta.status==='stub') return `<div class="empty-hint" style="padding:22px 8px">${doodle}${iconStatusStub()} 该数据源暂未接入真实数据${meta.error?`<div style="font-size:11px;color:var(--text-3);margin-top:6px">${escapeAttr(meta.error)}</div>`:''}</div>`;
  return `<div class="empty-hint" style="padding:22px 8px">${doodle}${iconStatusError()} 连接失败，暂无数据${meta.error?`<div style="font-size:11px;color:var(--text-3);margin-top:6px">${escapeAttr(meta.error)}</div>`:''}</div>`;
}
/** showTime: only meaningful for news, where each item genuinely happened at a different real
 * moment. Other sources' items mostly share one fetch timestamp — the card header's own "🟢 实时
 * HH:MM:SS" badge already covers freshness, so a per-item time there is just noise. It would
 * also be actively wrong for macro calendar items, whose `value` already shows the event's own
 * (future) scheduled time — a "5分钟前" under a event scheduled for next week makes no sense. */
/** Caps how many items a card shows (default 3) rather than letting a rich source (news,
 * technical) grow the card indefinitely or scroll internally — the overflow goes to a "还有 N
 * 条 →" link into the same 查看详情 modal, instead of duplicating that view inside the card. */
function renderGenericLiveItems(items,limit,showTime,key){
  const cap=limit||3;
  const shown=items.slice(0,cap);
  const remaining=items.length-shown.length;
  const rows=shown.map(it=>`<div class="src-line" style="align-items:flex-start">
    <span class="k">${it.label}${showTime&&it.timestamp?`<div style="font-size:10.5px;color:var(--text-3);margin-top:2px">${relTimeReal(it.timestamp)}</div>`:''}</span>
    <span class="v mono ${it.polarity==='bullish'?'up':it.polarity==='bearish'?'down':''}" style="font-weight:700; text-align:right">${it.value}</span>
  </div>`).join('');
  const more=remaining>0?`<button class="src-more" data-action="view-source-detail" data-key="${key}">还有 ${remaining} 条 →</button>`:'';
  return rows+more;
}

/** Section 6/7 — maps an AI ScenarioPlan's `triggerStructured` (AI_RESPONSE_SPEC vocabulary:
 * price/candle_close, GT/GTE/LT/LTE/BETWEEN/CROSSES_ABOVE/CROSSES_BELOW/EQUALS, logic ALL/ANY) onto
 * the narrower StrategyOrder Trigger this sprint actually supports (PRICE/CANDLE_CLOSE_PRICE,
 * GT/GTE/LT/LTE only, logic SINGLE/AND/OR). Returns null when the plan's trigger uses anything
 * outside that support set — never silently drops a condition or guesses a supported equivalent
 * (Section 6: "如果数据源不足，不要伪造支持"). */
function mapScenarioTriggerToStrategyTrigger(triggerStructured){
  if(!triggerStructured || !Array.isArray(triggerStructured.conditions) || !triggerStructured.conditions.length) return null;
  const metricMap={price:'PRICE', candle_close:'CANDLE_CLOSE_PRICE'};
  const allowedOps=['GT','GTE','LT','LTE'];
  const conditions=[];
  for(const c of triggerStructured.conditions){
    const metric=metricMap[c.metric];
    if(!metric || !allowedOps.includes(c.operator) || !isFiniteNumber(c.value)) return null;
    const cond={metric, operator:c.operator, value:c.value};
    if(metric==='CANDLE_CLOSE_PRICE'){
      if(!c.timeframe || !TRIGGER_TIMEFRAME_MS[c.timeframe]) return null;
      cond.timeframe=c.timeframe;
    }
    conditions.push(cond);
  }
  const logic = conditions.length===1 ? 'SINGLE' : (triggerStructured.logic==='ALL' ? 'AND' : 'OR');
  return {logic, conditions};
}

/** Sprint 3.6A.2 — the one function every "resume from history" flow (order/position sync,
 * protection reconciliation, cancellation) uses to go from an already-known `exchangeAccountId` back
 * to a currently-usable connection. Pure, given already-fetched accounts+connections lists. Never
 * silently substitutes another connection bound to the same account when the preferred one is
 * unavailable — deterministic by design (Section 8 of the Phase 1 investigation report): a missing/
 * disabled preferred connection means the account itself is reported unavailable, not silently routed
 * through some other connection. */
function resolvePreferredConnectionForAccount(exchangeAccountId, accounts, connections){
  if(!exchangeAccountId) return {ok:false, reason:'账户身份未知'};
  const account=(accounts||[]).find(a=>a.id===exchangeAccountId);
  if(!account) return {ok:false, reason:'交易所账户不存在'};
  if(!account.preferredConnectionId) return {ok:false, reason:'该交易所账户尚未设置首选连接', account};
  const conn=(connections||[]).find(c=>c.id===account.preferredConnectionId);
  if(!conn) return {ok:false, reason:'该交易所账户的首选连接不存在', account};
  if(!conn.enabled) return {ok:false, reason:'该交易所账户的首选连接已被禁用', account};
  return {ok:true, connectionId:conn.id, account};
}

/** Sprint 3.6A.2 — the one shared connection-resolution entry point for every flow that resumes work
 * on an ALREADY-EXISTING RealOrder (order/position sync, protection reconciliation, cancellation).
 * Prefers `order.exchangeAccountId` (ownership truth, ADD in 3.6A.2) via
 * resolvePreferredConnectionForAccount() — this is what lets these flows keep working through a
 * DIFFERENT connection after the order's original `exchangeConnectionId` becomes unavailable, as long
 * as both connections are bound to the same real ExchangeAccount. Falls back to the pre-3.6A.2
 * behavior (`resolveRiskExchangeConnectionId()` against current Risk Settings) only for a legacy order
 * that predates the `exchangeAccountId` field — never a silent behavior change for old data. */
async function resolveConnectionForRealOrder(order){
  let connections;
  try{
    const res=await fetch(`${BACKEND_URL}/api/exchange/connections`);
    const json=await res.json();
    if(!json.ok) return {ok:false, reason:'无法读取交易所连接列表'};
    connections=json.connections;
  }catch(e){ return {ok:false, reason:'无法读取交易所连接列表'}; }

  // Accounts are fetched independently and never allowed to block connections-based resolution — a
  // legacy order (no exchangeAccountId yet) doesn't even need this list, and a transient failure here
  // should degrade to "treat as no accounts known" rather than failing the whole resolution.
  let accounts=[];
  try{
    const res=await fetch(`${BACKEND_URL}/api/exchange/accounts`);
    const json=await res.json();
    if(json.ok) accounts=json.accounts;
  }catch(e){ /* degrade to accounts=[] */ }

  if(order.exchangeAccountId){
    const resolved=resolvePreferredConnectionForAccount(order.exchangeAccountId, accounts, connections);
    if(!resolved.ok) return {ok:false, reason:resolved.reason};
    return {ok:true, connectionId:resolved.connectionId, connections, accounts};
  }
  const resolved=resolveRiskExchangeConnectionId(loadRiskSettings(), connections);
  if(!resolved.ok) return {ok:false, reason:resolved.reason};
  return {ok:true, connectionId:resolved.connectionId, connections, accounts};
}

   * a key should reuse the same Binance account identity, not fork a new one. `accountBindingMode:
   * 'NEW'` as an unconditional default meant a user rotating their key by creating a fresh Connection
   * (rather than editing the old one) silently got a second ExchangeAccount every time. When exactly
   * one existing same-exchange/environment account is a reasonable candidate, default to EXISTING and
   * pre-select it — the user can still actively switch to "新建一个交易所账户". With zero or multiple
   * candidates, leave the default as NEW (multiple candidates must never be guessed/merged; the
   * dropdown already exposes every Existing option plus New for an explicit choice). */

}

/** Task 16/17 — explicit manual refresh only, no polling interval added (account data is never
 * treated as permanent cached config). */
/** Hotfix (3.5C.2), Task 9 — defense-in-depth only: the backend's own adapter-level timeouts
 * (BINANCE_READ_TIMEOUT_MS per Binance call, plus the symbol-scoped/best-effort protective-order
 * read) already bound how long a real account read can take, so this frontend timeout is a generous
 * upper bound on top of that — not the primary fix — ensuring the "正在读取账户信息…" spinner is
 * NEVER truly indefinite even in a pathological case (e.g. a hung local backend process). */
const EXCHANGE_ACCOUNT_FETCH_TIMEOUT_MS=25000;
async function loadExchangeAccountSnapshot(id){
  Store.exchangeAccountSnapshots=Store.exchangeAccountSnapshots||{};
  Store.exchangeAccountSnapshots[id]={loading:true};
  document.getElementById('app').innerHTML=renderAiConnectionsSettings(); wireInteractions();
  try{
    const res=await fetch(`${BACKEND_URL}/api/exchange/connections/${id}/account`, {signal:AbortSignal.timeout(EXCHANGE_ACCOUNT_FETCH_TIMEOUT_MS)});
    const json=await res.json();
    if(!json.ok) throw new Error((json.error&&json.error.message)||'读取账户失败');
    Store.exchangeAccountSnapshots[id]={loading:false, snapshot:json.snapshot, error:null};
  }catch(err){
    const isTimeout = err && (err.name==='TimeoutError' || err.name==='AbortError');
    Store.exchangeAccountSnapshots[id]={loading:false, snapshot:null, error: isTimeout?'读取账户超时，请稍后重试':err.message};
  }
  document.getElementById('app').innerHTML=renderAiConnectionsSettings(); wireInteractions();
}

 * non-zero by the backend's normalizeBinanceFuturesAccount() (Task 33's own test coverage), so this

/** Sprint 3.5C, Task 16 — full Futures position card. Every "不可用" is a real absence signal
 * (Binance didn't return a meaningful value), never a fabricated placeholder (Task 4/5). Stop-loss
 * wording is deliberately hedged ("当前读取范围内未检测到") per Task 13 — never an absolute claim
 * that no protection exists, since API coverage (esp. the best-effort Algo Service read) cannot
 * guarantee that conclusion.
 * Hotfix (3.5C.2), Task 5 — CRITICAL: `protectionReadStatus` distinguishes "the query succeeded and
 * found nothing" from "the query itself could not be completed." Only the former may say "未检测
 * 到"; the latter must say the read failed — never let the two look the same to the user. */
/** Sprint 3.6A — read-only helper: shows how the real exchange net Position's quantity breaks down
 * across local Trades (`PositionAllocation`) plus honestly-labeled external/pre-existing exposure.
 * Returns '' when there is nothing to show (zero allocations AND zero unattributed remainder — e.g.
 * a position freshly linked from a raw snapshot with no local mirror resolved). Never claims
 * exclusive ownership of the whole quantity — only ever shows what's actually attributable. */
function renderPositionAllocationBlock(position){
  const {allocations, allocationStatus, unattributedQuantity}=getPositionAllocationSummary(position);
  if(!allocations.length && !(unattributedQuantity>1e-9)) return '';
  const rows=allocations.map(a=>{
    const trade=getRealTradeById(a.tradeId);
    const pct = position.quantity>0 ? (a.quantity/position.quantity*100) : 0;
    const label = trade ? `<span data-action="nav" data-href="#/trades/${escapeAttr(a.tradeId)}" style="cursor:pointer; color:var(--primary)">交易 …${escapeAttr(a.tradeId.slice(-6))}</span>` : escapeAttr(a.tradeId);
    return `<div class="row"><span class="k">${label}</span><span class="v mono">${fmt(a.quantity,6)}（${fmt(pct,1)}%）</span></div>`;
  }).join('');
  const unattributedRow = unattributedQuantity>1e-9 ? `<div class="row"><span class="k">外部/未归因仓位</span><span class="v mono">${fmt(unattributedQuantity,6)}（${fmt(position.quantity>0?unattributedQuantity/position.quantity*100:0,1)}%）</span></div>` : '';
  const conflictNote = allocationStatus==='CONFLICT' ? `<div class="empty-hint" style="border:1px solid var(--amber, #d97706); color:var(--text-1); padding:8px 10px; margin-top:6px; text-align:left; font-size:12.5px">${iconStatusError()} 本地归因数量之和超过了交易所真实持仓数量（可能是外部减仓，或某笔交易自身的止盈/止损已部分成交）。以上数量仅供参考，以交易所真实持仓为准，系统不会自动调整任何归因记录。</div>` : '';
  return `<div class="pk" style="font-size:11px; color:var(--text-2); font-weight:700; margin:8px 0 4px">仓位归因 · 该持仓可能由交易所层面的同一净仓位与其他来源共享</div>
    <div class="kv-list" style="margin-bottom:6px">${rows}${unattributedRow}</div>
    ${conflictNote}`;
}
