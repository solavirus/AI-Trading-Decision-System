        <div class="row"><span class="k">scenarioPlanId</span><span class="v mono">${rt.scenarioPlanId?escapeAttr(rt.scenarioPlanId):'—'}</span></div>
        <div class="row"><span class="k">executionId</span><span class="v mono">${(rt.executionIds&&rt.executionIds.length)?rt.executionIds.map(id=>escapeAttr(id)).join(', '):'—（未经 ExecutionDraft，直接由策略自动执行创建）'}</span></div>
        <div class="row"><span class="k">tradeId</span><span class="v mono">${escapeAttr(rt.tradeId)}</span></div>
      </div>
    </details>
  `;
}

/* ---------- Interactions ---------- */
function wireInteractions(){
  document.querySelectorAll('[data-action="w-slide"],[data-action="w-num"]').forEach(elm=>{
    elm.addEventListener('input',()=>{
      const key=elm.dataset.key, val=clamp(Number(elm.value)||0,0,100);
      const w=Store.draft.weights.find(x=>x.key===key); w.weight=val; saveDraft();
      document.querySelectorAll(`[data-key="${key}"]`).forEach(o=>{if(o!==elm)o.value=val;});
      refreshWeightTotal();
    });
  });
  document.querySelectorAll('[data-action="ev-weight"]').forEach(elm=>{
    elm.addEventListener('input',()=>{const ev=Store.draft.evidence.find(x=>x.id===elm.dataset.id); ev.weight=clamp(Number(elm.value)||0,0,100); saveDraft(); refreshWeightTotal();});
  });
  document.querySelectorAll('[data-action="ev-label"]').forEach(elm=>elm.addEventListener('input',()=>{Store.draft.evidence.find(x=>x.id===elm.dataset.id).label=elm.value; saveDraft();}));
  document.querySelectorAll('[data-action="ev-desc"]').forEach(elm=>elm.addEventListener('input',()=>{Store.draft.evidence.find(x=>x.id===elm.dataset.id).desc=elm.value; saveDraft();}));
  document.querySelectorAll('[data-action="ev-type"]').forEach(elm=>elm.addEventListener('change',()=>{
    Store.draft.evidence.find(x=>x.id===elm.dataset.id).type=elm.value; saveDraft();
    document.getElementById('app').innerHTML=renderResearch(); wireInteractions();
  }));
  document.querySelectorAll('[data-action="ev-file-pick"]').forEach(elm=>elm.addEventListener('change',async ()=>{
    const file=elm.files[0]; if(!file) return;
    await attachFileToEvidence(elm.dataset.id, file);
  }));
  document.querySelectorAll('[data-action="ev-dropzone"]').forEach(elm=>{
    elm.addEventListener('dragover',e=>{ e.preventDefault(); elm.classList.add('dragover'); });
    elm.addEventListener('dragleave',()=>{ elm.classList.remove('dragover'); });
    elm.addEventListener('drop',async e=>{
      e.preventDefault(); elm.classList.remove('dragover');
      const file=e.dataTransfer.files && e.dataTransfer.files[0];
      if(file) await attachFileToEvidence(elm.dataset.id, file);
    });
  });
  document.querySelectorAll('.ev-card').forEach(card=>{
    card.addEventListener('focusin',()=>{ Store.lastFocusedEvidenceId=card.dataset.id; });
  });
  document.querySelectorAll('[data-action="account-select-connection"]').forEach(elm=>elm.addEventListener('change',()=>{ switchAccountPageConnection(elm.value); }));
  document.querySelectorAll('[data-action="set-asset"]').forEach(elm=>elm.addEventListener('change',()=>{Store.draft.asset=elm.value; saveDraft();}));
  document.querySelectorAll('[data-action="set-timeframe"]').forEach(elm=>elm.addEventListener('change',()=>{Store.draft.timeframe=elm.value; saveDraft();}));
  document.querySelectorAll('[data-action="set-range"]').forEach(elm=>elm.addEventListener('change',()=>{Store.draft.range=elm.value; saveDraft();}));

  document.querySelectorAll('[data-action="exec-field"]').forEach(elm=>elm.addEventListener('input',()=>{
    const f=elm.dataset.field; Store.draft.execution[f]=Number(elm.value); saveDraft();
    document.querySelectorAll(`[data-action="exec-field"][data-field="${f}"]`).forEach(o=>{if(o!==elm) o.value=elm.value;});
  }));
  document.querySelectorAll('[data-action="adj-reason"]').forEach(elm=>elm.addEventListener('input',()=>{
    Store.draft.execution[elm.dataset.field]=elm.value; saveDraft();
  }));
  const adjHoldEl=document.querySelector('[data-action="adj-hold"]');
  if(adjHoldEl) adjHoldEl.addEventListener('input',()=>{Store.draft.execution.adjHold=adjHoldEl.value; saveDraft();});
  const notesEl=document.querySelector('[data-action="exec-notes"]');
  if(notesEl) notesEl.addEventListener('input',()=>{Store.draft.execution.notes=notesEl.value; saveDraft();});

  // Sprint 3.4A — real ExecutionDraft field wiring, completely separate from the legacy exec-field
  // block above (which mutates Store.draft.execution). Re-resolves the draft fresh on every edit
  // (cheap — localStorage reads) rather than closing over a stale reference, and refuses to write
  // once the draft is no longer DRAFT (confirmed/cancelled drafts are read-only).
  (function wireExecutionDraftFields(){
    const routeParts=currentRoute();
    if(routeParts[0]!=='execution' || !routeParts[1]) return;
    const executionId=routeParts[1];
    function withDraft(fn){
      const view=resolveExecutionView(executionId);
      if(!view.ok || view.draft.status!=='DRAFT') return;
      fn(view.draft, view.plan);
      saveExecutionDraft(view.draft);
    }
    const entryFrom=document.querySelector('[data-action="exec2-entry-from"]');
    if(entryFrom) entryFrom.addEventListener('input',()=>withDraft((draft,plan)=>{
      exec2EnsureOverrideEntry(draft,plan).from = entryFrom.value===''?null:Number(entryFrom.value);
    }));
    const entryTo=document.querySelector('[data-action="exec2-entry-to"]');
    if(entryTo) entryTo.addEventListener('input',()=>withDraft((draft,plan)=>{
      exec2EnsureOverrideEntry(draft,plan).to = entryTo.value===''?null:Number(entryTo.value);
    }));
    const entryValue=document.querySelector('[data-action="exec2-entry-value"]');
    if(entryValue) entryValue.addEventListener('input',()=>withDraft((draft,plan)=>{
      exec2EnsureOverrideEntry(draft,plan).value = entryValue.value===''?null:Number(entryValue.value);
    }));
    const entryDesc=document.querySelector('[data-action="exec2-entry-desc"]');
    if(entryDesc) entryDesc.addEventListener('input',()=>withDraft((draft,plan)=>{
      exec2EnsureOverrideEntry(draft,plan).description = entryDesc.value;
    }));
    // Sprint 3.4C, Task 12/13 — ZONE/CONDITIONAL executable-price resolution. The type select needs
    // a re-render (it changes whether the price input is shown for CONDITIONAL); the price input
    // does not, same pattern as every other plain-value field above.
    const orderTypeEl=document.querySelector('[data-action="exec2-order-type"]');
    if(orderTypeEl) orderTypeEl.addEventListener('change',()=>{
      withDraft((draft)=>{
        draft.userOverrides.orderResolution = draft.userOverrides.orderResolution || {type:null, price:null};
        draft.userOverrides.orderResolution.type = orderTypeEl.value || null;
        if(orderTypeEl.value!=='LIMIT') draft.userOverrides.orderResolution.price=null;
      });
      document.getElementById('app').innerHTML=renderExecutionReal(executionId); wireInteractions();
    });
    const orderPriceEl=document.querySelector('[data-action="exec2-order-price"]');
    if(orderPriceEl) orderPriceEl.addEventListener('input',()=>withDraft((draft)=>{
      draft.userOverrides.orderResolution = draft.userOverrides.orderResolution || {type:null, price:null};
      draft.userOverrides.orderResolution.price = orderPriceEl.value===''?null:Number(orderPriceEl.value);
    }));
    const stopValue=document.querySelector('[data-action="exec2-stop-value"]');
    if(stopValue) stopValue.addEventListener('input',()=>withDraft((draft,plan)=>{
      exec2EnsureOverrideStopLoss(draft,plan).value = stopValue.value===''?null:Number(stopValue.value);
    }));
    const stopDesc=document.querySelector('[data-action="exec2-stop-desc"]');
    if(stopDesc) stopDesc.addEventListener('input',()=>withDraft((draft,plan)=>{
      exec2EnsureOverrideStopLoss(draft,plan).description = stopDesc.value;
    }));
    document.querySelectorAll('[data-action="exec2-tp-value"]').forEach(elm=>elm.addEventListener('input',()=>withDraft((draft,plan)=>{
      const ov=exec2EnsureOverrideTakeProfit(draft,plan), i=Number(elm.dataset.index);
      if(ov[i]) ov[i].value = elm.value===''?null:Number(elm.value);
    })));
    document.querySelectorAll('[data-action="exec2-tp-desc"]').forEach(elm=>elm.addEventListener('input',()=>withDraft((draft,plan)=>{
      const ov=exec2EnsureOverrideTakeProfit(draft,plan), i=Number(elm.dataset.index);
      if(ov[i]) ov[i].description = elm.value;
    })));
    document.querySelectorAll('[data-action="exec2-tp-portion"]').forEach(elm=>elm.addEventListener('input',()=>{
      withDraft((draft,plan)=>{
        const ov=exec2EnsureOverrideTakeProfit(draft,plan), i=Number(elm.dataset.index);
        if(ov[i]) ov[i].portion = elm.value===''?null:Number(elm.value);
      });
      refreshTakeProfitPortionTotal(executionId);
    }));
    const posSize=document.querySelector('[data-action="exec2-position-size"]');
    if(posSize) posSize.addEventListener('input',()=>withDraft((draft)=>{
      draft.userOverrides.positionSize = posSize.value===''?null:Number(posSize.value);
    }));
    const leverageEl=document.querySelector('[data-action="exec2-leverage"]');
    if(leverageEl) leverageEl.addEventListener('change',()=>withDraft((draft)=>{
      draft.userOverrides.leverage = leverageEl.value===''?null:Number(leverageEl.value);
    }));
    const notes2El=document.querySelector('[data-action="exec2-notes"]');
    if(notes2El) notes2El.addEventListener('input',()=>withDraft((draft)=>{
      draft.userOverrides.notes = notes2El.value;
    }));
  })();

/** Sprint 3.5D-E, Task C — same live-feedback pattern as refreshWeightTotal(): updates the portion
 * sum indicator without a full page re-render (avoids losing input focus mid-edit). */
function refreshTakeProfitPortionTotal(executionId){
  const view=resolveExecutionView(executionId);
  if(!view.ok) return;
  const effective=effectiveExecutionPlan(view.plan, view.draft.userOverrides);
  const check=validateTakeProfitPortions(effective.takeProfit);
  const sum=(effective.takeProfit||[]).reduce((s,tp)=>s+(isFiniteNumber(tp.portion)?tp.portion:0),0);
  const el=document.querySelector('.tp-portion-total');
  if(el){
    el.textContent = check.ok ? `✓ 止盈比例合计 ${sum}%` : `⚠ ${check.reason}`;
    el.style.color = check.ok ? 'var(--green)' : 'var(--red)';
  }
}

function refreshWeightTotal(){
  const total=draftTotal();
  const ok=total===100;
  const totalEl=document.querySelector('.weight-total');
  if(totalEl){totalEl.textContent=`总权重 ${total}% ${ok?'✓':'⚠'}`; totalEl.style.color= ok? 'var(--green)':'var(--red)';}
  const btn=document.querySelector('[data-action="analyze"]');
  if(btn){btn.disabled=!ok; btn.textContent = '✨ 开始 AI 分析 '+(ok?'':`（权重总和需为 100%，当前 ${total}%）`);}
}

/** Sprint 3.1B.2 Task 3 — global, not per-dropzone: Ctrl+V/Cmd+V has no natural "target element"
 * the way a click or a drag-drop does, and Research can now start with zero evidence cards (Task
 * 2), so there may be nowhere to paste INTO yet. Prefers the last-focused empty file-type card
 * (set by the 'focusin' listener in wireInteractions); if there isn't one, creates a fresh 截图
 * card and attaches there — "for pasted images, create the upload automatically" (Task 3). Only
 * images are handled: PDF/TXT/Markdown have no standard OS clipboard "paste as file" gesture. */
function findEmptyFileEvidenceId(){
  if(!Store.draft) return null;
  const focused=Store.draft.evidence.find(e=>e.id===Store.lastFocusedEvidenceId && !e.fileName && EVIDENCE_FILE_TYPES.includes(e.type));
  if(focused) return focused.id;
  const anyEmpty=Store.draft.evidence.find(e=>!e.fileName && EVIDENCE_FILE_TYPES.includes(e.type));
  return anyEmpty ? anyEmpty.id : null;
}
document.addEventListener('paste', async (e)=>{
  if(currentRoute()[0]!=='research'||!Store.draft) return;
  const items=(e.clipboardData||window.clipboardData||{}).items;
  if(!items) return;
  let imageFile=null;
  for(const item of items){ if(item.type&&item.type.startsWith('image/')){ imageFile=item.getAsFile(); break; } }
  if(!imageFile) return;
  e.preventDefault();
  let targetId=findEmptyFileEvidenceId();
  if(!targetId){
    const newEv={id:'e'+Date.now(),type:'截图',label:'',desc:'',weight:0,fileName:null,fileData:null,fileSize:null};
    Store.draft.evidence.push(newEv);
    targetId=newEv.id;
  }
  const named = imageFile.name ? imageFile : new File([imageFile],'pasted-image-'+Date.now()+'.png',{type:imageFile.type||'image/png'});
  await attachFileToEvidence(targetId, named);
});

/* ---------- Analysis Runner overlay (Sprint 3.2A UI, Sprint 3.9 backend unification, Sprint 3.9.1.1
   real per-source progress) ----------
   Sprint 3.9 collapsed source collection/payload/prompt/AI-call/response-validation into ONE
   blocking backend call, which regressed the overlay to a single "统一分析流水线" line with no real
   per-step visibility (Section 0's own bug report) and left the frontend's own HTTP request open for
   the full 45-90+s (up to 120s-timeout) duration.
   Sprint 3.9.1.1 fixes both: `POST /api/analysis/run` now returns `{analysisId}` immediately (the
   real pipeline runs in the background, `analysisRunStore.ts`), and this overlay polls
   `GET /api/analysis/runs/:id` to render REAL per-source rows, retry attempts, the account/position
   snapshot stage, and the AI stage's live elapsed time — every row here reflects an actual backend
   `AnalysisRun` field, never a locally-faked animation. Manual and Scheduled share the exact same
   `AnalysisRun` model (Section 9/19) — Scheduled's progress is viewed via `arOpenOverlayForRun()`
   from the Monitoring page's "查看进度" button, the SAME function/rendering Manual uses. */

/** Purely for perceptibility on the evidence-processing pre-stage (Section 1 — untouched by this
 * sprint, still fully frontend-local): Validate/parse-evidence-images are near-instant synchronous/
 * single-request steps, but rendering them with zero visible duration would look broken. The stage's
 * success/failure is always real; only this pacing is artificial. */
const AR_LOCAL_STAGE_MS = 220;
/** Sprint 3.9.1.1, Section 10 — how often the overlay re-polls `GET /api/analysis/runs/:id` while a
 * run is non-terminal. Frequent enough that retry/stage transitions feel live, not so frequent that
 * an idle overlay spams the backend for minutes at a time. */
const AR_POLL_INTERVAL_MS = 1500;
/** Sprint 3.9.1.1, Section 14 — once the AI stage has been running this long, its sub-line adds an
 * explicit "请求仍在处理中，请勿重复提交" — never turns red on its own; only a real backend FAILED
 * stage does that. */
const AR_AI_LONG_RUN_HINT_MS = 120_000;
/** Sprint 3.9.1.1, Section 24 — the ONE shared stage-label mapping; every stage name shown anywhere
 * in this overlay (or the Monitoring page's "查看进度" summary) comes from here. */
const AR_STAGE_LABEL={
  PREPARING:'准备中', COLLECTING_SOURCES:'采集数据源', SYNCING_ACCOUNT:'账户/持仓快照',
  BUILDING_PAYLOAD:'构建分析数据', BUILDING_PROMPT:'构建 Prompt', AI_ANALYSIS:'AI 深度分析',
  VALIDATING_RESPONSE:'校验 AI 响应', FINALIZING:'收尾', COMPLETED:'已完成', FAILED:'失败', CANCELLED:'已取消',
};
const AR_TERMINAL_STAGES=['COMPLETED','FAILED','CANCELLED'];

/** Developer Diagnostics (Sprint 3.2B) — only rendered when Store.devDiagnosticsMode is on (sidebar
 * switch). Built from real numbers collected during the run (see startAnalysisRunner()); shows "—"
 * for the payload/prompt fields on a failed run, since those stages never happened. No token
 * estimation, per explicit instruction. */
/** Dev-only (Store.devDiagnosticsMode) — shows only what's genuinely still knowable from the client
 * side under the Sprint 3.9.1.1 model: the real AnalysisRecord's payload size and the AI call's own
 * latency, both read from the record fetched once the run reaches COMPLETED (see
 * arHandleTerminalRun()). Collection/prompt-build timings are backend-internal now and never sent to
 * the client, so — per this codebase's own "never fabricate" discipline — those rows are gone rather
 * than shown as a guess. */
function arDiagnosticsHtml(runner){
  if(!Store.devDiagnosticsMode || !runner.diagnostics) return '';
  const g=runner.diagnostics;
  const ms=(v)=> v==null ? '—' : v+' ms';
  const chars=(v)=> v==null ? '—' : v+' 字符';
  return `<div class="ar-diagnostics">
    <div class="ar-diag-title">开发者诊断信息</div>
    <div class="ar-diag-row"><span>Payload 大小</span><span>${chars(g.payloadSizeChars)}</span></div>
    ${g.aiLatencyMs!==undefined?`<div class="ar-diag-row"><span>AI 请求耗时</span><span>${ms(g.aiLatencyMs)}</span></div>`:''}
  </div>`;
}

/** Sprint 3.9.1.1, Section 5/7/8/13 — one `.ar-stage` row per real `SourceProgress`/
 * `AccountSnapshotProgress`/`AiStageProgress` entry from the polled `AnalysisRun`; never a hardcoded
 * count, never a compressed "采集 N 个数据源" summary line (Section 5's hard requirement). */
function arRowStatusClass(status){
  if(status==='COMPLETED') return 'success';
  if(status==='FAILED') return 'failed';
  if(status==='RUNNING'||status==='RETRYING') return 'running';
  if(status==='SKIPPED') return 'skipped';
  return 'waiting'; // PENDING
}
function arRowIcon(status){
  return ({COMPLETED:'✓', FAILED:'✕', RUNNING:'●', RETRYING:'●', SKIPPED:'—'})[status] || '○';
}
function arRowHtml(row){
  const cls=arRowStatusClass(row.status);
  return `<div class="ar-stage ${cls}"><span class="ic">${arRowIcon(row.status)}</span><div style="flex:1; min-width:0">
    <div class="lbl">${escapeAttr(row.label)}</div>
    ${row.sub?`<div class="ar-stage-sub">${escapeAttr(row.sub).replace(/\n/g,'<br>')}</div>`:''}
  </div></div>`;
}
/** Sprint 3.9.1.1, Section 6/7/8/14 — builds every visible row straight from the real `AnalysisRun`:
 * per-source (with retry sub-text, Section 7), account/position snapshot (Section 8, only when the
 * run actually has one in scope), AI stage (Section 14's live elapsed + long-run hint). */
function arRowsFromRun(run){
  const rows=[];
  (run.sources||[]).forEach(s=>{
    let sub='';
    if(s.status==='RETRYING') sub=`第 ${s.attempt}/${s.maxAttempts} 次重试`+(s.lastError?`：${s.lastError}`:'');
    else if(s.status==='FAILED' && s.lastError) sub=s.lastError;
    rows.push({status:s.status, label:s.label, sub});
  });
  if(run.accountSnapshot){
    const a=run.accountSnapshot;
    let sub='';
    if(a.status==='RETRYING') sub=`第 ${a.attempt}/${a.maxAttempts} 次重试`+(a.lastError?`：${a.lastError}`:'');
    else if(a.status==='FAILED' && a.lastError) sub=a.lastError;
    rows.push({status:a.status, label:'账户/持仓快照', sub});
  }
  const ai=run.aiStage;
  let aiSub='';
  if(ai.status==='RUNNING' && ai.startedAt){
    const elapsedS=Math.max(0,Math.floor((Date.now()-new Date(ai.startedAt).getTime())/1000));
    const mm=String(Math.floor(elapsedS/60)).padStart(2,'0'), ss=String(elapsedS%60).padStart(2,'0');
    aiSub = elapsedS*1000>=AR_AI_LONG_RUN_HINT_MS ? `已运行 ${mm}:${ss} 请求仍在处理中，请勿重复提交` : `已运行 ${mm}:${ss}`;
  } else if(ai.status==='FAILED' && run.error){
    aiSub=run.error;
  }
  rows.push({status:ai.status, label:'AI 深度分析', sub:aiSub});
  return rows;
}

function renderAnalysisRunnerOverlay(){
  const r=Store.analysisRunner;
  if(!r) return '';

  // ---- Pre-backend phase: evidence processing only (Section 1 — still fully frontend-local,
  // untouched by this sprint) or the brief moment while POST /api/analysis/run is in flight. ----
  if(r.phase==='starting' || r.phase==='evidence-failed'){
    const stagesHtml = r.evidenceStage ? arRowHtml({status:r.evidenceStage.status==='running'?'RUNNING':r.evidenceStage.status==='success'?'COMPLETED':r.evidenceStage.status==='failed'?'FAILED':'PENDING', label:r.evidenceStage.label}) : '';
    let bannerHtml='', footHtml='';
    let title='正在准备分析', subtitle=r.evidenceStage&&r.evidenceStage.status==='running'?'正在处理补充信息…':'正在提交分析请求…';
    if(r.phase==='evidence-failed'){
      title='分析已取消'; subtitle='';
      const detailLines=(r.failures||[]).map(f=>`<div class="ar-banner-detail">· ${escapeAttr(f.message).replace(/\n/g,'<br>')}</div>`).join('');
      bannerHtml=`<div class="ar-banner err">${detailLines}</div>`;
      footHtml=`<button class="ar-btn" data-action="ar-close">关闭</button><button class="ar-btn ar-btn-primary" data-action="ar-retry">重新运行分析</button>`;
    }
    return `<div class="ar-panel">
      <div class="ar-head"><div class="ar-title"><span>${title}</span><span class="ar-timer" id="ar-timer">00:00.0</span></div><div class="ar-subtitle">${subtitle}</div></div>
      ${bannerHtml}
      <div class="ar-stages">${stagesHtml}</div>
      ${footHtml?`<div class="ar-foot">${footHtml}</div>`:''}
    </div>`;
  }

  // ---- Backend-run-driven phase (Section 4/5/13) — every row below reflects the REAL, currently
  // polled AnalysisRun; nothing here is a locally-faked animation. ----
  const run=r.run;
  if(!run) return '';
  const rows=arRowsFromRun(run);
  const stagesHtml=rows.map(arRowHtml).join('');
  const stageLabel=AR_STAGE_LABEL[run.currentStage]||run.currentStage;

  let title, subtitle='', bannerHtml='', footHtml='', hintHtml='';
  if(run.currentStage==='COMPLETED'){
    title='分析完成'; subtitle='正在打开 Strategy…';
    bannerHtml=arDiagnosticsHtml(r);
  } else if(run.currentStage==='FAILED'){
    // Section 22 — freeze at the real failure point: every already-completed row above stays green;
    // only the row that actually failed shows red, plus this one banner with the real reason.
    title='分析失败'; subtitle='';
    bannerHtml=`<div class="ar-banner err"><div class="ar-banner-detail">${escapeAttr(run.error||'未知错误').replace(/\n/g,'<br>')}</div></div>`;
    footHtml=`<button class="ar-btn" data-action="ar-close">关闭</button><button class="ar-btn ar-btn-primary" data-action="ar-retry">重新运行分析</button>`;
  } else if(run.currentStage==='CANCELLED'){
    title='分析已取消'; subtitle='';
    bannerHtml=`<div class="ar-banner err">您已取消本次分析，已采集的数据不会用于生成策略。</div>`;
    footHtml=`<button class="ar-btn" data-action="ar-close">关闭</button><button class="ar-btn ar-btn-primary" data-action="ar-retry">重新运行分析</button>`;
  } else {
    title='正在分析'; subtitle=`当前阶段：${stageLabel}`;
    // Section 17/18 — "关闭窗口" (hide UI only, backend keeps running) is always offered and is
    // NEVER labeled 取消; "取消分析" (real backend cancel) is a SEPARATE button, Manual-only, and
    // disabled once already requested (avoids firing a second cancel while the first is still
    // cooperatively winding down).
    const canCancel = run.source==='MANUAL' && !run.cancelRequested;
    if(run.cancelRequested) subtitle+='（正在取消…）';
    hintHtml=`<div class="ar-hint">关闭窗口不会中断后台分析；重新打开本页或返回本交易对可继续查看进度。</div>`;
    footHtml=`<button class="ar-btn" data-action="ar-close">关闭窗口</button>`+(canCancel?`<button class="ar-btn ar-btn-danger" data-action="ar-cancel">取消分析</button>`:'');
  }

  return `<div class="ar-panel">
    <div class="ar-head">
      <div class="ar-title"><span>${title}</span><span class="ar-timer" id="ar-timer">00:00.0</span></div>
      <div class="ar-subtitle">${subtitle}</div>
    </div>
    ${bannerHtml}
    <div class="ar-stages">${stagesHtml}</div>
    ${hintHtml}
    ${footHtml?`<div class="ar-foot">${footHtml}</div>`:''}
  </div>`;
}

let arTimerHandle=null, arStartMs=0;
function arFormatElapsed(ms){
  const s=Math.floor(ms/1000), tenths=Math.floor((ms%1000)/100);
  return String(Math.floor(s/60)).padStart(2,'0')+':'+String(s%60).padStart(2,'0')+'.'+tenths;
}
function arStartTimer(){
  arStartMs=Date.now();
  arTimerHandle=setInterval(()=>{
    const el=document.getElementById('ar-timer'); if(el) el.textContent=arFormatElapsed(Date.now()-arStartMs);
  },100);
}
function arStopTimer(){ if(arTimerHandle){ clearInterval(arTimerHandle); arTimerHandle=null; } }
/** arRerender() replaces #analysis-runner-body's innerHTML, which destroys and recreates #ar-timer
 * — its template default ("00:00.0") would otherwise be the last thing visible once the interval
 * has already been stopped (caught in a real screenshot during Sprint 3.2A's verification: the
 * final frame showed 00:00.0 instead of the real elapsed time). Call this right after
 * arStopTimer()+arRerender() to stamp the true final elapsed time onto the fresh element. */
function arFinishTimerDisplay(){
  const el=document.getElementById('ar-timer');
  if(el) el.textContent=arFormatElapsed(Date.now()-arStartMs);
}
function arDelay(ms){ return new Promise(res=>setTimeout(res,ms)); }

function arWireButtons(){
  const cancelBtn=document.querySelector('[data-action="ar-cancel"]');
  if(cancelBtn) cancelBtn.addEventListener('click',arRequestCancel);
  const closeBtn=document.querySelector('[data-action="ar-close"]');
  if(closeBtn) closeBtn.addEventListener('click',arCloseOverlay);
  const retryBtn=document.querySelector('[data-action="ar-retry"]');
  if(retryBtn) retryBtn.addEventListener('click',startAnalysisRunner);
}
function arRerender(){
  if(!Store.analysisRunner) return; // a closed run's in-flight poll/evidence step may still call this once more
  document.getElementById('analysis-runner-body').innerHTML=renderAnalysisRunnerOverlay();
  arWireButtons();
}
/** Sprint 3.9.1.1, Section 17 — "关闭窗口": hides the UI only, never touches the backend run. A
 * non-terminal `analysisId` is deliberately KEPT in localStorage so a reload/reopen (Section 11) or
 * navigating back to this symbol can resume showing real progress; only a run that already reached a
 * terminal stage clears the key here (a terminal run has nothing left to resume). */
function arCloseOverlay(){
  document.getElementById('analysis-runner-bg').classList.remove('show');
  arStopTimer();
  arStopPolling();
  const run=Store.analysisRunner && Store.analysisRunner.run;
  if(!run || AR_TERMINAL_STAGES.includes(run.currentStage)) localStorage.removeItem('qa_active_analysis_run_id');
  Store.analysisRunner=null;
}
/** Sprint 3.9.1.1, Section 17/18 — real backend cancel, never a bare UI-hide. Sends the request,
 * applies whatever the backend returns immediately (so the button reflects `cancelRequested` right
 * away), then leaves the poll loop to observe the real CANCELLED terminal stage once the backend
 * actually reaches it (Section 18's race: the backend, not this click handler, decides the final
 * outcome). */
async function arRequestCancel(){
  const r=Store.analysisRunner;
  if(!r || !r.analysisId) return;
  try{
    const res=await fetch(`${BACKEND_URL}/api/analysis/runs/${r.analysisId}/cancel`, {method:'POST'});
    const json=await res.json();
    if(Store.analysisRunner!==r) return;
    if(json.ok && json.run) r.run=json.run;
  }catch(e){ toast('取消请求发送失败：'+e.message); return; }
  arRerender();
}
function arStopPolling(){
  const r=Store.analysisRunner;
  if(r && r.pollHandle){ clearInterval(r.pollHandle); r.pollHandle=null; }
}
/** Sprint 3.9.1.1, Section 10/11 — the ONE polling loop backing this overlay, whether it was opened
 * by starting a brand-new Manual analysis, resuming one after a reload, or opening one from the
 * Monitoring page's "查看进度" (Scheduled). A transient fetch failure is never treated as the run
 * itself failing — just retried on the next tick. */
async function arPollOnce(){
  const r=Store.analysisRunner;
  if(!r || !r.analysisId) return;
  let json;
  try{
    const res=await fetch(`${BACKEND_URL}/api/analysis/runs/${r.analysisId}`);
    json=await res.json();
  }catch(e){ return; }
  if(!Store.analysisRunner || Store.analysisRunner!==r || !json.ok) return;
  r.run=json.run;
  arRerender();
  if(AR_TERMINAL_STAGES.includes(r.run.currentStage)){
    arStopPolling(); arStopTimer();
    await arHandleTerminalRun(r.run);
  }
}
function arStartPolling(){
  const r=Store.analysisRunner;
  if(!r) return;
  arPollOnce();
  r.pollHandle=setInterval(arPollOnce, AR_POLL_INTERVAL_MS);
}
/** Sprint 3.9.1.1, Section 11/21 — a terminal AnalysisRun carries no payload/response itself (Section
 * 21's own split); COMPLETED fetches the real AnalysisRecord once, here, and caches it locally the
 * same way the pre-3.9.1.1 synchronous flow always did, then auto-navigates to Strategy. Called both
 * from the live poll loop (overlay open) and from arCheckAndResumeActiveRun() (overlay never opened,
 * e.g. the app was reopened after the run had already finished) — the record-caching part always
 * runs; the UI-transition part only runs if this overlay is still the one showing this run. */
async function arHandleTerminalRun(run){
  localStorage.removeItem('qa_active_analysis_run_id');
  if(run.currentStage==='COMPLETED'){
    try{
      const res=await fetch(`${BACKEND_URL}/api/analysis/records/${run.analysisId}`);
      const json=await res.json();
      if(json.ok && json.record){
        cacheAnalysisRecordLocally(json.record);
        Store.lastAnalysisPayload=json.record.payload;
        Store.mostRecentAnalysisRecord=json.record;
        if(Store.analysisRunner && Store.analysisRunner.analysisId===run.analysisId){
          Store.analysisRunner.diagnostics={
            payloadSizeChars: JSON.stringify(json.record.payload).length,
            aiLatencyMs: json.record.aiRawResult?json.record.aiRawResult.latencyMs:undefined,
          };
        }
      }
    }catch(e){ /* record fetch failed — the run itself still shows COMPLETED; findable via 分析历史 */ }
  }
  if(!Store.analysisRunner || Store.analysisRunner.analysisId!==run.analysisId) return;
  arRerender(); arFinishTimerDisplay();
  if(run.currentStage==='COMPLETED'){
    await arDelay(900); // long enough for the "✓ ... 正在打开 Strategy..." checklist to actually be readable
    if(Store.analysisRunner && Store.analysisRunner.analysisId===run.analysisId){
      arCloseOverlay();
      navigate('#/strategy');
    }
  }
}
/** Sprint 3.9.1.1, Section 11/23 — opens/resumes the overlay for an ALREADY-EXISTING backend
 * AnalysisRun (Manual reload-recovery, or Monitoring's "查看进度" for a Scheduled run) — the SAME
 * overlay `startAnalysisRunner()` opens for a brand-new Manual run, never a second component. */
function arOpenOverlayForRun(run){
  Store.analysisRunner={analysisId:run.analysisId, symbol:run.symbol, run, phase:'running', evidenceStage:null, failures:[], pollHandle:null, diagnostics:null};
  localStorage.setItem('qa_active_analysis_run_id', run.analysisId);
  document.getElementById('analysis-runner-body').innerHTML=renderAnalysisRunnerOverlay();
  document.getElementById('analysis-runner-bg').classList.add('show');
  arWireButtons();
  arStartTimer();
  if(!AR_TERMINAL_STAGES.includes(run.currentStage)) arStartPolling();
}
/** Sprint 3.9.1.1, Section 11 — the hard acceptance criterion: a page reload must resume real
 * progress, never regress to "暂无分析" or silently start a new run. Called once at app init; a
 * remembered `analysisId` whose run already finished while the app was closed is handled silently
 * (record cached if it succeeded, key cleared) rather than popping the overlay back open for a run
 * that's no longer relevant to resume. */
async function arCheckAndResumeActiveRun(){
  const id=localStorage.getItem('qa_active_analysis_run_id');
  if(!id) return;
  let json;
  try{
    const res=await fetch(`${BACKEND_URL}/api/analysis/runs/${id}`);
    json=await res.json();
  }catch(e){ return; } // backend unreachable at boot — leave the key, try again on the next load
  if(!json.ok){ localStorage.removeItem('qa_active_analysis_run_id'); return; }
  const run=json.run;
  if(AR_TERMINAL_STAGES.includes(run.currentStage)){ await arHandleTerminalRun(run); return; }
  arOpenOverlayForRun(run);
}


async function arCollectOneSource(key, runner){
  const stage=runner.stages.find(s=>s.key==='collect-'+key);
  stage.status='running'; arRerender();
  const controller=new AbortController();
  runner.abortControllers.push(controller);
  const timer=setTimeout(()=>controller.abort(), ANALYSIS_SOURCE_TIMEOUT_MS);
  try{
    const res=await fetch(`${BACKEND_URL}/api/sources/${key}?fresh=1`, {signal:controller.signal});
    clearTimeout(timer);
    if(!res.ok) throw new Error('HTTP '+res.status);
    const data=await res.json();
    // Validation Rules (Step 4): a valid response has the SourceResult shape and a non-error
    // status — content being EMPTY (0 news events, 0 liquidations) is never itself a failure.
    if(!data || typeof data.status!=='string' || !Array.isArray(data.itemsRaw)) throw new Error('响应格式不正确');
    if(data.status==='error') throw new Error(data.note||'数据源返回错误');
    runner.collected[key]=data;
    stage.status='success';
  }catch(err){
    clearTimeout(timer);
    if(runner.cancelled) return; // a user-triggered abort isn't a collection "failure" — don't paint one
    stage.status='failed';
    const msg = err.name==='AbortError' ? '请求超时' : err.message;
    runner.failures.push({key, label:stage.sourceLabel, message:msg});
  }
  arRerender();
}

/** Evidence Step 5 — every FILE-type evidence item must actually have a file attached (fileName
 * set); an evidence item the user never finished uploading is a failure of this stage, same as any
 * other required source, since it carries real weight toward the 100% total. No PDF parsing (still
 * explicitly deferred, per Sprint 3.3B's own scope boundary).
 * Sprint 3.3B extends this stage: every image ('截图') evidence item with weight > 0 is now really
 * parsed (POST /api/ai/evidence/image, real image bytes — see attachFileToEvidence()'s
 * ev.fileDataForParser) before this stage can succeed. Parsed SEQUENTIALLY, not concurrently like
 * the 11 system sources — evidence images are typically few, and this keeps the single configured
 * Evidence Parser role from being hit with a burst of simultaneous requests. The first failure
 * cancels the whole stage/analysis immediately (never a silent "continue with filename-only
 * evidence" fallback) — matches the frozen "any required failure cancels the whole Analysis"
 * principle already governing system-source collection. */
async function arValidateEvidenceStage(runner, d){
  runner.evidenceStage.status='running'; arRerender();
  await arDelay(AR_LOCAL_STAGE_MS);
  if(Store.analysisRunner!==runner) return;
  const incomplete=d.evidence.filter(ev=>EVIDENCE_FILE_TYPES.includes(ev.type) && !ev.fileName);
  if(incomplete.length>0){
    runner.evidenceStage.status='failed';
    runner.failures.push({message:'存在未上传文件的补充信息'});
    arRerender();
    return;
  }

  runner.parsedEvidence={};
  const imageItems=d.evidence.filter(ev=>ev.type==='截图' && ev.fileName && Number(ev.weight)>0);
  for(const ev of imageItems){
    if(Store.analysisRunner!==runner) return;
    try{
      const dataUrl=ev.fileDataForParser||ev.fileData;
      const match=/^data:([^;]+);base64,(.+)$/.exec(dataUrl||'');
      if(!match) throw new Error('图片数据缺失或格式不正确，请重新上传');
      const [,mimeType,imageBase64]=match;
      const res=await fetch(`${BACKEND_URL}/api/ai/evidence/image`,{
        method:'POST', headers:{'Content-Type':'application/json'},
        body:JSON.stringify({imageBase64, mimeType, evidenceId:ev.id}),
      });
      const json=await res.json();
      if(!json.ok) throw new Error((json.error&&json.error.message)||('HTTP '+res.status));
      runner.parsedEvidence[ev.id]=json.result;
      ev.parsedContent=json.result; // persisted onto the draft too, so the evidence card can show "✓ 已解析" on the next Research render
    }catch(err){
      runner.evidenceStage.status='failed';
      runner.failures.push({
        message:`补充信息 ${ev.fileName} 解析失败。该证据权重为 ${ev.weight}%，无法在缺少该证据的情况下继续分析。（${err.message}）`,
      });
      arRerender();
      return;
    }
  }
  saveDraft();
  runner.evidenceStage.status='success';
  arRerender();
}

/** Sprint 3.9 — writes a backend `AnalysisRecord`'s payload/response into the SAME localStorage
 * shapes every existing render function (Strategy page, ARM flow, Prompt Preview) already reads via
 * `getAnalysisPayload()`/`getAiResponseRecord()` — a compatibility shim, not a second source of
 * truth: the backend's `analysis_records.json` (Section 28) is the durable record; this local copy
 * only exists so the large amount of already-working frontend rendering code (which reads these two
 * localStorage maps) does not need to be rewritten this sprint (Section 27 — minimal frontend
 * changes only). Both maps use the exact same field names as their pre-3.9 shape (the backend types
 * were ported to match verbatim), so no field translation is needed. */
function cacheAnalysisRecordLocally(record){
  const payloadMap=loadAnalysisPayloads();
  payloadMap[record.analysisId]=record.payload;
  saveAnalysisPayloadMap(payloadMap);

  const responseMap=loadAiResponseRecords();
  responseMap[record.analysisId]={
    analysisId:record.analysisId, responseVersion:record.response.responseVersion,
    promptVersion:record.promptVersion, payloadVersion:record.payload.payloadVersion,
    provider:record.aiRawResult?record.aiRawResult.provider:null, model:record.aiRawResult?record.aiRawResult.model:null,
    generatedAt:record.completedAt, response:record.response,
    source:record.source, // Sprint 3.9, Section 27 — lets Strategy/Homepage show 手动分析 vs 自动分析
  };
  saveAiResponseRecordMap(responseMap);
}

/** Sprint 3.9.1.1, Section 10/11/12 — starts a Manual analysis. The backend call now returns
 * `{analysisId}` almost immediately (real pipeline runs in the background); this function's own job
 * shrinks to: run the still-local evidence stage, submit, then hand off to the SAME poll-driven
 * overlay `arOpenOverlayForRun()` uses for resume/Scheduled — never a second progress mechanism. */
async function startAnalysisRunner(){
  if(draftTotal()!==100) return;
  const d=Store.draft;

  const runner={
    analysisId:null, symbol:d.asset, run:null, phase:'starting',
    evidenceStage: d.evidence.length>0 ? {label:'处理补充信息', status:'waiting'} : null,
    failures:[], parsedEvidence:{}, pollHandle:null, diagnostics:null,
  };
  Store.analysisRunner=runner;
  document.getElementById('analysis-runner-body').innerHTML=renderAnalysisRunnerOverlay();
  document.getElementById('analysis-runner-bg').classList.add('show');
  arWireButtons();
  arStartTimer();

  // Evidence completeness + image parsing — still entirely frontend-owned (Section 1 doesn't touch
  // this), unrelated to the unified backend Analysis Pipeline; must finish before the backend call so
  // `parsedContent` is ready to send.
  if(runner.evidenceStage){
    await arValidateEvidenceStage(runner, d);
    if(Store.analysisRunner!==runner) return; // closed mid-flight
    if(runner.failures.length>0){
      runner.phase='evidence-failed';
      arStopTimer(); arRerender(); arFinishTimerDisplay();
      return;
    }
  }

  const sourceWeights={};
  d.weights.forEach(w=>{ sourceWeights[w.key]=Number(w.weight); });
  const additionalEvidence=d.evidence.map(ev=>{
    const item={id:ev.id, type:ev.type, title:ev.label||undefined, content:ev.desc||undefined, reference:ev.fileName||undefined, weight:Number(ev.weight)};
    const parsed=runner.parsedEvidence[ev.id];
    if(parsed) item.parsedContent=parsed;
    return item;
  });

  let json;
  try{
    const res=await fetch(`${BACKEND_URL}/api/analysis/run`,{
      method:'POST', headers:{'Content-Type':'application/json'},
      body:JSON.stringify({symbol:d.asset, timeframe:d.timeframe, dateRange:d.range, sourceWeights, additionalEvidence}),
    });
    json=await res.json();
  }catch(err){
    if(Store.analysisRunner!==runner) return;
    runner.phase='evidence-failed';
    runner.failures.push({message:'无法连接到后端分析服务：\n\n'+err.message});
    arStopTimer(); arRerender(); arFinishTimerDisplay();
    return;
  }
  if(Store.analysisRunner!==runner) return;
  if(!json.ok){
    runner.phase='evidence-failed';
    runner.failures.push({message:json.error||'提交分析请求失败'});
    arStopTimer(); arRerender(); arFinishTimerDisplay();
    return;
  }

  // Section 12 — the backend may have attached this request to an already-running analysis for the
  // same symbol (its own duplicate guard, findActiveRun()) instead of starting a second one.
  if(json.attached) toast('该交易对已有一个进行中的分析，已为您接入实时进度');
  runner.analysisId=json.analysisId;
  runner.phase='running';
  localStorage.setItem('qa_active_analysis_run_id', json.analysisId);
  arStartPolling();
}

function confirmExecution(){
  const d=Store.draft, s=d.strategy, e=d.execution, a=assetOf(d.asset);
  const cancelled = e.choice==='cancel';
  const trade={
    id:uid(),symbol:d.asset,mode: e.leverage>1?'合约':'现货',leverage:e.leverage,
    direction: cancelled ? 'watch' : e.direction,
    status: cancelled ? 'cancelled':'running',
    createdAt:new Date(s.generatedAt), execTime:new Date(MOCK_NOW),
    entry: cancelled? null : e.entry,
    exitPrice:null,
    confidence:s.confidence,
    stopLoss: cancelled? null : e.stopLoss,
    takeProfit: cancelled? null : e.takeProfit,
    position: cancelled? null : e.position,
    notes:e.notes,
    execType: cancelled ? 'cancelled' : (e.choice==='modified'?'modified':'ai'),
    strategy:s,
    closeReason:null,
  };
  trade.timeline=[
    {title:'策略生成完成',time:fmtDateTime(s.generatedAt),desc:'AI 基于您的研究输入生成交易策略',status:'done'},
    cancelled
      ? {title:'放弃执行',time:fmtDateTime(MOCK_NOW),desc:'未按策略执行，交易取消',status:'done'}
      : {title:'执行下单（开仓）',time:fmtDateTime(MOCK_NOW),desc:`在 ${fmtPrice(trade.entry,a.decimals)} USDT 价格${trade.direction==='short'?'开空':'开多'} ${fmt(trade.position,0)} USDT`,status:'done'},
  ];
  if(!cancelled) trade.timeline.push({title:'当前持仓中',time:fmtDateTime(MOCK_NOW)+' – 进行中',desc:'持仓时间：0分钟',status:'active'},{title:'（待）平仓',time:'--',desc:'交易尚未结束',status:'pending'});

  Store.trades.unshift(trade); saveTrades();
  Store.draft=null; saveDraft();
  toast(cancelled? '已记录为放弃执行' : '交易已执行，进入持仓中');

}

/* ---------- 新闻源管理 UI ---------- */
let NewsWizard=null; // null when the add/edit wizard isn't open; see openNewsSourceAdd()/openNewsSourceEdit()

function newsSourceLogoInitial(name){ return (name.trim()[0]||'?').toUpperCase(); }

/** Every row is now a real backend record — no more builtin-vs-custom branch. 'origin' is purely
 * an informational badge; 状态/抓取频率/操作 all reflect (and act on) the real news_sources row. */
function renderNsRows(list){
  if(list.length===0) return `<tr><td colspan="7"><div class="empty-hint" style="padding:20px">没有匹配的新闻源</div></td></tr>`;
  return list.map(s=>{
    const t=NEWS_SOURCE_TYPES[s.type];
    // s.fetchable comes from the backend (isSourceFetchable(type,url), which for api-type sources
    // checks the actual url against known exchange adapters) — real per-row truth, not the
    // static per-type default. Falls back to the type default only if the backend hasn't sent it.
    const fetchable=typeof s.fetchable==='boolean' ? s.fetchable : t.fetchable;
    let statusHtml;
    if(!fetchable) statusHtml=`<div class="ns-status"><span class="ns-check" style="background:var(--track); border-color:var(--track)"></span><span>暂不支持抓取</span></div>`;
    else if(s.last_status==='ok') statusHtml=`<div class="ns-status"><span class="ns-check" style="background:var(--green); border-color:var(--green)"></span><span>正常 · ${s.last_item_count} 条</span></div>`;
    else if(s.last_status==='error') statusHtml=`<div class="ns-status"><span class="ns-check" style="background:var(--red); border-color:var(--red)" title="${escapeAttr(s.last_error||'')}"></span><span>抓取异常</span></div>`;
    else statusHtml=`<div class="ns-status"><span class="ns-check" style="background:var(--track); border-color:var(--track)"></span><span>尚未抓取</span></div>`;
    const syncTxt=s.last_fetched_at ? relTimeReal(s.last_fetched_at) : '—';
    return `<tr>
      <td><span class="ns-check"></span></td>
      <td><div style="display:flex; align-items:center; gap:10px">
        <span class="sym-ic" style="background:${newsLogoColor(s.name)}">${escapeAttr(newsSourceLogoInitial(s.name))}</span>
        <span style="font-weight:700">${s.name}</span>
      </div></td>
      <td><span class="pill pill-primary">${t.label}</span>${s.origin==='builtin'?` <span class="pill pill-gray">内置</span>`:''}</td>
      <td>${statusHtml}</td>
      <td class="muted">${fetchable?`每 ${s.fetch_interval_minutes} 分钟`:'—'}</td>
      <td class="muted">${syncTxt}</td>
      <td><div style="display:flex; gap:6px; align-items:center">
        <button class="switch ${s.enabled?'on':''}" data-action="ns-toggle" data-id="${s.id}" title="${s.enabled?'启用':'已停用'}"></button>
        <button class="icon-btn" data-action="ns-edit" data-id="${s.id}" title="编辑">${iconEdit(15)}</button>
        <button class="icon-btn" data-action="ns-delete" data-id="${s.id}" title="删除">${iconTrash(15)}</button>
      </div></td>
    </tr>`;
  }).join('');
}

function nsFilteredList(){
  const q=Store.newsSourceQ.trim().toLowerCase();
  return Store.newsSources.filter(s=>!q||s.name.toLowerCase().includes(q));
}

/** Surgical update (tbody + footer count only) so the search input never gets replaced mid-type
 * — a full openModal() re-render would destroy and recreate the focused input, losing the
 * cursor/focus after every keystroke. */
function refreshNsTable(){
  const body=document.getElementById('ns-table-body');
  if(!body) return;
  const list=nsFilteredList();
  body.innerHTML=renderNsRows(list);
  const countEl=document.getElementById('ns-count');
  const builtinCount=Store.newsSources.filter(s=>s.origin==='builtin').length;
  if(countEl) countEl.textContent=`共 ${Store.newsSources.length} 个新闻源（${builtinCount} 个内置）`;
  const errEl=document.getElementById('ns-source-err');
  if(errEl) errEl.textContent=Store.newsSourcesError||'';
}

function openNewsSourceManager(){
  NewsWizard=null;
  Store.newsSourceQ='';
  const list=nsFilteredList();
  const builtinCount=Store.newsSources.filter(s=>s.origin==='builtin').length;
  openModal(`
    <div class="modal-head"><h3 style="display:flex; align-items:center; gap:8px">${iconGear(19)} 新闻源管理</h3><button class="close-x" onclick="closeModal()">✕</button></div>

    ${Store.newsSourcesError?`<div class="ev-dropzone" style="border-color:var(--red); background:var(--red-light); color:var(--red); margin-bottom:14px; padding:10px 14px"><span id="ns-source-err">${escapeAttr(Store.newsSourcesError)}</span></div>`:''}
    <div style="display:flex; gap:10px; margin-bottom:14px; align-items:center">

      <table class="ns-table">

function openNewsSourceAdd(){

  NewsWizard={step:2, editingId:id, type:s.type, form:{name:s.name,url:s.url||'',category:s.category||'',fetchIntervalMinutes:s.fetch_interval_minutes,lookbackHours:s.lookback_hours,enabled:!!s.enabled,fetchable:!!s.fetchable}, testing:false, testError:null};

async function nsDelete(id){
  try{
    const res=await fetch(`${BACKEND_URL}/api/news-sources/${id}`, {method:'DELETE'});
    const data=await res.json();
    if(!data.ok){ toast(data.error||'删除失败'); return; }
    await loadNewsSourcesFromBackend();
    toast('已删除新闻源');
  }catch(err){
    toast('删除失败：'+err.message);
  }
}
async function nsToggle(id){
  const s=Store.newsSources.find(x=>x.id===id);
  if(!s) return;
  try{
    const res=await fetch(`${BACKEND_URL}/api/news-sources/${id}`, {method:'PATCH', headers:{'Content-Type':'application/json'}, body:JSON.stringify({enabled:!s.enabled})});

    if(!data.ok){ toast(data.error||'操作失败'); return; }
    Object.assign(s,data.source);
    refreshNsTable();

    toast('操作失败：'+err.message);

      <label>抓取范围（多久以内的新闻算有效）</label>
      <select id="ns-f-lookback">
        ${[24,72,168].map(h=>`<option value="${h}" ${f.lookbackHours===h?'selected':''}>${h===24?'最近 24 小时':h===72?'最近 3 天':'最近 7 天'}</option>`).join('')}
      </select>
    </div>
    ` : `<div class="weight-hint" style="margin-bottom:14px">ⓘ ${t.label} 类型暂无真实抓取实现，这里只保存配置，不会实际抓取新闻</div>`}
    <div class="foot-row" style="padding:8px 0 4px">
      <span style="font-weight:600; color:var(--text)">启用该新闻源</span>
      <button class="switch ${f.enabled?'on':''}" data-action="ns-toggle-enabled"></button>
    </div>
    ${testResultHtml}
    <div style="display:flex; justify-content:space-between; margin-top:18px">
      <button class="btn" data-action="ns-step3-back">← 上一步</button>
      <button class="btn btn-primary" data-action="ns-test-save" ${NewsWizard.testing?'disabled':''}>${NewsWizard.testing?'保存中…':(fetchable?'测试并保存':'保存')}</button>
    </div>
  `);
}
function nsReadStep2Fields(){
  NewsWizard.form.name=document.getElementById('ns-f-name').value.trim();
  NewsWizard.form.url=document.getElementById('ns-f-url').value.trim();
  NewsWizard.form.category=document.getElementById('ns-f-category').value;
}
function nsReadStep3Fields(){
  const f=NewsWizard.form;
  const fetchable = f.fetchable!=null ? f.fetchable : NEWS_SOURCE_TYPES[NewsWizard.type].fetchable;
  if(fetchable){
    NewsWizard.form.fetchIntervalMinutes=Number(document.getElementById('ns-f-interval').value);
    NewsWizard.form.lookbackHours=Number(document.getElementById('ns-f-lookback').value);
  }
}
/** Real POST (add) / PATCH (edit) to the backend — the backend itself runs the actual RSS
 * reachability test for rss/official types before persisting (server.ts), so a failed test never
 * gets saved; this function just reflects whatever the backend genuinely did. */
async function nsTestAndSave(){
  nsReadStep3Fields();
  const f=NewsWizard.form;
  if(!f.name||!f.url||!f.category){ toast('请填写完整信息'); return; }
  NewsWizard.testing=true; NewsWizard.testError=null; renderNsStep3();
  const payload={
    name:f.name, url:f.url, type:NewsWizard.type, category:f.category, enabled:f.enabled,
    fetch_interval_minutes:f.fetchIntervalMinutes||15, lookback_hours:f.lookbackHours||24,
  };
  try{
    const method=NewsWizard.editingId?'PATCH':'POST';
    const endpoint=NewsWizard.editingId?`${BACKEND_URL}/api/news-sources/${NewsWizard.editingId}`:`${BACKEND_URL}/api/news-sources`;
    const res=await fetch(endpoint,{method,headers:{'Content-Type':'application/json'},body:JSON.stringify(payload)});
    const data=await res.json();
    if(!data.ok){ NewsWizard.testing=false; NewsWizard.testError=data.error||'保存失败'; renderNsStep3(); toast(data.error||'保存失败'); return; }
  }catch(err){
    NewsWizard.testing=false; NewsWizard.testError='本地后端未启动或不可达（'+BACKEND_URL+'）：'+err.message; renderNsStep3(); toast('保存失败'); return;
  }
  NewsWizard=null;
  await loadNewsSourcesFromBackend();
  openNewsSourceManager();
  toast('新闻源已保存');
}

function openSourceDetailModal(key){
  // DATA_SOURCE_SPEC.md: Market and Liquidation are the reference modules built so far for the
  // richer per-source "Detail Page" (Overview → Historical Charts → Statistics → Latest
  // Updates → Raw Values). Other 9 modules still use the generic item-list modal below until
  // they get the same treatment.
  if(key==='market'){ openMarketDetail(Store.marketDetailSymbol||'BTCUSDT'); return; }
  if(key==='liquidation'){ openLiquidationDetail(); return; }
  const s=DASHBOARD_SOURCES.find(x=>x.key===key);
  const live=Store.live[key];
  const meta=Store.liveMeta[key];
  const liveOk=live && meta && meta.status==='ok' && live.itemsRaw && live.itemsRaw.length>0;
  const statusText = !meta||meta.status==='loading' ? `${iconStatusLoading()} 正在获取实时数据…`
    : meta.status==='ok' ? `${iconStatusLive()} 实时，更新于 ${fmtClock(meta.updatedAt)}`
    : meta.status==='stub' ? `${iconStatusStub()} 暂未接入真实数据`
    : `${iconStatusError()} 连接失败`;

  const itemsHtml = liveOk ? live.itemsRaw.map(it=>`
    <div style="border:1px solid var(--border); border-radius:10px; padding:12px 14px">
      <div style="display:flex; flex-wrap:wrap; justify-content:space-between; gap:2px 12px; align-items:baseline">
        <span style="font-weight:700; font-size:13px; min-width:0; overflow-wrap:break-word; flex:1 1 auto">${it.label}</span>
        <span class="mono fw ${it.polarity==='bullish'?'up':it.polarity==='bearish'?'down':''}" style="text-align:right; min-width:0; overflow-wrap:break-word; flex:0 1 auto">${it.value}</span>
      </div>
      ${it.detail?`<div class="small-note" style="margin-top:6px">${it.detail}</div>`:''}
      <div style="margin-top:6px; display:flex; justify-content:space-between; align-items:center">
        ${it.sourceUrl?`<a href="${it.sourceUrl}" target="_blank" rel="noopener" style="font-size:11.5px; color:var(--primary); text-decoration:none">来源链接 ↗</a>`:'<span></span>'}
        ${key==='news'&&it.timestamp?`<span style="font-size:10.5px;color:var(--text-3)">${relTimeReal(it.timestamp)}</span>`:''}
      </div>
    </div>
  `).join('') : `<div class="empty-hint" style="padding:24px 8px">${statusText}${meta&&meta.error?`<div style="font-size:11.5px;color:var(--text-3);margin-top:8px">${escapeAttr(meta.error)}</div>`:''}</div>`;

  openModal(`
    <div class="modal-head"><h3>${s.icon} ${s.name}</h3><button class="close-x" onclick="closeModal()">✕</button></div>
    <div class="small-note" style="margin-bottom:14px">${s.desc}</div>
    <div class="kv-list" style="margin-bottom:16px">
      <div class="row"><span class="k">状态</span><span class="v">${statusText}</span></div>
      ${liveOk?`<div class="row"><span class="k">条目数</span><span class="v">${live.itemsRaw.length}</span></div>`:''}
    </div>
    <div style="display:flex; flex-direction:column; gap:10px; max-height:50vh; overflow-y:auto">${itemsHtml}</div>
  `);
}

/* ---------- Init ---------- */
(function init(){
  const savedTheme=localStorage.getItem('qa_theme');
  if(savedTheme) document.documentElement.setAttribute('data-theme',savedTheme);
  Store.trades=loadTrades();
  if(!localStorage.getItem('qa_trades')) saveTrades();
  Store.draft=loadDraft();
  loadNewsSourcesFromBackend();
  window.addEventListener('hashchange',render);
  render();
  initLiveData();
  arCheckAndResumeActiveRun(); // Sprint 3.9.1.1, Section 11 — reload/reopen recovery for a still-running Manual analysis
  setInterval(refreshTickerPrices,20000);
  // Sprint 3.4B, Task 17/30: resumes monitoring for any NOTIFY drafts left PENDING from a previous
  // session — runs regardless of which page loads first, unlike refreshTickerPrices() which only
  // does anything while #ticker-strip (Dashboard) is present.
  startTriggerMonitorLoop();
  // Automatic RealTrade Reconciliation, Section 3 — startup + ~20s interval, independent of which
  // page loads first (same rationale as startTriggerMonitorLoop() above).
  startRealTradeReconcileLoop();
})();
</script>
