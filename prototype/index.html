 * so the UI can show WHY. */
function checkOrderCancellationEligibility(order){
  if(!order) return {ok:false, reason:'本地订单不存在'};
  if(!order.exchangeOrderId) return {ok:false, reason:'该订单尚未提交至交易所，无法撤单'};
  if(order.status!=='SUBMITTED' && order.status!=='PARTIALLY_FILLED') return {ok:false, reason:'该订单当前状态不支持撤单'};
  return {ok:true};
}

/** Shared by the FILLED-discovered-during-precheck branch below and the partial-fill-after-confirmed-
 * cancellation branch further below (Task 6/16) — one place resolves the connection and runs
 * syncPositionsFromExchange(), so both call sites can never diverge. Never fabricates a Position if
 * the exchange returns none (syncPositionsFromExchange() itself already guarantees that). */
async function triggerPositionSyncForOrder(order){
  const resolved=await resolveConnectionForRealOrder(order); // Sprint 3.6A.2 — account-first-with-legacy-fallback, same as every other resume-from-history flow
  if(!resolved.ok) return {ok:false, error:resolved.reason};
  return syncPositionsFromExchange(resolved.connectionId);
}

/** Task 5/27 — the fresh pre-cancel check, run every time the user clicks "撤销 TESTNET 订单" before
 * ever showing a confirmation modal or sending a DELETE. Reuses syncRealOrderFromExchange() verbatim
 * (same GET /order call, same normalization/mapping/Trade-propagation) — never a second, diverging
 * read path. Branches on the FRESH remote-derived local status, never the stale one that was true
 * when the button was rendered:
 *  - FILLED: no DELETE is ever attempted; local state is already synced to FILLED by the reused sync
 *    call, and a Position Sync runs immediately (Task 6's "then run Position Sync").
 *  - CANCELLED/REJECTED/EXPIRED (already terminal — e.g. a previous cancel already went through, or an
 *    earlier ambiguous DELETE actually succeeded): no DELETE, just an honest toast. This IS the
 *    idempotency guarantee (Task 27) — a repeated click can never send a second DELETE once exchange
 *    truth is terminal, because this fresh check always runs first.
 *  - SUBMITTED/PARTIALLY_FILLED (still genuinely live): proceeds to the mandatory confirmation modal
 *    with the JUST-REFRESHED data (original/executed/remaining quantity, average fill price). */
async function openCancelOrderConfirmationModal(orderId){
  const order=getRealOrderById(orderId);
  const eligibility=checkOrderCancellationEligibility(order);
  if(!eligibility.ok){ toast(eligibility.reason); return; }

  toast('正在查询交易所最新订单状态…');
  const syncResult=await syncRealOrderFromExchange(orderId);
  if(!syncResult.ok){ toast(syncResult.error||'无法获取最新订单状态，暂时无法撤单'); return; }

  const freshOrder=getRealOrderById(orderId);

  if(freshOrder.status==='FILLED'){
    toast('订单已成交，无法撤销。');
    await triggerPositionSyncForOrder(freshOrder);
    return;
  }
  if(freshOrder.status==='CANCELLED' || freshOrder.status==='REJECTED' || freshOrder.status==='EXPIRED'){
    toast('订单当前状态为'+(REAL_ORDER_STATUS_LABEL[freshOrder.status]||freshOrder.status)+'，无需撤单。');
    return;
  }
  if(freshOrder.status!=='SUBMITTED' && freshOrder.status!=='PARTIALLY_FILLED'){
    toast('订单当前状态不支持撤单');
    return;
  }

  const a=assetOf(freshOrder.symbol); const decimals=a?a.decimals:2;
  const sideLabel = freshOrder.side==='BUY' ? '做多方向 / BUY' : '做空方向 / SELL';
  const originalQty = freshOrder.exchangeSnapshot&&freshOrder.exchangeSnapshot.originalQuantity!=null ? freshOrder.exchangeSnapshot.originalQuantity : null;
  const executedQty = freshOrder.filled.quantity||0;
  const remainingQty = originalQty!=null ? Math.max(0, originalQty-executedQty) : null;
  const isPartial = freshOrder.status==='PARTIALLY_FILLED' && executedQty>0;

  openModal(`<div class="modal-head"><h3>撤销 TESTNET 订单</h3><button class="close-x" onclick="closeModal()">✕</button></div>
    <p class="muted" style="font-size:13px">你即将撤销 Binance TESTNET 上的真实测试订单。</p>
    <div class="kv-list" style="margin-top:10px">
      <div class="row"><span class="k">环境</span><span class="v"><span class="pill pill-gray">TESTNET</span>&nbsp;不会影响真实资金</span></div>
      <div class="row"><span class="k">交易对</span><span class="v mono">${escapeAttr(freshOrder.symbol||'—')}</span></div>
      <div class="row"><span class="k">方向</span><span class="v">${escapeAttr(sideLabel)}</span></div>
      <div class="row"><span class="k">订单类型</span><span class="v">${escapeAttr(freshOrder.orderType)}</span></div>
      <div class="row"><span class="k">交易所订单编号</span><span class="v mono">${escapeAttr(freshOrder.exchangeOrderId)}</span></div>
      <div class="row"><span class="k">当前交易所状态</span><span class="v mono">${escapeAttr((freshOrder.exchangeSnapshot&&freshOrder.exchangeSnapshot.status)||freshOrder.status)}</span></div>
      <div class="row"><span class="k">委托数量</span><span class="v mono">${originalQty!=null?fmt(originalQty,6):'未知'}</span></div>
      <div class="row"><span class="k">已成交数量</span><span class="v mono">${fmt(executedQty,6)}</span></div>
      <div class="row"><span class="k">剩余未成交数量</span><span class="v mono">${remainingQty!=null?fmt(remainingQty,6):'未知'}</span></div>
      ${freshOrder.filled.averagePrice!=null?`<div class="row"><span class="k">成交均价</span><span class="v mono">${fmtPrice(freshOrder.filled.averagePrice,decimals)}</span></div>`:''}
    </div>
    ${isPartial?`<div class="empty-hint" style="border:1px solid var(--amber, #d97706); color:var(--text-1); padding:8px 10px; margin-top:10px; text-align:left; font-size:12.5px">${iconStatusError()} 该订单已部分成交。撤单只会取消剩余未成交数量，已成交部分不会被撤销。</div>`:''}
    <div style="display:flex; gap:10px; margin-top:16px">
      <button class="btn btn-block" onclick="closeModal()">取消操作</button>
      <button class="btn btn-primary btn-block" data-action="confirm-cancel-real-order" data-order-id="${escapeAttr(freshOrder.orderId)}">确认撤销 TESTNET 订单</button>
    </div>`);
}

/** Task 1-3/8/12-16 — the real DELETE flow, only ever reached from the confirmation modal above (never
 * a one-click action). Re-verifies eligibility one more time (Task 26 defense-in-depth, same pattern
 * as submitRealOrderToTestnet's own re-check) before ever sending the request. No pendingClientOrderId-
 * style marker is needed here (unlike submission): a cancellation's idempotency comes from the fresh
 * pre-check in openCancelOrderConfirmationModal() ALWAYS running first — see its own comment. */
async function cancelRealOrderOnTestnet(orderId){
  const order=getRealOrderById(orderId);
  const eligibility=checkOrderCancellationEligibility(order);
  if(!eligibility.ok) return {ok:false, error:eligibility.reason};

  // Sprint 3.6A.2 — account-first-with-legacy-fallback, same as every other resume-from-history flow;
  // cancellation now keeps working through a different connection bound to the same real account.
  const resolved=await resolveConnectionForRealOrder(order);
  if(!resolved.ok) return {ok:false, error:resolved.reason};
  const connectionId=resolved.connectionId;
  const connection=(resolved.connections||[]).find(c=>c.id===connectionId);
  // Task 2 — frontend-side defense in depth on top of the backend's own hard TESTNET guard; never an override.
  if(!connection || connection.environment!=='TESTNET') return {ok:false, error:'当前选定的交易所连接不是 TESTNET 环境，本版本不支持撤单'};

  let json;
  try{
    const res=await fetch(`${BACKEND_URL}/api/exchange/connections/${connectionId}/orders/${encodeURIComponent(order.exchangeOrderId)}?symbol=${encodeURIComponent(order.symbol)}`, {method:'DELETE'});
    json=await res.json();
  }catch(e){
    // Task 10/26 — a network failure on the DELETE call is inherently ambiguous; never assume success or failure.
    order.sync={lastSyncedAt:new Date().toISOString(), lastSyncStatus:'ERROR', lastSyncError:'网络请求失败，撤单结果未知'};
    saveRealOrder(order);
    return {ok:false, error:'撤单结果未知，请先同步订单状态，避免重复操作。', ambiguous:true};
  }

  if(!json.ok){
    const errMsg=(json.error&&json.error.message)||'撤单失败';
    order.sync={lastSyncedAt:new Date().toISOString(), lastSyncStatus:'ERROR', lastSyncError:errMsg};
    saveRealOrder(order);
    return {ok:false, error:errMsg, ambiguous:json.ambiguous===true};
  }

  const snap=json.snapshot;
  const localStatus=mapExchangeOrderStatusToLocalOrderStatus(snap.status);
  const trade=getRealTradeById(order.tradeId);
  const nowIso=new Date().toISOString();
  if(!localStatus){
    // Same rule as sync/submit — an unrecognized remote status is never guessed.
    order.sync={lastSyncedAt:nowIso, lastSyncStatus:'ERROR', lastSyncError:'unsupported_exchange_order_status_on_cancel: 撤单请求已发送，但交易所返回了未识别的状态 '+snap.status};
    saveRealOrder(order);
    return {ok:false, error:'撤单请求已发送，但交易所返回了未识别的状态，请手动同步确认最新状态', requiresSync:true};
  }

  // Task 13 — preserve fill truth; never reset filled.quantity/averagePrice on cancel.
  order.status=localStatus;
  order.filled={
    quantity: snap.executedQuantity!=null ? snap.executedQuantity : order.filled.quantity,
    averagePrice: snap.averagePrice!=null ? snap.averagePrice : order.filled.averagePrice,
  };
  order.exchangeSnapshot={status:snap.status, originalQuantity:snap.originalQuantity, executedQuantity:snap.executedQuantity, averagePrice:snap.averagePrice, price:snap.price, updatedAt:snap.updatedAt};
  order.sync={lastSyncedAt:nowIso, lastSyncStatus:'SUCCESS', lastSyncError:null};
  saveRealOrder(order);
  // Task 14/15 — reuses the EXISTING Trade-propagation function verbatim: zero fill -> Trade CANCELLED;
  // any partial fill -> Trade is left alone (already-real exposure is never wiped out by a cancel).
  if(trade && order.role==='ENTRY') propagateEntryOrderStatusToTrade(trade, order, snap, nowIso);

  // Task 16 — partial fill created real exposure; sync the real Position immediately. Zero fill never
  // triggers this (there is nothing real to sync, and Position Sync must never be called speculatively).
  let positionResult=null;
  if(order.filled.quantity>0){
    positionResult=await triggerPositionSyncForOrder(order);
  }

  // Sprint 3.5D-E, Task R — cancellation interaction with protection. Only for the ENTRY role; a
  // cancelled STOP_LOSS/TAKE_PROFIT order never touches trade.protectionStatus here (that update
  // happens inside reconcileTradeProtection() itself, driven by real exchange state, not by which
  // order a user happened to just cancel).
  if(trade && order.role==='ENTRY'){
    const freshTrade=getRealTradeById(trade.tradeId);
    if(order.filled.quantity<=0){
      // Nothing was ever filled — there is nothing to protect. Never silently leaves a stale
      // PENDING_ENTRY_FILL/PENDING_PROTECTION status behind.
      freshTrade.protectionStatus='NOT_REQUIRED';
      saveRealTrade(freshTrade);
    }else{
      // A real fill already exists — protection must continue covering it. Reconciliation is
      // idempotent and never removes an already-active protection order; this call only ensures
      // protectionStatus honestly reflects current real coverage after the cancellation.
      await reconcileTradeProtection(trade.tradeId);
    }
  }

  return {ok:true, order:getRealOrderById(orderId), trade:getRealTradeById(order.tradeId), positionResult};
}

/* ---------- Sprint 3.5D-E: Full Trade Plan — real Stop Loss / Take Profit protection ----------
   Upgrades ExecutionDraft -> RealTrade -> Entry Order -> Submit Entry into: Entry -> Real Fill/
   Position -> Stop Loss Protection -> Take Profit Protection -> Protection Verification. The app's
   THIRD and FOURTH real write capabilities: POST/DELETE /fapi/v1/algoOrder, TESTNET only, via
   Binance's Algo Service (Before Coding research, 2026-08-10 — see EXECUTION_SPEC.md's "Real Trade
   Protection" section for the full boundary and the exact endpoints verified).

   Core Truth Rule (same discipline as Position Sync, Sprint 3.5D-C): protection quantity is ALWAYS
   derived from a real filled/position amount, NEVER from positionSizeUsdt or any AI/plan text. This
   section never amends an existing protection order — only creates what's missing, and never
   auto-cancels/auto-recreates (Task N's documented, deliberate MVP boundary). */

const PROTECTION_STATUS_LABEL={NOT_REQUIRED:'无需保护', PENDING_ENTRY_FILL:'等待入场成交', PENDING_PROTECTION:'保护建立中', PROTECTED:'已保护', PARTIALLY_PROTECTED:'部分保护', PROTECTION_FAILED:'保护建立失败', PROTECTION_UNVERIFIED:'保护未验证（已提交，读取确认中/失败）', ORPHANED_PROTECTION:'遗留保护单（持仓已关闭，保护单未自动撤销）'};

/** Task H — protection orders reuse the EXACT SAME RealOrder shape as the entry order (never a
 * parallel type), with `role: 'STOP_LOSS'|'TAKE_PROFIT'`, `intent: 'CLOSE'` (so nothing that filters
 * by `role==='ENTRY' && intent==='OPEN'` — e.g. checkOrderSubmissionEligibility — ever mistakes a
 * protection order for an entry order), and `exchangeOrderId`/`clientOrderId` semantically holding
 * the real `algoId`/`clientAlgoId` once submitted. `targetIndex`/`portion` are additive, TAKE_PROFIT-
 * only fields (Task H's explicit requirement) — never copies the whole ScenarioPlan, only the
 * specific numeric trigger this one order protects. */
const PROTECTION_ORDER_STATUS_MAP={NEW:'SUBMITTED', TRIGGERED:'TRIGGERED', CANCELED:'CANCELLED', EXPIRED:'EXPIRED', REJECTED:'REJECTED'};
function mapAlgoStatusToLocalOrderStatus(remoteStatus){ return PROTECTION_ORDER_STATUS_MAP[remoteStatus] || null; }
/** Task Q — an active (non-terminal) protection order still occupies its (role, targetIndex) slot;
 * only a terminal one (CANCELLED/REJECTED/EXPIRED) or none at all means "safe to create a new one". */
const PROTECTION_TERMINAL_STATUSES=['CANCELLED','REJECTED','EXPIRED'];

function loadProtectionOrdersForTrade(tradeId){
  return Object.values(loadRealOrders()).filter(o=>o.tradeId===tradeId && (o.role==='STOP_LOSS'||o.role==='TAKE_PROFIT'));
}
/** Task Q dedup — the ONLY place that decides "does an active protection order already occupy this
 * slot". `targetIndex` is ignored for STOP_LOSS (always exactly one, Task D). */
function findActiveProtectionOrder(tradeId, role, targetIndex){
  return loadProtectionOrdersForTrade(tradeId).find(o=>
    o.role===role && (role!=='TAKE_PROFIT' || o.targetIndex===targetIndex) &&
    !PROTECTION_TERMINAL_STATUSES.includes(o.status)
  ) || null;
}

function genProtectionOrderId(){ return genOrderId(); } // same id space/format as entry orders — no separate generator needed (Task H "minimal additive extension")

/** Task K/M — resolves the real, Binance-accurate side/positionSide/reduceOnly combination for a
 * protective order closing `position`. NEVER assumes one-way mode: `position.positionSide` is
 * Binance's own raw hedge-mode label, already real (sourced from Position Sync, Sprint 3.5D-C), never
 * guessed. One-way mode (`'BOTH'`) -> reduceOnly=true, positionSide omitted downstream. Hedge mode
 * (`'LONG'`/`'SHORT'`) -> positionSide sent explicitly, reduceOnly=false (Binance rejects it there —
 * the hedge-mode positionSide itself is what prevents an accidental opposite-direction open). */
function resolveProtectionSideParams(position){
  const side = position.side==='LONG' ? 'SELL' : 'BUY'; // Task K — LONG position -> SELL protection; SHORT position -> BUY protection
  const positionSide = position.positionSide || 'BOTH';
  const reduceOnly = positionSide==='BOTH';
  return {side, positionSide, reduceOnly};
}

/** Task L — creates the LOCAL record for a protection order (status DRAFT-equivalent: not yet
 * submitted) and immediately attempts submission. Returns the final order record either way — a
 * failed submission still leaves a real, inspectable local record (never silently discarded), so
 * "STOP_LOSS ✗" (Task P) has something concrete to point at. */
async function createAndSubmitProtectionOrder(trade, entryOrder, connectionId, position, role, targetIndex, triggerPrice, rawQuantity, portion){
  const now=new Date().toISOString();
  const {side, positionSide, reduceOnly}=resolveProtectionSideParams(position);
  const order={
    schemaVersion:'real-v1',
    orderId:genProtectionOrderId(),
    tradeId:trade.tradeId, executionId:entryOrder.executionId, analysisId:entryOrder.analysisId, scenarioPlanId:entryOrder.scenarioPlanId,
    symbol:entryOrder.symbol, // display symbol (e.g. "BTC/USDT") — normalized to Binance form only at the adapter boundary, same as the entry order
    side, intent:'CLOSE', role, // Task H — 'CLOSE' intent, never mistaken for an ENTRY/OPEN order by any existing eligibility check
    orderType: role==='STOP_LOSS' ? 'STOP_MARKET' : 'TAKE_PROFIT_MARKET',
    quantity:rawQuantity, limitPrice:null, stopPrice:triggerPrice,
    status:'DRAFT', filled:{quantity:0, averagePrice:null},
    createdAt:now, submittedAt:null, updatedAt:now,
    exchangeOrderId:null, clientOrderId:null, pendingClientOrderId:null, exchangeConnectionId:connectionId,
    exchangeAccountId:position.exchangeAccountId||null, // Sprint 3.6A.2 — protection orders inherit ownership from the Position they protect, same Core Truth source as everything else about this order
    targetIndex: role==='TAKE_PROFIT' ? targetIndex : null, // Task H — TAKE_PROFIT-only traceability field
    portion: role==='TAKE_PROFIT' ? portion : null,
  };
  saveRealOrder(order);

  // Task Q — persisted BEFORE the network call, exact same discipline as entry-order submission
  // (Task 27): survives a lost response, blocks a naive duplicate create on the next reconciliation.
  order.pendingClientOrderId=order.orderId;
  saveRealOrder(order);

  let json;
  try{
    const res=await fetch(`${BACKEND_URL}/api/exchange/connections/${connectionId}/algo-orders`, {
      method:'POST', headers:{'Content-Type':'application/json'},
      body:JSON.stringify({symbol:entryOrder.symbol, side, positionSide, type:order.orderType, triggerPrice, quantity:rawQuantity, reduceOnly, clientAlgoId:order.orderId}),
    });
    json=await res.json();
  }catch(e){
    order.sync={lastSyncedAt:new Date().toISOString(), lastSyncStatus:'ERROR', lastSyncError:'网络请求失败，保护单提交结果未知'};
    saveRealOrder(order); // pendingClientOrderId intentionally left set — recoverable via clientAlgoId
    return order;
  }

  if(!json.ok){
    const errMsg=(json.error&&json.error.message)||'保护单提交失败';
    if(!json.ambiguous){
      // Task 10/26-equivalent — a deterministic rejection means Binance definitely did not create the
      // order; safe to clear the pending marker so a later reconciliation can try again.
      order.pendingClientOrderId=null;
    }
    order.sync={lastSyncedAt:new Date().toISOString(), lastSyncStatus:'ERROR', lastSyncError:errMsg};
    saveRealOrder(order);
    return order;
  }

  const snap=json.snapshot;
  const localStatus=mapAlgoStatusToLocalOrderStatus(snap.algoStatus);
  order.exchangeOrderId=snap.algoId;
  order.clientOrderId=snap.clientAlgoId;
  order.pendingClientOrderId=null;
  order.status=localStatus || 'SUBMITTED';
  order.quantity=snap.quantity!=null?snap.quantity:order.quantity; // real, exchange-rounded quantity replaces the pre-rounding local estimate
  order.submittedAt=new Date().toISOString();
  order.sync={lastSyncedAt:new Date().toISOString(), lastSyncStatus:'SUCCESS', lastSyncError: localStatus?null:('unsupported_algo_status_on_submit: 已提交，交易所返回未识别状态 '+snap.algoStatus)};
  saveRealOrder(order);
  return order;
}

/** Task Q recovery — mirrors recoverAmbiguousSubmission() exactly, for a protection order stuck with
 * `pendingClientOrderId` set. Never resends a second create; only resolves truth via clientAlgoId. */
async function recoverAmbiguousProtectionSubmission(protectionOrderId, connectionId){
  const order=getRealOrderById(protectionOrderId);
  if(!order || !order.pendingClientOrderId) return order;
  let json;
  try{
    const res=await fetch(`${BACKEND_URL}/api/exchange/connections/${connectionId}/algo-order?clientAlgoId=${encodeURIComponent(order.pendingClientOrderId)}`);
    json=await res.json();
  }catch(e){ return order; } // still ambiguous — left exactly as-is, never guessed

  if(json.ok){
    const snap=json.snapshot;
    const localStatus=mapAlgoStatusToLocalOrderStatus(snap.algoStatus);
    order.exchangeOrderId=snap.algoId; order.clientOrderId=snap.clientAlgoId; order.pendingClientOrderId=null;
    order.status=localStatus || 'SUBMITTED';
    order.quantity=snap.quantity!=null?snap.quantity:order.quantity;
    if(!order.submittedAt) order.submittedAt=new Date().toISOString();
    order.sync={lastSyncedAt:new Date().toISOString(), lastSyncStatus:'SUCCESS', lastSyncError:null};
    saveRealOrder(order);
    return order;
  }
  if(json.error && json.error.code==='order_not_found'){
    order.pendingClientOrderId=null;
    order.sync={lastSyncedAt:new Date().toISOString(), lastSyncStatus:'ERROR', lastSyncError:'先前的保护单提交未在交易所找到对应记录，已清除待确认状态'};
    saveRealOrder(order);
    return order;
  }
  return order; // still unresolved — left exactly as-is
}

/** Task N — the ONE reconciliation function. Reads real Trade/Order/Position + real exchange
 * protection state, decides what (if anything) is missing, and creates ONLY what's missing — never
 * amends, never cancels, never auto-recreates (Task N's documented safe default: "if unsafe this
 * sprint, mark PARTIALLY_PROTECTED/PROTECTION_FAILED and wait for the user"). Idempotent and safe to
 * call repeatedly (drives both the automatic post-fill continuation, Task F.4, and the manual "重新
 * 建立保护" button, Task O — which must NEVER resubmit the entry order, only this). */
async function reconcileTradeProtection(tradeId){
  const trade=getRealTradeById(tradeId);
  if(!trade) return {status:'PROTECTION_FAILED', reason:'本地交易不存在'};
  const entryOrder=Object.values(loadRealOrders()).find(o=>o.tradeId===tradeId && o.role==='ENTRY');
  if(!entryOrder || !(entryOrder.filled && entryOrder.filled.quantity>0)){
    // Task S — Scenario expiry / anything else must never force a protection attempt without a real fill.
    trade.protectionStatus='NOT_REQUIRED';
    saveRealTrade(trade);
    return {status:'NOT_REQUIRED'};
  }

  // Sprint 3.6A.2 — resolve via the entry order's exchangeAccountId first (works through ANY
  // connection currently bound to the same real account, not just the one the entry order originally
  // reached), falling back to Risk Settings only for a legacy order. This is the exact call site that
  // used to fail with a misleading "不是 TESTNET 环境" message whenever the entry order's original
  // exchangeConnectionId had been deleted — see the Phase 1 investigation report's Failure Path
  // Reproduction, D.3. The two failure reasons are now kept honestly distinct (connection/account
  // unresolvable vs. resolved-but-not-TESTNET).
  const resolved=await resolveConnectionForRealOrder(entryOrder);
  if(!resolved.ok){
    trade.protectionStatus='PROTECTION_FAILED'; saveRealTrade(trade);
    return {status:'PROTECTION_FAILED', reason:resolved.reason};
  }
  const connectionId=resolved.connectionId;
  const connection=(resolved.connections||[]).find(c=>c.id===connectionId);
  // Task J/X — frontend-side defense in depth on top of the backend's own hard TESTNET guard, same
  // discipline as every other write path in this app (submission, cancellation); never an override.
  if(!connection || connection.environment!=='TESTNET'){
    trade.protectionStatus='PROTECTION_FAILED'; saveRealTrade(trade);
    return {status:'PROTECTION_FAILED', reason:'当前选定的交易所连接不是 TESTNET 环境，本版本不支持提交保护单'};
  }

  // Task L — the real Position, freshly synced, is the ONLY source of protectable quantity. Never
  // positionSizeUsdt, never the entry order's originally-intended quantity.
  trade.protectionStatus='PENDING_PROTECTION';
  saveRealTrade(trade);
  const syncResult=await syncPositionsFromExchange(connectionId);
  if(!syncResult.ok){
    trade.protectionStatus='PROTECTION_FAILED'; saveRealTrade(trade);
    return {status:'PROTECTION_FAILED', reason:syncResult.error||'无法读取真实持仓'};
  }
  const position=Object.values(loadRealPositions()).find(p=>(p.sourceTradeIds||[]).includes(tradeId) && p.status==='OPEN');
  if(!position){
    // Task L — no real open Position exists (fully closed, or not yet linked). Never fabricate a
    // quantity to protect. Trade itself may already be CLOSED/CANCELLED — protection is then moot.
    trade.protectionStatus = (trade.status==='CLOSED'||trade.status==='CANCELLED') ? 'NOT_REQUIRED' : 'PROTECTION_FAILED';
    saveRealTrade(trade);
    return {status:trade.protectionStatus, reason:'未找到与该交易关联的真实持仓'};
  }
  // Task L — protection quantity NEVER exceeds the real position quantity. This is the hard ceiling
  // every SL/TP quantity below is computed against.
  const protectableQty=Math.min(position.quantity, entryOrder.filled.quantity);

  const resolvedView=resolveScenarioPlan(trade.analysisId, trade.scenarioPlanId);
  const draft=getExecutionDraft(entryOrder.executionId);
  const effective = (resolvedView && draft) ? effectiveExecutionPlan(resolvedView.plan, draft.userOverrides) : null;
  if(!effective || !isFiniteNumber(effective.stopLoss.value) || effective.stopLoss.value<=0){
    trade.protectionStatus='PROTECTION_FAILED'; saveRealTrade(trade);
    return {status:'PROTECTION_FAILED', reason:'缺少有效的数值止损，无法建立保护'};
  }
  const tpTargets=(effective.takeProfit||[]).filter(tp=>isFiniteNumber(tp.value) && tp.value>0 && isFiniteNumber(tp.portion) && tp.portion>0);
  const portionOk=validateTakeProfitPortions(effective.takeProfit);

  const results=[]; // {role, targetIndex, order}

  // ---- Stop Loss: exactly one, 100% of the real protectable quantity (Task D). ----
  let slOrder=findActiveProtectionOrder(tradeId, 'STOP_LOSS', null);
  if(slOrder && slOrder.pendingClientOrderId){
    slOrder=await recoverAmbiguousProtectionSubmission(slOrder.orderId, connectionId);
  }
  if(!slOrder){
    slOrder=await createAndSubmitProtectionOrder(trade, entryOrder, connectionId, position, 'STOP_LOSS', null, effective.stopLoss.value, protectableQty, null);
  }
  results.push({role:'STOP_LOSS', targetIndex:null, order:slOrder});

  // ---- Take Profit: one per valid target, quantity = protectableQty * portion/100 (raw — backend
  // does the real LOT_SIZE rounding, Task L). Only attempted if portions pass validation (Task C/W —
  // never submit against an invalid/incomplete portion split). ----
  if(portionOk.ok){
    for(let i=0;i<effective.takeProfit.length;i++){
      const tp=effective.takeProfit[i];
      if(!isFiniteNumber(tp.value) || tp.value<=0 || !isFiniteNumber(tp.portion) || tp.portion<=0) continue;
      let tpOrder=findActiveProtectionOrder(tradeId, 'TAKE_PROFIT', i);
      if(tpOrder && tpOrder.pendingClientOrderId){
        tpOrder=await recoverAmbiguousProtectionSubmission(tpOrder.orderId, connectionId);
      }
      if(!tpOrder){
        const rawQty=protectableQty*(tp.portion/100);
        tpOrder=await createAndSubmitProtectionOrder(trade, entryOrder, connectionId, position, 'TAKE_PROFIT', i, tp.value, rawQty, tp.portion);
      }
      results.push({role:'TAKE_PROFIT', targetIndex:i, order:tpOrder});
    }
  }

  // Task N — final status computation: PROTECTED only if every expected slot is genuinely active
  // (has a real exchangeOrderId and a non-terminal status); otherwise PARTIALLY_PROTECTED (something
  // succeeded) or PROTECTION_FAILED (nothing did). Never silently treats a pending/ambiguous result as success.
  const expectedCount = 1 + (portionOk.ok ? tpTargets.length : 0);
  const activeCount = results.filter(r=>r.order && r.order.exchangeOrderId && !PROTECTION_TERMINAL_STATUSES.includes(r.order.status)).length;
  trade.protectionStatus = activeCount===0 ? 'PROTECTION_FAILED' : activeCount>=expectedCount ? 'PROTECTED' : 'PARTIALLY_PROTECTED';
  saveRealTrade(trade);
  return {status:trade.protectionStatus, results, protectableQty};
}

/* ---------- Sprint 3.5A: Risk Guard ----------
   Deterministic program logic sitting between RealOrder(DRAFT) and any future exchange submission.
   Answers exactly one question: "is this draft Order currently allowed to proceed toward future
   submission?" — never submits anything itself. Rules come from RiskSettings + ExecutionDraft +
   RealOrder/RealTrade + current market state ONLY — no AI/Prompt Builder/Evidence Parser/Main
   Analysis call anywhere in this section (the AI has no authority to bypass Risk Guard). Split per
   Task 33: pure per-rule evaluators + a pure aggregator, separate from the one impure context-
   building step that does the actual market-data fetch. */

const RISK_SETTINGS_KEY='qa_risk_settings';
/** Task 6 defaults, chosen deliberately, not invented aggressively:
 * - numeric ceilings (maxNotionalPerTrade/maxLeverage/maxActiveTrades) default to null — "not
 *   configured yet," never a silently-invented aggressive limit the user never chose.
 * - requireStopLoss / requireFreshMarketData default ON — matches this project's existing
 *   "prefer safety" precedent (3.4B's same-cycle invalidation-wins rule) and PROJECT.md's frozen
 *   principle that Execution always separates AI recommendation from human decision only after
 *   real safeguards, not before.
 * - blockSameSymbolConflict defaults ON — enforces the ALREADY-approved "one net Position per
 *   symbol" MVP policy from the 3.4B.1 design report, not a new arbitrary restriction. */
function defaultRiskSettings(){
  return {
    maxNotionalPerTrade: null,
    maxLeverage: null,
    requireStopLoss: true,
    maxActiveTrades: null,
    blockSameSymbolConflict: true,
    requireFreshMarketData: true,
    exchangeConnectionId: null, // Sprint 3.5C, Task 19/20 — explicit account selection; null = auto-resolve if exactly one enabled connection exists, else account-aware checks BLOCK (never silently pick one of several)
  };
}
function loadRiskSettings(){
  try{ const raw=localStorage.getItem(RISK_SETTINGS_KEY); if(raw) return Object.assign(defaultRiskSettings(), JSON.parse(raw)); }catch(e){}
  return defaultRiskSettings();
}
function saveRiskSettings(settings){ localStorage.setItem(RISK_SETTINGS_KEY, JSON.stringify(settings)); }

/** Real Trade statuses this prototype currently ever produces are just PLANNED (3.4C) — but the
 * rule is written against the FULL intended lifecycle enum from the frozen domain design so it
 * doesn't need to change again once OPENING/OPEN/CLOSING become real. CLOSED/CANCELLED are
 * deliberately excluded — a finished or abandoned Trade is not "active exposure/intent." */
const REAL_TRADE_ACTIVE_STATUSES=['PLANNED','OPENING','OPEN','CLOSING'];

/* ---- Layer 1: pure per-rule evaluators (Task 33) — no DOM/network, independently testable. ---- */

function evaluateMaxNotional(settings, positionSize){
  if(settings.maxNotionalPerTrade==null) return {ruleId:'max_notional', status:'SKIPPED', message:'未配置单笔名义金额上限'};
  if(!isFiniteNumber(positionSize)) return {ruleId:'max_notional', status:'BLOCKED', message:'已配置单笔名义金额上限，但当前执行草稿未填写仓位大小，无法验证是否合规'};
  if(positionSize>settings.maxNotionalPerTrade) return {ruleId:'max_notional', status:'BLOCKED', message:`本次名义金额 ${fmt(positionSize,0)} USDT 超过单笔上限 ${fmt(settings.maxNotionalPerTrade,0)} USDT`};
  return {ruleId:'max_notional', status:'PASS', message:`名义金额 ${fmt(positionSize,0)} USDT 未超过单笔上限 ${fmt(settings.maxNotionalPerTrade,0)} USDT`};
}
function evaluateMaxLeverage(settings, leverage){
  if(settings.maxLeverage==null) return {ruleId:'max_leverage', status:'SKIPPED', message:'未配置最大杠杆'};
  if(!isFiniteNumber(leverage)) return {ruleId:'max_leverage', status:'BLOCKED', message:'已配置最大杠杆限制，但当前执行草稿未填写杠杆倍数，无法验证是否合规'};
  if(leverage>settings.maxLeverage) return {ruleId:'max_leverage', status:'BLOCKED', message:`请求杠杆 ${leverage}x 超过上限 ${settings.maxLeverage}x`};
  return {ruleId:'max_leverage', status:'PASS', message:`请求杠杆 ${leverage}x 未超过上限 ${settings.maxLeverage}x`};
}
/** Task 10 — Risk Guard evaluates future exchange-submission readiness, so a description-only stop
 * ("跌破关键支撑" etc.) deliberately does NOT count as PASS even though it's a perfectly valid
 * Scenario-level stop for MANUAL review — only a finite numeric stopLoss.value is exchange-ready. */
function evaluateStopLoss(settings, effectivePlan){
  if(!settings.requireStopLoss) return {ruleId:'stop_loss_required', status:'SKIPPED', message:'未启用"必须设置止损"'};
  const sl=effectivePlan.stopLoss;
  if(sl && isFiniteNumber(sl.value)) return {ruleId:'stop_loss_required', status:'PASS', message:`已设置可执行止损价格 ${fmtPrice(sl.value,2)}`};
  if(sl && sl.description) return {ruleId:'stop_loss_required', status:'BLOCKED', message:'当前止损仅为描述性条件，尚无可执行止损价格'};
  return {ruleId:'stop_loss_required', status:'BLOCKED', message:'当前执行计划未设置止损'};
}
/** Task 11 — excludes the current Trade itself from the "how many active Trades already exist"
 * count (a Trade is never a conflict with its own draft Order). */
function evaluateActiveTrades(settings, activeTrades, currentTradeId){
  if(settings.maxActiveTrades==null) return {ruleId:'max_active_trades', status:'SKIPPED', message:'未配置最大活跃交易数量'};
  const others=activeTrades.filter(t=>t.tradeId!==currentTradeId);
  if(others.length>=settings.maxActiveTrades) return {ruleId:'max_active_trades', status:'BLOCKED', message:`当前活跃真实交易 ${others.length} 笔，已达到上限 ${settings.maxActiveTrades} 笔`};
  return {ruleId:'max_active_trades', status:'PASS', message:`当前活跃真实交易 ${others.length} 笔，未达到上限 ${settings.maxActiveTrades} 笔`};
}
/** Task 12 — MVP policy is "one active real Trade per symbol" (the already-approved one-net-
 * Position-per-symbol direction from the 3.4B.1 design report), not long/short hedge-aware logic.
 * Only inspects REAL active Trades — legacy mock qa_trades is never consulted. */
function evaluateSameSymbolConflict(settings, activeTrades, currentTradeId, symbol){
  if(!settings.blockSameSymbolConflict) return {ruleId:'same_symbol_conflict', status:'SKIPPED', message:'未启用"阻止同交易对冲突计划"'};
  const conflict=activeTrades.find(t=>t.tradeId!==currentTradeId && t.symbol===symbol);
  if(conflict) return {ruleId:'same_symbol_conflict', status:'BLOCKED', message:`已存在同交易对 ${symbol} 的活跃真实交易（${conflict.tradeId}），暂不允许新建`};
  return {ruleId:'same_symbol_conflict', status:'PASS', message:`交易对 ${symbol} 当前没有冲突的活跃真实交易`};
}
/** Task 13 — /api/prices has no per-row timestamp (checked: parsePrices() in server.ts returns only
 * {symbol,price,changePct}); "freshness" is therefore judged against the moment THIS Risk Guard
 * evaluation itself fetched the price (market.observedAt, stamped client-side, same honest pattern
 * fetchPriceObservations() already used for the Trigger Monitor in 3.4B) rather than any invented
 * backend truth. RISK_MARKET_FRESHNESS_MS is one named constant, not a scattered magic number. */
const RISK_MARKET_FRESHNESS_MS=60000; // backend /api/prices caches up to CACHE_TTL_MS=20s upstream; this adds a deliberate margin for fetch/evaluation latency, not a precise measured bound
function evaluateMarketFreshness(settings, market){
  if(!settings.requireFreshMarketData) return {ruleId:'market_freshness', status:'SKIPPED', message:'未启用"要求最新行情"'};
  if(!market || !isFiniteNumber(market.price) || !isNonEmptyString(market.observedAt)) return {ruleId:'market_freshness', status:'BLOCKED', message:'无法获取当前行情价格，订单暂不可提交'};
  const age=Date.now()-new Date(market.observedAt).getTime();
  if(!(age>=0) || age>RISK_MARKET_FRESHNESS_MS) return {ruleId:'market_freshness', status:'BLOCKED', message:'无法确认当前行情新鲜度，订单暂不可提交'};
  return {ruleId:'market_freshness', status:'PASS', message:`行情观测于 ${Math.round(age/1000)} 秒前，新鲜度达标`};
}

/* ---- Sprint 3.5C: account-aware rules (Task 22-27) — these three ALWAYS run (no on/off toggle
   like the six local rules above) and BLOCK rather than silently pass when the real account cannot
   be resolved/read (Task 20/27: "must BLOCK rather than silently downgrade to local-only PASS").
   This is a deliberate, disclosed behavior change from 3.5A/3.5B: once an exchange connection
   capability exists, Risk Guard no longer offers a pure local-only PASS path. ---- */

const ACCOUNT_UNAVAILABLE_MESSAGE='无法读取真实账户状态，风险守卫无法确认该订单可继续。';

/** Task 23 — estimatedRequiredMargin = positionSize / leverage is an explicitly-labelled
 * approximation (not exact exchange margin, which depends on tiered margin rates this prototype
 * does not model), compared against the real exchange availableBalance. Missing/invalid inputs on
 * either side BLOCK as unverifiable — never assumed. */
function evaluateAccountBalance(accountContext, positionSize, leverage){
  if(!accountContext || !accountContext.ok) return {ruleId:'account_balance', status:'BLOCKED', message:ACCOUNT_UNAVAILABLE_MESSAGE};
  if(!isFiniteNumber(positionSize) || !isFiniteNumber(leverage) || leverage<=0) return {ruleId:'account_balance', status:'BLOCKED', message:'仓位大小或杠杆缺失/无效，无法估算所需保证金（预估值）'};
  if(!isFiniteNumber(accountContext.availableBalance)) return {ruleId:'account_balance', status:'BLOCKED', message:'无法获取账户可用余额，无法验证保证金是否充足'};
  const estimatedRequiredMargin=positionSize/leverage;
  if(estimatedRequiredMargin>accountContext.availableBalance) return {ruleId:'account_balance', status:'BLOCKED', message:`预估所需保证金 ${fmt(estimatedRequiredMargin,2)} USDT（估算值）超过账户可用余额 ${fmt(accountContext.availableBalance,2)} USDT`};
  return {ruleId:'account_balance', status:'PASS', message:`预估所需保证金 ${fmt(estimatedRequiredMargin,2)} USDT（估算值），账户可用余额 ${fmt(accountContext.availableBalance,2)} USDT`};
}
/** Task 24 — current Execution model only supports new OPEN trades; ANY existing non-zero real
 * Binance Position for the same symbol blocks (same OR opposite direction — never auto-interpreted
 * as ADD/CLOSE/REVERSE). Message differs by relationship, per Task 24's exact wording. */
function evaluateExchangePositionConflict(accountContext, symbol, direction){
  if(!accountContext || !accountContext.ok) return {ruleId:'exchange_position_conflict', status:'BLOCKED', message:ACCOUNT_UNAVAILABLE_MESSAGE};
  const pos=accountContext.positions.find(p=>p.symbol===symbol);
  if(!pos) return {ruleId:'exchange_position_conflict', status:'PASS', message:`交易对 ${symbol} 当前没有已存在的真实持仓`};
  if(pos.side===direction) return {ruleId:'exchange_position_conflict', status:'BLOCKED', message:`账户已经存在 ${symbol} ${pos.side} 持仓。当前流程是新开仓，不支持将该执行自动解释为 ADD。`};
  return {ruleId:'exchange_position_conflict', status:'BLOCKED', message:`账户已经存在 ${symbol} ${pos.side} 持仓。当前流程尚未支持 CLOSE / REVERSE。`};
}
/** Task 25 — only meaningful when a same-symbol Position already exists (SKIPPED otherwise, not
 * PASS — nothing was actually verified). Take-profit absence alone never blocks this sprint. Does
 * NOT replace exchange_position_conflict — both reasons may legitimately appear together. */
function evaluateExistingPositionProtection(accountContext, symbol){
  if(!accountContext || !accountContext.ok) return {ruleId:'existing_position_protection', status:'BLOCKED', message:ACCOUNT_UNAVAILABLE_MESSAGE};
  const pos=accountContext.positions.find(p=>p.symbol===symbol);
  if(!pos) return {ruleId:'existing_position_protection', status:'SKIPPED', message:'该交易对当前没有已有真实持仓，无需检查现有持仓的止损保护'};
  const hasStop=pos.protection && pos.protection.stopLossOrders && pos.protection.stopLossOrders.length>0;
  if(hasStop) return {ruleId:'existing_position_protection', status:'PASS', message:'账户已有该交易对持仓，当前读取范围内检测到有效止损保护'};
  return {ruleId:'existing_position_protection', status:'BLOCKED', message:'账户已有该交易对持仓，但当前读取范围内未检测到有效止损保护。'};
}

/** Task 3/35 — the pure aggregator. BLOCKED if ANY check is BLOCKED (a SKIPPED check never blocks);
 * PASS only when every non-skipped check PASSes. Never mutates its inputs — context is read-only. */
function evaluateRiskGuard(context){
  const {effectivePlan, trade, riskSettings, activeTrades, market, accountContext}=context;
  const checks=[
    evaluateMaxNotional(riskSettings, effectivePlan.positionSize),
    evaluateMaxLeverage(riskSettings, effectivePlan.leverage),
    evaluateStopLoss(riskSettings, effectivePlan),
    evaluateActiveTrades(riskSettings, activeTrades, trade.tradeId),
    evaluateSameSymbolConflict(riskSettings, activeTrades, trade.tradeId, trade.symbol),
    evaluateMarketFreshness(riskSettings, market),
    evaluateAccountBalance(accountContext, effectivePlan.positionSize, effectivePlan.leverage),
    evaluateExchangePositionConflict(accountContext, trade.symbol, trade.thesisDirection),
    evaluateExistingPositionProtection(accountContext, trade.symbol),
  ];
  const status = checks.some(c=>c.status==='BLOCKED') ? 'BLOCKED' : 'PASS';
  return {status, checkedAt:new Date().toISOString(), checks};
}

/* ---- Layer 2: impure context building (Task 14/15) — the ONLY place that fetches. ---- */

/** Reuses the exact /api/prices endpoint the Trigger Monitor and ticker already poll — no new
 * market-data provider. Only fetched when requireFreshMarketData is actually enabled (Task 14: "do
 * not put fetch calls inside every rule" — and don't fetch at all when the rule can't block). */
async function fetchRiskMarketPrice(symbol){
  if(!symbol) return null;
  try{
    const res=await fetch(`${BACKEND_URL}/api/prices`);
    if(!res.ok) return null;
    const rows=await res.json();
    const row=Array.isArray(rows) ? rows.find(r=>r.symbol===symbol) : null;
    if(!row || !isFiniteNumber(row.price)) return null;
    return {price:row.price, observedAt:new Date().toISOString()};
  }catch(e){ return null; }
}
/** Sprint 3.5C, Task 19 — never silently choose the first of several enabled connections when
 * several exist. Sprint 3.5D-A, Task 10: extracted out of buildAccountRiskContext() (below) so the
 * Order Lifecycle sync flow (syncRealOrderFromExchange()) resolves "the" exchange connection via the
 * exact same rule Risk Guard already uses, instead of a second, potentially-diverging decision.
 * Pure given (riskSettings, connections) — no fetch of its own. */
function resolveRiskExchangeConnectionId(riskSettings, connections){
  let connectionId=riskSettings.exchangeConnectionId||null;
  if(!connectionId){
    const enabled=connections.filter(c=>c.enabled);
    if(enabled.length===1) return {ok:true, connectionId:enabled[0].id};
    return {ok:false, reason: enabled.length===0 ? '未配置任何已启用的交易所连接' : '存在多个已启用的交易所连接，请在设置中选择风险守卫使用的账户'};
  }
  const sel=connections.find(c=>c.id===connectionId);
  if(!sel) return {ok:false, reason:'风险守卫选定的交易所连接不存在', connectionId};
  if(!sel.enabled) return {ok:false, reason:'风险守卫选定的交易所连接已被禁用', connectionId};
  return {ok:true, connectionId};
}

/** Reads the connection list fresh from the backend (not Store.exchangeConnections, which may be
 * unloaded if the user confirms without ever visiting Settings) so Risk Guard is self-sufficient
 * regardless of navigation history. Returns {ok:false} with a reason when no single account can be
 * resolved. */
async function buildAccountRiskContext(riskSettings){
  let connections;
  try{
    const res=await fetch(`${BACKEND_URL}/api/exchange/connections`);
    const json=await res.json();
    if(!json.ok) return {ok:false, reason:'无法读取交易所连接列表'};
    connections=json.connections;
  }catch(e){ return {ok:false, reason:'无法读取交易所连接列表'}; }

  const resolved=resolveRiskExchangeConnectionId(riskSettings, connections);
  if(!resolved.ok) return resolved;
  const connectionId=resolved.connectionId;

  try{
    const res=await fetch(`${BACKEND_URL}/api/exchange/connections/${connectionId}/account`);
    const json=await res.json();
    if(!json.ok) return {ok:false, reason:(json.error&&json.error.message)||'无法读取真实账户状态', connectionId};
    const snap=json.snapshot;
    return {
      ok:true, connectionId, fetchedAt:snap.fetchedAt,
      availableBalance:(snap.accountRisk&&snap.accountRisk.availableBalance!=null)?snap.accountRisk.availableBalance:null,
      positions:snap.positions||[], protectiveOrders:snap.protectiveOrders||[],
    };
  }catch(e){ return {ok:false, reason:'无法读取真实账户状态', connectionId}; }
}

/** Task 15/16 (3.5A) — builds the RiskContext right after Trade(PLANNED)+Order(DRAFT) exist, since
 * the guard needs a concrete intended Order to inspect. activeTrades reads ONLY qa_trades_real (Task
 * 11/12 — legacy mock qa_trades is never consulted for risk purposes). Extended 3.5C: always builds
 * accountContext too (Task 20 — account-aware checks are never optional/toggle-gated). */
async function buildRiskContext(view, trade, order){
  const riskSettings=loadRiskSettings();
  const effectivePlan=effectiveExecutionPlan(view.plan, view.draft.userOverrides);
  // Automatic RealTrade Reconciliation, Section 7 — reconcile any OTHER active RealTrade on this
  // same symbol against real exchange truth BEFORE reading activeTrades below, so a genuinely-stale
  // local record can't block a new plan just because the periodic sweep hasn't run recently. The
  // conflict RULE itself (evaluateSameSymbolConflict) is completely untouched — this only makes sure
  // what it reads is as fresh as possible first; if a same-symbol Trade is still active after real
  // reconciliation, the conflict check below still BLOCKS exactly as before (Section 8).
  if(trade.symbol) await reconcileActiveRealTrades(trade.symbol);
  const activeTrades=Object.values(loadRealTrades()).filter(t=>REAL_TRADE_ACTIVE_STATUSES.includes(t.status));
  const market = riskSettings.requireFreshMarketData ? await fetchRiskMarketPrice(trade.symbol) : null;
  const accountContext = await buildAccountRiskContext(riskSettings);
  return {executionDraft:view.draft, effectivePlan, order, trade, riskSettings, activeTrades, market, accountContext};
}
/** Task 17 (3.5A) — persists the latest result on the RealOrder itself (`order.riskGuard`),
 * overwritten in place on every run — never inside AIResponse/ScenarioPlan/ExecutionDraft (Task 37).
 * Used both right after confirmation and by the explicit "重新检查风险" recheck action (Task 24/28,
 * 3.5C: recheck now also refreshes account data, since it reuses this exact function) — identical
 * function, no separate recheck-only code path to drift out of sync. Task 29 (3.5C): attaches trace
 * metadata (which account, when it was read) — never the full sensitive account snapshot. */
async function runRiskGuardForOrder(executionId){
  const trade=getRealTradeByExecutionId(executionId);
  if(!trade) return null;
  const order=Object.values(loadRealOrders()).find(o=>o.tradeId===trade.tradeId && o.role==='ENTRY');
  if(!order) return null;
  const view=resolveExecutionView(executionId);
  if(!view.ok) return null;
  const context=await buildRiskContext(view, trade, order);
  const result=evaluateRiskGuard(context);
  result.exchangeConnectionId = context.accountContext ? (context.accountContext.connectionId||null) : null;
  result.accountFetchedAt = (context.accountContext && context.accountContext.ok) ? context.accountContext.fetchedAt : null;
  order.riskGuard=result;
  saveRealOrder(order);
  return result;
}

/* ---- Layer 3: UI (Task 21/22/23) — shared between Execution and Trade Detail, no raw JSON. ---- */

const RISK_CHECK_LABEL={
  max_notional:'最大单笔名义金额', max_leverage:'最大杠杆', stop_loss_required:'必须设置止损',
  max_active_trades:'最大活跃交易数量', same_symbol_conflict:'阻止同交易对冲突计划', market_freshness:'要求最新行情',
  account_balance:'账户可用余额（估算保证金）', exchange_position_conflict:'交易所已有持仓冲突', existing_position_protection:'已有持仓止损保护',
};
/** One shared card, reused verbatim by both renderExecutionDraftPage() and renderRealTradeDetail()
 * (Task 21/22) so the two pages can never disagree about what a given riskGuard result means.
 * `opts.recheckExecutionId` renders the "重新检查风险" action (Task 24) when provided. Task 20/25:
 * PASS explicitly says "订单仍为草稿，尚未提交至交易所" — never "可成交"/"已批准下单"/"下单成功". */
function renderRiskGuardCard(riskGuard, opts){
  opts=opts||{};
  if(!riskGuard){
    return `<div class="card card-pad" style="margin-bottom:16px">
      <div class="section-title">风险守卫 Risk Guard</div>
      <div class="empty-hint">尚未运行风险检查。</div>
    </div>`;
  }
  const isPass=riskGuard.status==='PASS';
  return `<div class="card card-pad" style="margin-bottom:16px; ${isPass?'':'border-color:var(--red)'}">
    <div class="section-title" style="justify-content:space-between; display:flex; align-items:center">
      <span>风险守卫 Risk Guard <span class="pill ${isPass?'pill-green':'pill-red'}" style="margin-left:6px">${isPass?'通过':'阻止'}</span></span>
      ${opts.recheckExecutionId?`<button class="btn btn-sm" data-action="recheck-risk-guard" data-execution-id="${escapeAttr(opts.recheckExecutionId)}">重新检查风险</button>`:''}
    </div>
    <div class="small-note" style="margin:6px 0 10px">检查时间：${escapeAttr(fmtDateTime(new Date(riskGuard.checkedAt)))}${riskGuard.accountFetchedAt?`<br>账户数据读取时间：${escapeAttr(fmtDateTime(new Date(riskGuard.accountFetchedAt)))}`:''}${isPass?'<br>订单仍为草稿，尚未提交至交易所。':''}</div>
    <div class="kv-list">
      ${riskGuard.checks.map(c=>{
        const cCls=c.status==='PASS'?'pill-green':c.status==='BLOCKED'?'pill-red':'pill-gray';
        const cLabel=c.status==='PASS'?'通过':c.status==='BLOCKED'?'阻止':'未启用';
        return `<div class="row"><span class="k">${escapeAttr(RISK_CHECK_LABEL[c.ruleId]||c.ruleId)}</span><span class="v"><span class="pill ${cCls}" style="margin-right:6px">${cLabel}</span>${escapeAttr(c.message)}</span></div>`;
      }).join('')}
    </div>
    ${(!isPass && opts.showReturnToStrategy)?`<button class="btn btn-secondary btn-sm" style="margin-top:10px" data-action="nav" data-href="#/strategy">← 返回策略重新执行</button>`:''}

/** Confirmation (Task 7/15/16 of the 3.4C design report, extended in 3.5A): resolves the effective
 * plan, and — only if the entry can be resolved into an actually-executable Order spec (Task 11/12/
 * 13: MARKET/LIMIT only, never a fabricated price) — marks the draft CONFIRMED and creates a local
 * RealTrade(PLANNED) + ENTRY RealOrder(DRAFT), then immediately runs Risk Guard against it (Sprint
 * 3.5A, Task 16: "must run AFTER Trade/Order exist, BEFORE any future submission" — there is no
 * submission this sprint either way). If the entry cannot yet be resolved (unresolved ZONE/
 * CONDITIONAL), the WHOLE confirmation is blocked with a readable message — the draft stays DRAFT,
 * nothing is created, never a half-created Order. Still deliberately does NOT touch the legacy mock
 * qa_trades — see the Final Report for the full rationale (unchanged from 3.4A). */
async function confirmExecutionDraft(executionId){
  const view=resolveExecutionView(executionId);
  if(!view.ok || view.draft.status!=='DRAFT') return;
  const effective=effectiveExecutionPlan(view.plan, view.draft.userOverrides);
  const orderSpec=resolveEntryOrderSpec(view.plan, effective, view.draft.userOverrides);
  if(!orderSpec.ok){ toast(orderSpec.reason); return; }
  view.draft.status='CONFIRMED';
  saveExecutionDraft(view.draft);
  createOrReuseRealTradeAndOrder(view, orderSpec);
  await runRiskGuardForOrder(executionId);
  toast('执行意图已确认。<br>已生成本地交易计划和订单草稿。<br>订单尚未提交至交易所，仓位尚未建立。');
  document.getElementById('app').innerHTML=renderExecutionReal(executionId); wireInteractions();
}
function cancelExecutionDraft(executionId){
  const view=resolveExecutionView(executionId);
  if(!view.ok || view.draft.status!=='DRAFT') return;
  view.draft.status='CANCELLED';
  // Sprint 3.4B, Task 27: stop monitoring — but only overwrite triggerStatus while it was still
  // PENDING (an in-flight watch being cancelled). A TRIGGERED/INVALIDATED/EXPIRED draft keeps that
  // as historical fact even though status is now CANCELLED — the monitor already stopped watching
  // it (the tick loop only ever processes triggerStatus==='PENDING' drafts in the first place).
  if(view.draft.triggerStatus==='PENDING') view.draft.triggerStatus='CANCELLED';
  saveExecutionDraft(view.draft);
  toast('执行草稿已取消');
  navigate('#/strategy');
}

function formatEffectiveLevel(level, decimals){
  if(!level) return '—';
  if(level.value!=null) return fmtPrice(level.value,decimals);
  return level.description||'—';
}
function formatEffectiveEntry(entry, decimals){
  if(!entry) return '—';
  if(entry.type==='CONDITIONAL') return entry.description ? `条件入场：${entry.description}` : '条件入场';
  if(entry.type==='ZONE'){
    if(entry.from==null || entry.to==null) return entry.description||'—';
    return `${fmtPrice(entry.from,decimals)} – ${fmtPrice(entry.to,decimals)}`;
  }
  if(entry.value==null) return entry.description||'—';
  return `${entry.type==='MARKET'?'市价':'限价'} ${fmtPrice(entry.value,decimals)}`;
}

/* ---------- Sprint 3.4B: deterministic Trigger Monitor + NOTIFY ----------
   AI_RESPONSE_SPEC.md v2.1.0 is unmodified — this entire section only ever READS an already-frozen
   ScenarioPlan.triggerStructured/invalidation and evaluates it against real market data. No LLM
   call anywhere in this block (confirmed in the Final Report by grepping for /api/ai/, Evidence
   Parser, Prompt Builder call sites — none exist here). Split into 3 layers per Task 32:
   (1) pure condition/trigger evaluators — no DOM, no Store, no network, independently testable;
   (2) a batched, impure data-fetch + tick layer — reuses /api/prices (already 20s-cached backend-
       side, same endpoint refreshTickerPrices() already polls) and /api/market/detail (uncached,
       hits Binance directly, so fetched only per DISTINCT symbol+timeframe actually needed, never
       once per draft);
   (3) UI wiring (Strategy card badge, Execution page status, in-app toast). ---- */

/** Task 13 finding: /api/market/detail's `klines` array does not expose Binance's own `closeTime`
 * field (the backend connector fetches it but marketDetail.ts's response mapping drops it) — so
 * "is the last returned candle closed or still forming" cannot be read directly off the API today.
 * Rather than change the backend (a second, larger surface for this sprint to touch), this is
 * computed on the frontend from data ALREADY returned: a candle's close time is deterministically
 * `openTime + this timeframe's fixed duration`, and Research's own timeframe vocabulary (`1H`/`4H`/
 * `1D`/`1W`, see the `set-timeframe` dropdown) is exactly what candle_close.timeframe will contain
 * in practice. Any other timeframe string is treated as unsupported — not guessed. */
const TRIGGER_TIMEFRAME_MS={'1H':3600000,'4H':14400000,'1D':86400000,'1W':604800000};
const TRIGGER_TIMEFRAME_TO_BINANCE_INTERVAL={'1H':'1h','4H':'4h','1D':'1d','1W':'1w'};

/* ---- Layer 1: pure evaluators (Task 9/32) — no DOM/Store/network/AI, independently testable. ---- */

/** One condition -> 'MATCHED' | 'UNMATCHED' | 'UNRESOLVED' (tri-state, not boolean — Task 14/15
 * need to distinguish "definitely false" from "cannot yet tell" so ALL/ANY combine correctly and a
 * CROSSES_* condition with no previous observation never gets treated as a false negative). */
function isConditionMet(condition, ctx){
  if(condition.metric==='price'){
    const cur=ctx.price ? ctx.price.value : null;
    const prev=ctx.prevPrice ? ctx.prevPrice.value : null;
    if(cur==null) return 'UNRESOLVED';
    return evalOperator(condition, cur, prev);
  }
  if(condition.metric==='candle_close'){
    const c=ctx.candle;
    if(!c || c.timeframe!==condition.timeframe) return 'UNRESOLVED';
    const prevC=ctx.prevCandle && ctx.prevCandle.timeframe===condition.timeframe ? ctx.prevCandle.value : null;
    return evalOperator(condition, c.value, prevC);
  }
  return 'UNRESOLVED'; // unsupported metric — the Parser already rejects this at response-validation time; defensive only
}
function evalOperator(condition, cur, prev){
  const op=condition.operator;
  if(op==='GT') return cur>condition.value ? 'MATCHED' : 'UNMATCHED';
  if(op==='GTE') return cur>=condition.value ? 'MATCHED' : 'UNMATCHED';
  if(op==='LT') return cur<condition.value ? 'MATCHED' : 'UNMATCHED';
  if(op==='LTE') return cur<=condition.value ? 'MATCHED' : 'UNMATCHED';
  if(op==='EQUALS') return cur===condition.value ? 'MATCHED' : 'UNMATCHED';
  if(op==='BETWEEN') return (cur>=condition.min && cur<=condition.max) ? 'MATCHED' : 'UNMATCHED';
  if(op==='CROSSES_ABOVE'){ if(prev==null) return 'UNRESOLVED'; return (prev<condition.value && cur>=condition.value) ? 'MATCHED' : 'UNMATCHED'; }
  if(op==='CROSSES_BELOW'){ if(prev==null) return 'UNRESOLVED'; return (prev>condition.value && cur<=condition.value) ? 'MATCHED' : 'UNMATCHED'; }
  return 'UNRESOLVED';
}

/** Task 9 — one StructuredTrigger -> {evaluable, matched, conditionResults}. `ctxResolver(condition)`
 * supplies exactly the observation that ONE condition needs (kept generic rather than one fixed
 * MarketObservation shape, since a single Trigger's conditions may legitimately span more than one
 * timeframe — "equivalent design is acceptable" per the task). Never trusts an AI-declared
 * capability flag — reuses the same isMachineEvaluableTrigger() the Strategy UI badge already uses. */
function evaluateTrigger(structuredTrigger, ctxResolver){
  if(!isMachineEvaluableTrigger(structuredTrigger)) return {evaluable:false, matched:false, conditionResults:[]};
  const conditionResults=structuredTrigger.conditions.map(c=>({condition:c, result:isConditionMet(c, ctxResolver(c))}));
  // Task 14: ALL requires every condition MATCHED (any UNMATCHED or UNRESOLVED keeps it false — an
  // unresolved condition must never let the whole trigger fire). ANY fires on any single MATCHED,
  // regardless of other conditions being UNRESOLVED — an unresolved sibling never blocks a real match.
  const matched = structuredTrigger.logic==='ALL'
    ? conditionResults.length>0 && conditionResults.every(r=>r.result==='MATCHED')
    : conditionResults.some(r=>r.result==='MATCHED');
  return {evaluable:true, matched, conditionResults};
}

/* ---- Layer 2: batched market-data fetch + monitor tick (Task 11/17/18/31/42) — impure. ---- */

function toBinanceSymbol(symbol){ return String(symbol||'').replace('/',''); }

/** Reuses the EXACT endpoint refreshTickerPrices() already polls every 20s on Dashboard — already
 * batched (one call returns every tracked symbol) and already cached 20s server-side, so this adds
 * no new backend load pattern, just a second consumer of an existing cheap endpoint. */
async function fetchPriceObservations(symbols){
  const map={};
  if(!symbols.length) return map;
  try{
    const res=await fetch(`${BACKEND_URL}/api/prices`);
    if(!res.ok) return map;
    const rows=await res.json();
    const now=new Date().toISOString();
    rows.forEach(r=>{ if(symbols.includes(r.symbol)) map[r.symbol]={value:r.price, observedAt:now}; });
  }catch(e){ /* transient network miss — empty map, every dependent condition safely resolves UNRESOLVED, never fabricated (Task 31) */ }
  return map;
}
/** One request per DISTINCT (symbol,timeframe) pair, deduped by the caller across every pending
 * draft (Task 18/42) — /api/market/detail is NOT server-side cached (hits Binance directly), so
 * this is deliberately the more conservative of the two fetches. limit=3 is enough to always find
 * at least one genuinely closed candle even when the most recent 1-2 are still forming. */
async function fetchCandleObservation(symbol, timeframe){
  const interval=TRIGGER_TIMEFRAME_TO_BINANCE_INTERVAL[timeframe];
  const durationMs=TRIGGER_TIMEFRAME_MS[timeframe];
  if(!interval || !durationMs) return null; // unsupported timeframe — never guessed, Task 13
  try{
    const res=await fetch(`${BACKEND_URL}/api/market/detail?symbol=${toBinanceSymbol(symbol)}&interval=${interval}&limit=3`);
    if(!res.ok) return null;
    const data=await res.json();
    const klines=data.klines||[];
    const now=Date.now();
    for(let i=klines.length-1;i>=0;i--){
      const closeTime=klines[i].openTime+durationMs;
      if(closeTime<=now) return {timeframe, value:klines[i].close, closedAt:new Date(closeTime).toISOString()};
    }
    return null; // every returned candle is still forming this tick — do not pretend one is closed
  }catch(e){ return null; }
}

const TRIGGER_MONITOR_TICK_MS=30000; // shared interval for ALL pending drafts combined — see Final Report for the request-rate estimate
let triggerMonitorTimer=null;
let triggerMonitorPrevPrice={};  // symbol -> last observation, IN-MEMORY ONLY (never persisted) — resets on reload, which is exactly why a CROSSES_* condition is correctly UNRESOLVED for one tick right after startup rather than fabricating history (Task 15)
let triggerMonitorPrevCandle={}; // "symbol|timeframe" -> last observation, same in-memory-only rule

function collectPendingNotifyDrafts(){
  return Object.values(loadExecutionDrafts()).filter(d=>d.executionMode==='NOTIFY' && d.status==='DRAFT' && d.triggerStatus==='PENDING');
}
function pendingDraftContext(draft){
  const resolved=resolveScenarioPlan(draft.analysisId, draft.scenarioPlanId);
  if(!resolved) return null;
  const payload=getAnalysisPayload(draft.analysisId);
  if(!payload || !payload.symbol) return null;
  const conditions=[
    ...(resolved.plan.triggerStructured && Array.isArray(resolved.plan.triggerStructured.conditions) ? resolved.plan.triggerStructured.conditions : []),
    ...(resolved.plan.invalidation && Array.isArray(resolved.plan.invalidation.conditions) ? resolved.plan.invalidation.conditions : []),
  ];
  return {draft, plan:resolved.plan, symbol:payload.symbol, conditions};
}
function notifyTriggerEvent(draft, plan, kind){
  const messages={
    TRIGGERED:`<b>交易方案触发</b><br>${escapeAttr(plan.direction)} 的入场条件已满足。 <a href="#/execution/${escapeAttr(draft.executionId)}" style="text-decoration:underline">查看 →</a>`,
    INVALIDATED:'该交易方案已失效，未触发入场。',
    EXPIRED:'该待触发方案已过复核期，停止监控。',
  };
  toast(messages[kind]||'');
}
function refreshVisibleExecutionUi(){
  const parts=currentRoute();
  if(parts[0]==='strategy' || parts[0]==='execution') render();

/** Task 20 — same-cycle precedence: invalidation is evaluated first and wins if both would fire in
 * the same tick ("prefer safety"). Task 21 — reviewHorizon.expiresAt is a pure date comparison, run
 * even when no market fetch is needed; a natural-language-only horizon (no expiresAt) never
 * auto-expires, per Task 21's explicit instruction not to build a natural-language parser. */
async function runTriggerMonitorTick(){
  const pending=collectPendingNotifyDrafts();
  const now=new Date();
  let anyChanged=false;

  pending.forEach(draft=>{
    const resolved=resolveScenarioPlan(draft.analysisId, draft.scenarioPlanId);
    if(!resolved) return;
    const rh=resolved.plan.reviewHorizon;
    if(rh && isNonEmptyString(rh.expiresAt)){
      const exp=new Date(rh.expiresAt);
      if(!isNaN(exp.getTime()) && exp.getTime()<=now.getTime()){
        draft.triggerStatus='EXPIRED';
        draft.monitoring=draft.monitoring||{};
        draft.monitoring.expiredAt=now.toISOString();
        saveExecutionDraft(draft);
        notifyTriggerEvent(draft, resolved.plan, 'EXPIRED');
        anyChanged=true;
      }
    }
  });

  const stillPending=pending.filter(d=>d.triggerStatus==='PENDING');
  if(!stillPending.length){ if(anyChanged) refreshVisibleExecutionUi(); return; }

  const contexts=stillPending.map(pendingDraftContext).filter(Boolean);
  const symbolsForPrice=new Set(), candleKeys=new Set();
  contexts.forEach(c=>c.conditions.forEach(cond=>{
    if(cond.metric==='price') symbolsForPrice.add(c.symbol);
    else if(cond.metric==='candle_close' && TRIGGER_TIMEFRAME_MS[cond.timeframe]) candleKeys.add(c.symbol+'|'+cond.timeframe);
  }));

  const priceMap=await fetchPriceObservations([...symbolsForPrice]);
  const candleMap={};
  await Promise.all([...candleKeys].map(async key=>{
    const [symbol,timeframe]=key.split('|');
    const obs=await fetchCandleObservation(symbol,timeframe);
    if(obs) candleMap[key]=obs;
  }));

  contexts.forEach(({draft, plan, symbol})=>{
    const resolver=(condition)=>{
      if(condition.metric==='price') return {price:priceMap[symbol]||null, prevPrice:triggerMonitorPrevPrice[symbol]||null};
      if(condition.metric==='candle_close'){
        const key=symbol+'|'+condition.timeframe;
        return {candle:candleMap[key]||null, prevCandle:triggerMonitorPrevCandle[key]||null};
      }
      return {};
    };
    const invalidationResult = plan.invalidation ? evaluateTrigger(plan.invalidation, resolver) : {evaluable:false, matched:false};
    const triggerResult = evaluateTrigger(plan.triggerStructured, resolver);

    draft.monitoring=draft.monitoring||{};
    draft.monitoring.lastCheckedAt=now.toISOString();
    const observedSomething = !!priceMap[symbol] || Object.keys(candleMap).some(k=>k.indexOf(symbol+'|')===0);
    if(observedSomething) draft.monitoring.lastObservedDataAt=now.toISOString();

    if(invalidationResult.evaluable && invalidationResult.matched){
      draft.triggerStatus='INVALIDATED';
      draft.monitoring.invalidatedAt=now.toISOString();
      saveExecutionDraft(draft);
      notifyTriggerEvent(draft, plan, 'INVALIDATED');
      anyChanged=true;
    } else if(triggerResult.evaluable && triggerResult.matched){
      draft.triggerStatus='TRIGGERED';
      draft.monitoring.triggeredAt=now.toISOString();
      saveExecutionDraft(draft);
      notifyTriggerEvent(draft, plan, 'TRIGGERED');
      anyChanged=true;
    } else {
      saveExecutionDraft(draft); // still persist lastCheckedAt/lastObservedDataAt even when nothing fired this tick
    }
  });

  Object.keys(priceMap).forEach(s=>{ triggerMonitorPrevPrice[s]=priceMap[s]; });
  Object.keys(candleMap).forEach(k=>{ triggerMonitorPrevCandle[k]=candleMap[k]; });
  if(anyChanged) refreshVisibleExecutionUi();
}

/** Task 17/30 — "resume" is deliberately just "start the interval": the tick itself re-derives its
 * whole worklist from qa_execution_drafts fresh every time (collectPendingNotifyDrafts()), so there
 * is no separate persisted "which drafts was I watching" bookkeeping to restore — a reload that
 * calls this again picks up exactly the same PENDING drafts a moment later. Idempotent: calling
 * this twice (e.g. accidentally) never starts a second interval. */
function startTriggerMonitorLoop(){
  if(triggerMonitorTimer) return;
  triggerMonitorTimer=setInterval(()=>{ runTriggerMonitorTick().catch(()=>{}); }, TRIGGER_MONITOR_TICK_MS);
  runTriggerMonitorTick().catch(()=>{});
}

/** Task 35 — deterministic precedence when more than one historical draft exists for the same
 * (analysisId, scenarioPlanId): the most recently updated draft that is still status='DRAFT' (i.e.
 * not yet confirmed/cancelled) is "the current one" a fresh Strategy view should reflect; a
 * CONFIRMED/CANCELLED draft is resolved history, not the card's current state. */
function findRelevantExecutionDraft(analysisId, scenarioPlanId){
  const all=Object.values(loadExecutionDrafts()).filter(d=>d.analysisId===analysisId && d.scenarioPlanId===scenarioPlanId && d.status==='DRAFT');
  if(!all.length) return null;
  all.sort((a,b)=>new Date(b.updatedAt)-new Date(a.updatedAt));
  return all[0];
}
function scenarioMonitorBadge(draft){
  if(!draft || draft.executionMode!=='NOTIFY') return '';
  const meta={PENDING:{label:'监控中',cls:'pill-amber'}, TRIGGERED:{label:'已触发',cls:'pill-primary'}, INVALIDATED:{label:'已失效',cls:'pill-gray'}, EXPIRED:{label:'已过期',cls:'pill-gray'}}[draft.triggerStatus];
  return meta ? `<span class="pill ${meta.cls}">${meta.label}</span>` : '';
}

/* ---------- Trade List ---------- */
function computeStats(trades){
  const running=trades.filter(t=>t.status==='running').length;
  const closed=trades.filter(t=>t.status==='closed');
  const totalPnl=closed.reduce((s,t)=>s+pnlOf(t),0);
  const wins=closed.filter(t=>pnlOf(t)>0);
  const losses=closed.filter(t=>pnlOf(t)<=0);
  const winRate=closed.length? (wins.length/closed.length*100):0;
  const avgWin=wins.length? wins.reduce((s,t)=>s+pnlOf(t),0)/wins.length : 0;
  const avgLoss=losses.length? Math.abs(losses.reduce((s,t)=>s+pnlOf(t),0)/losses.length) : 0;
  const pnlRatio = avgLoss? (avgWin/avgLoss) : 0;
  return {running,closedCount:closed.length,totalPnl,winRate,pnlRatio,total:trades.length};
}
function pnlOf(t){
  if(t.mockPnl!==undefined) return t.mockPnl;
  if(t.status==='cancelled'||t.entry==null) return 0;
  const exit = t.status==='closed'? t.exitPrice : liveTPrice(t);
  const mult = t.direction==='long'? 1:-1;
  const qty = t.position / t.entry;
  return (exit-t.entry)*mult*qty;
}
function pnlPctOf(t){
  if(t.entry==null) return 0;
  const p=pnlOf(t); return p/t.position*100;
}
function liveTPrice(t){
  const a=assetOf(t.symbol);
  const rng=rngFor(t.id+'live');
  const drift=(t.direction==='long'?1:-1)*0.006*(0.5+rng());
  return t.entry*(1+drift);
}
/** Sprint 3.6B, Section 17 — "去掉模糊'计划中'": a linked StrategyOrder (if any) has a much richer,
 * user-meaningful status than the frozen RealTrade.status enum alone can express — prefer it. Falls
 * back to an honest, non-StrategyOrder label for a Trade with no linked StrategyOrder (plain manual
 * execution): `PLANNED` reads as "待提交" (awaiting submission) rather than the ambiguous "计划中"
 * that gave no hint of what's actually being waited on. RealTrade.status itself is NOT renamed —
 * frozen per Section 0 ("不要重新设计已经冻结的...RealOrder") — this only changes the display label. */
function realTradeDisplayStatus(rt){
  const so=(Store.strategyOrders||[]).find(o=>o.tradeId===rt.tradeId);
  if(so) return {label:STRATEGY_STATUS_LABEL[so.status]||so.status, cls:STRATEGY_STATUS_PILL_CLASS[so.status]||'pill-gray'};
  if(rt.status==='PLANNED') return {label:'待提交', cls:'pill-gray'};
  return {label:REAL_TRADE_STATUS_LABEL[rt.status]||rt.status, cls:'pill-gray'};
}
/** Sprint 3.4C — a dedicated row renderer for real-v1 Trades (Sprint 3.6A.2, Phase B: now the ONLY
 * row renderer Trade List uses — the legacy mock renderTradeRow()/renderTradeDetail() were retired).
 * Never calls liveTPrice()/pnlOf() — those model a fake live position, which a real-v1 Trade must
 * never claim to have. */
const TRADE_SOURCE_LABEL={MANUAL:'手动', MONITORED_AUTO:'监控策略', AUTONOMOUS:'自动分析', UNKNOWN:'未知 / 历史'};

/** Sprint 3.7, Section 59 — ONE shared projection from real truth (StrategyOrder + RealOrder +
 * RealTrade + linked Position/Protection state) to what the Trade List actually displays. Never
 * infers everything from rt.status alone (Section 59's own instruction) — a StrategyOrder that has
 * already reached COMPLETED via backend-headless reconciliation is authoritative EVEN IF the
 * browser-only RealTrade.status sync (syncPositionsFromExchange()) hasn't caught up yet (the exact
 * real contradiction this sprint's spec reported: already-完成 + 持仓中 in the same row). Never
 * fabricates PnL, current price, or exit attribution — every field here traces to a real,
 * already-confirmed fact or an honest not-yet-available state. */
function buildTradeListViewModel(rt){
  const so=(Store.strategyOrders||[]).find(o=>o.tradeId===rt.tradeId);
  const entryOrder=Object.values(loadRealOrders()).find(o=>o.tradeId===rt.tradeId && o.role==='ENTRY');
  const hasRealFill=!!(entryOrder && entryOrder.filled && entryOrder.filled.quantity>0);
  const a=assetOf(rt.symbol);

  const source = so ? (TRADE_SOURCE_LABEL[so.executionMode]||TRADE_SOURCE_LABEL.UNKNOWN)
    : ((rt.executionIds&&rt.executionIds.length) ? TRADE_SOURCE_LABEL.MANUAL : TRADE_SOURCE_LABEL.UNKNOWN);

  const strategyCompleted = so && so.status==='COMPLETED';
  const isClosed = strategyCompleted || rt.status==='CLOSED';

  const stage = so
    ? {label:STRATEGY_STATUS_LABEL[so.status]||so.status, cls:STRATEGY_STATUS_PILL_CLASS[so.status]||'pill-gray'}
    : (rt.status==='PLANNED' ? {label:'待提交', cls:'pill-gray'} : {label:REAL_TRADE_STATUS_LABEL[rt.status]||rt.status, cls:rt.status==='CLOSED'?'pill-gray':'pill-primary'});

  const entryText = hasRealFill && entryOrder.filled.averagePrice!=null
    ? (fmtPrice(entryOrder.filled.averagePrice, a.decimals)+(entryOrder.status==='PARTIALLY_FILLED'?' （部分成交）':''))
    : (entryOrder && entryOrder.exchangeOrderId ? (entryOrder.orderType==='LIMIT'&&entryOrder.limitPrice!=null?('LIMIT '+fmtPrice(entryOrder.limitPrice,a.decimals)+' · 等待成交'):'等待成交') : '尚未提交');

  const positionText = !hasRealFill ? '未建立' : (isClosed ? '已平仓' : '持仓中');

  let resultText;
  if(!hasRealFill){
    resultText = so&&so.status==='EXECUTION_BLOCKED' ? '未执行' : so&&so.status==='CANCELLED' ? '未成交' : so&&so.status==='EXPIRED' ? '已失效' : '进行中';
  } else if(isClosed){
    resultText = 'PnL 待归因';
  } else {
    resultText = '进行中';
  }

  let protectionText;
  if(so && isClosed){
    const pcs=so.execution.postCloseProtectionState;
    protectionText = pcs==='ORPHANED_PROTECTION' ? '历史已保护 · 遗留保护单'
      : pcs==='CONFIRMED_NONE' ? '历史已保护 · 当前无遗留'
      : pcs==='READ_FAILED' ? '历史已保护 · 无法核实'
      : '历史已保护 · 核实中';
  } else if(rt.protectionStatus){
    protectionText = PROTECTION_STATUS_LABEL[rt.protectionStatus]||rt.protectionStatus;
  } else {
    protectionText = '—';
  }

  return {so, entryOrder, a, source, stage, hasRealFill, entryText, positionText, resultText, protectionText, isClosed};
}

  /** Sprint 3.6B.2.1, Section 11 — this block above is entirely FRONTEND-owned (`rt.protectionStatus`,

   * never replacing or reinterpreting the block above. Present-tense "已保护" is never used for a

  const linkedClosedStrategyOrder=(Store.strategyOrders||[]).find(so=>so.tradeId===rt.tradeId && so.completionSource==='EXTERNAL_POSITION_CLOSE');
  const externalCloseProtectionSection = linkedClosedStrategyOrder ? (()=>{

    <div class="card card-pad" style="margin-bottom:16px">

            <div class="sym-ic" style="background:${a?a.color:'#888'}; width:38px;height:38px;font-size:15px">${a?a.ic:'?'}</div>
            <div style="font-size:20px;font-weight:800">${escapeAttr(rt.symbol||'—')}</div>
            <span class="pill" style="background:${rt.thesisDirection==='LONG'?'var(--green-light)':'var(--red-light)'}; color:${dirColor}">${rt.thesisDirection==='LONG'?'做多 LONG':'做空 SHORT'}</span>
            <span class="pill ${realTradeDisplayStatus(rt).cls}">${escapeAttr(realTradeDisplayStatus(rt).label)}</span>
          </div>
          <div class="dt-meta-row">
            <div class="dt-meta"><span class="k">创建时间</span><span class="v">${escapeAttr(fmtDateTime(new Date(rt.createdAt)))}</span></div>
            <div class="dt-meta"><span class="k">交易编号</span><span class="v mono">${escapeAttr(rt.tradeId)}</span></div>
          </div>
        </div>
        <div class="dt-pnl">
          <div class="k">盈亏</div>
          ${pnlValue!=null
            ? `<div class="v" style="color:${pnlValue>=0?'var(--green)':'var(--red)'}">${fmtSigned(pnlValue,2)} USDT</div>`
            : `<div class="v muted">${escapeAttr(pnlText)}</div>`}
        </div>
      </div>
    </div>

    <div class="two-col" style="margin-bottom:16px">

        ${execSection}
      </div>

      <div class="card card-pad">

        ${orderSection}
      </div>
      <div class="card card-pad">
        <div class="section-title"><span class="badge-num">4</span>&nbsp; 仓位</div>
        ${positionSection}
      </div>
    </div>

    ${entryOrder?renderRiskGuardCard(entryOrder.riskGuard, {recheckExecutionId:executionId}):''}

    ${protectionStatusSection}

    ${externalCloseProtectionSection}

    <div class="card card-pad">
      <div class="section-title"><span class="badge-num">6</span>&nbsp; 本地生命周期</div>
      <div class="timeline">
        ${timelineEvents.map((tl,i)=>`<div class="tl-item ${tl.status==='pending'?'pending':''}">
          <div class="dotwrap"><div class="dot"></div>${i<timelineEvents.length-1?'<div class="line"></div>':''}</div>
          <div style="flex:1"><span class="tl-title">${escapeAttr(tl.title)}</span><span class="tl-time">${escapeAttr(tl.time)}</span><div class="tl-desc">${escapeAttr(tl.desc)}</div></div>
        </div>`).join('')}
