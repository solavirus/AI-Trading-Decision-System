 * to the user as a nominal USDT amount ("仓位大小（USDT，用户自定义，AI 不建议此值）"), never a
 * base-asset quantity — there is no account/Risk Guard layer yet to convert one into the other.
 * Copying it into Order.quantity would be false precision, so quantity stays null (never invented)
 * until that conversion layer exists. */
function resolveOrderQuantity(userOverrides){
  return null;
}

/** Task 7/8 — idempotent creation: reuses the existing RealTrade for this executionId if one already
 * exists (double-click / reload / duplicate confirmation never creates a second Trade/Order). Only
 * ever called from confirmExecutionDraft() after resolveEntryOrderSpec().ok is already verified.
 * RealTrade stores only identifiers + lifecycle summary — never a copy of ScenarioPlan/reasoning/
 * the full ExecutionDraft (Task 17); everything else is re-resolved by ID when displayed. */
function createOrReuseRealTradeAndOrder(view, orderSpec){
  const existingTrade=getRealTradeByExecutionId(view.executionId);
  if(existingTrade){
    const existingOrder=Object.values(loadRealOrders()).find(o=>o.tradeId===existingTrade.tradeId && o.role==='ENTRY');
    return {trade:existingTrade, order:existingOrder||null};
  }
  const now=new Date().toISOString();
  const side = view.plan.direction==='LONG' ? 'BUY' : 'SELL';
  const symbol = view.payload ? view.payload.symbol : null;
  const trade={
    schemaVersion:'real-v1',
    tradeId:genTradeId(),
    analysisId:view.draft.analysisId,
    executionIds:[view.executionId],
    scenarioPlanId:view.draft.scenarioPlanId,
    symbol,
    thesisDirection:view.plan.direction,
    status:'PLANNED', // never OPENING/OPEN/'running' here — no Order has been submitted, no fill exists
    openedAt:null,
    closedAt:null,
    orderIds:[],
    positionId:null, // Position is not implemented this sprint — always null
    createdAt:now, updatedAt:now,
    // Sprint 3.5D-E, Task I — starts NOT_REQUIRED (no real fill exists yet, nothing to protect).
    // Never set to anything else here — only reconcileTradeProtection() ever transitions this field.
    protectionStatus:'NOT_REQUIRED',
  };
  const order={
    schemaVersion:'real-v1',
    orderId:genOrderId(),
    tradeId:trade.tradeId,
    executionId:view.executionId,
    analysisId:view.draft.analysisId,
    scenarioPlanId:view.draft.scenarioPlanId,
    symbol,
    side, intent:'OPEN', role:'ENTRY',
    orderType:orderSpec.orderType,
    quantity:resolveOrderQuantity(view.draft.userOverrides),
    limitPrice:orderSpec.limitPrice, stopPrice:null,
    status:'DRAFT', // never SUBMITTED — this sprint still never submits an order itself (Sprint 3.5D-A remains read-only-against-Binance too)
    filled:{quantity:0, averagePrice:null},
    createdAt:now, submittedAt:null, updatedAt:now,
    exchangeOrderId:null,
    // Sprint 3.5D-A, Task 7 — smallest sync metadata, not a history log. exchangeSnapshot (Task 6,
    // slightly beyond the letter of "sync may update only filled.quantity/averagePrice") retains the
    // rest of the last successfully-read exchange order as read-only diagnostic mirror only — never
    // authoritative, never consulted by Risk Guard/Trade-lifecycle logic (those read status/filled only).
    sync:{lastSyncedAt:null, lastSyncStatus:null, lastSyncError:null},
    exchangeSnapshot:null,
    clientOrderId:null, // set on successful submission (Sprint 3.5D-B) — Binance's own echoed clientOrderId
    pendingClientOrderId:null, // Task 27 — set BEFORE a submission POST is sent, cleared only on a definitive outcome (success or a clean/deterministic rejection); survives an ambiguous network failure so the order can be recovered by clientOrderId instead of risking a duplicate submission
    exchangeConnectionId:null, // Sprint 3.5D-C, Task 8 — set once at successful submission; the "same exchange connection" fact Position<->Trade linking checks
  };
  trade.orderIds=[order.orderId];
  saveRealTrade(trade);
  saveRealOrder(order);
  return {trade, order};
}

/* ---------- Sprint 3.5D-A: Real Order Lifecycle sync (read-only against Binance) ----------
   RealOrder(DRAFT, exchangeOrderId=null) is still never auto-submitted this sprint — this section
   only lets an order that ALREADY carries a real exchangeOrderId (set by a future submission sprint,
   or a synthetic test fixture) be synchronized against Binance's real order state. Never places,
   cancels, or amends anything; never creates a Position; never fabricates a Fill. */

/** Task 5 — one pure mapping function, Binance raw status -> local RealOrder.status. An unrecognized
 * remote status returns null (never silently guessed into FILLED/SUBMITTED/anything) so the caller
 * can reject the sync safely instead of corrupting local lifecycle (Task 19). */
const EXCHANGE_ORDER_STATUS_MAP={NEW:'SUBMITTED', PARTIALLY_FILLED:'PARTIALLY_FILLED', FILLED:'FILLED', CANCELED:'CANCELLED', REJECTED:'REJECTED', EXPIRED:'EXPIRED'};
function mapExchangeOrderStatusToLocalOrderStatus(remoteStatus){
  return EXCHANGE_ORDER_STATUS_MAP[remoteStatus] || null;
}

/** Task 11-14 — the only place synchronized Order state may move Trade.status. Only ever moves it
 * FORWARD from PLANNED/OPENING (never regresses an already-OPEN/CLOSING/CLOSED/CANCELLED Trade) —
 * this is also what makes repeated sync idempotent (Task 20): calling it again with the same remote
 * status is a no-op once the Trade has already advanced. `snap` supplies the best available real
 * exchange timestamp for openedAt (Task 13 — Binance's own `updateTime`, never a fabricated-precision
 * local "now" when a real one is available). */
function propagateEntryOrderStatusToTrade(trade, order, snap, syncTimeIso){
  const fillQty=order.filled.quantity||0;
  if(order.status==='SUBMITTED' || order.status==='PARTIALLY_FILLED'){
    if(trade.status==='PLANNED') trade.status='OPENING';
  }else if(order.status==='FILLED'){
    if(trade.status==='PLANNED' || trade.status==='OPENING'){
      trade.status='OPEN';
      if(!trade.openedAt) trade.openedAt = (snap && snap.updatedAt) || (snap && snap.createdAt) || syncTimeIso;
    }
  }else if(order.status==='CANCELLED' || order.status==='REJECTED' || order.status==='EXPIRED'){
    // Task 11 preferred MVP: zero fill -> Trade CANCELLED; any partial fill -> Trade is left alone
    // (never cancelled out from under a position that partially exists).
    if(fillQty<=0){
      if(trade.status==='PLANNED' || trade.status==='OPENING') trade.status='CANCELLED';
    }
  }
  saveRealTrade(trade);
}

/** Task 9 — read-only sync flow: load local Order -> resolve connection (Task 10, same rule as Risk
 * Guard) -> ensure exchangeOrderId exists (Task 8) -> query Binance -> normalize -> map status ->
 * update local Order -> persist -> propagate to Trade -> return. Task 18: on ANY failure, only
 * order.sync is written — order.status/filled/exchangeSnapshot are left exactly as they were. */
async function syncRealOrderFromExchange(orderId){
  const order=getRealOrderById(orderId);
  if(!order) return {ok:false, error:'本地订单不存在，无法同步'};
  if(!order.exchangeOrderId){
    // Task 8 — no exchange lookup is ever attempted for a local-only DRAFT order.
    return {ok:false, error:'尚未提交至交易所，无法同步订单状态'};
  }

  function failSync(message){
    order.sync={lastSyncedAt:new Date().toISOString(), lastSyncStatus:'ERROR', lastSyncError:message};
    saveRealOrder(order);
    return {ok:false, error:message};
  }

  // Sprint 3.6A.2 — prefers order.exchangeAccountId (works through ANY connection currently bound to
  // the same real account); falls back to Risk-Settings resolution only for a legacy order.
  const resolved=await resolveConnectionForRealOrder(order);
  if(!resolved.ok) return failSync(resolved.reason);

  let json;
  try{
    const res=await fetch(`${BACKEND_URL}/api/exchange/connections/${resolved.connectionId}/order?symbol=${encodeURIComponent(order.symbol)}&orderId=${encodeURIComponent(order.exchangeOrderId)}`);
    json=await res.json();
  }catch(e){ return failSync('网络请求失败，无法同步订单状态'); }
  if(!json.ok) return failSync((json.error&&json.error.message)||'同步订单状态失败');

  const snap=json.snapshot;
  const localStatus=mapExchangeOrderStatusToLocalOrderStatus(snap.status);
  if(!localStatus){
    // Task 19 — unrecognized remote status: safe sync error, local lifecycle left untouched.
    return failSync('unsupported_exchange_order_status: 交易所返回了未识别的订单状态 '+snap.status);
  }

  const syncTimeIso=new Date().toISOString();
  order.status=localStatus;
  order.filled={
    quantity: snap.executedQuantity!=null ? snap.executedQuantity : order.filled.quantity,
    averagePrice: snap.averagePrice!=null ? snap.averagePrice : order.filled.averagePrice,
  };
  order.exchangeSnapshot={status:snap.status, originalQuantity:snap.originalQuantity, executedQuantity:snap.executedQuantity, averagePrice:snap.averagePrice, price:snap.price, updatedAt:snap.updatedAt};
  order.sync={lastSyncedAt:syncTimeIso, lastSyncStatus:'SUCCESS', lastSyncError:null};
  saveRealOrder(order);

  const trade=getRealTradeById(order.tradeId);
  if(trade && order.role==='ENTRY') propagateEntryOrderStatusToTrade(trade, order, snap, syncTimeIso);

  // Sprint 3.5D-E, Task F.4 — "the user does not need a second click": a real fill discovered by the
  // user's own manual "同步订单状态"/"同步交易状态" action continues straight into the Protection
  // workflow, as part of that SAME user-initiated sync — this is not automatic background polling.
  if(trade && order.role==='ENTRY' && order.filled.quantity>0){
    await reconcileTradeProtection(trade.tradeId);
  }

  return {ok:true, order, trade};
}

/* ---------- Sprint 3.5D-B: Binance TESTNET Manual Order Submission ----------
   The ONE real write capability this app has: POST /fapi/v1/order, TESTNET only, one explicit user
   click, only for a RealOrder(DRAFT, exchangeOrderId=null). No LIVE, no AUTO, no cancel/amend/
   leverage/margin-mode, no stop-loss/take-profit submission. See EXECUTION_SPEC.md's "Real Order
   Submission" section for the full boundary. */

/** Shared by a successful direct submission AND a successful ambiguous-submission recovery (Task
 * 20/22) — one place persists exchangeOrderId/clientOrderId/status/fill/lifecycle-propagation, so
 * the two paths can never drift apart. An order that reached Binance is AT MINIMUM 'SUBMITTED' even
 * if `snapshot.status` is some future/unrecognized string (Task 19 still applies — never guess
 * FILLED/CANCELLED etc. — but "the exchange accepted it" is a floor we already know is true). */
function applyOrderSubmissionSuccess(order, trade, snapshot, connectionId, connections){
  const nowIso=new Date().toISOString();
  const localStatus=mapExchangeOrderStatusToLocalOrderStatus(snapshot.status);
  order.exchangeOrderId=snapshot.exchangeOrderId;
  order.clientOrderId=snapshot.clientOrderId;
  order.pendingClientOrderId=null;
  // Sprint 3.5D-C, Task 8 — persisted once, at the moment we know for certain which connection this
  // order actually reached, so later Position<->Trade linking has a real "same exchange connection"
  // fact to check against instead of re-resolving RiskSettings (which could drift after submission).
  if(connectionId && !order.exchangeConnectionId) order.exchangeConnectionId=connectionId;
  // Sprint 3.6A.2 — same one-time-freeze discipline, but for account OWNERSHIP rather than execution
  // channel: this is what lets a later sync/protection/cancel flow keep working through a DIFFERENT
  // connection bound to the same real account, even after THIS connection is gone.
  if(!order.exchangeAccountId){
    const conn=(connections||[]).find(c=>c.id===connectionId);
    if(conn && conn.exchangeAccountId) order.exchangeAccountId=conn.exchangeAccountId;
  }
  order.status = localStatus || 'SUBMITTED';
  order.filled={
    quantity: snapshot.executedQuantity!=null ? snapshot.executedQuantity : order.filled.quantity,
    averagePrice: snapshot.averagePrice!=null ? snapshot.averagePrice : order.filled.averagePrice,
  };
  order.exchangeSnapshot={status:snapshot.status, originalQuantity:snapshot.originalQuantity, executedQuantity:snapshot.executedQuantity, averagePrice:snapshot.averagePrice, price:snapshot.price, updatedAt:snapshot.updatedAt};
  if(!order.submittedAt) order.submittedAt=nowIso;
  order.sync={lastSyncedAt:nowIso, lastSyncStatus:'SUCCESS', lastSyncError: localStatus?null:('unsupported_exchange_order_status_on_submit: 已提交，交易所返回未识别状态 '+snapshot.status+'，已按"已提交"处理，请手动同步确认最新状态')};
  saveRealOrder(order);
  if(trade && order.role==='ENTRY'){
    propagateEntryOrderStatusToTrade(trade, order, snapshot, nowIso);
    // Sprint 3.5D-E, Task F.3 — a LIMIT entry that reached the exchange but has NOT filled yet must
    // not attempt Protection (Task F rule 2: "no SL/TP based on full position quantity while
    // NEW/SUBMITTED"). Marks the trade as explicitly awaiting a real fill — the async
    // reconcileTradeProtection() call (Task E/F.4) is only ever triggered by a caller once
    // order.filled.quantity>0 is confirmed, never from inside this synchronous function.
    if(order.filled.quantity<=0){
      const freshTrade=getRealTradeById(trade.tradeId)||trade;
      freshTrade.protectionStatus='PENDING_ENTRY_FILL';
      saveRealTrade(freshTrade);
    }
  }
  return order;
}

/** Task 5-8/31 — every gate that must pass before the submit button is even shown, re-verified again
 * (Task 26 defense-in-depth) at the top of submitRealOrderToTestnet() itself, never trusted from a
 * stale render. Returns {ok:false,reason} instead of a boolean so the UI can show WHY. */
function checkOrderSubmissionEligibility(order, trade, draft){
  if(!order) return {ok:false, reason:'本地订单不存在'};
  if(order.pendingClientOrderId) return {ok:false, reason:'存在结果未知的提交，请先查询交易所订单状态', requiresRecovery:true};
  if(order.exchangeOrderId || order.status!=='DRAFT') return {ok:false, reason:'该订单状态不允许提交（可能已提交或已关闭），以避免重复下单'};
  if(order.role!=='ENTRY' || order.intent!=='OPEN') return {ok:false, reason:'本版本仅支持提交入场（ENTRY/OPEN）订单'};
  if(order.orderType!=='MARKET' && order.orderType!=='LIMIT') return {ok:false, reason:'本版本仅支持 MARKET 或 LIMIT 订单类型'};
  if(!trade || trade.status!=='PLANNED') return {ok:false, reason:'关联的本地交易计划状态不是 PLANNED，无法提交'};
  if(!draft || draft.status!=='CONFIRMED') return {ok:false, reason:'关联的执行意图尚未确认，无法提交'};
  // Sprint 3.5D-B.1, Task 27 — scenario execution readiness required IN ADDITION to the checks
  // above, reusing the exact same helper Strategy/Execution already gate on (Task 20 — never a
  // second, diverging implementation). This is the LAST layer before a real write: even if a user
  // somehow reached this point with a plan that was never numerically ready, submission still stops.
  const view=resolveExecutionView(order.executionId);
  if(!view.ok) return {ok:false, reason:'无法解析执行草稿，无法提交'};
  const readiness=evaluateScenarioExecutionReadiness(view.plan, view.decision, new Date());
  if(!readiness.ready) return {ok:false, reason:'该方案不满足执行就绪要求：'+readiness.reasons.join('；')};
  // Sprint 3.5D-E, Task W — the full-trade-plan final gate, additive to the readiness check above
  // (which already requires numeric stopLoss/takeProfit values but knows nothing about portions).
  // Risk Guard PASS still does not mean automatic submission — this only ensures the plan itself is
  // numerically complete enough to drive real Stop Loss + Take Profit protection once the entry
  // fills; the mandatory confirmation modal (Task T) is the actual human final decision.
  const effective=effectiveExecutionPlan(view.plan, view.draft.userOverrides);
  const portionCheck=validateTakeProfitPortions(effective.takeProfit);
  if(!portionCheck.ok) return {ok:false, reason:'止盈比例不满足要求：'+portionCheck.reason};
  return {ok:true};
}

/** Task 9 — the real write flow: eligibility -> FRESH Risk Guard recheck (never a stale persisted
 * PASS, Task 4) -> resolve the SAME TESTNET-only connection Risk Guard used -> mark pendingClientOrderId
 * BEFORE the network call (Task 27, survives an ambiguous outcome) -> POST -> apply result. */
async function submitRealOrderToTestnet(orderId){
  const order=getRealOrderById(orderId);
  if(!order) return {ok:false, error:'本地订单不存在'};
  const trade=getRealTradeById(order.tradeId);
  const draft=getExecutionDraft(order.executionId);
  const eligibility=checkOrderSubmissionEligibility(order, trade, draft);
  if(!eligibility.ok) return {ok:false, error:eligibility.reason, requiresRecovery:eligibility.requiresRecovery};

  // Task 4 — a persisted riskGuard.status is never trusted here; only a FRESH recheck's result counts.
  const freshRisk=await runRiskGuardForOrder(order.executionId);
  if(!freshRisk || freshRisk.status!=='PASS') return {ok:false, error:'风险检查未通过，已阻止提交', riskGuard:freshRisk, riskBlocked:true};

  let connections;
  try{
    const res=await fetch(`${BACKEND_URL}/api/exchange/connections`);
    const json=await res.json();
    if(!json.ok) return {ok:false, error:'无法读取交易所连接列表'};
    connections=json.connections;
  }catch(e){ return {ok:false, error:'无法读取交易所连接列表'}; }

  const riskSettings=loadRiskSettings();
  const resolved=resolveRiskExchangeConnectionId(riskSettings, connections);
  if(!resolved.ok) return {ok:false, error:resolved.reason};
  const connection=connections.find(c=>c.id===resolved.connectionId);
  // Task 2/31 — frontend-side defense in depth on top of the backend's own hard TESTNET guard; never
  // an override, never a developer bypass.
  if(!connection || connection.environment!=='TESTNET') return {ok:false, error:'当前选定的交易所连接不是 TESTNET 环境，本版本不支持提交'};

  const resolvedView=resolveExecutionView(order.executionId);
  if(!resolvedView.ok) return {ok:false, error:'无法解析执行草稿，无法提交'};
  const effective=effectiveExecutionPlan(resolvedView.plan, resolvedView.draft.userOverrides);
  if(!isFiniteNumber(effective.positionSize) || effective.positionSize<=0) return {ok:false, error:'仓位大小（USDT）未填写或无效，无法提交'};
  if(!isFiniteNumber(effective.leverage) || effective.leverage<=0) return {ok:false, error:'杠杆倍数未填写或无效，无法提交'};

  // Task 27 — persisted BEFORE the network call. If the process/tab dies mid-request, this survives
  // and blocks a naive resubmission on the next load (checkOrderSubmissionEligibility above).
  order.pendingClientOrderId=order.orderId;
  saveRealOrder(order);

  let json;
  try{
    const res=await fetch(`${BACKEND_URL}/api/exchange/connections/${resolved.connectionId}/orders`, {
      method:'POST', headers:{'Content-Type':'application/json'},
      body:JSON.stringify({symbol:order.symbol, side:order.side, orderType:order.orderType, limitPrice:order.limitPrice, positionSizeUsdt:effective.positionSize, leverage:effective.leverage, localOrderId:order.orderId}),
    });
    json=await res.json();
  }catch(e){
    // Task 27 — a network failure on the SUBMIT call is inherently ambiguous; never assume rejection.
    order.sync={lastSyncedAt:new Date().toISOString(), lastSyncStatus:'ERROR', lastSyncError:'网络请求失败，提交结果未知'};
    saveRealOrder(order);
    return {ok:false, error:'订单提交结果未知，请先同步/查询交易所订单，避免重复下单。', ambiguous:true};
  }

  if(!json.ok){
    const errMsg=(json.error&&json.error.message)||'提交失败';
    if(json.ambiguous){
      order.sync={lastSyncedAt:new Date().toISOString(), lastSyncStatus:'ERROR', lastSyncError:errMsg};
      saveRealOrder(order); // pendingClientOrderId intentionally left set
      return {ok:false, error:errMsg, ambiguous:true};
    }
    // Task 27 — a deterministic rejection (bad params, risk/margin/filter failure, clean -1021, etc.)
    // means Binance definitely did not create an order — safe to clear the pending marker.
    order.pendingClientOrderId=null;
    order.sync={lastSyncedAt:new Date().toISOString(), lastSyncStatus:'ERROR', lastSyncError:errMsg};
    saveRealOrder(order);
    // Sprint 3.6A — leverage_mismatch now carries real current/required leverage so the UI can offer
    // the explicit leverage-sync recovery flow instead of a dead-end error (still never auto-retried).
    return {ok:false, error:errMsg, leverageMismatch:json.leverageMismatch||null, connectionId:resolved.connectionId};
  }

  const updatedOrder=applyOrderSubmissionSuccess(order, trade, json.snapshot, resolved.connectionId, connections);
  // Sprint 3.5D-E, Task E — MARKET orders (and, rarely, a LIMIT order that fills immediately on
  // TESTNET) can be FILLED the instant this call returns. Entry MUST already be a confirmed real
  // success before Protection is ever attempted (Task E's absolute rule) — reached exactly here.
  if(updatedOrder.role==='ENTRY' && updatedOrder.filled.quantity>0){
    await reconcileTradeProtection(updatedOrder.tradeId);
  }
  return {ok:true, order:getRealOrderById(updatedOrder.orderId), trade:getRealTradeById(order.tradeId)};
}

/** Task 27 recovery path — for an order stuck with `pendingClientOrderId` set (an earlier submission
 * whose network outcome was never confirmed). Queries Binance by the locally-known clientOrderId
 * (never by a fresh/arbitrary id). A genuine order_not_found means the submission never actually
 * reached Binance — safe to clear the pending marker and allow a normal resubmission. */
async function recoverAmbiguousSubmission(orderId){
  const order=getRealOrderById(orderId);
  if(!order || !order.pendingClientOrderId) return {ok:false, error:'没有待确认结果的提交'};
  const trade=getRealTradeById(order.tradeId);

  let connections;
  try{
    const res=await fetch(`${BACKEND_URL}/api/exchange/connections`);
    const json=await res.json();
    if(!json.ok) return {ok:false, error:'无法读取交易所连接列表'};
    connections=json.connections;
  }catch(e){ return {ok:false, error:'无法读取交易所连接列表'}; }
  const riskSettings=loadRiskSettings();
  const resolved=resolveRiskExchangeConnectionId(riskSettings, connections);
  if(!resolved.ok) return {ok:false, error:resolved.reason};

  let json;
  try{
    const res=await fetch(`${BACKEND_URL}/api/exchange/connections/${resolved.connectionId}/order?symbol=${encodeURIComponent(order.symbol)}&origClientOrderId=${encodeURIComponent(order.pendingClientOrderId)}`);
    json=await res.json();
  }catch(e){ return {ok:false, error:'网络请求失败，仍无法确认提交结果'}; }

  if(json.ok){
    const updatedOrder=applyOrderSubmissionSuccess(order, trade, json.snapshot, resolved.connectionId, connections);
    if(updatedOrder.role==='ENTRY' && updatedOrder.filled.quantity>0){
      await reconcileTradeProtection(updatedOrder.tradeId);
    }
    return {ok:true, order:getRealOrderById(updatedOrder.orderId), trade:getRealTradeById(order.tradeId), found:true};
  }
  if(json.error && json.error.code==='order_not_found'){
    order.pendingClientOrderId=null;
    order.sync={lastSyncedAt:new Date().toISOString(), lastSyncStatus:'ERROR', lastSyncError:'先前的提交未在交易所找到对应订单，已清除待确认状态，可重新提交'};
    saveRealOrder(order);
    return {ok:true, order, cleared:true};
  }
  return {ok:false, error:(json.error&&json.error.message)||'仍无法确认提交结果，请稍后重试'};
}

/* ---------- Sprint 3.6B: Strategy Order — Arm (Monitored Auto) modal ----------
   Section 11 — Armed Auto Authorization. Two steps: (1) an editable form for executionIntent/
   executionGuard/expiresAt, pre-filled from the AI's own ScenarioPlan but never silently reusing an
   AI-suggested position size (Core Truth Rule: AI never dictates size/leverage); (2) a full-disclosure
   confirmation screen the user must explicitly approve before any StrategyOrder is ever authorized. ---- */
function openArmStrategyModal(analysisId, planId){
  const resolved=resolveScenarioPlan(analysisId, planId);
  if(!resolved){ toast('无法解析该方案'); return; }
  const plan=resolved.plan;
  const payload=getAnalysisPayload(analysisId);
  const symbol=payload?payload.symbol:null;
  if(!symbol){ toast('无法确定交易对（Analysis Payload 缺失）'); return; }
  const trigger=mapScenarioTriggerToStrategyTrigger(plan.triggerStructured);
  if(!trigger){ toast('该方案的触发条件暂不支持自动监控（仅支持 价格/K线收盘价 + 大于/大于等于/小于/小于等于）'); return; }
  const entryType=plan.entry.type==='MARKET'?'MARKET':'LIMIT';
  const entryPrice=entryType==='LIMIT'&&isFiniteNumber(plan.entry.value)?plan.entry.value:null;
  const stopLoss=plan.stopLoss&&isFiniteNumber(plan.stopLoss.value)?plan.stopLoss.value:null;
  const tpSrc=(plan.takeProfit||[]).filter(tp=>isFiniteNumber(tp.value));
  const takeProfit=tpSrc.map((tp,i)=>({price:tp.value, portion: i===tpSrc.length-1 ? (100-Math.floor(100/tpSrc.length)*(tpSrc.length-1)) : Math.floor(100/tpSrc.length)}));
  const connections=(Store.exchangeConnections||[]).filter(c=>c.environment==='TESTNET'&&c.enabled);
  if(!connections.length){ toast('没有已启用的 TESTNET 交易所连接，无法加入监控待执行'); return; }
  /** Sprint 3.8C.2, Section 18 — never default to "the first TESTNET account by array order": that
   * silently bound new StrategyOrders to whichever account happened to be created first, including
   * long-broken orphaned ones. Only accounts the backend reports `usable:true` (existing, preferred
   * connection resolves, enabled, TESTNET) are eligible at all. 0 usable -> block before even opening
   * the modal; exactly 1 -> safe to auto-default; 2+ -> leave unselected, force an explicit choice. */
  const usableAccounts=(Store.exchangeAccounts||[]).filter(a=>a.environment==='TESTNET'&&a.usable);
  if(!usableAccounts.length){ toast('当前没有可执行的交易账户，请先检查交易连接。'); return; }
  Store.armDraft={
    analysisId, planId, symbol, direction:plan.direction, trigger,
    executionGuard:{maxPriceDeviationPct:1},
    executionIntent:{entryType, entryPrice, positionSizeUsdt:null, leverage:null, stopLoss, takeProfit},
    expiresAt:(plan.reviewHorizon&&plan.reviewHorizon.expiresAt)?plan.reviewHorizon.expiresAt:null,
    exchangeAccountId:usableAccounts.length===1?usableAccounts[0].id:null,
  };
  openModal(renderArmStrategyFormStep());
}
function describeTriggerForDisplay(trigger){
  const opLabel={GT:'>',GTE:'≥',LT:'<',LTE:'≤'};
  const parts=trigger.conditions.map(c=>`${c.metric==='PRICE'?'价格':('K线收盘价 '+escapeAttr(c.timeframe))} ${opLabel[c.operator]} ${c.value}`);
  return trigger.logic==='SINGLE'?parts[0]:parts.join(trigger.logic==='AND'?' 且 ':' 或 ');
}

/* ---------- Sprint 3.6A: Leverage Sync (TESTNET-only, the app's FIFTH real write) ----------

   3.5D-B: the entry submission itself STILL never calls set-leverage on its own). Leverage only ever

   "调整为 Nx 并继续" — never silently, never as a side effect of any other action. */

/** Shows current vs. required leverage before ever calling the real write. Extra-strong warning when
 * a real OPEN Position already exists for this symbol (leverage changes affect its margin math). */
function openLeverageSyncConfirmationModal(orderId, mismatch, connectionId){
  // Sprint 3.6A.2.1 — Hotfix: leverage is set per (account, symbol) on Binance, not per API key/
  // connection, so whether a real Position already exists for this symbol must be judged against the
  // ACCOUNT the write is about to affect, never against just the one connection currently submitting
  // it — otherwise a Position last synced through a different connection on the SAME account could be
  // silently missed and this extra-strong warning would fail to show when it should. Same
  // account-first-with-legacy-fallback pattern as linkPositionToTrade()/reconcilePositionAllocations().
  const exchangeAccountId=(exchangeConnectionById(connectionId)||{}).exchangeAccountId||null;
  const existingPosition=Object.values(loadRealPositions()).find(p=>{
    if(p.status!=='OPEN' || p.symbol!==mismatch.symbol) return false;
    if(exchangeAccountId && p.exchangeAccountId) return p.exchangeAccountId===exchangeAccountId;
    return p.exchangeConnectionId===connectionId;
  });
  openModal(`<div class="modal-head"><h3>调整杠杆</h3><button class="close-x" onclick="closeModal()">✕</button></div>
    <p class="muted" style="font-size:13px">当前执行计划要求的杠杆与交易所（TESTNET）当前设置不一致。本版本从不自动修改交易所杠杆——需要你明确确认后才会调整。</p>
    <div class="kv-list" style="margin-top:10px">
      <div class="row"><span class="k">环境</span><span class="v"><span class="pill pill-gray">TESTNET</span></span></div>
      <div class="row"><span class="k">交易对</span><span class="v mono">${escapeAttr(mismatch.symbol)}</span></div>
      <div class="row"><span class="k">交易所当前杠杆</span><span class="v mono">${mismatch.current}x</span></div>
      <div class="row"><span class="k">执行计划要求杠杆</span><span class="v mono">${mismatch.required}x</span></div>
    </div>
    ${existingPosition?`<div class="empty-hint" style="border:1px solid var(--red); color:var(--red); padding:8px 10px; margin-top:10px; text-align:left; font-size:12.5px">${iconStatusError()} 警告：该交易对当前已存在真实持仓（数量 ${fmt(existingPosition.quantity,6)}）。调整杠杆会影响该持仓的保证金与强平价格计算，请谨慎确认。</div>`:''}
    <div style="display:flex; gap:10px; margin-top:16px">
      <button class="btn btn-block" onclick="closeModal()">取消</button>
      <button class="btn btn-primary btn-block" data-action="confirm-leverage-sync" data-order-id="${escapeAttr(orderId)}" data-connection-id="${escapeAttr(connectionId)}" data-symbol="${escapeAttr(mismatch.symbol)}" data-required="${mismatch.required}">调整为 ${mismatch.required}x 并继续</button>
    </div>`);
}

/** The ONE call site of changeLeverageOnBinanceTestnet's real write — only ever reached from the
 * modal above, never automatically. After a successful change, resubmission itself performs the
 * read-back verification: resolveAndSubmitEntryOrder's own leverage-match gate (Task 13, adapter)
 * re-reads REAL leverage via positionRisk before ever writing an order, and submitRealOrderToTestnet
 * reruns Risk Guard fresh regardless — reusing that existing, already-correct logic rather than a
 * second, potentially-diverging verification step. If the change genuinely didn't take effect,
 * resubmission fails again with a fresh leverage_mismatch (never silently retried beyond this one
 * explicit click; a repeat mismatch reopens this same modal with updated real numbers). */
async function confirmLeverageSyncAndResubmit(orderId, connectionId, symbol, requiredLeverage){
  toast('正在调整杠杆…');
  let json;
  try{
    const res=await fetch(`${BACKEND_URL}/api/exchange/connections/${connectionId}/leverage`, {
      method:'POST', headers:{'Content-Type':'application/json'},
      body:JSON.stringify({symbol, leverage:requiredLeverage}),
    });
    json=await res.json();
  }catch(e){ return {ok:false, error:'杠杆调整结果未知，请重新查询账户确认当前杠杆后再继续，不要重复提交。', ambiguous:true}; }
  if(!json.ok) return {ok:false, error:(json.error&&json.error.message)||'调整杠杆失败', ambiguous:json.ambiguous===true};

  toast('杠杆已调整，正在重新核实并提交…');
  return submitRealOrderToTestnet(orderId);
}

/** Task 30/31 — the first real write operation in this app requires an explicit final confirmation
 * modal, never a one-click submit. Resolves the TESTNET connection check BEFORE ever showing the
 * modal (if it would resolve to LIVE or fail entirely, the user never even sees a submit dialog —
 * satisfies "do not show an active submission button" in spirit for the async case a static render
 * can't check synchronously). The fresh Risk Guard recheck itself still happens inside
 * submitRealOrderToTestnet() right before the POST (Task 4) — this modal is confirmation UI only. */
async function openSubmitOrderConfirmationModal(orderId){
  const order=getRealOrderById(orderId);
  const trade=order?getRealTradeById(order.tradeId):null;
  const draft=order?getExecutionDraft(order.executionId):null;
  const eligibility=checkOrderSubmissionEligibility(order, trade, draft);
  if(!eligibility.ok){ toast(eligibility.reason); return; }

  let connections;
  try{
    const res=await fetch(`${BACKEND_URL}/api/exchange/connections`);
    const json=await res.json();
    if(!json.ok) throw new Error('bad response');
    connections=json.connections;
  }catch(e){ toast('无法读取交易所连接列表'); return; }
  const riskSettings=loadRiskSettings();
  const resolved=resolveRiskExchangeConnectionId(riskSettings, connections);
  if(!resolved.ok){ toast(resolved.reason); return; }
  const connection=connections.find(c=>c.id===resolved.connectionId);
  if(!connection || connection.environment!=='TESTNET'){ toast('当前选定的交易所连接不是 TESTNET 环境，本版本不支持提交'); return; }

  const resolvedView=resolveExecutionView(order.executionId);
  const effective = resolvedView.ok ? effectiveExecutionPlan(resolvedView.plan, resolvedView.draft.userOverrides) : null;
  const a=assetOf(order.symbol); const decimals=a?a.decimals:2;
  const sideLabel = order.side==='BUY' ? '做多方向 / BUY' : '做空方向 / SELL';

  // Sprint 3.5D-E, Task T — the confirmation modal now shows the FULL trade plan (entry + stop loss +
  // every take-profit target with its portion), not entry alone — this is the one human final
  // decision point before Entry -> Real Fill -> Stop Loss -> Take Profit ever begins.
  const slLine = effective ? `<div class="row"><span class="k">止损</span><span class="v mono">${effective.stopLoss.value!=null?fmtPrice(effective.stopLoss.value,decimals):'—'}</span></div>` : '';
  const tpLines = effective ? effective.takeProfit.map((tp,i)=>`<div class="row"><span class="k">止盈 ${i+1}</span><span class="v mono">${tp.value!=null?fmtPrice(tp.value,decimals):'—'} ${tp.portion!=null?`· ${tp.portion}%`:''}</span></div>`).join('') : '';

  openModal(`<div class="modal-head"><h3>提交完整交易计划到 TESTNET</h3><button class="close-x" onclick="closeModal()">✕</button></div>
    <p class="muted" style="font-size:13px">你即将向 Binance TESTNET 提交真实测试网订单，成交后将自动继续建立真实止损/止盈保护。</p>
    <div class="kv-list" style="margin-top:10px">
      <div class="row"><span class="k">交易对</span><span class="v mono">${escapeAttr(order.symbol||'—')}</span></div>
      <div class="row"><span class="k">方向</span><span class="v">${escapeAttr(sideLabel)}</span></div>
      <div class="row"><span class="k">入场</span><span class="v">${escapeAttr(order.orderType)}${order.orderType==='LIMIT'?' '+fmtPrice(order.limitPrice,decimals):''}</span></div>
      ${slLine}
      ${tpLines}
      <div class="row"><span class="k">仓位名义金额</span><span class="v mono">${effective&&effective.positionSize!=null?fmt(effective.positionSize,0)+' USDT':'—'}</span></div>
      <div class="row"><span class="k">杠杆</span><span class="v mono">${effective&&effective.leverage!=null?effective.leverage+'x':'—'}</span></div>
      <div class="row"><span class="k">下单数量</span><span class="v">将由服务器按最新交易所规则计算（步长/最小数量/最小名义金额）</span></div>
      <div class="row"><span class="k">环境</span><span class="v"><span class="pill pill-gray">TESTNET</span>&nbsp;不会影响真实资金</span></div>
    </div>
    <div class="small-note" style="margin-top:10px; color:var(--text-2)">止损/止盈保护单只会在入场真实成交、且已知真实成交/持仓数量后才会提交——从不基于计划仓位大小。提交前会重新执行一次风险检查，若未通过将阻止提交。</div>
    <div style="display:flex; gap:10px; margin-top:16px">
      <button class="btn btn-block" onclick="closeModal()">取消</button>
      <button class="btn btn-primary btn-block" data-action="confirm-submit-real-order" data-order-id="${escapeAttr(order.orderId)}">确认提交完整交易计划到 TESTNET</button>
    </div>`);
}

/* ---------- Sprint 3.5D-C: Position Sync + Real Fill Lifecycle ----------
   Truth boundary (Task 1, frozen): EXCHANGE TRUTH WINS. A local RealPosition may only ever be
   created/updated from real, non-zero exchange position data (`GET /fapi/v2/positionRisk` via the
   existing `/api/exchange/connections/:id/account` route — Task 23, no new backend endpoint) — never
   from an AI recommendation, a ScenarioPlan, an ExecutionDraft confirmation, or a local Order's
   status alone (DRAFT or SUBMITTED). `qa_positions` is a local MIRROR/cache/history, never a second
   source of truth — every sync overwrites its mutable fields from the fresh exchange read. */

function genPositionId(){ return 'PO'+Date.now().toString(36).toUpperCase()+Math.random().toString(36).slice(2,6).toUpperCase(); }
/** Sprint 3.6A.1 — see the "Position Lifecycle" comment block near reconcilePositionAllocations()
 * below for the full rationale. A fresh id every time a Position transitions from absent/CLOSED into
 * OPEN — never reused while continuously OPEN. */
function genPositionLifecycleId(){ return 'PL'+Date.now().toString(36).toUpperCase()+Math.random().toString(36).slice(2,6).toUpperCase(); }

/** Task 22 — smallest persistence helpers, same pattern as loadRealOrders()/loadRealTrades(). */
function loadRealPositions(){
  try{ const raw=localStorage.getItem('qa_positions'); if(raw) return JSON.parse(raw); }catch(e){}
  return {};
}
function saveRealPositionMap(map){ localStorage.setItem('qa_positions', JSON.stringify(map)); }
function saveRealPosition(pos){ pos.lastSyncedAt=new Date().toISOString(); const map=loadRealPositions(); map[pos.positionId]=pos; saveRealPositionMap(map); return pos; }
function getRealPositionById(id){ return loadRealPositions()[id]||null; }
/** Task 4 — identity key is (connectionId, symbol, positionSide). `positionSide` is Binance's own
 * raw hedge-mode label ('BOTH' in one-way mode, 'LONG'/'SHORT' in hedge mode) — already present on
 * every ExchangePositionSnapshot (binanceFuturesAdapter.ts's normalizePositionRisk()), so this key is
 * hedge-mode-safe by construction without any separate "is this account in hedge mode" call: one-way
 * mode naturally collapses to one net Position per symbol (always 'BOTH'); hedge mode naturally keeps
 * LONG/SHORT as two distinct Positions (two different keys) — verified against the current adapter
 * output shape, not assumed. */
function findPositionByExchangeIdentity(connectionId, symbol, positionSide){
  return Object.values(loadRealPositions()).find(p=>p.exchangeConnectionId===connectionId && p.symbol===symbol && p.positionSide===(positionSide||'BOTH')) || null;
}
/** Sprint 3.6A.2 — the identity `syncPositionsFromExchange()` actually creates/dedups on, upgraded
 * from `(connectionId, symbol, positionSide)` to `(exchangeAccountId, symbol, positionSide)` per the
 * Phase 1 investigation report's Model B recommendation: ownership belongs to the account, not to
 * whichever connection happened to last observe it. `findPositionByExchangeIdentity()` above is left
 * completely unchanged as a raw building block (still connectionId-scoped, still used as the legacy
 * fallback inside `findLocalPositionForAccount()` below for pre-3.6A.2 data that has no
 * `exchangeAccountId` yet) — but as of Sprint 3.6A.2.1 no rendering call site calls it directly
 * anymore; they all go through `findLocalPositionForAccount()` so account scope wins whenever it's
 * resolvable. */
function findPositionByExchangeAccountIdentity(exchangeAccountId, symbol, positionSide){
  return Object.values(loadRealPositions()).find(p=>p.exchangeAccountId===exchangeAccountId && p.symbol===symbol && p.positionSide===(positionSide||'BOTH')) || null;
}
/** Sprint 3.6A.2.1 — Hotfix: the one function every rendering/warning call site should use to find a
 * local RealPosition mirror. Prefers `exchangeAccountId` (ownership truth) when given one; falls back
 * to the legacy connectionId-only lookup only when no account id is available at all (e.g. a
 * connection whose bootstrap hasn't resolved yet, or a genuinely legacy position with no
 * `exchangeAccountId`). This is what lets a Position rendered/looked-up while viewing Connection B
 * still resolve correctly even though it was created/last-linked while viewing Connection A, as long
 * as both connections belong to the same real ExchangeAccount. */
function findLocalPositionForAccount(exchangeAccountId, connectionId, symbol, positionSide){
  if(exchangeAccountId){
    const byAccount=findPositionByExchangeAccountIdentity(exchangeAccountId, symbol, positionSide);
    if(byAccount) return byAccount;
  }
  return connectionId ? findPositionByExchangeIdentity(connectionId, symbol, positionSide) : null;
}

/** Task 8/9/24 — the ONLY place a Position gets linked to a Trade. Never guesses: exactly one
 * candidate Trade must satisfy the full defensible chain, or the Position stays unlinked
 * (`sourceTradeIds: []`, the correct default for a pre-existing exchange position this app never
 * created — Task 9). Idempotent (Task 29's "reopen behavior deterministic"): a Position that already
 * has a sourceTradeIds entry is never re-evaluated, so a later ambiguous state can't silently steal
 * or duplicate an existing link. `order.exchangeConnectionId` may be absent on an order submitted
 * before this field existed (Sprint 3.5D-C) — treated as "connection unknown" rather than a hard
 * mismatch, but uniqueness (exactly one candidate) is still always enforced regardless, so this
 * backward-compatibility allowance never by itself creates ambiguity across multiple connections. */
/** Known, disclosed, NOT fixed by Sprint 3.6A.1 (out of scope — that hotfix only covers
 * PositionAllocation): this function's own guard below (`if sourceTradeIds.length return`) means a
 * Position that was linked to a Trade, then fully closed, then reopened under the SAME positionId
 * (see syncPositionsFromExchange's revival branch) keeps pointing "查看交易详情" at the OLD Trade —
 * `sourceTradeIds` is never reset on a lifecycle transition the way PositionAllocation now is. This
 * is a real, structurally-identical sibling issue, reported to the user rather than silently fixed
 * here, since it was outside this hotfix's explicitly stated scope. */
function linkPositionToTrade(position, connectionId){
  if(position.sourceTradeIds && position.sourceTradeIds.length) return;
  const candidates=Object.values(loadRealTrades()).filter(t=>{
    if(toBinanceSymbol(t.symbol)!==position.symbol) return false;
    if(t.thesisDirection!==position.side) return false;
    const order=Object.values(loadRealOrders()).find(o=>o.tradeId===t.tradeId && o.role==='ENTRY');
    if(!order || !order.exchangeOrderId) return false;
    // Sprint 3.6A.2 — prefer exchangeAccountId (ownership truth: same account, any bound connection)
    // when both sides have it; fall back to the original connectionId-exact-match rule only for
    // legacy data predating that field, so old behavior is unchanged for old records.
    if(order.exchangeAccountId && position.exchangeAccountId){
      if(order.exchangeAccountId!==position.exchangeAccountId) return false;
    } else if(order.exchangeConnectionId && order.exchangeConnectionId!==connectionId){
      return false;
    }
    if(!(order.filled && order.filled.quantity>0)) return false;
    return true;
  });
  if(candidates.length===1){
    position.sourceTradeIds=[candidates[0].tradeId];
    saveRealPosition(position);
    if(candidates[0].positionId!==position.positionId){
      candidates[0].positionId=position.positionId;
      saveRealTrade(candidates[0]);
    }
  }
  // 0 candidates (pre-existing exchange position) or >1 (ambiguous) -> stays unlinked, never guessed.
}

/** Task 24 — UI-only helper (no side effects, never writes): "does a real OPEN exchange position
 * exist that matches this Trade's symbol/direction but isn't (yet, or ever, due to ambiguity) linked
 * to it" — lets Trade Detail show an honest "检测到真实持仓，但无法唯一关联" state instead of silence. */
function findUnlinkedMatchingPosition(trade){
  return Object.values(loadRealPositions()).find(p=>
    p.status==='OPEN' && p.symbol===toBinanceSymbol(trade.symbol) && p.side===trade.thesisDirection &&
    !(p.sourceTradeIds||[]).includes(trade.tradeId)
  ) || null;
}

/* ---------- Sprint 3.6A: Position Allocation ---------- (Sprint 3.6A.1: Lifecycle Hotfix applied)
   One-way Mode means a single real exchange net Position can be the combined result of MULTIPLE
   local Trades' entries, plus quantity this app never touched at all (a pre-existing/external
   contribution) — empirically confirmed during 3.5D-E.1's real verification (a real BTCUSDT position
   built from an earlier session's 0.374 contribution plus that sprint's own 0.0153 contribution).
   `linkPositionToTrade()` above is deliberately left untouched (still exactly-one-link-ever, used for
   the Position Card's "查看交易详情" convenience link — see its own comment for a disclosed, related,
   NOT-fixed-here sibling issue) — PositionAllocation is a purely ADDITIVE, more honest model layered
   alongside it: every qualifying Trade gets its own row, never exclusive.

   Position Lifecycle (Sprint 3.6A.1 hotfix — root cause and fix):
   `findPositionByExchangeIdentity(connectionId, symbol, positionSide)` keys purely on identity, not
   on whether the position is currently open — confirmed by reading syncPositionsFromExchange(): when
   a previously-CLOSED position reappears (same symbol, same positionSide — which in One-way Mode is
   ALWAYS 'BOTH' regardless of LONG/SHORT, so even a direction reversal reuses the same identity), the
   exact same `RealPosition.positionId` is revived rather than a new one being minted. `positionId`
   was therefore never a safe scope for "this Trade's fill still counts toward the CURRENT exposure" —
   a historical ENTRY fill proves only "this Trade once really filled on this symbol/direction", never
   "still contributes to the position that exists right now".
   Fix, two complementary rules:
   (1) `RealPosition.positionLifecycleId` — freshly generated only when a position transitions from
       absent/CLOSED into OPEN (an ordinary quantity update on an already-OPEN position keeps its
       existing lifecycle id unchanged). `PositionAllocation.positionLifecycleId` is copied from the
       position at allocation-creation time. `activeAllocationsForPosition()` — the ONLY function
       `reconcilePositionAllocations()`/`getPositionAllocationSummary()` use for current-total math —
       filters by BOTH `positionId` AND a matching `positionLifecycleId`, so an old lifecycle's
       allocations are excluded from a revived position's current total. Nothing is ever deleted —
       `allocationsForPosition()` (positionId only, every lifecycle) remains available for audit.
   (2) `isEntryFillAlreadyAllocated(sourceOrderId)` — a global, cross-lifecycle, cross-position check.
       Rule (1) alone is not sufficient: without this, a revived position's fresh (new) lifecycle id
       would have ZERO existing allocations, so the ordinary candidate scan would immediately treat
       the Trade's old, already-once-allocated fill as a brand new, still-unclaimed candidate and
       reattribute it to the new lifecycle — exactly the bug this hotfix exists to close. An ENTRY
       fill is a frozen historical fact that happened at one real moment and can only ever have
       genuinely contributed to the ONE real position lifecycle that was open at that moment; once an
       order has been consumed by any allocation, ever, it is permanently excluded from candidacy for
       every other lifecycle, forever — never re-attributed on symbol/direction match alone. */

function genAllocationId(){ return 'AL'+Date.now().toString(36).toUpperCase()+Math.random().toString(36).slice(2,6).toUpperCase(); }
function loadPositionAllocations(){
  try{ const raw=localStorage.getItem('qa_position_allocations'); if(raw) return JSON.parse(raw); }catch(e){}
  return {};
}
function savePositionAllocationMap(map){ localStorage.setItem('qa_position_allocations', JSON.stringify(map)); }
function saveRealPositionAllocation(a){ a.updatedAt=new Date().toISOString(); const map=loadPositionAllocations(); map[a.allocationId]=a; savePositionAllocationMap(map); return a; }
/** Raw/audit view — every allocation ever tied to this positionId, across EVERY lifecycle that has
 * ever occupied this identity slot. Never used directly for current-total math (Sprint 3.6A.1) —
 * see `activeAllocationsForPosition()` below for that. */
function allocationsForPosition(positionId){ return Object.values(loadPositionAllocations()).filter(a=>a.positionId===positionId); }
/** Sprint 3.6A.1 — the allocations that actually count toward THIS position's CURRENT total: same
 * positionId AND same positionLifecycleId. A position record predating this hotfix (no
 * `positionLifecycleId` field on either side yet, both `undefined`) still matches itself correctly —
 * no data migration needed; only a position that goes through an actual close→reopen transition
 * AFTER this hotfix gets a genuinely fresh lifecycle id. */
function activeAllocationsForPosition(position){
  return allocationsForPosition(position.positionId).filter(a=>a.positionLifecycleId===position.positionLifecycleId);
}
function activeAllocationForTradeAndPosition(tradeId, position){
  return activeAllocationsForPosition(position).find(a=>a.tradeId===tradeId) || null;
}
/** Sprint 3.6A.1 — global truth, deliberately not scoped to any one position/lifecycle: has this
 * Trade's real ENTRY fill already been consumed by ANY allocation, anywhere, ever? See the header
 * comment above for why this is required in addition to lifecycle scoping, not instead of it. */
function isEntryFillAlreadyAllocated(sourceOrderId){
  return Object.values(loadPositionAllocations()).some(a=>a.sourceOrderId===sourceOrderId);
}

/** The ONE place a PositionAllocation is ever created. Candidate criteria are identical to
 * `linkPositionToTrade()`'s (symbol/direction/connection match + a real filled ENTRY order) but,
 * unlike that function, exclusivity is never enforced — every qualifying Trade gets its own
 * allocation. Quantity is ALWAYS the Trade's own real filled ENTRY quantity — never
 * `positionSizeUsdt`, never AI/plan/DRAFT data (Core Truth Rule, same discipline as Position Sync/
 * Protection). Idempotent: an existing allocation's `quantity` is NEVER rewritten by a later sync —
 * a Trade's own ENTRY fill quantity is a frozen historical fact once it exists, so this can never
 * silently "correct" an allocation out from under the user. Sprint 3.6A.1 — a candidate whose ENTRY
 * fill was already consumed by ANY prior allocation (any lifecycle, any position) is excluded before
 * ever reaching the create step; see `isEntryFillAlreadyAllocated()`.
 *
 * Known, disclosed MVP limitation (unchanged since 3.6A): a later PARTIAL CLOSE of this Trade's own
 * share (e.g. its own take-profit target filling) is not separately tracked here — `allocationStatus`
 * below will correctly flag the resulting mismatch as CONFLICT rather than silently going stale, but
 * does not attempt to guess which Trade's share actually shrank. This is intentional: guessing under
 * ambiguity is exactly what this model refuses to do (see allocationStatus below). */
function reconcilePositionAllocations(position){
  if(position.status!=='OPEN') return {allocations:activeAllocationsForPosition(position), allocationStatus:null, unattributedQuantity:null};
  const candidates=Object.values(loadRealTrades()).filter(t=>{
    if(toBinanceSymbol(t.symbol)!==position.symbol) return false;
    if(t.thesisDirection!==position.side) return false;
    const order=Object.values(loadRealOrders()).find(o=>o.tradeId===t.tradeId && o.role==='ENTRY');
    if(!order || !order.exchangeOrderId) return false;
    // Sprint 3.6A.2 — same account-first-with-legacy-fallback rule as linkPositionToTrade(): an
    // order submitted through a DIFFERENT connection bound to the SAME real account still counts.
    if(order.exchangeAccountId && position.exchangeAccountId){
      if(order.exchangeAccountId!==position.exchangeAccountId) return false;
    } else if(order.exchangeConnectionId && order.exchangeConnectionId!==position.exchangeConnectionId){
      return false;
    }
    if(!(order.filled && order.filled.quantity>0)) return false;
    if(isEntryFillAlreadyAllocated(order.orderId)) return false; // Sprint 3.6A.1 — the core fix: never re-attribute a fill already consumed by a prior lifecycle
    return true;
  });
  candidates.forEach(t=>{
    if(activeAllocationForTradeAndPosition(t.tradeId, position)) return; // defensive; isEntryFillAlreadyAllocated above should already exclude this
    const order=Object.values(loadRealOrders()).find(o=>o.tradeId===t.tradeId && o.role==='ENTRY');
    saveRealPositionAllocation({
      schemaVersion:'alloc-v1', allocationId:genAllocationId(), positionId:position.positionId,
      positionLifecycleId:position.positionLifecycleId,
      tradeId:t.tradeId, exchangeConnectionId:position.exchangeConnectionId, exchangeAccountId:position.exchangeAccountId||null,
      symbol:position.symbol, side:position.side,
      quantity:order.filled.quantity, sourceOrderId:order.orderId, createdAt:new Date().toISOString(),
    });
  });
  return getPositionAllocationSummary(position);
}

/** Read-only, no side effects — used by rendering. `allocationStatus`: `'OK'` when the sum of every
 * CURRENT-lifecycle allocation's quantity is within the real Position's current quantity (the
 * remainder, `unattributedQuantity`, is honestly shown as external/pre-existing exposure this app
 * never claims); `'CONFLICT'` when the sum EXCEEDS real quantity — i.e. real exchange quantity is now
 * smaller than local records expect (an external reduction, or a Trade's own protection order
 * partially closing its share) — flagged, never silently resolved or auto-adjusted. Sprint 3.6A.1 —
 * now scoped to `activeAllocationsForPosition()`, so a revived position's stale prior-lifecycle
 * allocations are never counted here even though they remain in storage for audit. */
function getPositionAllocationSummary(position){
  const allocations=activeAllocationsForPosition(position);
  const sum=allocations.reduce((s,a)=>s+(a.quantity||0), 0);
  const allocationStatus = sum<=position.quantity+1e-9 ? 'OK' : 'CONFLICT';
  return {allocations, allocationStatus, unattributedQuantity: Math.max(0, position.quantity-sum)};
}

/** Task 5 — the one exchange->local sync flow. Reuses the EXISTING account snapshot route (Task 23,
 * no new backend endpoint); `snap.positions` already contains only NON-ZERO exchange positions
 * (binanceFuturesAdapter.ts filters zero/absent positionAmt at the source), so "this connectionId's
 * local Positions not present in this fresh read" is exactly "exchange now confirms zero exposure"
 * (Task 10) — no separate zero-quantity case to special-case. Every existing Position's mutable
 * fields are OVERWRITTEN from the fresh read (Task 26 — exchange wins, local sync never merges/keeps
 * a stale local value over a fresh exchange one). */
async function syncPositionsFromExchange(connectionId){
  let json;
  try{
    const res=await fetch(`${BACKEND_URL}/api/exchange/connections/${connectionId}/account`);
    json=await res.json();
  }catch(e){ return {ok:false, error:'无法读取交易所账户快照'}; }
  if(!json.ok) return {ok:false, error:(json.error&&json.error.message)||'无法读取真实账户状态'};
  const snap=json.snapshot;

  // Sprint 3.6A.2 — resolve the real ExchangeAccount this connectionId belongs to. Position identity
  // (below) is scoped by exchangeAccountId, not raw connectionId, so switching to a DIFFERENT
  // connection bound to the SAME account never creates a duplicate Position. A resolution failure here
  // degrades to the pre-3.6A.2 connectionId-only behavior (never blocks the sync itself — reading a
  // position mirror is still safe/useful even if the account layer is briefly unavailable).
  let exchangeAccountId=null;
  try{
    const acctRes=await fetch(`${BACKEND_URL}/api/exchange/connections`);
    const acctJson=await acctRes.json();
    if(acctJson.ok){
      const conn=(acctJson.connections||[]).find(c=>c.id===connectionId);
      exchangeAccountId=conn?(conn.exchangeAccountId||null):null;
    }
  }catch(e){ /* degrade gracefully — see comment above */ }

  const nowIso=new Date().toISOString();
  const seenIds=new Set();
  const positions=[];

  (snap.positions||[]).forEach(p=>{
    const positionSideKey=p.positionSide||'BOTH';
    let existing = exchangeAccountId ? findPositionByExchangeAccountIdentity(exchangeAccountId, p.symbol, positionSideKey) : null;
    if(!existing){
      // Sprint 3.6A.2 backward-compat: a Position created before this sprint has no exchangeAccountId
      // yet. It is still safe to ADOPT (never guess) when it matches the OLD (connectionId, symbol,
      // positionSide) identity for THIS SPECIFIC connectionId being synced right now — that connection
      // is the one that originally created it, so backfilling exchangeAccountId here is a fact, not a
      // guess across different connections/accounts.
      const legacyMatch=Object.values(loadRealPositions()).find(p2=>!p2.exchangeAccountId && p2.exchangeConnectionId===connectionId && p2.symbol===p.symbol && p2.positionSide===positionSideKey);
      if(legacyMatch) existing=legacyMatch;
    }
    // Sprint 3.6A.1 — the identity lookup above matches purely by (exchangeAccountId, symbol,
    // positionSide) regardless of open/closed status, so a previously-CLOSED record is REVIVED here,
    // not replaced. A fresh positionLifecycleId is required exactly when that revival happens (or on
    // genuine first creation) — never on an ordinary quantity refresh of an already-OPEN position,
    // which must keep its existing lifecycle. See the Position Lifecycle comment block above
    // reconcilePositionAllocations() for the full root-cause explanation.
    const isNewLifecycle = !existing || existing.status==='CLOSED';
    if(!existing){
      existing={
        schemaVersion:'real-v1', positionId:genPositionId(),
        exchangeConnectionId:connectionId, exchangeAccountId, exchange:'binance-futures', environment:snap.environment,
        symbol:p.symbol, side:p.side, positionSide:positionSideKey,
        sourceTradeIds:[], firstObservedAt:nowIso, lastSyncedAt:nowIso, status:'OPEN', closedAt:null,
        positionLifecycleId:genPositionLifecycleId(),
      };
    }else{
      existing.side=p.side; existing.status='OPEN'; existing.closedAt=null;
      if(isNewLifecycle) existing.positionLifecycleId=genPositionLifecycleId();
    }
    // Task 26 — exchange wins: every mutable field is overwritten fresh, every sync, whether the
    // Position is new or already known. exchangeConnectionId/exchangeAccountId are included here as of
    // 3.6A.2 — Position is a pure mirror, so "whichever connection/account just confirmed this" is
    // always allowed to overwrite (unlike RealOrder, which freezes its connection/account at
    // submission time as a historical fact — see applyOrderSubmissionSuccess()).
    existing.exchangeConnectionId=connectionId;
    if(exchangeAccountId) existing.exchangeAccountId=exchangeAccountId;
    existing.quantity=p.quantity; existing.entryPrice=p.entryPrice; existing.markPrice=p.markPrice;
    existing.leverage=p.leverage; existing.marginType=p.marginType; existing.liquidationPrice=p.liquidationPrice;
    existing.unrealizedPnl=p.unrealizedPnl; existing.breakEvenPrice=p.breakEvenPrice;
    existing.isolatedMargin=p.isolatedMargin; existing.positionInitialMargin=p.positionInitialMargin;
    existing.maintenanceMargin=p.maintenanceMargin;
    existing.protection=p.protection; existing.protectionReadStatus=snap.protectionReadStatus;
    saveRealPosition(existing);
    seenIds.add(existing.positionId);
    positions.push(existing);
    linkPositionToTrade(existing, connectionId);
    reconcilePositionAllocations(existing); // Sprint 3.6A / 3.6A.1 / 3.6A.2 — additive; never affects linkPositionToTrade()'s own single-link behavior; lifecycle-scoped as of 3.6A.1, account-scoped as of 3.6A.2
  });

  // Task 10 — any PREVIOUSLY-OPEN local Position for this ACCOUNT (Sprint 3.6A.2 — was connectionId
  // pre-3.6A.2; upgraded so switching connections within the same account never leaves the OLD
  // connection's positions stuck OPEN forever) not present in this fresh read is exchange-confirmed
  // zero exposure -> CLOSED. History is never deleted, no fabricated close price. Falls back to the
  // legacy connectionId-only scoping for a position that still has no exchangeAccountId at all.
  Object.values(loadRealPositions()).forEach(p=>{
    const sameOwner = exchangeAccountId && p.exchangeAccountId ? p.exchangeAccountId===exchangeAccountId : p.exchangeConnectionId===connectionId;
    if(sameOwner && p.status==='OPEN' && !seenIds.has(p.positionId)){
      // Sprint 3.6B.2, Section 2/5/18 — a Trade Completion Rule addition, additive to the CLOSED
      // transition above (never itself changed): the lifecycle that just ended (p.positionLifecycleId
      // is still the pre-close value here — only a REVIVAL, handled in the loop above, ever mints a
      // fresh one) had zero or more CURRENT-lifecycle allocations; the exchange reporting this identity
      // fully absent (not merely reduced — that path never reaches this branch, Section 18) means every
      // one of THOSE Trades has no remaining real exposure. Never fabricates an exit Fill/price/PnL
      // (Section 17) — only status/closedAt/closeSource, and only for a Trade still in an active state
      // (idempotent against a Trade already completed by some other path).
      const closingAllocations=activeAllocationsForPosition(p);
      p.status='CLOSED'; p.closedAt=nowIso; saveRealPosition(p);
      closingAllocations.forEach(alloc=>{
        const trade=getRealTradeById(alloc.tradeId);
        if(trade && REAL_TRADE_ACTIVE_STATUSES.includes(trade.status)){
          trade.status='CLOSED'; trade.closedAt=nowIso; trade.closeSource='EXTERNAL';
          saveRealTrade(trade);
        }
      });
    }
  });

  return {ok:true, positions, protectionReadStatus:snap.protectionReadStatus};
}

/** Task 16 — one combined action ("同步交易状态") so the user isn't required to separately click
 * 同步订单状态 and 刷新账户. Resolves the connection the SAME way order submission/sync already does
 * (never a diverging choice) — prefers the order's own persisted `exchangeConnectionId` (Task 8, the
 * connection this order actually reached) when known, falling back to fresh RiskSettings resolution
 * for an order submitted before that field existed. */
async function syncOrderAndPositionForTrade(orderId){
  const order=getRealOrderById(orderId);
  if(!order) return {ok:false, error:'本地订单不存在'};

  // Sprint 3.6A.2 — same account-first-with-legacy-fallback resolver every other resume-from-history
  // flow now uses; this is the exact call site that used to fail with "交易所连接不存在" whenever the
  // order's original exchangeConnectionId had been deleted (see the Phase 1 investigation report's
  // Failure Path Reproduction, D.2).
  const resolved=await resolveConnectionForRealOrder(order);
  if(!resolved.ok) return {ok:false, error:resolved.reason};

  const orderResult = order.exchangeOrderId ? await syncRealOrderFromExchange(orderId) : {ok:true, skipped:true};
  const positionResult = await syncPositionsFromExchange(resolved.connectionId);
  return {ok: orderResult.ok!==false && positionResult.ok!==false, orderResult, positionResult};
}

/* ---------- Automatic RealTrade Reconciliation (+ Orphan RealTrade Reconciliation) ----------
   Real gap this fixes (Trade State Reconciliation Audit): a RealTrade can stay ACTIVE locally
   (PLANNED/OPENING/OPEN/CLOSING) indefinitely once its real exchange activity is gone, because the
   ONLY things that ever call syncRealOrderFromExchange()/syncPositionsFromExchange() are (a)
   explicit manual buttons and (b) reconcileAutoSubmittedStrategyOrders(), itself gated on a
   StrategyOrder currently in ENTRY_SUBMITTED/PARTIALLY_FILLED/POSITION_ACTIVE — zero such
   candidates means zero automatic trigger at all. This section adds exactly one new automatic
   trigger (startup + interval + pre-Risk-Guard, see startRealTradeReconcileLoop()/buildRiskContext()
   below) and reuses the two existing sync functions above for every case they already cover. The
   same-symbol conflict RULE itself (evaluateSameSymbolConflict) is never touched.

   Orphan RealTrade Reconciliation adds ONE further, STRICTER path for a narrower real case found by
   the Trade State Reconciliation Audit (TRMSO6R4EVJ1RL): a Trade whose audit trail PROVES a
   StrategyOrder once linked to it, but that StrategyOrder's own record has since been lost (the
   pre-3.8C.2 persistence bug). Such a Trade is never closed on "exchange is empty" alone — Section 7
   of this sprint's own spec is explicit that this is unsafe. It is only closed when the audit log
   ALSO carries a real terminal event (POSITION_CLOSED_EXTERNAL / a terminal newStatus) — see
   resolveOrphanTradeTerminalEvidence(). A Trade with NO audit trail at all (never linked to any
   StrategyOrder — most Trades) is explicitly NOT "orphan" under this definition and is completely
   unaffected by this addition — it keeps going through the exact Step 1/Step 2 path from the prior
   sprint, unchanged, which is what keeps that prior sprint's own tests passing unmodified. */

const REAL_TRADE_RECONCILE_INTERVAL_MS=20000; // distinct concern from the backend's own ~10s
// Exchange Runtime Sync (that owns exchange truth; this owns keeping the LOCAL RealTrade mirror
// aligned with it) — a separate loop, not a duplicate of it.
let realTradeReconcileTimer=null, realTradeReconcileInFlight=false;

function activeRealTradesForSymbol(symbol){
  return Object.values(loadRealTrades()).filter(t=>REAL_TRADE_ACTIVE_STATUSES.includes(t.status) && (!symbol || t.symbol===symbol));
}

/** Section 11 — the ONE shared symbol-normalization helper. `trade.symbol` (and every other
 * frontend "asset" concept) uses the display form "BTC/USDT"; every backend Binance-sourced field
 * (positions[].symbol, protectiveOrders[].symbol, the open-orders query param) uses the raw
 * exchange form "BTCUSDT". Centralized here so this comparison is never duplicated as a second
 * inline `.replace('/','')` — every place in this file that needs it (below, and the Orphan
 * resolver) calls this one function. Does NOT fix the separate, pre-existing raw-string mismatch
 * inside evaluateExchangePositionConflict()/evaluateExistingPositionProtection() (Risk Guard's own
 * rule code) — that stays exactly as-is and is recorded in Remaining Issues, per this sprint's
 * explicit prohibition on touching Risk Guard's own rule logic. */
function normalizeSymbol(symbol){
  return (symbol||'').replace('/','').toUpperCase();
}

/** Fail-closed real-exchange emptiness check for ONE symbol on ONE connection — position, open
 * orders, AND protective orders must all be POSITIVELY confirmed (never merely absent from a
 * degraded/partial read) before this ever reports *Empty:true. `cache` (Map/Set-based, owned by the
 * caller's reconciliation pass) is what lets one pass share a single account snapshot and a single
 * open-orders read per (connection[,symbol]) across every Trade on that connection — never one
 * fetch per Trade (Section 4/Case K). Reuses the exact backend endpoints Risk Guard's own
 * buildAccountRiskContext() already calls — no new backend route. */
async function fetchExchangeEmptinessForSymbol(connectionId, symbol, cache){
  const rawSymbol=normalizeSymbol(symbol);
  let snap=cache.accountSnapshots.get(connectionId);
  if(snap===undefined){
    snap=await fetch(`${BACKEND_URL}/api/exchange/connections/${connectionId}/account`).then(r=>r.json()).catch(()=>null);
    cache.accountSnapshots.set(connectionId, snap);
  }
  if(!snap || !snap.ok) return {ok:false, error:(snap&&snap.error&&snap.error.message)||'无法读取真实账户状态'};

  const ordersKey=connectionId+'::'+rawSymbol;
  let orders=cache.openOrders.get(ordersKey);
  if(orders===undefined){
    orders=await fetch(`${BACKEND_URL}/api/exchange/connections/${connectionId}/open-orders?symbol=${encodeURIComponent(rawSymbol)}`).then(r=>r.json()).catch(()=>null);
    cache.openOrders.set(ordersKey, orders);
  }
  if(!orders || !orders.ok) return {ok:false, error:(orders&&orders.error&&orders.error.message)||'无法读取当前挂单'};

  // Same fail-closed discipline ExchangeAccountSnapshot.protectionReadStatus itself documents (Sprint
  // 3.5C.2 Hotfix): a TIMEOUT/UNAVAILABLE protective-order read must never be treated as "confirmed
  // no protection" just because the returned list happens to be empty.
  if(snap.snapshot.protectionReadStatus!=='OK'){
    return {ok:false, error:'保护单读取状态不完整（'+snap.snapshot.protectionReadStatus+'），无法确认是否已无保护单'};
  }

  return {
    ok:true,
    positionEmpty: !(snap.snapshot.positions||[]).some(p=>normalizeSymbol(p.symbol)===rawSymbol),
    openOrdersEmpty: (orders.snapshots||[]).length===0,
    protectiveOrdersEmpty: !(snap.snapshot.protectiveOrders||[]).some(o=>normalizeSymbol(o.symbol)===rawSymbol),
  };
}

/** Section 4 — given a RealTrade, determines whether it is a genuine "orphan": its audit trail
 * PROVES a StrategyOrder once linked to it (queried by tradeId — the one field that survives even
 * after that StrategyOrder's own record is gone, since the audit log is append-only and independent
 * of it), but that StrategyOrder no longer exists in the current live store. A Trade with NO audit
 * trail at all is explicitly `isOrphanCandidate:false` (Section 6/Case I: never apply the stricter
 * orphan gate to a Trade that never had a StrategyOrder link, and never to one whose StrategyOrder
 * is still current — the ordinary/prior-sprint path already covers both correctly). Never mutates
 * the Trade — purely a read + judgment, matching Section 4's "resolver only" contract. `cache`
 * reuses one `/api/strategy/orders` read across an entire reconciliation pass. */
async function resolveOrphanTradeTerminalEvidence(trade, cache){
  let auditJson;
  try{
    const res=await fetch(`${BACKEND_URL}/api/strategy/audit/search?tradeId=${encodeURIComponent(trade.tradeId)}`);
    auditJson=await res.json();
  }catch(e){ return {isOrphanCandidate:false, terminalConfirmed:false, source:null, reasonCode:'AUDIT_READ_FAILED', evidence:null}; }
  if(!auditJson.ok) return {isOrphanCandidate:false, terminalConfirmed:false, source:null, reasonCode:'AUDIT_READ_FAILED', evidence:null};

  const events=(auditJson.events||[]).slice().sort((a,b)=>new Date(a.timestamp)-new Date(b.timestamp));
  if(events.length===0) return {isOrphanCandidate:false, terminalConfirmed:false, source:null, reasonCode:'NO_AUDIT_TRAIL', evidence:null};

  const strategyOrderId=events[events.length-1].strategyOrderId; // most recent linkage on record
  let currentOrders=cache.currentStrategyOrders;
  if(currentOrders===undefined){
    currentOrders=await fetch(`${BACKEND_URL}/api/strategy/orders`).then(r=>r.json()).then(j=>j.ok?j.orders:null).catch(()=>null);
    cache.currentStrategyOrders=currentOrders;
  }
  if(currentOrders===null) return {isOrphanCandidate:false, terminalConfirmed:false, source:null, reasonCode:'STRATEGY_ORDER_LIST_READ_FAILED', evidence:null};

  const stillExists=currentOrders.some(o=>o.strategyOrderId===strategyOrderId);
  if(stillExists) return {isOrphanCandidate:false, terminalConfirmed:false, source:null, reasonCode:'STRATEGY_ORDER_STILL_CURRENT', evidence:{strategyOrderId}};

  // This IS an orphan candidate: real audit trail exists, its StrategyOrder is confirmed gone. Now
  // look for a real terminal event within that same trail (Section 3.A). A specific terminal EVENT
  // TYPE (e.g. POSITION_CLOSED_EXTERNAL — the actual reason something ended) is preferred over a
  // later housekeeping event that merely carries a terminal newStatus (e.g. a
  // PROTECTION_RECONCILIATION_UPDATED logged after the fact still shows newStatus:'COMPLETED', but
  // is not itself informative about WHY) — this keeps reasonCode meaningful for the report/export.
  const TERMINAL_EVENT_TYPES=['POSITION_CLOSED_EXTERNAL'];
  const TERMINAL_STATUS_VALUES=['COMPLETED','CLOSED','CANCELLED'];
  const reversed=events.slice().reverse();
  const terminalEvent=reversed.find(e=>TERMINAL_EVENT_TYPES.includes(e.eventType)) || reversed.find(e=>TERMINAL_STATUS_VALUES.includes(e.newStatus));
  if(!terminalEvent){
    return {isOrphanCandidate:true, terminalConfirmed:false, source:null, reasonCode:'NO_TERMINAL_EVENT_IN_AUDIT_TRAIL', evidence:{strategyOrderId, events}};
  }
  return {isOrphanCandidate:true, terminalConfirmed:true, source:'AUDIT_LOG', reasonCode:terminalEvent.eventType||terminalEvent.newStatus, evidence:{strategyOrderId, terminalEvent, events}};
}

/** Shared by both the ordinary (prior-sprint) and orphan closure paths below — the ONE place a
 * RealTrade actually transitions to CLOSED, so there is exactly one closing code shape, not two.
 * `extra` carries orphan-specific provenance (Section 6: "记录 reconciledAt/reason，如果现有模型支持")
 * without inventing new REQUIRED fields on RealTrade — purely additive metadata. */
function closeRealTradeIfExchangeConfirmedEmpty(trade, emptiness, extra){
  if(!(emptiness.positionEmpty && emptiness.openOrdersEmpty && emptiness.protectiveOrdersEmpty)) return false;
  trade.status='CLOSED'; trade.closedAt=new Date().toISOString(); trade.closeSource='EXTERNAL';
  if(extra) Object.assign(trade, extra);
  saveRealTrade(trade);
  return true;
}

/** One Trade's reconciliation attempt. Never touches a terminal Trade (Case L). Never touches a
 * PLANNED Trade with no submission evidence at all (Case F/H — zero Binance activity is the
 * EXPECTED state for a plan that was never submitted, not evidence of staleness). Reuses
 * syncRealOrderFromExchange()/syncPositionsFromExchange() FIRST (Step 1, unchanged from the prior
 * sprint) — most Trades that need closing are closed by this reuse alone. A Trade still active
 * afterward then goes through EXACTLY ONE of two paths: the orphan gate (Section 3/6 — only for a
 * Trade whose audit trail proves a now-missing StrategyOrder once owned it, Case I excludes a
 * current one) requiring real terminal evidence before even checking exchange emptiness; or, for
 * every other Trade, the prior sprint's original Step 2 (still just exchange-emptiness, unchanged
 * behavior, regression-safe for every trade shape that isn't a genuine orphan). */
async function reconcileOneActiveRealTrade(tradeId, cache){
  const trade=getRealTradeById(tradeId);
  if(!trade || !REAL_TRADE_ACTIVE_STATUSES.includes(trade.status)) return {changed:false};

  const order=Object.values(loadRealOrders()).find(o=>o.tradeId===trade.tradeId && o.role==='ENTRY');
  const hasSubmissionEvidence=!!(order && order.exchangeOrderId);
  if(trade.status==='PLANNED' && !hasSubmissionEvidence) return {changed:false, reason:'PLANNED_NO_SUBMISSION_EVIDENCE'};

  // Step 1 — reuse existing, already-correct sync paths in full, whenever a local RealOrder/
  // connection can be resolved at all. The order-status read is one real query per Trade (each ENTRY
  // order has its own distinct exchangeOrderId, so this can't be deduped); the position sync is
  // deduped per connection within this pass via cache.positionsSynced.
  let connectionId=null;
  if(order){
    const resolved=await resolveConnectionForRealOrder(order);
    if(resolved.ok){
      connectionId=resolved.connectionId;
      if(hasSubmissionEvidence) await syncRealOrderFromExchange(order.orderId);
      if(!cache.positionsSynced.has(connectionId)){
        await syncPositionsFromExchange(connectionId);
        cache.positionsSynced.add(connectionId);
      }
    }
  }

  const afterSync=getRealTradeById(trade.tradeId);
  if(!afterSync || !REAL_TRADE_ACTIVE_STATUSES.includes(afterSync.status)) return {changed:true, trade:afterSync}; // closed via existing, unmodified logic

  // Orphan gate (Section 3/4/6) — only meaningfully applies to a Trade whose audit trail proves a
  // NOW-MISSING StrategyOrder once owned it. Everything else (no audit trail at all, or a
  // still-current StrategyOrder — Case I) falls straight through to the unchanged Step 2 below.
  const orphanCheck=await resolveOrphanTradeTerminalEvidence(afterSync, cache);
  if(orphanCheck.isOrphanCandidate){
    if(!orphanCheck.terminalConfirmed) return {changed:false, trade:afterSync, reason:orphanCheck.reasonCode}; // Section 7 — no terminal evidence, NEVER close on "empty" alone
    if(!connectionId){
      const resolved=order?await resolveConnectionForRealOrder(order):{ok:false, reason:'本地缺少对应的 RealOrder，无法核实 orphan 交易的当前 exchange truth'};
      if(!resolved.ok) return {changed:false, trade:afterSync, error:resolved.reason};
      connectionId=resolved.connectionId;
    }
    const emptiness=await fetchExchangeEmptinessForSymbol(connectionId, afterSync.symbol, cache);
    if(!emptiness.ok) return {changed:false, trade:afterSync, error:emptiness.error}; // fail-closed — Case F(audit)/G(exchange)
    const closed=closeRealTradeIfExchangeConfirmedEmpty(afterSync, emptiness, {
      reconciliationReason:'ORPHAN_TERMINAL_EVIDENCE:'+orphanCheck.reasonCode, reconciledAt:new Date().toISOString(),
    });
    return closed ? {changed:true, trade:afterSync} : {changed:false, trade:afterSync}; // Case C/D/E — terminal evidence exists but exchange still shows activity -> KEEP ACTIVE
  }

  // Not an orphan candidate — the prior sprint's original Step 2, unchanged: still active + exchange
  // confirmed empty -> close. Regression-safe for every Trade shape the prior sprint already covered.
  if(!connectionId){
    if(!order) return {changed:false, trade:afterSync, error:'本地缺少对应的 RealOrder，无法对账'};
    const resolved=await resolveConnectionForRealOrder(order);
    if(!resolved.ok) return {changed:false, trade:afterSync, error:resolved.reason};
    connectionId=resolved.connectionId;
  }
  const emptiness=await fetchExchangeEmptinessForSymbol(connectionId, afterSync.symbol, cache);
  if(!emptiness.ok) return {changed:false, trade:afterSync, error:emptiness.error}; // fail-closed — Case G/H, local status left untouched
  const closed=closeRealTradeIfExchangeConfirmedEmpty(afterSync, emptiness);
  return closed ? {changed:true, trade:afterSync} : {changed:false, trade:afterSync}; // genuinely still active — Case B/C/D/J
}

/** The ONE reconciliation pass entry point — startup, the periodic interval, and the pre-Risk-Guard
 * hook (buildRiskContext(), Section 7) all call this SAME function, never a second implementation.
 * `symbol` scopes the pass to one symbol (used by the pre-Risk-Guard hook, which only cares about
 * the symbol about to be checked); omitted for the periodic/startup sweep, which reconciles every
 * active Trade account-wide. Re-entrancy guarded — a pass already in flight is never overlapped by
 * a second one (the pre-Risk-Guard hook simply no-ops if a periodic pass just started; `qa_trades_real`
 * is then at most one interval old, an accepted tradeoff over blocking user interaction to wait). */
async function reconcileActiveRealTrades(symbol){
  if(realTradeReconcileInFlight) return;
  realTradeReconcileInFlight=true;
  const cache={accountSnapshots:new Map(), openOrders:new Map(), positionsSynced:new Set()};
  let closedCount=0, errorCount=0;
  try{
    const targets=activeRealTradesForSymbol(symbol);
    for(const t of targets){
      const result=await reconcileOneActiveRealTrade(t.tradeId, cache);
      if(result.changed) closedCount++;
      if(result.error) errorCount++;
    }
  }finally{
    realTradeReconcileInFlight=false;
  }
  if(closedCount>0){
    toast(`已自动对账并结束 ${closedCount} 笔与交易所不再一致的本地交易记录`);
    if(['trades','monitoring'].includes(currentRoute()[0])) render();
  }
  return {closedCount, errorCount};
}

function startRealTradeReconcileLoop(){
  if(realTradeReconcileTimer) return;
  reconcileActiveRealTrades().catch(()=>{});
  realTradeReconcileTimer=setInterval(()=>{ reconcileActiveRealTrades().catch(()=>{}); }, REAL_TRADE_RECONCILE_INTERVAL_MS);
}

/* ---------- Sprint 3.5D-D: Binance TESTNET Manual Order Cancellation ----------
   The app's SECOND real write capability: DELETE /fapi/v1/order, TESTNET only, one explicit user
   click, only for a RealOrder(SUBMITTED|PARTIALLY_FILLED, exchangeOrderId!=null). Never automatic —
   not on scenario expiry, not on a Risk Guard result changing, not on page load, not on Position
   change. No amend/replace, no AUTO, no LIVE. See EXECUTION_SPEC.md's "Real Order Cancellation"
   section for the full boundary. */

/** Task 4 — the only two locally-cancellable states, and only with a real exchangeOrderId. Every
 * other state (DRAFT/FILLED/CANCELLED/REJECTED/EXPIRED, or missing exchangeOrderId) is rejected
 * before any network call — matches checkOrderSubmissionEligibility()'s "reason, not boolean" shape
