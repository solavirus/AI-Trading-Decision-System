/* ---------- Sprint 3.6A.2, Phase C: Local Trading History Management ----------
   "系统不得自动、静默篡改或删除真实历史事实。但用户明确执行 Delete/Reset 时，可以删除本地交易历史。"
   Safety precondition (most conservative first version, per the task spec): EVERY currently enabled
   exchange connection must show a fresh, real, read-only REST snapshot with zero open Positions, zero
   ordinary open Orders, and zero open Algo/Protection orders — local trading history spans whatever
   connections/accounts were ever used, so checking only "the current one" would not be safe. Any read
   failure, timeout, or unresolved connection BLOCKs the whole reset — never "probably fine". Only
   Binance READS happen here (reuses the existing account-snapshot + open-orders routes) — no write of
   any kind is ever made by this flow. */

/** Sprint 3.6A.2.2 — Hotfix: one item's shape, `{status:'OK', count:N} | {status:'FAILED', error}`.
 * Used for all three checked items (positions/orders/algoOrders) so a read failure on ONE item never
 * discards the other two items' genuinely-confirmed results — the previous version threw away
 * "positions already confirmed 0" the moment the orders read failed, collapsing everything into one
 * vague error string. `clean` for one item requires status OK AND count===0; a FAILED item is never
 * clean, regardless of what the other items say. */
function cleanCheckItemOk(count){ return {status:'OK', count}; }
function cleanCheckItemFailed(error){ return {status:'FAILED', error}; }
function cleanCheckItemIsClean(item){ return item.status==='OK' && item.count===0; }

/** Read-only. Returns {ok:true, allClean:boolean, perConnection:[{connection, clean, positions,
 * orders, algoOrders}]} (each of positions/orders/algoOrders is the item shape above) or
 * {ok:false, reason} if the connection list itself can't be read. */
async function verifyAllAccountsCleanForReset(){
  let connections;
  try{
    const res=await fetch(`${BACKEND_URL}/api/exchange/connections`);
    const json=await res.json();
    if(!json.ok) return {ok:false, reason:'无法读取交易所连接列表'};
    connections=json.connections;
  }catch(e){ return {ok:false, reason:'无法读取交易所连接列表'}; }

  const enabled=connections.filter(c=>c.enabled);
  const perConnection=[];
  for(const c of enabled){
    // Account snapshot (positions + protective/algo orders) and ordinary open orders are two
    // INDEPENDENT reads — one failing must never discard the other's genuinely-confirmed result.
    let acctJson=null, acctError=null, ordersJson=null, ordersError=null;
    try{
      const acctRes=await fetch(`${BACKEND_URL}/api/exchange/connections/${c.id}/account`);
      acctJson=await acctRes.json();
      if(!acctJson.ok) acctError=(acctJson.error&&acctJson.error.message)||'账户快照读取失败';
    }catch(e){ acctError='账户快照读取失败（网络错误）'; }
    try{
      const ordersRes=await fetch(`${BACKEND_URL}/api/exchange/connections/${c.id}/open-orders`);
      ordersJson=await ordersRes.json();
      if(!ordersJson.ok) ordersError=(ordersJson.error&&ordersJson.error.message)||'普通挂单读取失败';
    }catch(e){ ordersError='普通挂单读取失败（网络错误）'; }

    // positions[]/protectiveOrders[] from the backend already exclude zero-quantity/closed entries
    // (Task 26 of Sprint 3.5D-C/3.5C.2), so a non-empty array here IS a genuinely real, non-zero,
    // currently-open item — never a false positive from stale/zero rows.
    const positions = acctError ? cleanCheckItemFailed(acctError) : cleanCheckItemOk(acctJson.snapshot.positions.length);
    const algoOrders = acctError ? cleanCheckItemFailed(acctError)
      : acctJson.snapshot.protectionReadStatus!=='OK' ? cleanCheckItemFailed('保护单读取未完成（'+acctJson.snapshot.protectionReadStatus+'），无法确认是否为空')
      : cleanCheckItemOk(acctJson.snapshot.protectiveOrders.length);
    const orders = ordersError ? cleanCheckItemFailed(ordersError) : cleanCheckItemOk(ordersJson.snapshots.length);

    const clean = cleanCheckItemIsClean(positions) && cleanCheckItemIsClean(orders) && cleanCheckItemIsClean(algoOrders);
    perConnection.push({connection:c, clean, positions, orders, algoOrders});
  }
  const allClean = perConnection.length>0 && perConnection.every(r=>r.clean===true);
  return {ok:true, allClean, perConnection, checkedAt:new Date().toISOString()};
}

/** The one place local trading-domain history is ever cleared. Never touches ExchangeAccount/

/** Sprint 3.6A.2.2 — one line per checked item, honestly distinguishing "read failed" (status
 * unknown, never assumed zero) from "read succeeded and found N" (N itself may or may not be zero).
 * This is the exact distinction Section 10 of the hotfix asked for — "读取失败" and "挂单：2" must

function renderCleanCheckItem(label, item){
  if(item.status==='FAILED') return `<div class="row"><span class="k">${escapeAttr(label)}</span><span class="v" style="color:var(--red)">读取失败 ✕${item.error?'（'+escapeAttr(item.error)+'）':''}</span></div>`;
  const ok=item.count===0;
  return `<div class="row"><span class="k">${escapeAttr(label)}</span><span class="v"${ok?'':' style="color:var(--red)"'}>${item.count} ${ok?'✓':'✕'}</span></div>`;

   Operates entirely on Store.live.news.itemsRaw — the news source's ALREADY-loaded, ALREADY
   backend-clustered events (see sources/news.ts's clusterArticlesIntoEvents()). No new fetch, no
   new backend endpoint: the public API only exposes clustered events, not pre-cluster articles,
   so stages 3 (dedup) and 4 (cluster) here are a defensive SECOND pass over already-mostly-
   deduped/clustered data — on real data they typically find nothing further to do, which is
   expected and reported honestly rather than staged to look busier than it is. Never uses
   MOCK_NOW (that's fixed at 2024-05-20 for the old seeded-trade timeline) — always Date.now(). */

const NEWS_RANGE_DAYS={'最近3天':3,'最近7天':7,'最近14天':14,'最近30天':30};
function newsRangeMs(rangeLabel){ return (NEWS_RANGE_DAYS[rangeLabel]||7)*24*60*60*1000; }

/** Bilingual (Chinese labels are already backend-translated; `detail` keeps the English original
 * when translation changed it) — BTC/ETH get full direct+indirect lists per the spec's own
 * example; the other 4 supported assets get a lighter symbol/name list, proportionate to how
 * asset-specific crypto news actually skews. Centralized here, not scattered per-call. */
const NEWS_ASSET_KEYWORDS={
  BTC:{direct:['btc','bitcoin','比特币','btcusdt'], indirect:['bitcoin etf','spot etf','现货etf','blackrock','贝莱德','microstrategy']},
  ETH:{direct:['eth','ethereum','以太坊','ethusdt'], indirect:['eth etf','以太坊etf','staking','质押','layer 2']},
  SOL:{direct:['sol','solana','索拉纳','solusdt'], indirect:[]},
  XRP:{direct:['xrp','ripple','瑞波','xrpusdt'], indirect:[]},
  DOGE:{direct:['doge','dogecoin','狗狗币','dogeusdt'], indirect:[]},
  BNB:{direct:['bnb','binance coin','币安币','bnbusdt'], indirect:['binance','币安']},
};
const NEWS_MACRO_KEYWORDS=['fed','federal reserve','美联储','fomc','cpi','ppi','interest rate','利率','treasury','国债','us dollar','sec','regulation','监管'];
const NEWS_MAJOR_EVENT_KEYWORDS=['etf','approval','rejection','regulation','sec','fed','fomc','cpi','rate','hack','exploit','liquidation','insolvency','bankruptcy','listing','delisting','outage'];
/** Reuses the same source-type info news-source management already has — no separate list to
 * drift out of sync with. */
const NEWS_OFFICIAL_SOURCE_NAMES=new Set(NEWS_SOURCE_PRESETS.filter(p=>p.type==='official'||p.type==='api').map(p=>p.name));

function newsBaseSymbol(assetSymbol){ return String(assetSymbol||'').split('/')[0]; }

/** Parses "来源：A、B · 原文：..." (added by sources/news.ts) into a source-name array — there is
 * no separate structured field for this today, so this is the one place that depends on that
 * exact string format; if the backend's format ever changes, only this function needs updating. */
function newsParseSources(detail){
  const m=String(detail||'').match(/来源：([^·]+)/);
  if(!m) return [];
  return m[1].trim().split('、').map(s=>s.trim()).filter(Boolean);
}

/** Label + English original ONLY (the "原文：..." tail of detail, if present) — deliberately
 * excludes the "来源：X、Y" source-attribution prefix. Found via testing: two unrelated stories
 * from the same outlet (e.g. both "来源：CoinDesk") shared enough boilerplate tokens to falsely
 * clear the Stage 4 clustering threshold, and a source literally named after an asset (e.g.
 * "Binance Announcements") would spuriously satisfy Stage 2's keyword match on every one of its
 * articles regardless of actual content. This is the one function every content-similarity check
 * below goes through, so the fix only has to live in one place. */
function newsContentText(item){
  const m=String(item.detail||'').match(/原文：(.*)$/);
  return String(item.label||'')+(m?(' '+m[1]):'');
}

/** Stage 1 — Time Filter: keep items inside the Research-selected date range. Items with no
 * usable timestamp may only survive if they came from an official/exchange source (spec rule) —
 * in practice sources/news.ts always sets a timestamp today, so this branch is defensive/untested
 * by real data (covered by a fixture in verification instead). */
function newsStage1TimeFilter(items, rangeLabel, now){
  const windowMs=newsRangeMs(rangeLabel);
  return items.filter(it=>{
    const hasTime=typeof it.timestamp==='number' && !isNaN(it.timestamp);
    if(!hasTime){
      const sources=newsParseSources(it.detail);
      return sources.some(s=>NEWS_OFFICIAL_SOURCE_NAMES.has(s));
    }
    return (now-it.timestamp)<=windowMs;
  });
}

/** Stage 2 — Asset Relevance Filter: direct asset match, indirect match, or market-wide macro
 * relevance (kept even without the asset name, per spec) all pass; anything else (unrelated
 * single-token promo news) is excluded. Matches against label+English-original content only (see
 * newsContentText) — NOT source names, so an article merely published BY "Binance Announcements"
 * doesn't spuriously count as BNB-relevant regardless of what it's actually about. */
function newsStage2AssetRelevance(items, baseSymbol){
  const kw=NEWS_ASSET_KEYWORDS[baseSymbol]||{direct:[baseSymbol.toLowerCase()],indirect:[]};
  return items
    .map(it=>{
      const text=newsContentText(it).toLowerCase();
      const directHit=kw.direct.some(k=>text.includes(k));
      const macroHit=NEWS_MACRO_KEYWORDS.some(k=>text.includes(k));
      const indirectHit=kw.indirect.some(k=>text.includes(k));
      let tier=null;
      if(directHit) tier='direct'; else if(macroHit) tier='macro'; else if(indirectHit) tier='indirect';
      return {it, tier};
    })
    .filter(x=>x.tier)
    .map(x=>({...x.it, __tier:x.tier, __sources:newsParseSources(x.it.detail)}));
}

function newsNormalizeUrl(u){ try{ const url=new URL(u); return url.origin+url.pathname; }catch(e){ return String(u||'').split('?')[0]; } }
function newsNormalizeTitle(t){ return String(t||'').toLowerCase().replace(/[^\p{L}\p{N}]+/gu,''); }

/** Stage 3 — Exact Deduplication: normalized URL (tracking params stripped) and normalized title,
 * first-seen wins. On real data this is expected to remove 0 items (the backend already dedupes
 * within its own clustering) — verified separately with a synthetic fixture that it actually
 * removes a planted duplicate. */
function newsStage3Dedup(items){
  const seenUrl=new Set(), seenTitle=new Set(), out=[];
  for(const it of items){
    const u=newsNormalizeUrl(it.sourceUrl), nt=newsNormalizeTitle(it.label);
    if(u && seenUrl.has(u)) continue;
    if(nt && seenTitle.has(nt)) continue;
    if(u) seenUrl.add(u);
    if(nt) seenTitle.add(nt);
    out.push(it);
  }
  return out;
}

function newsTitleTokens(text){
  return new Set(String(text||'').toLowerCase().split(/[^\p{L}\p{N}]+/u).filter(w=>w.length>1));
}
function newsTokenOverlapRatio(a,b){
  if(a.size===0||b.size===0) return 0;
  let inter=0; for(const w of a) if(b.has(w)) inter++;
  return inter/Math.min(a.size,b.size);
}
const NEWS_CLUSTER_TOKEN_OVERLAP_MIN=0.6;
const NEWS_CLUSTER_TIME_WINDOW_MS=6*60*60*1000; // 6h

/** Stage 4 — Event Clustering: deterministic second pass, title-token overlap AND time proximity
 * both required to merge (spec: "if clustering confidence is low, keep items separate rather than
 * merging unrelated stories" — a single weak signal alone never merges). No embeddings, no AI. */
function newsStage4Cluster(items){
  const clusters=[];
  for(const it of items){
    const tokens=newsTitleTokens(newsContentText(it));
    let target=null;
    for(const c of clusters){
      const timeOk=Math.abs(c.rep.timestamp-it.timestamp)<=NEWS_CLUSTER_TIME_WINDOW_MS;
      const overlapOk=newsTokenOverlapRatio(c.tokens,tokens)>=NEWS_CLUSTER_TOKEN_OVERLAP_MIN;
      if(timeOk && overlapOk){ target=c; break; }
    }
    if(target){
      target.members.push(it);
      it.__sources.forEach(s=>target.sourcesSet.add(s));
      target.articleIds.push(it.id);
      if(it.timestamp>target.rep.timestamp) target.rep=it; // keep most-recent as representative
    }else{
      clusters.push({rep:it, tokens, members:[it], sourcesSet:new Set(it.__sources), articleIds:[it.id]});
    }
  }
  return clusters;
}

/** Stage 5 — Rule-Based Importance Score (0–100, transparent/testable, additive factors below).
 * Never scores trading direction, only importance/relevance, per spec. */
function newsStage5Score(cluster, baseSymbol, rangeLabel, now){
  const text=newsContentText(cluster.rep).toLowerCase();
  let score=0;
  if(cluster.rep.__tier==='direct') score+=30;
  else if(cluster.rep.__tier==='macro') score+=15;
  else if(cluster.rep.__tier==='indirect') score+=10;
  if([...cluster.sourcesSet].some(s=>NEWS_OFFICIAL_SOURCE_NAMES.has(s))) score+=15;
  score+=Math.min(cluster.sourcesSet.size-1,4)*5;
  const ageMs=now-cluster.rep.timestamp;
  if(ageMs<6*3600*1000) score+=15; else if(ageMs<24*3600*1000) score+=10; else if(ageMs<72*3600*1000) score+=5;
  if(NEWS_MAJOR_EVENT_KEYWORDS.some(k=>text.includes(k))) score+=20;
  if(ageMs<=newsRangeMs(rangeLabel)/2) score+=5;
  return clamp(Math.round(score),0,100);
}

/** Stages 1–6 in one call. Pure/synchronous — no network calls of its own. Two callers, two data
 * sources, same function: Research's live inline preview (news-item weight row, "查看已选择新闻事件"
 * modal) calls this with just 2 args, reading whatever loadAllLiveSources() already has in
 * Store.live.news — a cosmetic preview, fine to be Dashboard-cache-driven since it isn't part of
 * any frozen Payload. The Analysis Runner (Sprint 3.2B, startAnalysisRunner()) passes a 3rd arg —
 * the news itemsRaw it just fetched fresh via GET /api/sources/news?fresh=1 — so the real,
 * persisted selectedNewsEvents never comes from Dashboard's cache, per the Analysis Snapshot
 * Integrity decision. Returns both the pipeline stats (for the Research UI's inspection line) and
 * the final ≤10 SelectedNewsEvent list (for the payload). */
function runNewsPipeline(assetSymbol, rangeLabel, freshNewsRawItems){
  const now=Date.now();
  const raw = freshNewsRawItems || ((Store.live.news && Store.live.news.itemsRaw) ? Store.live.news.itemsRaw : []);
  const baseSymbol=newsBaseSymbol(assetSymbol);

  const afterTime=newsStage1TimeFilter(raw, rangeLabel, now);
  const afterAsset=newsStage2AssetRelevance(afterTime, baseSymbol);
  const afterDedup=newsStage3Dedup(afterAsset);
  const clusters=newsStage4Cluster(afterDedup);

  const scored=clusters.map(c=>({c, score:newsStage5Score(c, baseSymbol, rangeLabel, now)}));
  scored.sort((a,b)=>b.score-a.score);
  const top=scored.slice(0,10);

  const selectedEvents=top.map(({c,score})=>{
    const allSources=[...c.sourcesSet];
    return {
      id:c.rep.id,
      title:c.rep.label,
      summary:c.rep.detail,
      category:undefined,
      publishedAt: (typeof c.rep.timestamp==='number') ? new Date(c.rep.timestamp).toISOString() : null,
      sourceCount:allSources.length,
      sources:allSources.slice(0,5),
      importanceScore:score,
      relatedAssets:[baseSymbol],
      sourceArticleIds:c.articleIds,
    };
  });

  return {
    stats:{
      fetchedCount: raw.length,
      filteredCount: afterDedup.length,
      clusteredCount: clusters.length,
      selectedCount: selectedEvents.length,
    },
    selectedEvents,
  };
}

/* ---------- Analysis Payload (localStorage, keyed by analysisId — see qa_analysis_payloads) ---------- */
function genAnalysisId(){ return 'A'+Date.now().toString(36).toUpperCase()+Math.random().toString(36).slice(2,6).toUpperCase(); }
function loadAnalysisPayloads(){
  try{ const raw=localStorage.getItem('qa_analysis_payloads'); if(raw) return JSON.parse(raw); }catch(e){}
  return {};
}
function saveAnalysisPayloadMap(map){ localStorage.setItem('qa_analysis_payloads', JSON.stringify(map)); }
function getAnalysisPayload(analysisId){ return loadAnalysisPayloads()[analysisId]||null; }

/** ANALYSIS_PAYLOAD_SPEC.md v1.0.0's canonical field is `payloadVersion` (semver string) — this
 * function migrates the CREATE path (see buildAnalysisPayload() below) to that field name.
 * Payloads already in localStorage from before this migration still have the old `version:1`
 * field instead; they are deliberately left as-is on disk (never rewritten in place) and are only
 * ever normalized at READ time, by normalizeAnalysisPayload() (Sprint 3.1A, near the Prompt
 * Builder code) — not here, since getAnalysisPayload() itself is unchanged Sprint 2.2 code and
 * every existing caller of it still expects the raw stored shape. */
function currentPayloadVersion(){ return '1.1.0'; } // Sprint 3.3B: additive parsedContent field, see ANALYSIS_PAYLOAD_SPEC.md

/** Sprint 3.1B.2 Task 6 — these 3 snapshots list one `values` row per tracked symbol (see
 * market.ts/technical.ts/derivatives.ts's SYMBOLS.map()); a single-asset analysis has no use for
 * the other 5 assets' rows, and they were pure Prompt bloat. Every other snapshot (macro/news/etf/
 * onchain/sentiment/stablecoin/liquidation/options) isn't structured this way and is untouched. */
const ASSET_SPECIFIC_SOURCE_KEYS=['market','technical','derivatives'];

/** Filters sourceSnapshots IN PLACE, called from buildAnalysisPayload() below — its only caller.
 * Matches by exact label prefix (e.g. "BTC/USDT"), which is how market/technical/derivatives all
 * format their labels (see freshSourceResultToSnapshot() -> itemsRaw mapping). Never touches
 * `status` — a filtered-to-empty `values` on an otherwise-'available' source is still reported as
 * 'available', since the filtering is a Prompt-size choice, not a data-quality one. Dashboard is
 * unaffected: it reads Store.live/liveMeta directly, never sourceSnapshots. */
function filterSourceSnapshotsToAsset(sourceSnapshots, selectedAssetSymbol){
  sourceSnapshots.forEach(s=>{
    if(!ASSET_SPECIFIC_SOURCE_KEYS.includes(s.id)) return;
    s.values=(s.values||[]).filter(v=>typeof v.label==='string' && v.label.startsWith(selectedAssetSymbol));
  });
}

/** Sprint 3.1B.2 Task 5 — sourceSnapshots' `news` entry previously carried one `values` row per
 * fetched headline, which is the exact same news selectedNewsEvents already carries in full
 * detail — the Prompt sent every headline twice. Replaced with 4 pipeline-stage counts (already
 * computed for Research's on-page "已抓取 N 条 · 筛选/去重后 N 条…" stats line, see renderResearch())
 * — a summary, never per-article titles. selectedNewsEvents itself is passed through completely
 * untouched by this function. */
function summarizeNewsSnapshot(sourceSnapshots, newsPipelineStats){
  const newsSnap=sourceSnapshots.find(s=>s.id==='news');
  if(!newsSnap) return;
  newsSnap.values=[
    {label:'已抓取新闻总数', value:newsPipelineStats.fetchedCount},
    {label:'时间/资产筛选后', value:newsPipelineStats.filteredCount},
    {label:'聚类后事件数', value:newsPipelineStats.clusteredCount},
    {label:'已选入 selectedNewsEvents', value:newsPipelineStats.selectedCount},
  ];
}

/** Sprint 3.2B — the "existing builder" Step 7 of the Analysis Snapshot Integrity lifecycle
 * reuses: same output shape, same persistence, same weight/evidence mapping as every prior sprint.
 * What changed is the INPUT — `frozenSnapshots` is no longer computed internally from Dashboard's
 * cache (that was the bug the frozen decision identified); the caller (startAnalysisRunner(), only
 * reachable after every required source has already succeeded — see Step 6's cancel-on-failure
 * gate) hands in the snapshots it just froze from real, fresh GET /api/sources/:key?fresh=1
 * responses, and the fresh news itemsRaw so runNewsPipeline() doesn't fall back to Store.live.news.
 * Deliberately does NOT deep-copy `frozenSnapshots` (unlike the old version) — it's already a
 * private array built fresh for this one call, never shared with or read from Store.live/liveMeta,
 * so there's nothing left for a later Dashboard refresh to accidentally mutate. */
function buildAnalysisPayload(frozenSnapshots, freshNewsRawItems, parsedEvidenceByEvidenceId){
  const d=Store.draft;
  const sourceSnapshots=frozenSnapshots;
  const pipeline=runNewsPipeline(d.asset, d.range, freshNewsRawItems);
  filterSourceSnapshotsToAsset(sourceSnapshots, d.asset);
  summarizeNewsSnapshot(sourceSnapshots, pipeline.stats);

  const sourceWeights={};
  d.weights.forEach(w=>{ sourceWeights[w.key]=Number(w.weight); });

  // Sprint 3.3B: parsedContent (ANALYSIS_PAYLOAD_SPEC.md v1.1.0's additive field) — populated only
  // when the Image Evidence Parser already successfully structured this evidence item during the
  // Analysis Runner's evidence stage (see arValidateEvidenceStage()). Original identity/metadata
  // fields (id/type/title/content/reference/weight) are unchanged — parsedContent is added, never
  // substituted for them.
  const additionalEvidence=d.evidence.map(ev=>{
    const item={
      id:ev.id, type:ev.type, title:ev.label||undefined, content:ev.desc||undefined,
      reference:ev.fileName||undefined, weight:Number(ev.weight),
    };
    const parsed=parsedEvidenceByEvidenceId && parsedEvidenceByEvidenceId[ev.id];
    if(parsed) item.parsedContent=parsed;
    return item;
  });

  const payload={
    analysisId:genAnalysisId(),
    createdAt:new Date().toISOString(),
    payloadVersion:currentPayloadVersion(),
    symbol:d.asset,
    timeframe:d.timeframe,
    dateRange:d.range,
    sourceWeights,
    additionalEvidence,
    sourceSnapshots,
    selectedNewsEvents:pipeline.selectedEvents,
    // Sprint 3.2B: unavailableSources will always be [] here now — a source that failed collection
    // never reaches this function at all (Step 6 cancels the whole analysis first, see
    // startAnalysisRunner()). staleSources will always be [] too — freshSourceResultToSnapshot()
    // never produces 'stale', since every snapshot was fetched moments ago as part of this run.
    // Both fields are kept for ANALYSIS_PAYLOAD_SPEC.md shape compatibility. partialSources (stub
    // sources) can still be non-empty — a stub response is real and valid, just data-limited.
    dataQuality:{
      unavailableSources:sourceSnapshots.filter(s=>s.status==='unavailable').map(s=>s.id),
      partialSources:sourceSnapshots.filter(s=>s.status==='partial').map(s=>s.id),
      staleSources:sourceSnapshots.filter(s=>s.status==='stale').map(s=>s.id),
    },
  };

  const map=loadAnalysisPayloads();
  map[payload.analysisId]=payload;
  saveAnalysisPayloadMap(map);
  return payload;
}

/* ---------- Sprint 3.1A: Prompt Builder (2026-08-07) ----------
   Implements PROMPT_BUILDER_SPEC.md v1.1.0: Analysis Payload -> deterministic Prompt Record.
   Stops here — no AI Engine, no HTTP call, no response parsing (out of scope this sprint).
   Kept in this same file (not a /prompts/*.js split) because the whole frontend is one static
   HTML file with no bundler and no <script src> — splitting would require introducing exactly
   the build tooling PROMPT_BUILDER_SPEC.md's own file-structure note says to avoid if it doesn't
   fit the current architecture. Section functions below stand in for the suggested
   systemPrompt.js/tradingRules.js/outputContract.js/builder.js. */

/** ANALYSIS_PAYLOAD_SPEC.md's canonical payloadVersion, applied at READ time only — never
 * mutates what's in localStorage. A payload created before this migration has `version:1`
 * instead of `payloadVersion`; this function is the ONLY place that gap gets papered over, and
 * only for callers (the Prompt Builder) that need the canonical shape. */
function normalizeAnalysisPayload(raw){
  if(!raw) return null;
  if(raw.payloadVersion) return raw;
  if(raw.version){ const {version,...rest}=raw; return {...rest, payloadVersion:'1.0.0'}; }
  return raw;
}

function promptBuilderError(code,message){ const e=new Error(message); e.code=code; e.devError=true; return e; }

/** Fails loudly and specifically per PROMPT_BUILDER_SPEC.md's Error Handling section — the only
 * "repair" performed is the legacy version->payloadVersion normalization above; everything else
 * here is a hard requirement, not a best-effort guess. */
function validateNormalizedPayload(p){
  if(!p) throw promptBuilderError('no_payload','没有可用的 Analysis Payload');
  if(!p.payloadVersion) throw promptBuilderError('payload_not_normalized','Payload 无法归一化为 payloadVersion');
  const required=['analysisId','createdAt','symbol','timeframe','dateRange'];
  for(const f of required) if(!p[f]) throw promptBuilderError('missing_field','缺少必填字段：'+f);
  if(!p.sourceWeights || typeof p.sourceWeights!=='object' || Array.isArray(p.sourceWeights)) throw promptBuilderError('malformed_source_weights','sourceWeights 格式不正确');
  if(!Array.isArray(p.additionalEvidence)) throw promptBuilderError('malformed_additional_evidence','additionalEvidence 必须是数组');
  if(!Array.isArray(p.sourceSnapshots)) throw promptBuilderError('malformed_source_snapshots','sourceSnapshots 必须是数组');
  if(!Array.isArray(p.selectedNewsEvents)) throw promptBuilderError('malformed_selected_news_events','selectedNewsEvents 必须是数组');
  if(!p.dataQuality || typeof p.dataQuality!=='object') throw promptBuilderError('malformed_data_quality','dataQuality 格式不正确');
}

/** Section 3 — deterministic JSON dump of the required Payload fields, in a FIXED key order

}

/** Orchestrates the 4 fixed-order sections into one deterministic prompt string. Never embeds
 * Date.now()/new Date() — the only timestamp that can appear is the Payload's own createdAt,
 * already inside buildPayloadSection()'s JSON dump. generatedAt lives on the PromptRecord
 * wrapper, never inside promptText itself (PROMPT_BUILDER_SPEC.md's determinism principle). */
function buildPromptText(normalizedPayload){
  return [
    buildSystemPromptSection(),
    buildTradingRulesSection(),
    buildPayloadSection(normalizedPayload),
    buildOutputContractSection(),
  ].join('\n\n---\n\n');
}

/* ---------- Prompt Record persistence (localStorage, keyed by analysisId — qa_prompt_records) ---------- */
function loadPromptRecords(){
  try{ const raw=localStorage.getItem('qa_prompt_records'); if(raw) return JSON.parse(raw); }catch(e){}
  return {};
}
function savePromptRecordMap(map){ localStorage.setItem('qa_prompt_records', JSON.stringify(map)); }
function getPromptRecordByAnalysisId(analysisId){ return loadPromptRecords()[analysisId]||null; }
function savePromptRecord(record){
  const map=loadPromptRecords();
  map[record.analysisId]=record;
  savePromptRecordMap(map);
  return record;
}

/** Builds (or returns the already-existing) immutable PromptRecord for one AnalysisPayload.
 * Idempotent by design: a second call for the same analysisId never rebuilds or overwrites —
 * it returns the exact record persisted the first time, preserving its original generatedAt. */
function buildPromptRecord(payload){
  if(!payload) throw promptBuilderError('no_payload','没有可用的 Analysis Payload');
  const existing=getPromptRecordByAnalysisId(payload.analysisId);
  if(existing) return existing;

  const normalized=normalizeAnalysisPayload(payload);
  validateNormalizedPayload(normalized);

  const record={
    analysisId:normalized.analysisId,
    promptVersion:PROMPT_VERSION,
    payloadVersion:normalized.payloadVersion,
    generatedAt:new Date().toISOString(),
    promptText:buildPromptText(normalized),
  };
  return savePromptRecord(record);
}

/** Multiple attempts per analysisId are preserved as a growing array — never overwritten,

/* ---------- Sprint 3.2C: AI Response Parser (2026-08-08); rewritten for v2 in Sprint 3.3D-A ----------
   Implements AI_RESPONSE_SPEC.md v2.0.0: AIRawResult -> JSON parse -> schema validation ->
   cross-validation against the originating AnalysisPayload -> AIResponseRecord.
   Lives in this file for the same reason the Prompt Builder does (see Sprint 3.1A's note above
   buildPromptText()): one static frontend file, no bundler, no module system.
   Every validation function here is a pure function of its explicit arguments — no Store reads,
   no DOM access — matching AIResponseParserInput {rawResult, payload, promptVersion} exactly, so
   the whole pipeline is independently testable outside a browser.
   Scope: parses/validates/persists only. Never wired to Strategy — see AI_RESPONSE_SPEC.md's
   Scope and Governance section for why that stays a future sprint.
   Sprint 3.3D-A: clean major-version cutover, no dual v1/v2 support (per that sprint's own
   explicit instruction) — historical major-1 AIResponseRecords remain stored, unmigrated,
   unreparsed; this Parser only ever accepts major=2 going forward. */

const AI_RESPONSE_SUPPORTED_MAJOR=2;
const AI_RESPONSE_SUPPORTED_MAX_MINOR=2; // AI_RESPONSE_SPEC.md v2.2.0's Compatible Minor-Version Policy (Sprint 3.5D-B.1) — 2.0.0/2.1.0 records remain valid (additive-tightening, same precedent as the 2.0.0->2.1.0 bump), 2.2.0 is the current ceiling
const AI_RESPONSE_SYSTEM_SOURCE_KEYS=WEIGHT_DEFS.map(w=>w.key); // reuse the canonical 11 keys, never a second hardcoded list

/** Structured parser error — code/message/details only, mirrors engine.ts's classifyError() shape
 * on the backend side. Never carries a key/header/secret; details are always plain identifiers,
 * counts, or the offending value, never raw provider output beyond what's already in rawText. */
function parserError(code,message,details){
  const e=new Error(message);
  e.code=code;
  if(details!==undefined) e.details=details;
  e.isParserError=true;
  return e;
}

function isFiniteNumber(v){ return typeof v==='number' && Number.isFinite(v); }
function isNonEmptyString(v){ return typeof v==='string' && v.trim().length>0; }
function isPlainObject(v){ return v!==null && typeof v==='object' && !Array.isArray(v); }
function inRange0to100(v){ return isFiniteNumber(v) && v>=0 && v<=100; }
function isNonEmptyStringArray(v){ return Array.isArray(v) && v.length>0 && v.every(isNonEmptyString); }

/* ---- Step 1: reject if the raw AI request itself was not successful ---- */
function assertRawResultSucceeded(rawResult){
  if(!rawResult || rawResult.status!=='success'){
    throw parserError('raw_request_failed','AIRawResult 未成功，无法解析',{status:rawResult&&rawResult.status,error:rawResult&&rawResult.error});
  }
  if(!isNonEmptyString(rawResult.rawText)){
    throw parserError('empty_response','AIRawResult.rawText 为空');
  }
}

/* ---- Step 2: strict JSON parse — first implementation, no repair, no fence stripping.
   JSON.parse() itself already rejects markdown fences, leading/trailing text, and malformed
   JSON — no extra regex needed. rawText is never mutated before this call (Raw Response
   Preservation, AI_RESPONSE_SPEC.md v1.2.0) — parsing failure still leaves rawText untouched in
   the caller's AIRawResult. ---- */
function strictParseJson(rawText){
  let parsed;
  try{ parsed=JSON.parse(rawText); }
  catch(err){ throw parserError('invalid_json','原始响应不是合法 JSON：'+err.message,{rawTextLength:rawText.length}); }
  if(!isPlainObject(parsed)){
    throw parserError('invalid_json','原始响应必须是一个 JSON 对象（不能是数组/字符串/数字等）');
  }
  return parsed;
}

/* ---- Step 3: response version — checked before deep schema validation, since an unsupported
   major/minor makes the rest of the schema inapplicable by definition. ---- */
function validateResponseVersion(responseVersion){
  const m=/^(\d+)\.(\d+)\.(\d+)$/.exec(String(responseVersion));
  if(!m) throw parserError('unsupported_response_version','responseVersion 格式不正确（需要 semver 字符串）：'+responseVersion,{responseVersion});
  const major=Number(m[1]), minor=Number(m[2]);
  if(major!==AI_RESPONSE_SUPPORTED_MAJOR || minor>AI_RESPONSE_SUPPORTED_MAX_MINOR){
    throw parserError('unsupported_response_version','不受支持的 responseVersion：'+responseVersion+'（支持 major='+AI_RESPONSE_SUPPORTED_MAJOR+'，minor<='+AI_RESPONSE_SUPPORTED_MAX_MINOR+'）',{responseVersion,supportedMajor:AI_RESPONSE_SUPPORTED_MAJOR,supportedMaxMinor:AI_RESPONSE_SUPPORTED_MAX_MINOR});
  }
}

/* ---- Step 4: schema validation — root fields, nested types, enums, numeric ranges, array caps.
   Strict typing throughout: e.g. a JSON string "69" fails isFiniteNumber() (typeof !== 'number')
   and is correctly rejected rather than coerced. ---- */
function validateRootFieldsPresent(r){
  const required=['responseVersion','analysisId','summary','decision','scenarioPlans','sourceAssessments','reasoning','risks','evidence'];
  for(const f of required){
    if(!(f in r)) throw parserError('schema_validation_failed','缺少必填字段：'+f,{field:f});
  }
  if(!isNonEmptyString(r.responseVersion)) throw parserError('schema_validation_failed','responseVersion 必须是非空字符串');
  if(!isNonEmptyString(r.analysisId)) throw parserError('schema_validation_failed','analysisId 必须是非空字符串');
}

/* ---- v2.1 (Sprint 3.3D-C): ScenarioPlan shape. entry/stopLoss/takeProfit are no longer nullable/
   empty for ANY plan (including WAIT's) — AI_RESPONSE_SPEC.md v2.1.0's completeness rule: "every
   ScenarioPlan is a complete trading plan," universal, not action-dependent. A value-less field
   still allows a description-only fallback (Numeric Precision rule, unchanged) — only the
   containing object/array itself may no longer be null/empty. ENTER's STRICTER numeric-value
   requirement remains a separate cross-rule (validateScenarioPlansCrossRules below), since it
   needs decision.action, not just shape. ---- */
function validateScenarioEntryShape(entry,i){
  if(!isPlainObject(entry)) throw parserError('schema_validation_failed','scenarioPlans['+i+'].entry 必须是对象（v2.1 起不允许 null）',{index:i});
  if(!['MARKET','LIMIT','ZONE','CONDITIONAL'].includes(entry.type)) throw parserError('schema_validation_failed','scenarioPlans['+i+'].entry.type 非法枚举值',{index:i,value:entry.type});
  for(const f of ['value','from','to']){
    const v=entry[f];
    if(v!==undefined && v!==null && !isFiniteNumber(v)){
      throw parserError('schema_validation_failed','scenarioPlans['+i+'].entry.'+f+' 必须是数字、null 或省略',{index:i,field:f,value:v});
    }
  }
  if(entry.description!==undefined && entry.description!==null && !isNonEmptyString(entry.description)){
    throw parserError('schema_validation_failed','scenarioPlans['+i+'].entry.description 如提供必须是非空字符串',{index:i});
  }
  if(entry.type==='CONDITIONAL' && !isNonEmptyString(entry.description)){
    throw parserError('schema_validation_failed','scenarioPlans['+i+'].entry.type=CONDITIONAL 时必须提供非空的 description',{index:i});
  }
}
function validateScenarioStopLossShape(sl,i){
  if(!isPlainObject(sl)) throw parserError('schema_validation_failed','scenarioPlans['+i+'].stopLoss 必须是对象（v2.1 起不允许 null）',{index:i});
  if(sl.value!==undefined && sl.value!==null && !isFiniteNumber(sl.value)) throw parserError('schema_validation_failed','scenarioPlans['+i+'].stopLoss.value 必须是数字、null 或省略',{index:i});
  if(sl.description!==undefined && sl.description!==null && !isNonEmptyString(sl.description)) throw parserError('schema_validation_failed','scenarioPlans['+i+'].stopLoss.description 如提供必须是非空字符串',{index:i});
  if(sl.value==null && !isNonEmptyString(sl.description)) throw parserError('schema_validation_failed','scenarioPlans['+i+'].stopLoss 必须提供 value 或 description 中至少一项有意义的内容',{index:i});
}
function validateScenarioTakeProfitItemShape(tp,i,j){
  if(!isPlainObject(tp)) throw parserError('schema_validation_failed','scenarioPlans['+i+'].takeProfit['+j+'] 必须是对象',{index:i,j});
  if(tp.value!==undefined && tp.value!==null && !isFiniteNumber(tp.value)) throw parserError('schema_validation_failed','scenarioPlans['+i+'].takeProfit['+j+'].value 必须是数字、null 或省略',{index:i,j});
  if(tp.description!==undefined && tp.description!==null && !isNonEmptyString(tp.description)) throw parserError('schema_validation_failed','scenarioPlans['+i+'].takeProfit['+j+'].description 如提供必须是非空字符串',{index:i,j});
  if(tp.value==null && !isNonEmptyString(tp.description)) throw parserError('schema_validation_failed','scenarioPlans['+i+'].takeProfit['+j+'] 必须提供 value 或 description 中至少一项有意义的内容',{index:i,j});
}

/* ---- v2.1 (Sprint 3.3D-C): controlled machine-metric vocabulary. This is a PROGRAM-side list,
   never an AI-declared capability (AI_RESPONSE_SPEC.md v2.1.0 explicitly forbids a machineExecutable
   field from the model) — the Parser is the sole authority on which metrics/operators it accepts. ---- */
const TRIGGER_ALLOWED_METRICS=['price','candle_close'];
const TRIGGER_ALLOWED_OPERATORS=['GT','GTE','LT','LTE','BETWEEN','CROSSES_ABOVE','CROSSES_BELOW','EQUALS'];
function validateTriggerCondition(cond,i,context){
  if(!isPlainObject(cond)) throw parserError('schema_validation_failed',context+' 必须是对象',{index:i});
  if(!TRIGGER_ALLOWED_METRICS.includes(cond.metric)) throw parserError('schema_validation_failed',context+' 使用了不受支持的 metric（仅支持 price / candle_close）：'+cond.metric,{index:i,metric:cond.metric});
  if(!TRIGGER_ALLOWED_OPERATORS.includes(cond.operator)) throw parserError('schema_validation_failed',context+' 使用了不受支持的 operator',{index:i,operator:cond.operator});
  const op=cond.operator;
  if(op==='BETWEEN'){
    if(!isFiniteNumber(cond.min) || !isFiniteNumber(cond.max)) throw parserError('schema_validation_failed',context+' 的 BETWEEN 需要有效数字 min 与 max',{index:i});
    if(cond.min>cond.max) throw parserError('schema_validation_failed',context+' 的 BETWEEN min 不能大于 max',{index:i,min:cond.min,max:cond.max});
  }else{
    if(!isFiniteNumber(cond.value)) throw parserError('schema_validation_failed',context+' 的 '+op+' 需要一个有效数字 value（不接受字符串强转）',{index:i,operator:op,value:cond.value});
  }
  if(cond.metric==='candle_close'){
    if(!isNonEmptyString(cond.timeframe)) throw parserError('schema_validation_failed',context+' 的 candle_close 条件必须提供非空 timeframe',{index:i});
  }else if(cond.metric==='price'){
    if(cond.timeframe!=null && cond.timeframe!=='') throw parserError('schema_validation_failed',context+' 的 price 条件的 timeframe 应为 null 或省略',{index:i,timeframe:cond.timeframe});
  }
}
/** Shared shape for triggerStructured AND invalidation (both are `StructuredTrigger | null`,
 * AI_RESPONSE_SPEC.md v2.1.0) — one validator, two call sites, no duplicated logic. */
function validateStructuredTrigger(st,i,fieldLabel){
  if(st===null || st===undefined) return;
  if(!isPlainObject(st)) throw parserError('schema_validation_failed','scenarioPlans['+i+'].'+fieldLabel+' 必须是对象或 null',{index:i});
  if(!isNonEmptyString(st.description)) throw parserError('schema_validation_failed','scenarioPlans['+i+'].'+fieldLabel+'.description 必须是非空字符串',{index:i});
  if(!['ALL','ANY'].includes(st.logic)) throw parserError('schema_validation_failed','scenarioPlans['+i+'].'+fieldLabel+'.logic 非法枚举值',{index:i,value:st.logic});
  if(!Array.isArray(st.conditions) || st.conditions.length<1) throw parserError('schema_validation_failed','scenarioPlans['+i+'].'+fieldLabel+'.conditions 必须至少包含一项',{index:i});
  st.conditions.forEach((c,j)=>validateTriggerCondition(c,i,'scenarioPlans['+i+'].'+fieldLabel+'.conditions['+j+']'));
}
function validateReviewHorizonShape(rh,i){
  if(rh===null || rh===undefined) return;
  if(!isPlainObject(rh)) throw parserError('schema_validation_failed','scenarioPlans['+i+'].reviewHorizon 必须是对象或 null',{index:i});
  if(!isNonEmptyString(rh.description)) throw parserError('schema_validation_failed','scenarioPlans['+i+'].reviewHorizon.description 必须是非空字符串',{index:i});
  // Sprint 3.5D-B.1, Task 13/14 — whenever expiresAt IS provided (by any plan, not just PRIMARY), it
  // must be a real, timezone/offset-qualified ISO-8601 timestamp — a bare "2026-08-10 17:00" with no
  // zone is never valid, regardless of which plan carries it.
  if(rh.expiresAt!==undefined && rh.expiresAt!==null && !isValidAbsoluteTimestamp(rh.expiresAt)){
    throw parserError('schema_validation_failed','scenarioPlans['+i+'].reviewHorizon.expiresAt 如提供必须是带时区/偏移的有效 ISO-8601 绝对时间戳',{index:i,value:rh.expiresAt});
  }
}

/** Sprint 3.3D-C, Task 28 — pure, system-side "does this already-validated triggerStructured use
 * only the supported metric/operator vocabulary" check, for a Strategy UI status badge only.
 * Reuses the same controlled lists the Parser itself enforces — never trusts an AI-declared
 * capability flag (AI_RESPONSE_SPEC.md v2.1.0 has no such field; the system alone decides
 * evaluability). No monitoring, no timers, no data fetches, no Execution Engine — this function
 * answers nothing about whether a Trigger Monitor exists (it doesn't; not implemented this sprint). */
function isMachineEvaluableTrigger(triggerStructured){
  if(!triggerStructured || !Array.isArray(triggerStructured.conditions) || triggerStructured.conditions.length<1) return false;
  return triggerStructured.conditions.every(c=>c && TRIGGER_ALLOWED_METRICS.includes(c.metric) && TRIGGER_ALLOWED_OPERATORS.includes(c.operator));
}

/** Sprint 3.5D-B.1 — ISO-8601 timestamp WITH an explicit timezone/offset marker (trailing `Z`, or a
 * `+HH:MM`/`-HH:MM`/`+HHMM`/`-HHMM` offset). A bare "2026-08-10 17:00" with no zone is deliberately
 * rejected (Task 13/14) — `new Date()` would silently assume the *browser's* local zone, which is
 * exactly the ambiguity this rule exists to prevent. */
function isValidAbsoluteTimestamp(s){
  if(!isNonEmptyString(s)) return false;
  const d=new Date(s);
  if(isNaN(d.getTime())) return false;
  return /Z$|[+-]\d{2}:?\d{2}$/.test(s.trim());
}

/** Sprint 3.5D-B.1, Task 6 — the one numeric reference price used ONLY for the directional stop/TP
 * sanity check, never for order creation (ZONE order price resolution remains the user's own
 * ExecutionDraft.userOverrides.orderResolution, Task 23 — completely separate mechanism). MARKET has
 * no reference price by design (Task 3 — a market order's execution price isn't known in advance),
 * so directional sanity is simply skipped for MARKET/CONDITIONAL entries — there is nothing to check
 * a stop/TP against, not a validation gap. */
function getScenarioEntryReferencePrice(entry){
  if(!entry) return null;
  if(entry.type==='LIMIT') return isFiniteNumber(entry.value) ? entry.value : null;
  if(entry.type==='ZONE') return (isFiniteNumber(entry.from) && isFiniteNumber(entry.to)) ? (entry.from+entry.to)/2 : null;
  return null;
}

/** Sprint 3.5D-B.1, Task 20 — THE single execution-readiness authority, reused verbatim by the
 * Parser's PRIMARY cross-rule (so a newly-submitted response that fails this can never be persisted),
 * Strategy's 手动执行/触发时提醒 buttons, the Execution page guard, and TESTNET submission eligibility
 * (Task 27) — never a second, independently-drifting implementation of "is this plan numerically
 * complete." `referenceTime` is whatever instant the caller wants `expiresAt` checked against: the
 * Parser passes the analysis's own generation instant (Task 14 — "expiresAt <= analysis time"
 * rejects a nonsensical AI output); UI call sites pass the real current time (a plan can go stale
 * between when it was generated and when a user tries to act on it much later — Task 24's "historical
 * response cannot execute" falls naturally out of this same check, no special-casing needed). Historical
 * records are NEVER re-validated by the Parser (unchanged precedent) — this function only runs against
 * them at USE time (Strategy/Execution/TESTNET), never rewrites or migrates them. */
function evaluateScenarioExecutionReadiness(scenario, decision, referenceTime){
  const reasons=[];
  if(!scenario) return {ready:false, reasons:['方案不存在']};
  const isPrimary=scenario.priority==='PRIMARY';
  const isPrimaryEnterNow=isPrimary && decision && decision.action==='ENTER';
  const isPrimaryWait=isPrimary && decision && decision.action==='WAIT';

  const entry=scenario.entry;
  if(!entry || !['MARKET','LIMIT','ZONE','CONDITIONAL'].includes(entry.type)){
    reasons.push('缺少有效的入场类型');
  }else if(entry.type==='CONDITIONAL'){
    // Task 3 — CONDITIONAL is no longer a valid FINAL execution parameter for any plan. A future
    // condition belongs in triggerStructured; entry itself must still be a numeric LIMIT/ZONE.
    reasons.push('入场类型为 CONDITIONAL（纯文字描述），不满足可执行数值要求，应改用带数值的 LIMIT/ZONE，条件逻辑放入 triggerStructured');
  }else if(entry.type==='MARKET'){
    if(!isPrimaryEnterNow) reasons.push('MARKET 入场仅允许用于当前可立即执行的 PRIMARY 方案（decision.action=ENTER）');
  }else if(entry.type==='LIMIT'){
    if(!isFiniteNumber(entry.value) || entry.value<=0) reasons.push('LIMIT 入场缺少有效的数值价格（entry.value）');
  }else if(entry.type==='ZONE'){
    if(!isFiniteNumber(entry.from) || !isFiniteNumber(entry.to) || entry.from<=0 || entry.to<=0) reasons.push('ZONE 入场缺少有效的数值区间（entry.from/entry.to）');
    else if(entry.from>entry.to) reasons.push('ZONE 入场的 from 不能大于 to');
  }

  if(!scenario.stopLoss || !isFiniteNumber(scenario.stopLoss.value) || scenario.stopLoss.value<=0){
    reasons.push('缺少有效的数值止损（stopLoss.value）——文字描述不满足可执行要求');
  }

  const tp=Array.isArray(scenario.takeProfit) ? scenario.takeProfit : [];
  const numericTp=tp.filter(t=>t && isFiniteNumber(t.value) && t.value>0);
  if(numericTp.length===0){
    reasons.push('缺少至少一个有效的数值止盈目标（takeProfit[].value）——文字描述不满足可执行要求');
  }

  const rh=scenario.reviewHorizon;
  let expiresAtTime=null;
  if(!rh || !isValidAbsoluteTimestamp(rh.expiresAt)){
    reasons.push('缺少有效的带时区绝对到期时间（reviewHorizon.expiresAt）');
  }else{
    expiresAtTime=new Date(rh.expiresAt).getTime();
  }

  if(isPrimaryWait && !isMachineEvaluableTrigger(scenario.triggerStructured)){
    reasons.push('WAIT 方案的 PRIMARY 缺少可机器判定的数值触发条件（triggerStructured）');
  }

  const refPrice=getScenarioEntryReferencePrice(entry);
  if(refPrice!=null && scenario.stopLoss && isFiniteNumber(scenario.stopLoss.value)){
    const slVal=scenario.stopLoss.value;
    if(scenario.direction==='LONG' && slVal>=refPrice) reasons.push('LONG 方案的止损（'+slVal+'）不应高于或等于入场参考价（'+refPrice+'）');
    if(scenario.direction==='SHORT' && slVal<=refPrice) reasons.push('SHORT 方案的止损（'+slVal+'）不应低于或等于入场参考价（'+refPrice+'）');
  }
  if(refPrice!=null){
    numericTp.forEach(t=>{
      if(scenario.direction==='LONG' && t.value<=refPrice) reasons.push('LONG 方案存在止盈目标（'+t.value+'）不高于入场参考价（'+refPrice+'）');
      if(scenario.direction==='SHORT' && t.value>=refPrice) reasons.push('SHORT 方案存在止盈目标（'+t.value+'）不低于入场参考价（'+refPrice+'）');
    });
  }

  if(expiresAtTime!=null && referenceTime){
    const refTime=referenceTime instanceof Date ? referenceTime.getTime() : new Date(referenceTime).getTime();
    if(expiresAtTime<=refTime) reasons.push('该方案的有效期（expiresAt）已过');
  }

  return {ready:reasons.length===0, reasons};
}

function validateScenarioPlanItemShape(sp,i){
  if(!isPlainObject(sp)) throw parserError('schema_validation_failed','scenarioPlans['+i+'] 必须是对象',{index:i});
  if(!isNonEmptyString(sp.id)) throw parserError('schema_validation_failed','scenarioPlans['+i+'].id 必须是非空字符串',{index:i});
  if(!['PRIMARY','ALTERNATIVE','INVALIDATION'].includes(sp.priority)) throw parserError('schema_validation_failed','scenarioPlans['+i+'].priority 非法枚举值',{index:i,value:sp.priority});
  if(!['LONG','SHORT'].includes(sp.direction)) throw parserError('schema_validation_failed','scenarioPlans['+i+'].direction 非法枚举值',{index:i,value:sp.direction});
  if(sp.action!=='ENTER') throw parserError('schema_validation_failed','scenarioPlans['+i+'].action 必须是 "ENTER"',{index:i,value:sp.action});
  if(!isNonEmptyString(sp.title)) throw parserError('schema_validation_failed','scenarioPlans['+i+'].title 必须是非空字符串',{index:i});
  if(!isNonEmptyString(sp.trigger)) throw parserError('schema_validation_failed','scenarioPlans['+i+'].trigger 必须是非空字符串',{index:i});
  if(sp.holdingPeriod!==undefined && !isNonEmptyString(sp.holdingPeriod)) throw parserError('schema_validation_failed','scenarioPlans['+i+'].holdingPeriod 如提供必须是非空字符串',{index:i});
  validateScenarioEntryShape(sp.entry,i);
  validateScenarioStopLossShape(sp.stopLoss,i);
  if(!Array.isArray(sp.takeProfit) || sp.takeProfit.length<1) throw parserError('schema_validation_failed','scenarioPlans['+i+'].takeProfit 至少需要一项（v2.1 起不允许空数组）',{index:i});
  sp.takeProfit.forEach((tp,j)=>validateScenarioTakeProfitItemShape(tp,i,j));
  if(!isNonEmptyString(sp.rationale)) throw parserError('schema_validation_failed','scenarioPlans['+i+'].rationale 必须是非空字符串',{index:i});
  if(!isNonEmptyStringArray(sp.evidenceReferences)) throw parserError('schema_validation_failed','scenarioPlans['+i+'].evidenceReferences 必须是至少含一项的字符串数组',{index:i});
  validateStructuredTrigger(sp.triggerStructured,i,'triggerStructured');
  validateStructuredTrigger(sp.invalidation,i,'invalidation');
  validateReviewHorizonShape(sp.reviewHorizon,i);
  if(sp.priority==='PRIMARY' && (!sp.reviewHorizon || !isNonEmptyString(sp.reviewHorizon.description))){
    throw parserError('schema_validation_failed','scenarioPlans['+i+']：PRIMARY 方案必须提供 reviewHorizon 且 description 非空',{index:i});
  }
}

function validateAiResponseSchema(r){
  if(!isPlainObject(r.summary)) throw parserError('schema_validation_failed','summary 必须是对象');
  if(!isNonEmptyString(r.summary.title)) throw parserError('schema_validation_failed','summary.title 必须是非空字符串');
  if(!isNonEmptyString(r.summary.content)) throw parserError('schema_validation_failed','summary.content 必须是非空字符串');
  const summaryWordCount=r.summary.content.trim().split(/\s+/).length;
  if(summaryWordCount>150) throw parserError('schema_validation_failed','summary.content 超过 150 词上限',{wordCount:summaryWordCount});

  if(!isPlainObject(r.decision)) throw parserError('schema_validation_failed','decision 必须是对象');
  if(!['LONG','SHORT'].includes(r.decision.direction)) throw parserError('schema_validation_failed','decision.direction 非法枚举值（v2 不再允许 NEUTRAL）',{value:r.decision.direction});
  if(!['ENTER','WAIT'].includes(r.decision.action)) throw parserError('schema_validation_failed','decision.action 非法枚举值（v2 不再允许 EXIT/REDUCE）',{value:r.decision.action});
  if(!inRange0to100(r.decision.confidence)) throw parserError('schema_validation_failed','decision.confidence 必须是 0-100 之间的数字',{value:r.decision.confidence});

  if(!Array.isArray(r.scenarioPlans)) throw parserError('schema_validation_failed','scenarioPlans 必须是数组');
  r.scenarioPlans.forEach(validateScenarioPlanItemShape);

  if(!Array.isArray(r.sourceAssessments)) throw parserError('schema_validation_failed','sourceAssessments 必须是数组');
  r.sourceAssessments.forEach(validateSourceAssessmentItemShape);

  if(!Array.isArray(r.reasoning)) throw parserError('schema_validation_failed','reasoning 必须是数组');
  if(r.reasoning.length>5) throw parserError('schema_validation_failed','reasoning 最多 5 项，实际 '+r.reasoning.length+' 项',{count:r.reasoning.length});
  r.reasoning.forEach(validateReasoningItemShape);

  if(!Array.isArray(r.risks)) throw parserError('schema_validation_failed','risks 必须是数组');
  if(r.risks.length>5) throw parserError('schema_validation_failed','risks 最多 5 项，实际 '+r.risks.length+' 项',{count:r.risks.length});
  r.risks.forEach(validateRiskItemShape);

  if(!Array.isArray(r.evidence)) throw parserError('schema_validation_failed','evidence 必须是数组');
  r.evidence.forEach(validateEvidenceReferenceItemShape);
}

/* ---- Step 5 (v2.0 Sprint 3.3D-A, tightened v2.1 Sprint 3.3D-C): scenario-plan cross rules — needs
   decision.action, not just shape. Cardinality (1-3, exactly one PRIMARY) applies to every response
   regardless of action. ENTER-executability applies only to the PRIMARY plan when
   decision.action==='ENTER', and is STRICTER than the universal v2.1 shape completeness rules
   above (entry.type restricted to MARKET/LIMIT/ZONE with real numeric values, not just "an object
   exists"). WAIT's PRIMARY is already guaranteed a complete plan by the universal shape rules
   (non-null entry/stopLoss, non-empty takeProfit, required reviewHorizon) — no separate WAIT
   branch is needed here, since v2.1 completeness is action-independent by design. ---- */
/* ---- Sprint 3.5D-B.1: PRIMARY must ALWAYS be numerically execution-ready — for ENTER and WAIT
   alike (Task 2/7 — "WAIT does NOT excuse missing numbers"). Reuses evaluateScenarioExecutionReadiness()
   verbatim (Task 20 — never a second, diverging implementation) rather than reimplementing the
   entry/stopLoss/takeProfit/expiresAt/directional-sanity/WAIT-trigger checks here. `holdingPeriod`
   remains a SEPARATE, ENTER-only rule unchanged from the pre-3.5D-B.1 Parser — it was never part of
   this sprint's numeric-scenario scope, so it is intentionally not folded into the shared readiness
   helper (which is also reused by non-Parser call sites that have no reason to know about it). ---- */
function validateScenarioPlansCrossRules(r,analysisTime){
  const plans=r.scenarioPlans;
  if(plans.length<1 || plans.length>3) throw parserError('schema_validation_failed','scenarioPlans 数量必须在 1-3 之间，实际 '+plans.length,{count:plans.length});
  const primaries=plans.filter(p=>p.priority==='PRIMARY');
  if(primaries.length!==1) throw parserError('schema_validation_failed','scenarioPlans 必须恰好包含 1 个 PRIMARY，实际 '+primaries.length,{count:primaries.length});
  const primary=primaries[0];

  const readiness=evaluateScenarioExecutionReadiness(primary, r.decision, analysisTime);
  if(!readiness.ready){
    throw parserError('schema_validation_failed','PRIMARY 方案未满足数值执行就绪要求：'+readiness.reasons.join('；'),{reasons:readiness.reasons});
  }
  if(r.decision.action==='ENTER' && !isNonEmptyString(primary.holdingPeriod)){
    throw parserError('schema_validation_failed','ENTER 决策的 PRIMARY 方案必须提供非空的 holdingPeriod');
  }
}

/* ---- Step 6: analysisId must match the originating Analysis Payload exactly — never repaired. ---- */
function validateAnalysisIdMatch(r,payload){
  if(r.analysisId!==payload.analysisId){
    throw parserError('analysis_id_mismatch','AIResponse.analysisId 与 Analysis Payload 不匹配',{responseAnalysisId:r.analysisId,payloadAnalysisId:payload.analysisId});
  }
}

/* ---- Step 7 (v2, Sprint 3.3D-A): SourceAssessment cross-validation against payload.sourceWeights /
   additionalEvidence. AI_RESPONSE_SPEC.md v2.0.0's Completeness rule (renamed from WeightContribution
   Completeness, same rule): every system source with configuredWeight > 0 must appear exactly once;
   additionalEvidence sources remain optional. No influenceScore/influenceLevel to sanity-check
   anymore (v2 dropped those fields entirely) — direction/evidenceStrength have no numeric "must be
   zero for a zero-weight source" analogue, so that old check has no v2 equivalent. */
function validateSourceAssessmentCrossRules(r,payload){
  const seen=new Set();
  const evidenceById=new Map((payload.additionalEvidence||[]).map(e=>[e.id,e]));
  r.sourceAssessments.forEach((sa,i)=>{
    if(seen.has(sa.sourceId)) throw parserError('weight_validation_failed','sourceAssessments 存在重复 sourceId：'+sa.sourceId,{sourceId:sa.sourceId,index:i});
    seen.add(sa.sourceId);

    const isSystemSource=AI_RESPONSE_SYSTEM_SOURCE_KEYS.includes(sa.sourceId);
    const evidenceMatch=evidenceById.get(sa.sourceId);
    if(!isSystemSource && !evidenceMatch){
      throw parserError('weight_validation_failed','sourceAssessments 引用了未知 sourceId：'+sa.sourceId,{sourceId:sa.sourceId,index:i});
    }

    const expectedWeight=isSystemSource ? Number(payload.sourceWeights[sa.sourceId]) : Number(evidenceMatch.weight);
    if(sa.configuredWeight!==expectedWeight){
      throw parserError('weight_validation_failed','sourceAssessments.configuredWeight 与 Analysis Payload 不一致：'+sa.sourceId,{sourceId:sa.sourceId,expected:expectedWeight,actual:sa.configuredWeight});
    }
  });

  const missing=AI_RESPONSE_SYSTEM_SOURCE_KEYS.filter(id=>Number(payload.sourceWeights[id])>0 && !seen.has(id));
  if(missing.length>0){
    throw parserError('weight_validation_failed','缺少权重 > 0 的系统来源对应的 sourceAssessments：'+missing.join(', '),{missing});
  }
}

/* ---- Step 8: evidence reference resolution — every reference must dereference to something
   that actually exists inside this one immutable Analysis Payload. Supports exactly the 3
   reference styles named in AI_RESPONSE_SPEC.md; anything else (including any attempt to
   reference external information) is rejected. ---- */
function collectValidEvidenceReferenceIds(payload){
  return {
    sourceSnapshots:new Set((payload.sourceSnapshots||[]).map(s=>s.id)),
    selectedNewsEvents:new Set((payload.selectedNewsEvents||[]).map(e=>e.id)),
    additionalEvidence:new Set((payload.additionalEvidence||[]).map(e=>e.id)),
  };
}
function assertValidEvidenceReference(ref,validSets,context){
  const m=/^(sourceSnapshots|selectedNewsEvents|additionalEvidence):(.+)$/.exec(ref);
  if(!m){
    throw parserError('evidence_reference_invalid','证据引用格式不受支持：'+ref,{ref,context});
  }
  const [,namespace,id]=m;
  if(!validSets[namespace].has(id)){
    throw parserError('evidence_reference_invalid','证据引用在 Analysis Payload 中不存在：'+ref,{ref,namespace,id,context});
  }
}
function validateEvidenceReferences(r,payload){
  const validSets=collectValidEvidenceReferenceIds(payload);
  r.reasoning.forEach((it,i)=>it.evidenceReferences.forEach(ref=>assertValidEvidenceReference(ref,validSets,'reasoning['+i+']')));
  r.sourceAssessments.forEach((sa,i)=>sa.evidenceReferences.forEach(ref=>assertValidEvidenceReference(ref,validSets,'sourceAssessments['+i+']')));
  r.scenarioPlans.forEach((sp,i)=>sp.evidenceReferences.forEach(ref=>assertValidEvidenceReference(ref,validSets,'scenarioPlans['+i+']')));
  r.evidence.forEach((it,i)=>it.references.forEach(ref=>assertValidEvidenceReference(ref,validSets,'evidence['+i+']')));
}

/* ---------- AIResponseRecord persistence (localStorage, keyed by analysisId — qa_ai_response_records) ----------
   Dedicated key, parallel to qa_analysis_payloads / qa_prompt_records. Unlike qa_ai_raw_results
   (which grows an array — every attempt kept), this map holds AT MOST ONE entry per analysisId:
   the first attempt that validates successfully. Immutable once written. */
const qa_ai_response_records_KEY='qa_ai_response_records';
function loadAiResponseRecords(){
  try{ const raw=localStorage.getItem(qa_ai_response_records_KEY); if(raw) return JSON.parse(raw); }catch(e){}
  return {};
}
function saveAiResponseRecordMap(map){ localStorage.setItem(qa_ai_response_records_KEY, JSON.stringify(map)); }
function getAiResponseRecord(analysisId){ return loadAiResponseRecords()[analysisId]||null; }

/** Sprint 3.8 — Homepage's "最近一次分析" summary needs the single most recent AIResponseRecord
 * across ALL past analyses (not just the current in-memory draft's). Pure read of already-persisted
 * records — never triggers a new AI call. */
function getMostRecentAiResponseRecord(){
  const map=loadAiResponseRecords();
  const records=Object.values(map);
  if(!records.length) return null;
  return records.slice().sort((a,b)=>new Date(b.generatedAt)-new Date(a.generatedAt))[0];
}

/** Never overwrites — a second valid response for an analysisId that already has a persisted
 * record throws response_already_exists instead of replacing it. This is what makes "duplicate
 * valid response does not silently overwrite existing record" true regardless of caller. */
function persistAiResponseRecord(record){
  const map=loadAiResponseRecords();
  if(map[record.analysisId]){
    throw parserError('response_already_exists','该 analysisId 已存在有效的 AIResponseRecord，不会覆盖',{analysisId:record.analysisId});
  }
  map[record.analysisId]=record;
  saveAiResponseRecordMap(map);
  return record;
}

/** Main entry point — AIResponseParserInput -> {ok:true,record} | {ok:false,error}. Never throws;
 * every failure funnels through parserError() and is caught here, matching engine.ts's
 * "never throws — always returns a well-formed result" convention on the backend side. Order
 * follows AI_RESPONSE_SPEC.md v2.0.0's pipeline: raw result -> JSON parse -> version -> schema ->
 * scenario-plan cross rules -> analysisId -> source-assessment cross-validation -> evidence
 * references -> persist. rawResult.rawText itself is never touched by any step (Raw Response
 * Preservation, unchanged from 1.x). */
function parseAiResponse(input){
  const {rawResult,payload,promptVersion}=input;
  // Sprint 3.5D-B.1 — ONE "now" reference for BOTH the PRIMARY expiresAt-must-be-future check
  // (Task 14 — "expiresAt <= analysis time") and generatedAt, so the two can never disagree.
  const analysisTime=new Date();
  try{
    assertRawResultSucceeded(rawResult);
    const parsed=strictParseJson(rawResult.rawText);
    validateRootFieldsPresent(parsed);
    validateResponseVersion(parsed.responseVersion);
    validateAiResponseSchema(parsed);
    validateScenarioPlansCrossRules(parsed,analysisTime);
    validateAnalysisIdMatch(parsed,payload);
    validateSourceAssessmentCrossRules(parsed,payload);
    validateEvidenceReferences(parsed,payload);

    const record={
      analysisId:parsed.analysisId,
      responseVersion:parsed.responseVersion,
      promptVersion:promptVersion,
      payloadVersion:payload.payloadVersion,
      provider:rawResult.provider,
      model:rawResult.model,
      generatedAt:analysisTime.toISOString(),
      response:parsed,
    };
    persistAiResponseRecord(record);
    return {ok:true,record};
  }catch(err){
    if(err && err.isParserError) return {ok:false,error:{code:err.code,message:err.message,details:err.details}};
    return {ok:false,error:{code:'schema_validation_failed',message:'解析过程中发生未预期的错误：'+err.message}};
  }
}

/** Dev-only hook (Sprint 3.2C) — parses+validates one already-received raw attempt (already
 * sitting in qa_ai_raw_results) against AI_RESPONSE_SPEC.md v1.2.0, persisting an AIResponseRecord
 * on success. Never calls the network, never touches Strategy. Reuses the same Prompt Preview
 * modal as devSendToAiEngine() (Sprint 3.1B) rather than adding a new page. */
function devParseAiResponse(analysisId,requestId){
  const payload=getAnalysisPayload(analysisId);
  const record=getPromptRecordByAnalysisId(analysisId);
  const attempt=getAiRawResultsByAnalysisId(analysisId).find(a=>a.requestId===requestId);
  if(!payload || !record || !attempt){ toast('缺少解析所需的 Payload / Prompt Record / 原始响应'); return; }
  const result=parseAiResponse({rawResult:attempt, payload, promptVersion:record.promptVersion});
  console.log('[dev] parseAiResponse', result);
  if(result.ok){ toast('已生成 AIResponseRecord（analysisId='+result.record.analysisId+'）'); }
  else{ toast('解析失败：'+result.error.code+' — '+result.error.message.split('\n')[0]); }
  openPromptPreviewModal();
}

/** Sprint 3.1B.2 Task 1 — the Model field auto-fills from whatever's actually configured on the
 * Settings → AI Connections page for the selected provider, never a hardcoded model name (a
 * hardcoded preset for a name like "gpt-4o-mini" would go stale, and had no meaningful default
 * for openai-compatible at all, since a relay's models are operator-defined). Falls back to '' —
 * left for the dev to type — when nothing is configured yet, or before the config has loaded. */
function devAiModelForProvider(provider){
  const cfg=Store.aiProviderConfig && Store.aiProviderConfig[provider];
  return (cfg && cfg.defaultModel) || '';
}
function devAiProviderChanged(provider){
  const modelInput=document.getElementById('dev-ai-model');
  if(modelInput) modelInput.value=devAiModelForProvider(provider);
}
/** Loads Store.aiProviderConfig if this session hasn't visited Settings yet, then re-fills the
 * Model field for whatever provider is currently selected — a no-op if the modal has since
 * closed. Fire-and-forget from openPromptPreviewModal(); reuses the exact same fetch the Settings
 * page itself uses (GET /api/ai/config), no new endpoint. */
async function ensureAiProviderConfigLoadedForDevModal(){
  if(Store.aiProviderConfig) return;
  await loadAiProviderConfigFromBackend();
  const sel=document.getElementById('dev-ai-provider');
  if(sel) devAiProviderChanged(sel.value);
}

async function devSendToAiEngine(){
  const payload=Store.lastAnalysisPayload;
  const record=payload?getPromptRecordByAnalysisId(payload.analysisId):null;
  if(!record){ toast('没有可用的 Prompt Record'); return; }
  const providerSel=document.getElementById('dev-ai-provider');
  const modelInput=document.getElementById('dev-ai-model');
  const provider=providerSel.value, model=modelInput.value.trim();
  const btn=document.querySelector('[data-action="dev-send-to-ai-engine"]');
  if(btn){ btn.disabled=true; btn.textContent='请求中…'; }
  try{
    const res=await fetch(`${BACKEND_URL}/api/ai/analyze`,{
      method:'POST', headers:{'Content-Type':'application/json'},
      body:JSON.stringify({
        analysisId:record.analysisId, promptVersion:record.promptVersion, payloadVersion:record.payloadVersion,
        provider, model, promptText:record.promptText,
      }),
    });
    const data=await res.json();
    if(!data.ok){ toast('请求失败：'+(data.error?data.error.message:('HTTP '+res.status))); return; }
    saveAiRawResult(record.analysisId, data.result);
    console.log('[dev] AIRawResult', data.result);
  }catch(err){
    toast('请求失败：'+err.message);
  }finally{
    openPromptPreviewModal(); // re-render to show the new attempt in the list, resets busy state
  }
}

function buildReasoning(direction,contrib){
  const sorted=[...contrib].sort((x,y)=>Math.abs(y.score)-Math.abs(x.score));
  const aligned=sorted.filter(c=> (direction==='long'? c.score>0 : c.score<0));
  const opposed=sorted.filter(c=> (direction==='long'? c.score<0 : c.score>0));
  const templates={
    main:[
      (c)=>`${c.label}显示价格在关键位获得${direction==='long'?'支撑':'压力'}，结构${direction==='long'?'转强':'转弱'}`,
      (c)=>`${c.label}权重贡献显著（${c.score>0?'+':''}${c.score}），是本次判断的主要依据`,
      (c)=>`${c.label}指标持续验证当前${direction==='long'?'上行':'下行'}趋势`,
    ],
    support:[
      (c)=>`${c.label}进一步确认${direction==='long'?'看多':'看空'}结构，权重占比 ${c.weight}%`,
      (c)=>`${c.label}提供额外佐证，方向与主策略一致`,
    ],
    against:[
      (c)=>`${c.label}呈现相反信号（${c.score}），存在一定分歧，建议关注`,
      (c)=>`${c.label}权重占比 ${c.weight}%，构成潜在反向风险`,
    ],
  };
  function build(list,tpls,n){return list.slice(0,n).map((c,i)=>tpls[i%tpls.length](c));}
  return {
    main: build(aligned,templates.main,3).length? build(aligned,templates.main,3) : [`综合${contrib.length}项输入的加权结果指向${direction==='long'?'看多':'看空'}`],
    support: build(aligned.slice(3),templates.support,3),
    against: build(opposed,templates.against,3).length? build(opposed,templates.against,3) : ['未发现明显反向信号，各输入方向基本一致'],
  };
}
function strategyFor(symbol,direction,confidence,entry,entryLo,entryHi,stopLoss,takeProfit,hold,rr,invalidation){
  const contrib=WEIGHT_DEFS.map(w=>{
    const sig=signalFor(symbol,w.key);
    return {key:w.key,label:w.label,icon:w.icon,weight:w.def,score:Math.round(sig*70)};
  });
  const reasoning=buildReasoning(direction,contrib);
  return {direction,confidence,entryLo,entryHi,stopLoss,takeProfit,hold,rr,invalidation,contrib,reasoning};
}

function readImageAsThumbnail(file,maxW,quality){
  return new Promise((resolve)=>{
    const reader=new FileReader();
    reader.onload=()=>{
      const img=new Image();
      img.onload=()=>{
        const scale=Math.min(1,maxW/img.width);
        const w=Math.max(1,Math.round(img.width*scale)), h=Math.max(1,Math.round(img.height*scale));
        const canvas=document.createElement('canvas'); canvas.width=w; canvas.height=h;
        canvas.getContext('2d').drawImage(img,0,0,w,h);
        resolve(canvas.toDataURL('image/jpeg',quality||0.75));
      };
      img.onerror=()=>resolve(null);
      img.src=reader.result;
    };
    reader.onerror=()=>resolve(null);
    reader.readAsDataURL(file);
  });
}
/** Sprint 3.1B.2 Task 3/4 — shared by click-upload (ev-file-pick change), drag&drop, and paste, so
 * all 3 input methods produce identical results. Sets `type` from the FILE's own kind (never from
 * whatever the dropzone's evidence card happened to have selected before) and `reference`
 * (fileName) — never touches `label` (title), which stays exactly what it was, per Task 4: no
 * automatic title is ever generated, since this prototype has no real image/document recognition
 * to base one on. */
async function attachFileToEvidence(evId, file){
  if(!Store.draft) return;
  const ev=Store.draft.evidence.find(x=>x.id===evId);
  if(!ev) return;
  const detected=detectFileEvidenceType(file);
  if(!detected){ toast('不支持的文件类型，仅支持图片 / PDF / TXT / Markdown'); return; }
  ev.type=detected;
  ev.fileName=file.name;
  ev.fileSize=file.size<1024*1024 ? Math.round(file.size/1024)+' KB' : (file.size/1024/1024).toFixed(1)+' MB';
  ev.fileData = detected==='截图' ? await readImageAsThumbnail(file,360) : null;
  // Sprint 3.3B: a separate, higher-fidelity copy for the Image Evidence Parser — ev.fileData above
  // stays the small on-card preview thumbnail (360px, unchanged), this is what actually gets sent
  // to POST /api/ai/evidence/image, since a vision model needs to read fine text/numbers the small
  // preview would lose. Still capped (1600px / JPEG 0.9), not the literal original file bytes, to
  // keep localStorage bounded — well above what these providers meaningfully use internally anyway.
  ev.fileDataForParser = detected==='截图' ? await readImageAsThumbnail(file,1600,0.9) : null;
  ev.parsedContent = null; // a re-uploaded file invalidates any previous parse of the old image
  saveDraft();
  document.getElementById('app').innerHTML=renderResearch(); wireInteractions();
  toast('已添加文件：'+file.name);
}

/* ---------- Sprint 3.6A: Account / Portfolio ----------
   A new top-level page, distinct from Settings (which stays for connection/credential config only).
   Shows the real account overview, every real Position (App-originated and external, undifferentiated
   in the list — each shows its own allocation breakdown), every real ordinary open Order (App vs
   External ownership distinguished, manual cancel available for both, extra-strong warning before
   cancelling an External one), and every real open Algo/Protection order (same App/External
   distinction, read-only — 3.5D-E's own "not yet wired to any UI action" decision for algo-order
   cancellation is deliberately preserved, not revisited this sprint).

   Real-time: an SSE connection (`GET .../stream`) relays normalized Binance User Data Stream events;
   REST remains the reconciliation truth everywhere — a stream event only triggers a debounced REST
   refresh, never a direct state mutation, so a dropped/misparsed field can never silently corrupt
   what's displayed. Connection status ("已连接"/"重新连接中"/"已断开") and last-sync time are always
   shown; "立即刷新" remains the manual recovery/debug path regardless of stream state. */

const ACCOUNT_STREAM_STATUS_LABEL={CONNECTING:'连接中', CONNECTED:'已连接', RECONNECTING:'重新连接中', DISCONNECTED:'已断开'};
const ACCOUNT_STREAM_REFRESH_DEBOUNCE_MS=2000;

function ensureAccountPageState(){
  Store.accountPage=Store.accountPage||{connectionId:null, streamStatus:null, streamConnectionId:null, _es:null, _refreshTimer:null, openOrders:null};
  return Store.accountPage;
}

/** Loads (or refreshes) everything the Account page shows for one connection: the account snapshot
 * (shared cache with Settings, `Store.exchangeAccountSnapshots`), the local Position/allocation mirror
 * (via the existing syncPositionsFromExchange — same function every other sync path uses, never a
 * diverging read), and the ordinary open-orders list (new, read-only). Re-renders only if the user is
 * still on #/account when this resolves (same "still on this route" guard the ticker refresh uses). */
async function loadAccountPageData(connectionId){
  const ap=ensureAccountPageState();
  Store.exchangeAccountSnapshots=Store.exchangeAccountSnapshots||{};
  Store.exchangeAccountSnapshots[connectionId]={loading:true};
  ap.openOrders={loading:true};
  if(currentRoute()[0]==='account'){ document.getElementById('app').innerHTML=renderAccountPage(); wireInteractions(); }

  try{
    const res=await fetch(`${BACKEND_URL}/api/exchange/connections/${connectionId}/account`, {signal:AbortSignal.timeout(EXCHANGE_ACCOUNT_FETCH_TIMEOUT_MS)});
    const json=await res.json();
    if(!json.ok) throw new Error((json.error&&json.error.message)||'读取账户失败');
    Store.exchangeAccountSnapshots[connectionId]={loading:false, snapshot:json.snapshot, error:null};
    await syncPositionsFromExchange(connectionId); // keeps the local Position/allocation mirror fresh — same function Trade Detail/Settings already use
  }catch(err){
    const isTimeout=err && (err.name==='TimeoutError' || err.name==='AbortError');
    Store.exchangeAccountSnapshots[connectionId]={loading:false, snapshot:null, error:isTimeout?'读取账户超时，请稍后重试':err.message};
  }

  try{
    const res=await fetch(`${BACKEND_URL}/api/exchange/connections/${connectionId}/open-orders`, {signal:AbortSignal.timeout(EXCHANGE_ACCOUNT_FETCH_TIMEOUT_MS)});
    const json=await res.json();
    if(!json.ok) throw new Error((json.error&&json.error.message)||'普通挂单读取失败');
    ap.openOrders={loading:false, snapshots:json.snapshots, error:null};
  }catch(err){
    // Sprint 3.6A.2.2 — Hotfix: `snapshots` is deliberately left `null` (never `[]`) on failure. A
    // read failure must never be structurally indistinguishable from "confirmed zero orders" — see
    // readListState()/accountOpenOrdersTitle() below, which are what actually render "数量未知" vs
    // "共 0 个" from this state.
    const isTimeout=err && (err.name==='TimeoutError' || err.name==='AbortError');
    ap.openOrders={loading:false, snapshots:null, error:isTimeout?'普通挂单读取超时，请稍后重试':err.message};
  }

  if(currentRoute()[0]==='account'){ document.getElementById('app').innerHTML=renderAccountPage(); wireInteractions(); }
}

/** Opens (or reuses) the SSE connection for one connectionId. Never trusts a stream event as
 * complete truth — every event only schedules a debounced `loadAccountPageData()` REST refresh
 * (multiple events arriving in a burst collapse into one refresh, not one per event). */
function startAccountEventStream(connectionId){
  const ap=ensureAccountPageState();
  if(ap._es && ap.streamConnectionId===connectionId) return; // already open for this connection
  teardownAccountEventStream();
  ap.streamConnectionId=connectionId;
  ap.streamStatus='CONNECTING';
  let es;
  try{ es=new EventSource(`${BACKEND_URL}/api/exchange/connections/${connectionId}/stream`); }
  catch(e){ ap.streamStatus='DISCONNECTED'; return; }
  ap._es=es;
  es.onmessage=(ev)=>{
    let evt; try{ evt=JSON.parse(ev.data); }catch(e){ return; }
    if(evt.kind==='STATUS'){
      ap.streamStatus=evt.data.status;
      if(currentRoute()[0]==='account'){ document.getElementById('app').innerHTML=renderAccountPage(); wireInteractions(); }
      return;
    }
    // ORDER_UPDATE / ACCOUNT_UPDATE / ACCOUNT_CONFIG_UPDATE — a low-latency NUDGE only. Debounced so a
    // burst of events (e.g. a fill immediately followed by an account balance update) triggers exactly
    // one REST reconciliation, never one per event.
    if(ap._refreshTimer) clearTimeout(ap._refreshTimer);
    ap._refreshTimer=setTimeout(()=>{ if(currentRoute()[0]==='account') loadAccountPageData(connectionId); }, ACCOUNT_STREAM_REFRESH_DEBOUNCE_MS);
  };
  es.onerror=()=>{
    // EventSource auto-reconnects natively; the backend's own STATUS events (CONNECTING/CONNECTED/
    // RECONNECTING) reflect the REAL upstream Binance WebSocket state, which is the state that
    // actually matters here — this handler only needs to avoid leaving a stale "已连接" showing.
    if(ap.streamConnectionId===connectionId && ap.streamStatus==='CONNECTED') ap.streamStatus='RECONNECTING';
  };
}
function teardownAccountEventStream(){
  const ap=ensureAccountPageState();
  if(ap._refreshTimer){ clearTimeout(ap._refreshTimer); ap._refreshTimer=null; }
  if(ap._es){ try{ ap._es.close(); }catch(e){} ap._es=null; }
  ap.streamStatus=null; ap.streamConnectionId=null;
}

/** Called every time render() enters #/account. Picks a default connection (the first one) if none
 * selected yet, (re)loads data when the selected connection changed or nothing's loaded yet, and
 * (re)opens the SSE stream to match. Safe to call repeatedly — every step is itself idempotent. */
function initAccountPage(){
  const ap=ensureAccountPageState();
  const connections=Store.exchangeConnections||[];
  if(!connections.length) return;
  if(!ap.connectionId || !connections.some(c=>c.id===ap.connectionId)) ap.connectionId=connections[0].id;
  const haveSnapshot=Store.exchangeAccountSnapshots && Store.exchangeAccountSnapshots[ap.connectionId];
  if(!haveSnapshot) loadAccountPageData(ap.connectionId);
  startAccountEventStream(ap.connectionId);
}

function switchAccountPageConnection(connectionId){
  const ap=ensureAccountPageState();
  ap.connectionId=connectionId;
  loadAccountPageData(connectionId);
  startAccountEventStream(connectionId);
}

/** Sprint 3.6A.2.2 — Hotfix: the one honest three-state classifier for a read that returns a list.
 * A failed read is NEVER treated as "confirmed zero" — that distinction is exactly what was wrong
 * before this hotfix (a caught fetch error still set `snapshots:[]`, so the UI showed "共 0 个"
 * directly above a "读取失败" warning, a real truth-semantics bug: a failed read does not know
 * whether the true count is zero). `LOADING`/`FAILED`/`OK` mirror the same three states
 * `verifyAllAccountsCleanForReset()` (Data Management) now reports per-item — one shared vocabulary
 * for "we don't know yet" vs "we tried and it broke" vs "we know, and here it is." */
function readListState(state){
  if(!state || state.loading) return {status:'LOADING'};
  if(state.error) return {status:'FAILED', error:state.error};
  return {status:'OK', items:state.snapshots||[]};
}

  const s=readListState(state);
  if(s.status==='LOADING') return '挂单';
  if(s.status==='FAILED') return '挂单（数量未知）';
  return `挂单（共 ${s.items.length} 个）`;
}
