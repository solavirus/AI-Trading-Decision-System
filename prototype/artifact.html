    else if(Store_presetAdopting===p.name) actionHtml=`<button class="btn btn-sm" disabled>添加中…</button>`;
    else actionHtml=`<button class="btn btn-primary btn-sm" data-action="ns-preset-adopt" data-name="${escapeAttr(p.name)}">添加</button>`;
    return `<tr>
      <td><div style="display:flex; align-items:center; gap:10px">
        <span class="sym-ic" style="background:${newsLogoColor(p.name)}">${escapeAttr(newsSourceLogoInitial(p.name))}</span>
        <span style="font-weight:700">${p.name}</span>
      </div></td>
      <td><span class="pill pill-primary">${t.label}</span></td>
      <td class="muted">${p.category}</td>
      <td class="muted" style="font-size:11.5px">${unavailable?'':(p.fetchable?'支持真实抓取':'仅保存配置')}</td>
      <td>${actionHtml}</td>
    </tr>`;
  }).join('');
}
async function nsAdoptPreset(name){
  const p=NEWS_SOURCE_PRESETS.find(x=>x.name===name);
  if(!p||!p.url) return;
  Store_presetAdopting=name;
  document.getElementById('ns-preset-body').innerHTML=renderNsPresetRows();
  try{
    const res=await fetch(`${BACKEND_URL}/api/news-sources`,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({
      name:p.name, type:p.type, category:p.category, url:p.url, enabled:true, fetch_interval_minutes:15, lookback_hours:24,
    })});
    const data=await res.json();
    if(!data.ok){ toast(data.error||'添加失败'); }
    else{ await loadNewsSourcesFromBackend(); toast(`已添加 ${p.name}`); }
  }catch(err){
    toast('添加失败：'+err.message);
  }
  Store_presetAdopting=null;
  const body=document.getElementById('ns-preset-body');
  if(body) body.innerHTML=renderNsPresetRows();
}

/* ---------- Sprint 2.2: News Pipeline v1 + Analysis Payload Builder (2026-08-07) ----------
   Operates entirely on Store.live.news.itemsRaw — the news source's ALREADY-loaded, ALREADY
   backend-clustered events (see sources/news.ts's clusterArticlesIntoEvents()). No new fetch, no
   new backend endpoint: the public API only exposes clustered events, not pre-cluster articles,
   so stages 3 (dedup) and 4 (cluster) here are a defensive SECOND pass over already-mostly-
   deduped/clustered data — on real data they typically find nothing further to do, which is
   expected and reported honestly rather than staged to look busier than it is. Never uses
   MOCK_NOW (that's fixed at 2024-05-20 for the old seeded-trade timeline) — always Date.now(). */

const NEWS_RANGE_DAYS={'最近3天':3,'最近7天':7,'最近14天':14,'最近30天':30};
function newsRangeMs(rangeLabel){ return (NEWS_RANGE_DAYS[rangeLabel]||7)*24*60*60*1000; }

/** Bilingual (Chinese labels are already backend-translated; `detail` keeps the English original
 * when translation changed it) — BTC/ETH get full direct+indirect lists per the spec's own
 * example; the other 4 supported assets get a lighter symbol/name list, proportionate to how
 * asset-specific crypto news actually skews. Centralized here, not scattered per-call. */
const NEWS_ASSET_KEYWORDS={
  BTC:{direct:['btc','bitcoin','比特币','btcusdt'], indirect:['bitcoin etf','spot etf','现货etf','blackrock','贝莱德','microstrategy']},
  ETH:{direct:['eth','ethereum','以太坊','ethusdt'], indirect:['eth etf','以太坊etf','staking','质押','layer 2']},
  SOL:{direct:['sol','solana','索拉纳','solusdt'], indirect:[]},
  XRP:{direct:['xrp','ripple','瑞波','xrpusdt'], indirect:[]},
  DOGE:{direct:['doge','dogecoin','狗狗币','dogeusdt'], indirect:[]},
  BNB:{direct:['bnb','binance coin','币安币','bnbusdt'], indirect:['binance','币安']},
};
const NEWS_MACRO_KEYWORDS=['fed','federal reserve','美联储','fomc','cpi','ppi','interest rate','利率','treasury','国债','us dollar','sec','regulation','监管'];
const NEWS_MAJOR_EVENT_KEYWORDS=['etf','approval','rejection','regulation','sec','fed','fomc','cpi','rate','hack','exploit','liquidation','insolvency','bankruptcy','listing','delisting','outage'];
/** Reuses the same source-type info news-source management already has — no separate list to
 * drift out of sync with. */
const NEWS_OFFICIAL_SOURCE_NAMES=new Set(NEWS_SOURCE_PRESETS.filter(p=>p.type==='official'||p.type==='api').map(p=>p.name));

function newsBaseSymbol(assetSymbol){ return String(assetSymbol||'').split('/')[0]; }

/** Parses "来源：A、B · 原文：..." (added by sources/news.ts) into a source-name array — there is
 * no separate structured field for this today, so this is the one place that depends on that
 * exact string format; if the backend's format ever changes, only this function needs updating. */
function newsParseSources(detail){
  const m=String(detail||'').match(/来源：([^·]+)/);
  if(!m) return [];
  return m[1].trim().split('、').map(s=>s.trim()).filter(Boolean);
}

/** Label + English original ONLY (the "原文：..." tail of detail, if present) — deliberately
 * excludes the "来源：X、Y" source-attribution prefix. Found via testing: two unrelated stories
 * from the same outlet (e.g. both "来源：CoinDesk") shared enough boilerplate tokens to falsely
 * clear the Stage 4 clustering threshold, and a source literally named after an asset (e.g.
 * "Binance Announcements") would spuriously satisfy Stage 2's keyword match on every one of its
 * articles regardless of actual content. This is the one function every content-similarity check
 * below goes through, so the fix only has to live in one place. */
function newsContentText(item){
  const m=String(item.detail||'').match(/原文：(.*)$/);
  return String(item.label||'')+(m?(' '+m[1]):'');
}

/** Stage 1 — Time Filter: keep items inside the Research-selected date range. Items with no
 * usable timestamp may only survive if they came from an official/exchange source (spec rule) —
 * in practice sources/news.ts always sets a timestamp today, so this branch is defensive/untested
 * by real data (covered by a fixture in verification instead). */
function newsStage1TimeFilter(items, rangeLabel, now){
  const windowMs=newsRangeMs(rangeLabel);
  return items.filter(it=>{
    const hasTime=typeof it.timestamp==='number' && !isNaN(it.timestamp);
    if(!hasTime){
      const sources=newsParseSources(it.detail);
      return sources.some(s=>NEWS_OFFICIAL_SOURCE_NAMES.has(s));
    }
    return (now-it.timestamp)<=windowMs;
  });
}

/** Stage 2 — Asset Relevance Filter: direct asset match, indirect match, or market-wide macro
 * relevance (kept even without the asset name, per spec) all pass; anything else (unrelated
 * single-token promo news) is excluded. Matches against label+English-original content only (see
 * newsContentText) — NOT source names, so an article merely published BY "Binance Announcements"
 * doesn't spuriously count as BNB-relevant regardless of what it's actually about. */
function newsStage2AssetRelevance(items, baseSymbol){
  const kw=NEWS_ASSET_KEYWORDS[baseSymbol]||{direct:[baseSymbol.toLowerCase()],indirect:[]};
  return items
    .map(it=>{
      const text=newsContentText(it).toLowerCase();
      const directHit=kw.direct.some(k=>text.includes(k));
      const macroHit=NEWS_MACRO_KEYWORDS.some(k=>text.includes(k));
      const indirectHit=kw.indirect.some(k=>text.includes(k));
      let tier=null;
      if(directHit) tier='direct'; else if(macroHit) tier='macro'; else if(indirectHit) tier='indirect';
      return {it, tier};
    })
    .filter(x=>x.tier)
    .map(x=>({...x.it, __tier:x.tier, __sources:newsParseSources(x.it.detail)}));
}

function newsNormalizeUrl(u){ try{ const url=new URL(u); return url.origin+url.pathname; }catch(e){ return String(u||'').split('?')[0]; } }
function newsNormalizeTitle(t){ return String(t||'').toLowerCase().replace(/[^\p{L}\p{N}]+/gu,''); }

/** Stage 3 — Exact Deduplication: normalized URL (tracking params stripped) and normalized title,
 * first-seen wins. On real data this is expected to remove 0 items (the backend already dedupes
 * within its own clustering) — verified separately with a synthetic fixture that it actually
 * removes a planted duplicate. */
function newsStage3Dedup(items){
  const seenUrl=new Set(), seenTitle=new Set(), out=[];
  for(const it of items){
    const u=newsNormalizeUrl(it.sourceUrl), nt=newsNormalizeTitle(it.label);
    if(u && seenUrl.has(u)) continue;
    if(nt && seenTitle.has(nt)) continue;
    if(u) seenUrl.add(u);
    if(nt) seenTitle.add(nt);
    out.push(it);
  }
  return out;
}

function newsTitleTokens(text){
  return new Set(String(text||'').toLowerCase().split(/[^\p{L}\p{N}]+/u).filter(w=>w.length>1));
}
function newsTokenOverlapRatio(a,b){
  if(a.size===0||b.size===0) return 0;
  let inter=0; for(const w of a) if(b.has(w)) inter++;
  return inter/Math.min(a.size,b.size);
}
const NEWS_CLUSTER_TOKEN_OVERLAP_MIN=0.6;
const NEWS_CLUSTER_TIME_WINDOW_MS=6*60*60*1000; // 6h

/** Stage 4 — Event Clustering: deterministic second pass, title-token overlap AND time proximity
 * both required to merge (spec: "if clustering confidence is low, keep items separate rather than
 * merging unrelated stories" — a single weak signal alone never merges). No embeddings, no AI. */
function newsStage4Cluster(items){
  const clusters=[];
  for(const it of items){
    const tokens=newsTitleTokens(newsContentText(it));
    let target=null;
    for(const c of clusters){
      const timeOk=Math.abs(c.rep.timestamp-it.timestamp)<=NEWS_CLUSTER_TIME_WINDOW_MS;
      const overlapOk=newsTokenOverlapRatio(c.tokens,tokens)>=NEWS_CLUSTER_TOKEN_OVERLAP_MIN;
      if(timeOk && overlapOk){ target=c; break; }
    }
    if(target){
      target.members.push(it);
      it.__sources.forEach(s=>target.sourcesSet.add(s));
      target.articleIds.push(it.id);
      if(it.timestamp>target.rep.timestamp) target.rep=it; // keep most-recent as representative
    }else{
      clusters.push({rep:it, tokens, members:[it], sourcesSet:new Set(it.__sources), articleIds:[it.id]});
    }
  }
  return clusters;
}

/** Stage 5 — Rule-Based Importance Score (0–100, transparent/testable, additive factors below).
 * Never scores trading direction, only importance/relevance, per spec. */
function newsStage5Score(cluster, baseSymbol, rangeLabel, now){
  const text=newsContentText(cluster.rep).toLowerCase();
  let score=0;
  if(cluster.rep.__tier==='direct') score+=30;
  else if(cluster.rep.__tier==='macro') score+=15;
  else if(cluster.rep.__tier==='indirect') score+=10;
  if([...cluster.sourcesSet].some(s=>NEWS_OFFICIAL_SOURCE_NAMES.has(s))) score+=15;
  score+=Math.min(cluster.sourcesSet.size-1,4)*5;
  const ageMs=now-cluster.rep.timestamp;
  if(ageMs<6*3600*1000) score+=15; else if(ageMs<24*3600*1000) score+=10; else if(ageMs<72*3600*1000) score+=5;
  if(NEWS_MAJOR_EVENT_KEYWORDS.some(k=>text.includes(k))) score+=20;
  if(ageMs<=newsRangeMs(rangeLabel)/2) score+=5;
  return clamp(Math.round(score),0,100);
}

/** Stages 1–6 in one call. Pure/synchronous — no network calls of its own. Two callers, two data
 * sources, same function: Research's live inline preview (news-item weight row, "查看已选择新闻事件"
 * modal) calls this with just 2 args, reading whatever loadAllLiveSources() already has in
 * Store.live.news — a cosmetic preview, fine to be Dashboard-cache-driven since it isn't part of
 * any frozen Payload. The Analysis Runner (Sprint 3.2B, startAnalysisRunner()) passes a 3rd arg —
 * the news itemsRaw it just fetched fresh via GET /api/sources/news?fresh=1 — so the real,
 * persisted selectedNewsEvents never comes from Dashboard's cache, per the Analysis Snapshot
 * Integrity decision. Returns both the pipeline stats (for the Research UI's inspection line) and
 * the final ≤10 SelectedNewsEvent list (for the payload). */
function runNewsPipeline(assetSymbol, rangeLabel, freshNewsRawItems){
  const now=Date.now();
  const raw = freshNewsRawItems || ((Store.live.news && Store.live.news.itemsRaw) ? Store.live.news.itemsRaw : []);
  const baseSymbol=newsBaseSymbol(assetSymbol);

  const afterTime=newsStage1TimeFilter(raw, rangeLabel, now);
  const afterAsset=newsStage2AssetRelevance(afterTime, baseSymbol);
  const afterDedup=newsStage3Dedup(afterAsset);
  const clusters=newsStage4Cluster(afterDedup);

  const scored=clusters.map(c=>({c, score:newsStage5Score(c, baseSymbol, rangeLabel, now)}));
  scored.sort((a,b)=>b.score-a.score);
  const top=scored.slice(0,10);

  const selectedEvents=top.map(({c,score})=>{
    const allSources=[...c.sourcesSet];
    return {
      id:c.rep.id,
      title:c.rep.label,
      summary:c.rep.detail,
      category:undefined,
      publishedAt: (typeof c.rep.timestamp==='number') ? new Date(c.rep.timestamp).toISOString() : null,
      sourceCount:allSources.length,
      sources:allSources.slice(0,5),
      importanceScore:score,
      relatedAssets:[baseSymbol],
      sourceArticleIds:c.articleIds,
    };
  });

  return {
    stats:{
      fetchedCount: raw.length,
      filteredCount: afterDedup.length,
      clusteredCount: clusters.length,
      selectedCount: selectedEvents.length,
    },
    selectedEvents,
  };
}

/* ---------- Analysis Payload (localStorage, keyed by analysisId — see qa_analysis_payloads) ---------- */
function genAnalysisId(){ return 'A'+Date.now().toString(36).toUpperCase()+Math.random().toString(36).slice(2,6).toUpperCase(); }
function loadAnalysisPayloads(){
  try{ const raw=localStorage.getItem('qa_analysis_payloads'); if(raw) return JSON.parse(raw); }catch(e){}
  return {};
}
function saveAnalysisPayloadMap(map){ localStorage.setItem('qa_analysis_payloads', JSON.stringify(map)); }
function getAnalysisPayload(analysisId){ return loadAnalysisPayloads()[analysisId]||null; }

/** ANALYSIS_PAYLOAD_SPEC.md v1.0.0's canonical field is `payloadVersion` (semver string) — this
 * function migrates the CREATE path (see buildAnalysisPayload() below) to that field name.
 * Payloads already in localStorage from before this migration still have the old `version:1`
 * field instead; they are deliberately left as-is on disk (never rewritten in place) and are only
 * ever normalized at READ time, by normalizeAnalysisPayload() (Sprint 3.1A, near the Prompt
 * Builder code) — not here, since getAnalysisPayload() itself is unchanged Sprint 2.2 code and
 * every existing caller of it still expects the raw stored shape. */
function currentPayloadVersion(){ return '1.0.0'; }

/** Sprint 3.1B.2 Task 6 — these 3 snapshots list one `values` row per tracked symbol (see
 * market.ts/technical.ts/derivatives.ts's SYMBOLS.map()); a single-asset analysis has no use for
 * the other 5 assets' rows, and they were pure Prompt bloat. Every other snapshot (macro/news/etf/
 * onchain/sentiment/stablecoin/liquidation/options) isn't structured this way and is untouched. */
const ASSET_SPECIFIC_SOURCE_KEYS=['market','technical','derivatives'];

/** Filters sourceSnapshots IN PLACE, called from buildAnalysisPayload() below — its only caller.
 * Matches by exact label prefix (e.g. "BTC/USDT"), which is how market/technical/derivatives all
 * format their labels (see freshSourceResultToSnapshot() -> itemsRaw mapping). Never touches
 * `status` — a filtered-to-empty `values` on an otherwise-'available' source is still reported as
 * 'available', since the filtering is a Prompt-size choice, not a data-quality one. Dashboard is
 * unaffected: it reads Store.live/liveMeta directly, never sourceSnapshots. */
function filterSourceSnapshotsToAsset(sourceSnapshots, selectedAssetSymbol){
  sourceSnapshots.forEach(s=>{
    if(!ASSET_SPECIFIC_SOURCE_KEYS.includes(s.id)) return;
    s.values=(s.values||[]).filter(v=>typeof v.label==='string' && v.label.startsWith(selectedAssetSymbol));
  });
}

/** Sprint 3.1B.2 Task 5 — sourceSnapshots' `news` entry previously carried one `values` row per
 * fetched headline, which is the exact same news selectedNewsEvents already carries in full
 * detail — the Prompt sent every headline twice. Replaced with 4 pipeline-stage counts (already
 * computed for Research's on-page "已抓取 N 条 · 筛选/去重后 N 条…" stats line, see renderResearch())
 * — a summary, never per-article titles. selectedNewsEvents itself is passed through completely
 * untouched by this function. */
function summarizeNewsSnapshot(sourceSnapshots, newsPipelineStats){
  const newsSnap=sourceSnapshots.find(s=>s.id==='news');
  if(!newsSnap) return;
  newsSnap.values=[
    {label:'已抓取新闻总数', value:newsPipelineStats.fetchedCount},
    {label:'时间/资产筛选后', value:newsPipelineStats.filteredCount},
    {label:'聚类后事件数', value:newsPipelineStats.clusteredCount},
    {label:'已选入 selectedNewsEvents', value:newsPipelineStats.selectedCount},
  ];
}

/** Sprint 3.2B — the "existing builder" Step 7 of the Analysis Snapshot Integrity lifecycle
 * reuses: same output shape, same persistence, same weight/evidence mapping as every prior sprint.
 * What changed is the INPUT — `frozenSnapshots` is no longer computed internally from Dashboard's
 * cache (that was the bug the frozen decision identified); the caller (startAnalysisRunner(), only
 * reachable after every required source has already succeeded — see Step 6's cancel-on-failure
 * gate) hands in the snapshots it just froze from real, fresh GET /api/sources/:key?fresh=1
 * responses, and the fresh news itemsRaw so runNewsPipeline() doesn't fall back to Store.live.news.
 * Deliberately does NOT deep-copy `frozenSnapshots` (unlike the old version) — it's already a
 * private array built fresh for this one call, never shared with or read from Store.live/liveMeta,
 * so there's nothing left for a later Dashboard refresh to accidentally mutate. */
function buildAnalysisPayload(frozenSnapshots, freshNewsRawItems){
  const d=Store.draft;
  const sourceSnapshots=frozenSnapshots;
  const pipeline=runNewsPipeline(d.asset, d.range, freshNewsRawItems);
  filterSourceSnapshotsToAsset(sourceSnapshots, d.asset);
  summarizeNewsSnapshot(sourceSnapshots, pipeline.stats);

  const sourceWeights={};
  d.weights.forEach(w=>{ sourceWeights[w.key]=Number(w.weight); });

  const additionalEvidence=d.evidence.map(ev=>({
    id:ev.id, type:ev.type, title:ev.label||undefined, content:ev.desc||undefined,
    reference:ev.fileName||undefined, weight:Number(ev.weight),
  }));

  const payload={
    analysisId:genAnalysisId(),
    createdAt:new Date().toISOString(),
    payloadVersion:currentPayloadVersion(),
    symbol:d.asset,
    timeframe:d.timeframe,
    dateRange:d.range,
    sourceWeights,
    additionalEvidence,
    sourceSnapshots,
    selectedNewsEvents:pipeline.selectedEvents,
    // Sprint 3.2B: unavailableSources will always be [] here now — a source that failed collection
    // never reaches this function at all (Step 6 cancels the whole analysis first, see
    // startAnalysisRunner()). staleSources will always be [] too — freshSourceResultToSnapshot()
    // never produces 'stale', since every snapshot was fetched moments ago as part of this run.
    // Both fields are kept for ANALYSIS_PAYLOAD_SPEC.md shape compatibility. partialSources (stub
    // sources) can still be non-empty — a stub response is real and valid, just data-limited.
    dataQuality:{
      unavailableSources:sourceSnapshots.filter(s=>s.status==='unavailable').map(s=>s.id),
      partialSources:sourceSnapshots.filter(s=>s.status==='partial').map(s=>s.id),
      staleSources:sourceSnapshots.filter(s=>s.status==='stale').map(s=>s.id),
    },
  };

  const map=loadAnalysisPayloads();
  map[payload.analysisId]=payload;
  saveAnalysisPayloadMap(map);
  return payload;
}

/* ---------- Sprint 3.1A: Prompt Builder (2026-08-07) ----------
   Implements PROMPT_BUILDER_SPEC.md v1.1.0: Analysis Payload -> deterministic Prompt Record.
   Stops here — no AI Engine, no HTTP call, no response parsing (out of scope this sprint).
   Kept in this same file (not a /prompts/*.js split) because the whole frontend is one static
   HTML file with no bundler and no <script src> — splitting would require introducing exactly
   the build tooling PROMPT_BUILDER_SPEC.md's own file-structure note says to avoid if it doesn't
   fit the current architecture. Section functions below stand in for the suggested
   systemPrompt.js/tradingRules.js/outputContract.js/builder.js. */

/** ANALYSIS_PAYLOAD_SPEC.md's canonical payloadVersion, applied at READ time only — never
 * mutates what's in localStorage. A payload created before this migration has `version:1`
 * instead of `payloadVersion`; this function is the ONLY place that gap gets papered over, and
 * only for callers (the Prompt Builder) that need the canonical shape. */
function normalizeAnalysisPayload(raw){
  if(!raw) return null;
  if(raw.payloadVersion) return raw;
  if(raw.version){ const {version,...rest}=raw; return {...rest, payloadVersion:'1.0.0'}; }
  return raw;
}

function promptBuilderError(code,message){ const e=new Error(message); e.code=code; e.devError=true; return e; }

/** Fails loudly and specifically per PROMPT_BUILDER_SPEC.md's Error Handling section — the only
 * "repair" performed is the legacy version->payloadVersion normalization above; everything else
 * here is a hard requirement, not a best-effort guess. */
function validateNormalizedPayload(p){
  if(!p) throw promptBuilderError('no_payload','没有可用的 Analysis Payload');
  if(!p.payloadVersion) throw promptBuilderError('payload_not_normalized','Payload 无法归一化为 payloadVersion');
  const required=['analysisId','createdAt','symbol','timeframe','dateRange'];
  for(const f of required) if(!p[f]) throw promptBuilderError('missing_field','缺少必填字段：'+f);
  if(!p.sourceWeights || typeof p.sourceWeights!=='object' || Array.isArray(p.sourceWeights)) throw promptBuilderError('malformed_source_weights','sourceWeights 格式不正确');
  if(!Array.isArray(p.additionalEvidence)) throw promptBuilderError('malformed_additional_evidence','additionalEvidence 必须是数组');
  if(!Array.isArray(p.sourceSnapshots)) throw promptBuilderError('malformed_source_snapshots','sourceSnapshots 必须是数组');
  if(!Array.isArray(p.selectedNewsEvents)) throw promptBuilderError('malformed_selected_news_events','selectedNewsEvents 必须是数组');
  if(!p.dataQuality || typeof p.dataQuality!=='object') throw promptBuilderError('malformed_data_quality','dataQuality 格式不正确');
}

      tradingPlan:{entry:{type:'MARKET|LIMIT|ZONE',value:'number?',from:'number?',to:'number?'},stopLoss:'number|null',takeProfit:['number'],holdingPeriod:'string'},
      weightContribution:[{sourceId:'string',configuredWeight:'number',influenceScore:'0-100',influenceLevel:'LOW|MEDIUM|HIGH',explanation:'string',evidenceReferences:['string']}],
      reasoning:[{title:'string',description:'string',importance:'0-100',stance:'SUPPORT|OPPOSE|NEUTRAL',evidenceReferences:['string']}],
      risks:[{title:'string',description:'string',impact:'LOW|MEDIUM|HIGH'}],
      evidence:[{reason:'string',references:['string']}],
    },null,2),
    '',
    'Rules:',
    '- No Markdown.',
    '- No code fences.',
    '- No text before or after the JSON object.',
    '- analysisId must match the Analysis Payload\'s analysisId exactly.',
    '- Every weightContribution.configuredWeight must exactly match the corresponding sourceWeights value in the Analysis Payload.',
    '- Sources with zero configured weight must not influence the result.',
    '- Every reasoning item must reference evidence from the Analysis Payload via evidenceReferences.',
    '- Every weightContribution item must reference evidence from the Analysis Payload via evidenceReferences.',
    '- You must not create a Trade.',
  ].join('\n');
}

/** Orchestrates the 4 fixed-order sections into one deterministic prompt string. Never embeds
 * Date.now()/new Date() — the only timestamp that can appear is the Payload's own createdAt,
 * already inside buildPayloadSection()'s JSON dump. generatedAt lives on the PromptRecord
 * wrapper, never inside promptText itself (PROMPT_BUILDER_SPEC.md's determinism principle). */
function buildPromptText(normalizedPayload){
  return [
    buildSystemPromptSection(),
    buildTradingRulesSection(),
    buildPayloadSection(normalizedPayload),
    buildOutputContractSection(),
  ].join('\n\n---\n\n');
}

/* ---------- Prompt Record persistence (localStorage, keyed by analysisId — qa_prompt_records) ---------- */
function loadPromptRecords(){
  try{ const raw=localStorage.getItem('qa_prompt_records'); if(raw) return JSON.parse(raw); }catch(e){}
  return {};
}
function savePromptRecordMap(map){ localStorage.setItem('qa_prompt_records', JSON.stringify(map)); }
function getPromptRecordByAnalysisId(analysisId){ return loadPromptRecords()[analysisId]||null; }
function savePromptRecord(record){
  const map=loadPromptRecords();
  map[record.analysisId]=record;
  savePromptRecordMap(map);
  return record;
}

/** Builds (or returns the already-existing) immutable PromptRecord for one AnalysisPayload.
 * Idempotent by design: a second call for the same analysisId never rebuilds or overwrites —
 * it returns the exact record persisted the first time, preserving its original generatedAt. */
function buildPromptRecord(payload){
  if(!payload) throw promptBuilderError('no_payload','没有可用的 Analysis Payload');
  const existing=getPromptRecordByAnalysisId(payload.analysisId);
  if(existing) return existing;

  const normalized=normalizeAnalysisPayload(payload);
  validateNormalizedPayload(normalized);

  const record={
    analysisId:normalized.analysisId,
    promptVersion:PROMPT_VERSION,
    payloadVersion:normalized.payloadVersion,
    generatedAt:new Date().toISOString(),
    promptText:buildPromptText(normalized),
  };
  return savePromptRecord(record);
}

   Smallest possible frontend surface: reuses the Sprint 3.1A Prompt-preview modal, adds a
   provider/model picker + send button + result view. Never sends an API key — the request body
   below has no field for one, matching pipeline/src/ai/types.ts's AIAnalyzeRequest exactly. */
const qa_ai_raw_results_KEY='qa_ai_raw_results';
function loadAiRawResults(){
  try{ const raw=localStorage.getItem(qa_ai_raw_results_KEY); if(raw) return JSON.parse(raw); }catch(e){}
  return {};
}
function saveAiRawResultMap(map){ localStorage.setItem(qa_ai_raw_results_KEY, JSON.stringify(map)); }
/** Multiple attempts per analysisId are preserved as a growing array — never overwritten,
 * per Sprint 3.1B's "multiple calls for the same analysisId should be preserved as separate
 * attempts" (each identified by its own requestId, assigned server-side). */
function saveAiRawResult(analysisId,result){
  const map=loadAiRawResults();
  if(!Array.isArray(map[analysisId])) map[analysisId]=[];
  map[analysisId].push(result);

}

async function devSendToAiEngine(){
  const payload=Store.lastAnalysisPayload;
  const record=payload?getPromptRecordByAnalysisId(payload.analysisId):null;

  const providerSel=document.getElementById('dev-ai-provider');

  const btn=document.querySelector('[data-action="dev-send-to-ai-engine"]');
  if(btn){ btn.disabled=true; btn.textContent='请求中…'; }
  try{
    const res=await fetch(`${BACKEND_URL}/api/ai/analyze`,{
      method:'POST', headers:{'Content-Type':'application/json'},
      body:JSON.stringify({
        analysisId:record.analysisId, promptVersion:record.promptVersion, payloadVersion:record.payloadVersion,
        provider, model, promptText:record.promptText,

function buildReasoning(direction,contrib){
  const sorted=[...contrib].sort((x,y)=>Math.abs(y.score)-Math.abs(x.score));
  const aligned=sorted.filter(c=> (direction==='long'? c.score>0 : c.score<0));
  const opposed=sorted.filter(c=> (direction==='long'? c.score<0 : c.score>0));
  const templates={
    main:[
      (c)=>`${c.label}显示价格在关键位获得${direction==='long'?'支撑':'压力'}，结构${direction==='long'?'转强':'转弱'}`,
      (c)=>`${c.label}权重贡献显著（${c.score>0?'+':''}${c.score}），是本次判断的主要依据`,
      (c)=>`${c.label}指标持续验证当前${direction==='long'?'上行':'下行'}趋势`,
    ],
    support:[
      (c)=>`${c.label}进一步确认${direction==='long'?'看多':'看空'}结构，权重占比 ${c.weight}%`,
      (c)=>`${c.label}提供额外佐证，方向与主策略一致`,
    ],
    against:[
      (c)=>`${c.label}呈现相反信号（${c.score}），存在一定分歧，建议关注`,
      (c)=>`${c.label}权重占比 ${c.weight}%，构成潜在反向风险`,
    ],
  };
  function build(list,tpls,n){return list.slice(0,n).map((c,i)=>tpls[i%tpls.length](c));}
  return {
    main: build(aligned,templates.main,3).length? build(aligned,templates.main,3) : [`综合${contrib.length}项输入的加权结果指向${direction==='long'?'看多':'看空'}`],
    support: build(aligned.slice(3),templates.support,3),
    against: build(opposed,templates.against,3).length? build(opposed,templates.against,3) : ['未发现明显反向信号，各输入方向基本一致'],
  };
}
function strategyFor(symbol,direction,confidence,entry,entryLo,entryHi,stopLoss,takeProfit,hold,rr,invalidation){
  const contrib=WEIGHT_DEFS.map(w=>{
    const sig=signalFor(symbol,w.key);
    return {key:w.key,label:w.label,icon:w.icon,weight:w.def,score:Math.round(sig*70)};
  });
  const reasoning=buildReasoning(direction,contrib);
  return {direction,confidence,entryLo,entryHi,stopLoss,takeProfit,hold,rr,invalidation,contrib,reasoning};
}

function readImageAsThumbnail(file,maxW){
  return new Promise((resolve)=>{
    const reader=new FileReader();
    reader.onload=()=>{
      const img=new Image();
      img.onload=()=>{
        const scale=Math.min(1,maxW/img.width);
        const w=Math.max(1,Math.round(img.width*scale)), h=Math.max(1,Math.round(img.height*scale));
        const canvas=document.createElement('canvas'); canvas.width=w; canvas.height=h;
        canvas.getContext('2d').drawImage(img,0,0,w,h);
        resolve(canvas.toDataURL('image/jpeg',0.75));
      };
      img.onerror=()=>resolve(null);
      img.src=reader.result;
    };
    reader.onerror=()=>resolve(null);
    reader.readAsDataURL(file);
  });
}
/** Sprint 3.1B.2 Task 3/4 — shared by click-upload (ev-file-pick change), drag&drop, and paste, so
 * all 3 input methods produce identical results. Sets `type` from the FILE's own kind (never from
 * whatever the dropzone's evidence card happened to have selected before) and `reference`
 * (fileName) — never touches `label` (title), which stays exactly what it was, per Task 4: no
 * automatic title is ever generated, since this prototype has no real image/document recognition
 * to base one on. */
async function attachFileToEvidence(evId, file){
  if(!Store.draft) return;
  const ev=Store.draft.evidence.find(x=>x.id===evId);
  if(!ev) return;
  const detected=detectFileEvidenceType(file);
  if(!detected){ toast('不支持的文件类型，仅支持图片 / PDF / TXT / Markdown'); return; }
  ev.type=detected;
  ev.fileName=file.name;
  ev.fileSize=file.size<1024*1024 ? Math.round(file.size/1024)+' KB' : (file.size/1024/1024).toFixed(1)+' MB';
  ev.fileData = detected==='截图' ? await readImageAsThumbnail(file,360) : null;
  saveDraft();
  document.getElementById('app').innerHTML=renderResearch(); wireInteractions();
  toast('已添加文件：'+file.name);
}

/** "今日重要事件" — was a hand-written mock array (TODAY_EVENTS) that never got connected to
 * the real Xoomar calendar data added later, even after the 宏观经济 card itself went live.
 * Reads the same Store.live.macro the card uses (items with id starting "cal-"), parsing the
 * "MM/DD HH:MM（影响）" value string macro.ts builds. No separate mock fallback — same
 * loading/stub/error honesty rule as everything else. */
function renderTodayEvents(){
  const meta=Store.liveMeta.macro, live=Store.live.macro;
  if(!meta||meta.status==='loading') return `<div class="empty-hint" style="padding:10px">${iconStatusLoading()} 正在获取…</div>`;
  if(meta.status!=='ok'||!live) return `<div class="empty-hint" style="padding:10px">${iconStatusError()} 暂无真实事件数据${meta.error?`<div style="font-size:11px;color:var(--text-3);margin-top:4px">${escapeAttr(meta.error)}</div>`:''}</div>`;
  const events=live.itemsRaw.filter(it=>it.id.startsWith('cal-'));
  if(events.length===0) return `<div class="empty-hint" style="padding:10px">近期没有已知的重要事件</div>`;
  return events.map(e=>{
    const m=e.value.match(/^(\d{2}\/\d{2}) (\d{2}:\d{2})（(.+)）$/);
    const dateTime=m?`${m[1]} ${m[2]}`:e.value, impact=m?m[3]:'';
    const cls=impact.includes('高')?'pill-red':impact.includes('中')?'pill-amber':'pill-gray';
    return `<div class="event-chip"><span class="flag">${iconCalendar(15)}</span><div><div>${e.label}</div><div class="t">${dateTime}</div></div>${impact?`<span class="pill ${cls}">${impact}</span>`:''}</div>`;
  }).join('');
}

  })();
  return assetsHtml+mcHtml;

/** Lightweight periodic refresh for just the ticker strip's numbers — hits the same /api/prices
 * + /api/marketcap the full initLiveData() cycle uses, but only touches #ticker-strip's innerHTML
 * (never calls render()), so it can't interrupt a search input, an open modal, or anything else
 * on the page. Silently keeps the last known-good numbers on a transient fetch failure — this is
 * a background convenience poll, not the authoritative connection-status check (that's still
 * initLiveData()'s job). No-ops entirely when off the dashboard route (element won't exist). */
async function refreshTickerPrices(){
  if(document.hidden) return;
  if(!document.getElementById('ticker-strip')) return;
  try{
    const [pricesRes,marketCapRes]=await Promise.all([
      fetch(BACKEND_URL+'/api/prices'),
      fetch(BACKEND_URL+'/api/marketcap'),
    ]);
    if(pricesRes.ok){
      const prices=await pricesRes.json();
      prices.forEach(p=>{ const a=ASSETS.find(x=>x.symbol===p.symbol); if(a){ a.price=p.price; a.change=p.changePct; } });
    }
    if(marketCapRes.ok){
      Store.marketCap=await marketCapRes.json();
      Store.marketCapMeta={status:'ok',updatedAt:Date.now()};
    }
  }catch(err){ /* transient miss — leave last known-good numbers on screen, try again next tick */ }
  const el=document.getElementById('ticker-strip');
  if(el) el.innerHTML=renderTickerStrip();
}

function renderEvidenceCard(ev){

        <button class="ev-file-remove" data-action="ev-file-remove" data-id="${ev.id}">移除</button>
      </div>`;
    } else {
      body=`<label class="ev-dropzone" tabindex="0" data-action="ev-dropzone" data-id="${ev.id}">

/* ---------- Strategy generation ---------- */
function generateStrategy(){
  const d=Store.draft;
  const a=assetOf(d.asset);
  const contrib=[];
  d.weights.forEach(w=>{
    const def=WEIGHT_DEFS.find(x=>x.key===w.key);
    const sig=signalFor(d.asset,w.key);
    contrib.push({label:def.label,icon:def.icon,weight:Number(w.weight),score:Math.round(sig*Number(w.weight)*1.4)});
  });
  d.evidence.forEach(ev=>{
    const sig=signalForText(ev.label);
    contrib.push({label:ev.label,icon:EVIDENCE_TYPE_ICON[ev.type]||'📎',weight:Number(ev.weight),score:Math.round(sig*Number(ev.weight)*1.4)});
  });
  contrib.forEach(c=>c.score=clamp(c.score,-100,100));
  const net=contrib.reduce((s,c)=>s+c.score,0);
  const direction = net>=0 ? 'long':'short';
  const strength=clamp(Math.abs(net)/(contrib.length*40),0,1);
  const confidence=Math.round(clamp(52+strength*43,50,96));

  const price=a.price;
  const entryLo = direction==='long'? price*0.9985 : price*0.9995;
  const entryHi = direction==='long'? price*1.0015 : price*1.0025;
  const entryMid=(entryLo+entryHi)/2;
  const stopLoss = direction==='long'? entryLo*0.976 : entryHi*1.024;
  const takeProfit = direction==='long'? entryHi*1.048 : entryLo*0.952;
  const risk=Math.abs(entryMid-stopLoss), reward=Math.abs(takeProfit-entryMid);
  const rr='1:'+(reward/risk).toFixed(2);
  const hold = strength>0.6 ? '1-3 天' : '2-4 天';
  const invalidation = direction==='long'
    ? `跌破关键支撑 ${fmtPrice(stopLoss*0.995,a.decimals)}`
    : `突破关键阻力 ${fmtPrice(stopLoss*1.005,a.decimals)}`;

  const reasoning=buildReasoning(direction,contrib);

  d.strategy={
    direction,confidence,entryLo,entryHi,entryMid,stopLoss,takeProfit,rr,hold,invalidation,
    contrib:contrib.sort((x,y)=>Math.abs(y.score)-Math.abs(x.score)),
    reasoning,
    generatedAt:new Date(MOCK_NOW),
    decimals:a.decimals,
  };
  saveDraft();
}

/* ---------- Trade List ---------- */
function computeStats(trades){
  const running=trades.filter(t=>t.status==='running').length;
  const closed=trades.filter(t=>t.status==='closed');
  const totalPnl=closed.reduce((s,t)=>s+pnlOf(t),0);
  const wins=closed.filter(t=>pnlOf(t)>0);
  const losses=closed.filter(t=>pnlOf(t)<=0);
  const winRate=closed.length? (wins.length/closed.length*100):0;
  const avgWin=wins.length? wins.reduce((s,t)=>s+pnlOf(t),0)/wins.length : 0;
  const avgLoss=losses.length? Math.abs(losses.reduce((s,t)=>s+pnlOf(t),0)/losses.length) : 0;
  const pnlRatio = avgLoss? (avgWin/avgLoss) : 0;
  return {running,closedCount:closed.length,totalPnl,winRate,pnlRatio,total:trades.length};
}
function pnlOf(t){
  if(t.mockPnl!==undefined) return t.mockPnl;
  if(t.status==='cancelled'||t.entry==null) return 0;
  const exit = t.status==='closed'? t.exitPrice : liveTPrice(t);
  const mult = t.direction==='long'? 1:-1;
  const qty = t.position / t.entry;
  return (exit-t.entry)*mult*qty;
}
function pnlPctOf(t){
  if(t.entry==null) return 0;
  const p=pnlOf(t); return p/t.position*100;
}
function liveTPrice(t){
  const a=assetOf(t.symbol);
  const rng=rngFor(t.id+'live');
  const drift=(t.direction==='long'?1:-1)*0.006*(0.5+rng());
  return t.entry*(1+drift);
}

      <div class="subtabs">${tabs.map(([k,l])=>`<button class="subtab ${f.tab===k?'active':''}" data-action="trade-tab" data-tab="${k}">${l}</button>`).join('')}</div>
      <div class="filters-row">

        <select data-action="trade-filter-dir"><option value="all">全部方向</option><option value="long" ${f.dir==='long'?'selected':''}>做多</option><option value="short" ${f.dir==='short'?'selected':''}>做空</option><option value="watch" ${f.dir==='watch'?'selected':''}>观望</option></select>
      </div>
      <div style="overflow-x:auto">

        <thead><tr><th>交易标的</th><th>方向</th><th>状态</th><th>持仓时间</th><th>入场价格 / 当前价格</th><th>盈亏 (USDT)</th><th>盈亏率</th><th>AI 置信度</th><th>创建时间</th><th></th></tr></thead>

          ${rows.length? rows.map(t=>renderTradeRow(t)).join('') : `<tr><td colspan="10"><div class="empty-hint">没有符合条件的交易</div></td></tr>`}

          <div class="legend-item"><b>已取消</b>：交易未执行或手动取消</div>
        </div>
      </div>
    </div>
  `;
}
function statusPill(t){
  if(t.status==='running') return `<span class="pill pill-primary">进行中</span>`;
  if(t.status==='closed') return `<span class="pill ${t.closeReason==='止盈'?'pill-green':'pill-red'}">已平仓</span>`;
  return `<span class="pill pill-gray">已取消</span>`;
}
function dirLabel(t){
  if(t.direction==='watch') return `<span class="dir-lbl muted">— 观望</span>`;
  if(t.direction==='long') return `<span class="dir-lbl up">↑ 做多</span>`;
  return `<span class="dir-lbl down">↓ 做空</span>`;
}
function renderTradeRow(t){
  const a=assetOf(t.symbol);
  const pnl=pnlOf(t), pnlPct=pnlPctOf(t);
  const cur = t.status==='closed'? t.exitPrice : (t.entry!=null? liveTPrice(t): null);
  return `<tr class="rowlink" data-action="open-trade" data-id="${t.id}">
    <td><div class="sym-cell"><div class="sym-ic" style="background:${a.color}">${a.ic}</div><div><div class="fw">${t.symbol}</div><div class="sym-sub">${t.mode} ${t.leverage>1?t.leverage+'x':''}</div></div></div></td>
    <td>${dirLabel(t)}</td>
    <td>${statusPill(t)}<div class="sym-sub" style="margin-top:3px">${t.status==='closed'?t.closeReason:(t.status==='cancelled'?'手动取消':'持仓中')}</div></td>
    <td>${t.status==='cancelled'?'--':fmtDuration(t.createdAt)}${t.status==='running'?'<div class="sym-sub">自入场起</div>':''}</td>
    <td class="mono">${t.entry!=null? `入场 ${fmtPrice(t.entry,a.decimals)}<div class="sym-sub">${t.status==='closed'?'出场':'当前'} ${fmtPrice(cur,a.decimals)}</div>`:'--'}</td>
    <td class="mono fw ${t.status==='cancelled'?'muted':(pnl>=0?'up':'down')}">${t.status==='cancelled'?'--':fmtSigned(pnl,2)+' USDT'}</td>
    <td class="mono fw ${t.status==='cancelled'?'muted':(pnlPct>=0?'up':'down')}">${t.status==='cancelled'?'--':fmtPct(pnlPct)}</td>
    <td>${confidenceBadge(t.confidence)}</td>
    <td class="muted">${fmtDateTime(t.createdAt)}</td>
    <td>
      <div class="dropdown-wrap">
        <button class="icon-btn" data-action="row-menu" data-id="${t.id}">⋯</button>
      </div>
    </td>
  </tr>`;
}
function confidenceBadge(c){
  const color = c>=70?'var(--green)':c>=55?'var(--amber)':'var(--red)';
  return `<div class="conf-ring" style="--pct:${c}"><span style="color:${color}">${c}%</span></div>`;
}

function execTypeLabel(k){return {ai:'按 AI 执行',modified:'修改后执行',cancelled:'放弃执行'}[k]||k;}

/* ---------- Interactions ---------- */
function wireInteractions(){
  document.querySelectorAll('[data-action="w-slide"],[data-action="w-num"]').forEach(elm=>{
    elm.addEventListener('input',()=>{
      const key=elm.dataset.key, val=clamp(Number(elm.value)||0,0,100);
      const w=Store.draft.weights.find(x=>x.key===key); w.weight=val; saveDraft();
      document.querySelectorAll(`[data-key="${key}"]`).forEach(o=>{if(o!==elm)o.value=val;});
      refreshWeightTotal();
    });
  });
  document.querySelectorAll('[data-action="ev-weight"]').forEach(elm=>{
    elm.addEventListener('input',()=>{const ev=Store.draft.evidence.find(x=>x.id===elm.dataset.id); ev.weight=clamp(Number(elm.value)||0,0,100); saveDraft(); refreshWeightTotal();});
  });
  document.querySelectorAll('[data-action="ev-label"]').forEach(elm=>elm.addEventListener('input',()=>{Store.draft.evidence.find(x=>x.id===elm.dataset.id).label=elm.value; saveDraft();}));
  document.querySelectorAll('[data-action="ev-desc"]').forEach(elm=>elm.addEventListener('input',()=>{Store.draft.evidence.find(x=>x.id===elm.dataset.id).desc=elm.value; saveDraft();}));
  document.querySelectorAll('[data-action="ev-type"]').forEach(elm=>elm.addEventListener('change',()=>{
    Store.draft.evidence.find(x=>x.id===elm.dataset.id).type=elm.value; saveDraft();
    document.getElementById('app').innerHTML=renderResearch(); wireInteractions();
  }));
  document.querySelectorAll('[data-action="ev-file-pick"]').forEach(elm=>elm.addEventListener('change',async ()=>{
    const file=elm.files[0]; if(!file) return;
    await attachFileToEvidence(elm.dataset.id, file);
  }));
  document.querySelectorAll('[data-action="ev-dropzone"]').forEach(elm=>{
    elm.addEventListener('dragover',e=>{ e.preventDefault(); elm.classList.add('dragover'); });
    elm.addEventListener('dragleave',()=>{ elm.classList.remove('dragover'); });
    elm.addEventListener('drop',async e=>{
      e.preventDefault(); elm.classList.remove('dragover');
      const file=e.dataTransfer.files && e.dataTransfer.files[0];
      if(file) await attachFileToEvidence(elm.dataset.id, file);
    });
  });
  document.querySelectorAll('.ev-card').forEach(card=>{
    card.addEventListener('focusin',()=>{ Store.lastFocusedEvidenceId=card.dataset.id; });
  });
  document.querySelectorAll('[data-action="set-asset"]').forEach(elm=>elm.addEventListener('change',()=>{Store.draft.asset=elm.value; saveDraft();}));
  document.querySelectorAll('[data-action="set-timeframe"]').forEach(elm=>elm.addEventListener('change',()=>{Store.draft.timeframe=elm.value; saveDraft();}));
  document.querySelectorAll('[data-action="set-range"]').forEach(elm=>elm.addEventListener('change',()=>{Store.draft.range=elm.value; saveDraft();}));

  document.querySelectorAll('[data-action="exec-field"]').forEach(elm=>elm.addEventListener('input',()=>{
    const f=elm.dataset.field; Store.draft.execution[f]=Number(elm.value); saveDraft();
    document.querySelectorAll(`[data-action="exec-field"][data-field="${f}"]`).forEach(o=>{if(o!==elm) o.value=elm.value;});
  }));
  document.querySelectorAll('[data-action="adj-reason"]').forEach(elm=>elm.addEventListener('input',()=>{
    Store.draft.execution[elm.dataset.field]=elm.value; saveDraft();
  }));
  const adjHoldEl=document.querySelector('[data-action="adj-hold"]');
  if(adjHoldEl) adjHoldEl.addEventListener('input',()=>{Store.draft.execution.adjHold=adjHoldEl.value; saveDraft();});
  const notesEl=document.querySelector('[data-action="exec-notes"]');
  if(notesEl) notesEl.addEventListener('input',()=>{Store.draft.execution.notes=notesEl.value; saveDraft();});

  document.querySelectorAll('[data-action="ai-cfg-field"]').forEach(elm=>elm.addEventListener('input',()=>{
    const draft=Store.aiProviderConfigDraft[elm.dataset.provider];
    if(!draft) return;
    draft[elm.dataset.field]=elm.value;
  }));

  const search=document.querySelector('[data-action="trade-search"]');
  if(search) search.addEventListener('input',()=>{Store.tradeFilter.q=search.value; renderInPlace();});
  const fs=document.querySelector('[data-action="trade-filter-symbol"]');
  if(fs) fs.addEventListener('change',()=>{Store.tradeFilter.symbol=fs.value; renderInPlace();});
  const fd=document.querySelector('[data-action="trade-filter-dir"]');
  if(fd) fd.addEventListener('change',()=>{Store.tradeFilter.dir=fd.value; renderInPlace();});
}
function renderInPlace(){document.getElementById('app').innerHTML=renderTradeList(); wireInteractions();}
function refreshWeightTotal(){
  const total=draftTotal();
  const ok=total===100;
  const totalEl=document.querySelector('.weight-total');
  if(totalEl){totalEl.textContent=`总权重 ${total}% ${ok?'✓':'⚠'}`; totalEl.style.color= ok? 'var(--green)':'var(--red)';}
  const btn=document.querySelector('[data-action="analyze"]');
  if(btn){btn.disabled=!ok; btn.textContent = '✨ 开始 AI 分析 '+(ok?'':`（权重总和需为 100%，当前 ${total}%）`);}
}

document.addEventListener('click',(e)=>{
  const t=e.target.closest('[data-action]');
  document.querySelectorAll('.dropdown-menu').forEach(m=>{if(!t||!m.contains(t)) m.remove();});
  if(!t) return;
  const act=t.dataset.action;

  if(act==='nav'){navigate(t.dataset.href);}
  else if(act==='scope-toast'){toast('该功能在本原型范围之外（详见 MVP Handbook）');}
  else if(act==='logout-toast'){toast('原型模式，无需登录');}
  else if(act==='toggle-theme'){
    const html=document.documentElement;
    const cur=html.getAttribute('data-theme');
    const next = cur==='dark' ? 'light' : 'dark';
    html.setAttribute('data-theme',next);
    localStorage.setItem('qa_theme',next);
    render();
  }

/** Sprint 3.1B.2 Task 3 — global, not per-dropzone: Ctrl+V/Cmd+V has no natural "target element"
 * the way a click or a drag-drop does, and Research can now start with zero evidence cards (Task
 * 2), so there may be nowhere to paste INTO yet. Prefers the last-focused empty file-type card
 * (set by the 'focusin' listener in wireInteractions); if there isn't one, creates a fresh 截图
 * card and attaches there — "for pasted images, create the upload automatically" (Task 3). Only
 * images are handled: PDF/TXT/Markdown have no standard OS clipboard "paste as file" gesture. */
function findEmptyFileEvidenceId(){
  if(!Store.draft) return null;
  const focused=Store.draft.evidence.find(e=>e.id===Store.lastFocusedEvidenceId && !e.fileName && EVIDENCE_FILE_TYPES.includes(e.type));
  if(focused) return focused.id;
  const anyEmpty=Store.draft.evidence.find(e=>!e.fileName && EVIDENCE_FILE_TYPES.includes(e.type));
  return anyEmpty ? anyEmpty.id : null;
}
document.addEventListener('paste', async (e)=>{
  if(currentRoute()[0]!=='research'||!Store.draft) return;
  const items=(e.clipboardData||window.clipboardData||{}).items;
  if(!items) return;
  let imageFile=null;
  for(const item of items){ if(item.type&&item.type.startsWith('image/')){ imageFile=item.getAsFile(); break; } }
  if(!imageFile) return;
  e.preventDefault();
  let targetId=findEmptyFileEvidenceId();
  if(!targetId){
    const newEv={id:'e'+Date.now(),type:'截图',label:'',desc:'',weight:0,fileName:null,fileData:null,fileSize:null};
    Store.draft.evidence.push(newEv);
    targetId=newEv.id;
  }
  const named = imageFile.name ? imageFile : new File([imageFile],'pasted-image-'+Date.now()+'.png',{type:imageFile.type||'image/png'});
  await attachFileToEvidence(targetId, named);
});

/* ---------- Analysis Runner overlay (Sprint 3.2A UI + Sprint 3.2B real logic) ----------
   Sprint 3.2A built this terminal-style overlay as a pure visual mock. Sprint 3.2B replaces the
   scripted lifecycle with the real one: concurrent fresh per-source requests, independent
   timeouts, real validation, real evidence checks, cancel-on-any-failure, then the SAME
   buildAnalysisPayload()/buildPromptRecord() calls as before — now fed real, just-collected data
   instead of Dashboard's cache. Still no AI call anywhere in this flow (Sprint 3.2C's job). */

/** Single source of truth for the per-source collection timeout — not repeated as a literal
 * anywhere else in this file. Not user-configurable this sprint (no Settings UI asked for it);
 * a future sprint could expose this as a real setting without touching the call site below. */
const ANALYSIS_SOURCE_TIMEOUT_MS = 10000;
/** Purely for perceptibility on the LOCAL (non-network) stages — Validate/Freeze/Build Payload/
 * Build Prompt are near-instant synchronous JS, but rendering them with zero visible duration
 * would look broken next to the real, variable timing of the concurrent collection phase above
 * them. The stage's success/failure is always real; only this pacing is artificial. */
const AR_LOCAL_STAGE_MS = 220;

/** One stage per required (weight>0) source, an evidence stage only if evidence exists, then the
 * fixed local tail — no more 'ai' stage this sprint (Sprint 3.2C's job). `sourceLabel` (no "采集"
 * prefix) is kept separately for failure-banner text. */
function buildAnalysisRunnerStages(d, requiredKeys){
  const stages=[];
  requiredKeys.forEach(key=>{
    const def=WEIGHT_DEFS.find(x=>x.key===key);
    const label=def?def.label:key;
    stages.push({key:'collect-'+key, kind:'collect', label:'采集'+label, sourceLabel:label, status:'waiting'});
  });
  if(d.evidence.length>0) stages.push({key:'process-evidence', kind:'evidence', label:'处理补充信息', sourceLabel:'补充信息', status:'waiting'});
  stages.push({key:'validate', kind:'validate', label:'校验数据源', sourceLabel:'数据源校验', status:'waiting'});
  stages.push({key:'freeze', kind:'freeze', label:'冻结分析快照', sourceLabel:'分析快照', status:'waiting'});
  stages.push({key:'payload', kind:'payload', label:'构建 Analysis Payload', sourceLabel:'Analysis Payload', status:'waiting'});
  stages.push({key:'prompt', kind:'prompt', label:'构建 Prompt', sourceLabel:'Prompt', status:'waiting'});
  return stages;
}

/** Developer Diagnostics (Sprint 3.2B) — only rendered when Store.devDiagnosticsMode is on (sidebar
 * switch). Built from real numbers collected during the run (see startAnalysisRunner()); shows "—"
 * for the payload/prompt fields on a failed run, since those stages never happened. No token
 * estimation, per explicit instruction. */
function arDiagnosticsHtml(runner){
  if(!Store.devDiagnosticsMode || !runner.diagnostics) return '';
  const g=runner.diagnostics;
  const ms=(v)=> v==null ? '—' : v+' ms';
  const chars=(v)=> v==null ? '—' : v+' 字符';
  const list=(arr)=> arr.length ? escapeAttr(arr.join('、')) : '无';
  return `<div class="ar-diagnostics">
    <div class="ar-diag-title">开发者诊断信息</div>
    <div class="ar-diag-row"><span>已采集来源</span><span>${g.collectedCount}</span></div>
    <div class="ar-diag-row"><span>跳过来源（权重为 0）</span><span>${list(g.skippedSources)}</span></div>
    <div class="ar-diag-row"><span>失败来源</span><span>${list(g.failedNames)}</span></div>
    <div class="ar-diag-row"><span>采集耗时</span><span>${ms(g.collectionDurationMs)}</span></div>
    <div class="ar-diag-row"><span>Payload 大小</span><span>${chars(g.payloadSizeChars)}</span></div>
    <div class="ar-diag-row"><span>Prompt 大小</span><span>${chars(g.promptSizeChars)}</span></div>
    <div class="ar-diag-row"><span>Prompt 构建耗时</span><span>${ms(g.promptBuildDurationMs)}</span></div>
  </div>`;
}

function renderAnalysisRunnerOverlay(){
  const r=Store.analysisRunner;
  if(!r) return '';
  const iconFor=(s)=>({success:'✓', failed:'✕', running:'●', skipped:'—'}[s] || '○');
  const stagesHtml=r.stages.map(s=>`<div class="ar-stage ${s.status}"><span class="ic">${iconFor(s.status)}</span><span class="lbl">${escapeAttr(s.label)}</span></div>`).join('');

  let title='正在准备分析', subtitle='正在为本次实验采集最新数据…', bannerHtml='', footHtml='';
  if(r.phase==='failed'){
    title='分析已取消'; subtitle='';
    const names=(r.diagnostics&&r.diagnostics.failedNames)||[];
    // Phrased as "{X} 未能成功获取" rather than "未能获取 {X} 数据" — several source labels
    // (链上数据/衍生品数据/稳定币数据/清算数据/期权数据) already end in "数据" themselves, and
    // appending another "数据" produced a visible "期权数据数据" duplication (caught in a real
    // screenshot during Sprint 3.2A's verification). This phrasing is safe for every label, and
    // now handles multiple simultaneous failures (concurrent requests can fail together).
    bannerHtml=`<div class="ar-banner err">${escapeAttr(names.join('、'))}未能成功获取。${names.length>1?'这些':'该'}数据源参与本次实验，请重试。</div>`+arDiagnosticsHtml(r);
    footHtml=`<button class="ar-btn" data-action="ar-close">关闭</button><button class="ar-btn ar-btn-primary" data-action="ar-retry">重试</button>`;
  } else if(r.phase==='ready'){
    title='分析已就绪'; subtitle='Prompt 已成功构建';
    bannerHtml=arDiagnosticsHtml(r);
    footHtml=`<button class="ar-btn" data-action="ar-view-prompt">查看 Prompt（开发用）</button><button class="ar-btn ar-btn-primary" data-action="ar-close">关闭</button>`;
  } else {
    footHtml=`<button class="ar-btn ar-btn-danger" data-action="ar-cancel">取消</button>`;
  }

  return `<div class="ar-panel">
    <div class="ar-head">
      <div class="ar-title"><span>${title}</span><span class="ar-timer" id="ar-timer">00:00.0</span></div>
      <div class="ar-subtitle">${subtitle}</div>
    </div>
    ${bannerHtml}
    <div class="ar-stages">${stagesHtml}</div>
    ${footHtml?`<div class="ar-foot">${footHtml}</div>`:''}
  </div>`;
}

let arTimerHandle=null, arStartMs=0;
function arFormatElapsed(ms){
  const s=Math.floor(ms/1000), tenths=Math.floor((ms%1000)/100);
  return String(Math.floor(s/60)).padStart(2,'0')+':'+String(s%60).padStart(2,'0')+'.'+tenths;
}
function arStartTimer(){
  arStartMs=Date.now();
  arTimerHandle=setInterval(()=>{
    const el=document.getElementById('ar-timer'); if(el) el.textContent=arFormatElapsed(Date.now()-arStartMs);
  },100);
}
function arStopTimer(){ if(arTimerHandle){ clearInterval(arTimerHandle); arTimerHandle=null; } }
/** arRerender() replaces #analysis-runner-body's innerHTML, which destroys and recreates #ar-timer
 * — its template default ("00:00.0") would otherwise be the last thing visible once the interval
 * has already been stopped (caught in a real screenshot during Sprint 3.2A's verification: the
 * final frame showed 00:00.0 instead of the real elapsed time). Call this right after
 * arStopTimer()+arRerender() to stamp the true final elapsed time onto the fresh element. */
function arFinishTimerDisplay(){
  const el=document.getElementById('ar-timer');
  if(el) el.textContent=arFormatElapsed(Date.now()-arStartMs);
}
function arDelay(ms){ return new Promise(res=>setTimeout(res,ms)); }

function arWireButtons(){
  const cancelBtn=document.querySelector('[data-action="ar-cancel"]');
  if(cancelBtn) cancelBtn.addEventListener('click',()=>{
    if(Store.analysisRunner){
      Store.analysisRunner.cancelled=true;
      // Actually aborts every in-flight source fetch, not just makes the loop ignore their
      // eventual result — a cancelled run stops real network activity immediately.
      (Store.analysisRunner.abortControllers||[]).forEach(c=>{ try{ c.abort(); }catch(e){} });
    }
    arCloseOverlay();
  });
  const closeBtn=document.querySelector('[data-action="ar-close"]');
  if(closeBtn) closeBtn.addEventListener('click',arCloseOverlay);
  const retryBtn=document.querySelector('[data-action="ar-retry"]');
  if(retryBtn) retryBtn.addEventListener('click',startAnalysisRunner);
  const viewPromptBtn=document.querySelector('[data-action="ar-view-prompt"]');
  if(viewPromptBtn) viewPromptBtn.addEventListener('click',()=>{
    arCloseOverlay();
    openPromptPreviewModal();
  });
}
function arRerender(){
  if(!Store.analysisRunner) return; // a cancelled/closed run's in-flight collectors may still call this once more
  document.getElementById('analysis-runner-body').innerHTML=renderAnalysisRunnerOverlay();
  arWireButtons();
}
function arCloseOverlay(){
  document.getElementById('analysis-runner-bg').classList.remove('show');
  arStopTimer();
  Store.analysisRunner=null;
}

/** Collects exactly ONE required source, fresh, real, right now — GET /api/sources/:key?fresh=1
 * bypasses the backend's own 20s cache (see pipeline/src/server.ts's getSource()), so this can
 * never silently return data Dashboard's own polling happened to fetch moments ago. Independent
 * AbortController per source, per Step 3's "independent timeout" requirement; the controller is
 * also what Cancel uses to actually stop this request, not just ignore its result. Never throws —
 * always resolves, recording success into runner.collected or failure into runner.failures, so
 * Promise.all(requiredKeys.map(...)) in startAnalysisRunner() waits for every source to genuinely
 * settle rather than short-circuiting on the first rejection (multiple sources can fail at once,
 * since they're concurrent — the diagnostics/banner should reflect all of them, not just one). */
async function arCollectOneSource(key, runner){
  const stage=runner.stages.find(s=>s.key==='collect-'+key);
  stage.status='running'; arRerender();
  const controller=new AbortController();
  runner.abortControllers.push(controller);
  const timer=setTimeout(()=>controller.abort(), ANALYSIS_SOURCE_TIMEOUT_MS);
  try{
    const res=await fetch(`${BACKEND_URL}/api/sources/${key}?fresh=1`, {signal:controller.signal});
    clearTimeout(timer);
    if(!res.ok) throw new Error('HTTP '+res.status);
    const data=await res.json();
    // Validation Rules (Step 4): a valid response has the SourceResult shape and a non-error
    // status — content being EMPTY (0 news events, 0 liquidations) is never itself a failure.
    if(!data || typeof data.status!=='string' || !Array.isArray(data.itemsRaw)) throw new Error('响应格式不正确');
    if(data.status==='error') throw new Error(data.note||'数据源返回错误');
    runner.collected[key]=data;
    stage.status='success';
  }catch(err){
    clearTimeout(timer);
    if(runner.cancelled) return; // a user-triggered abort isn't a collection "failure" — don't paint one
    stage.status='failed';
    const msg = err.name==='AbortError' ? '请求超时' : err.message;
    runner.failures.push({key, label:stage.sourceLabel, message:msg});
  }
  arRerender();
}

/** Evidence Step 5 — MVP validation only: every FILE-type evidence item must actually have a file
 * attached (fileName set). No OCR, no PDF parsing, no image understanding — explicitly deferred.
 * An evidence item the user never finished uploading is treated as a failure of this stage, same
 * as any other required source, since it carries real weight toward the 100% total. */
async function arValidateEvidenceStage(runner, d){
  const stage=runner.stages.find(s=>s.kind==='evidence');
  if(!stage) return;
  stage.status='running'; arRerender();
  await arDelay(AR_LOCAL_STAGE_MS);
  if(runner.cancelled) return;
  const incomplete=d.evidence.filter(ev=>EVIDENCE_FILE_TYPES.includes(ev.type) && !ev.fileName);
  if(incomplete.length>0){
    stage.status='failed';
    runner.failures.push({key:'evidence', label:stage.sourceLabel, message:'存在未上传文件的补充信息'});
  } else {
    stage.status='success';
  }
  arRerender();
}

async function startAnalysisRunner(){
  if(draftTotal()!==100) return;
  const d=Store.draft;
  const requiredKeys=d.weights.filter(w=>Number(w.weight)>0).map(w=>w.key);
  const skippedSources=d.weights.filter(w=>Number(w.weight)===0).map(w=>{
    const def=WEIGHT_DEFS.find(x=>x.key===w.key); return def?def.label:w.key;
  });
  const stages=buildAnalysisRunnerStages(d, requiredKeys);
  const runner={stages, phase:'running', cancelled:false, collected:{}, failures:[], abortControllers:[], diagnostics:null};
  Store.analysisRunner=runner;
  document.getElementById('analysis-runner-body').innerHTML=renderAnalysisRunnerOverlay();
  document.getElementById('analysis-runner-bg').classList.add('show');
  arWireButtons();
  arStartTimer();

  // Step 2/3: every required source, fresh, concurrent, independently timed out and validated.
  const collectionStartedAt=Date.now();
  await Promise.all(requiredKeys.map(key=>arCollectOneSource(key, runner)));
  if(runner.cancelled) return;
  const collectionDurationMs=Date.now()-collectionStartedAt;

  // Step 5: evidence completeness (folds into the same any-failure-cancels gate as Step 6).
  await arValidateEvidenceStage(runner, d);
  if(runner.cancelled) return;

  if(runner.failures.length>0){
    stages.forEach(s=>{ if(['validate','freeze','payload','prompt'].includes(s.kind) && s.status==='waiting') s.status='skipped'; });
    runner.phase='failed';
    runner.diagnostics={
      collectedCount:requiredKeys.length-runner.failures.length, skippedSources,
      failedNames:runner.failures.map(f=>f.label), failedCount:runner.failures.length,
      collectionDurationMs, payloadSizeChars:null, promptSizeChars:null, promptBuildDurationMs:null,
    };
    arStopTimer(); arRerender(); arFinishTimerDisplay();
    return;
  }

  // Step 4/6 checkpoint: every required source (and evidence) already individually validated above
  // — this stage is the visible confirmation of that gate, not new async work.
  const validateStage=stages.find(s=>s.kind==='validate');
  validateStage.status='running'; arRerender();
  await arDelay(AR_LOCAL_STAGE_MS);
  if(runner.cancelled) return;
  validateStage.status='success'; arRerender();

  // Step 7: freeze the snapshot — real, just-collected results, converted once, never touching
  // Store.live/liveMeta (Dashboard's own cache) at any point in this whole flow.
  const freezeStage=stages.find(s=>s.kind==='freeze');
  freezeStage.status='running'; arRerender();
  const frozenSnapshots=requiredKeys.map(key=>freshSourceResultToSnapshot(key, runner.collected[key]));
  await arDelay(AR_LOCAL_STAGE_MS);
  if(runner.cancelled) return;
  freezeStage.status='success'; arRerender();

  // Step 7 (cont'd): Analysis Payload, via the existing, unmodified builder.
  const payloadStage=stages.find(s=>s.kind==='payload');
  payloadStage.status='running'; arRerender();
  const freshNewsRaw=runner.collected.news ? runner.collected.news.itemsRaw : [];
  const payload=buildAnalysisPayload(frozenSnapshots, freshNewsRaw);
  Store.lastAnalysisPayload=payload;
  await arDelay(AR_LOCAL_STAGE_MS);
  if(runner.cancelled) return;
  payloadStage.status='success'; arRerender();

  // Step 8: Prompt Record, via the existing, unmodified Prompt Builder.
  const promptStage=stages.find(s=>s.kind==='prompt');
  promptStage.status='running'; arRerender();
  const promptBuildStartedAt=Date.now();
  const record=buildPromptRecord(payload);
  const promptBuildDurationMs=Date.now()-promptBuildStartedAt;
  await arDelay(AR_LOCAL_STAGE_MS);
  if(runner.cancelled) return;
  promptStage.status='success';

  // Step 9: stop here — no AI call. Deliberately no auto-navigate to Strategy either (unlike
  // Sprint 3.2A's mock): Strategy is still 100% mock signal generation, unrelated to this real

function confirmExecution(){
  const d=Store.draft, s=d.strategy, e=d.execution, a=assetOf(d.asset);
  const cancelled = e.choice==='cancel';
  const trade={
    id:uid(),symbol:d.asset,mode: e.leverage>1?'合约':'现货',leverage:e.leverage,
    direction: cancelled ? 'watch' : e.direction,
    status: cancelled ? 'cancelled':'running',
    createdAt:new Date(s.generatedAt), execTime:new Date(MOCK_NOW),
    entry: cancelled? null : e.entry,
    exitPrice:null,
    confidence:s.confidence,
    stopLoss: cancelled? null : e.stopLoss,
    takeProfit: cancelled? null : e.takeProfit,
    position: cancelled? null : e.position,
    notes:e.notes,
    execType: cancelled ? 'cancelled' : (e.choice==='modified'?'modified':'ai'),
    strategy:s,
    closeReason:null,
  };
  trade.timeline=[
    {title:'策略生成完成',time:fmtDateTime(s.generatedAt),desc:'AI 基于您的研究输入生成交易策略',status:'done'},
    cancelled
      ? {title:'放弃执行',time:fmtDateTime(MOCK_NOW),desc:'未按策略执行，交易取消',status:'done'}
      : {title:'执行下单（开仓）',time:fmtDateTime(MOCK_NOW),desc:`在 ${fmtPrice(trade.entry,a.decimals)} USDT 价格${trade.direction==='short'?'开空':'开多'} ${fmt(trade.position,0)} USDT`,status:'done'},
  ];
  if(!cancelled) trade.timeline.push({title:'当前持仓中',time:fmtDateTime(MOCK_NOW)+' – 进行中',desc:'持仓时间：0分钟',status:'active'},{title:'（待）平仓',time:'--',desc:'交易尚未结束',status:'pending'});

  Store.trades.unshift(trade); saveTrades();
  Store.draft=null; saveDraft();
  toast(cancelled? '已记录为放弃执行' : '交易已执行，进入持仓中');
  navigate('#/trades/'+trade.id);
}

function openRowMenu(btn){
  document.querySelectorAll('.dropdown-menu').forEach(m=>m.remove());
  const id=btn.dataset.id; const trade=Store.trades.find(x=>x.id===id);
  const wrap=btn.closest('.dropdown-wrap');
  const menu=el(`<div class="dropdown-menu">
    <button data-action="open-trade-menu" data-id="${id}">查看详情</button>
    ${trade.status==='running'?`<button data-action="manual-close-menu" data-id="${id}">手动平仓</button>`:''}
    <button data-action="copy-trade" data-id="${id}">复制交易</button>
  </div>`);

    if(b.dataset.action==='open-trade-menu') navigate('#/trades/'+id);

  const t=Store.trades.find(x=>x.id===id); if(!t||t.status!=='running') return;
  openModal(`<div class="modal-head"><h3>手动平仓</h3><button class="close-x" onclick="closeModal()">✕</button></div>

function newsSourceLogoInitial(name){ return (name.trim()[0]||'?').toUpperCase(); }

/** Every row is now a real backend record — no more builtin-vs-custom branch. 'origin' is purely
 * an informational badge; 状态/抓取频率/操作 all reflect (and act on) the real news_sources row. */
function renderNsRows(list){
  if(list.length===0) return `<tr><td colspan="7"><div class="empty-hint" style="padding:20px">没有匹配的新闻源</div></td></tr>`;
  return list.map(s=>{
    const t=NEWS_SOURCE_TYPES[s.type];
    // s.fetchable comes from the backend (isSourceFetchable(type,url), which for api-type sources
    // checks the actual url against known exchange adapters) — real per-row truth, not the
    // static per-type default. Falls back to the type default only if the backend hasn't sent it.
    const fetchable=typeof s.fetchable==='boolean' ? s.fetchable : t.fetchable;
    let statusHtml;
    if(!fetchable) statusHtml=`<div class="ns-status"><span class="ns-check" style="background:var(--track); border-color:var(--track)"></span><span>暂不支持抓取</span></div>`;
    else if(s.last_status==='ok') statusHtml=`<div class="ns-status"><span class="ns-check" style="background:var(--green); border-color:var(--green)"></span><span>正常 · ${s.last_item_count} 条</span></div>`;
    else if(s.last_status==='error') statusHtml=`<div class="ns-status"><span class="ns-check" style="background:var(--red); border-color:var(--red)" title="${escapeAttr(s.last_error||'')}"></span><span>抓取异常</span></div>`;
    else statusHtml=`<div class="ns-status"><span class="ns-check" style="background:var(--track); border-color:var(--track)"></span><span>尚未抓取</span></div>`;
    const syncTxt=s.last_fetched_at ? relTimeReal(s.last_fetched_at) : '—';
    return `<tr>
      <td><span class="ns-check"></span></td>
      <td><div style="display:flex; align-items:center; gap:10px">
        <span class="sym-ic" style="background:${newsLogoColor(s.name)}">${escapeAttr(newsSourceLogoInitial(s.name))}</span>
        <span style="font-weight:700">${s.name}</span>
      </div></td>
      <td><span class="pill pill-primary">${t.label}</span>${s.origin==='builtin'?` <span class="pill pill-gray">内置</span>`:''}</td>
      <td>${statusHtml}</td>
      <td class="muted">${fetchable?`每 ${s.fetch_interval_minutes} 分钟`:'—'}</td>
      <td class="muted">${syncTxt}</td>
      <td><div style="display:flex; gap:6px; align-items:center">
        <button class="switch ${s.enabled?'on':''}" data-action="ns-toggle" data-id="${s.id}" title="${s.enabled?'启用':'已停用'}"></button>
        <button class="icon-btn" data-action="ns-edit" data-id="${s.id}" title="编辑">${iconEdit(15)}</button>
        <button class="icon-btn" data-action="ns-delete" data-id="${s.id}" title="删除">${iconTrash(15)}</button>
      </div></td>
    </tr>`;
  }).join('');
}

  if(errEl) errEl.textContent=Store.newsSourcesError||'';
}

function openNewsSourceAdd(){
  NewsWizard={step:1, editingId:null, type:null, form:{name:'',url:'',category:'',fetchIntervalMinutes:15,lookbackHours:24,enabled:true,fetchable:null}, testing:false, testError:null};
  renderNsWizard();
}
function openNewsSourceEdit(id){
  const s=Store.newsSources.find(x=>x.id===id);
  if(!s) return;
  // s.fetchable is the real per-row truth from the backend (e.g. a Binance-preset row is
  // fetchable even though type==='api' is generically not) — carried through so step 3 shows the
  // real interval/lookback controls when editing an already-adopted preset.
  NewsWizard={step:2, editingId:id, type:s.type, form:{name:s.name,url:s.url||'',category:s.category||'',fetchIntervalMinutes:s.fetch_interval_minutes,lookbackHours:s.lookback_hours,enabled:!!s.enabled,fetchable:!!s.fetchable}, testing:false, testError:null};
  renderNsWizard();
}
async function nsDelete(id){
  try{
    const res=await fetch(`${BACKEND_URL}/api/news-sources/${id}`, {method:'DELETE'});
    const data=await res.json();
    if(!data.ok){ toast(data.error||'删除失败'); return; }
    await loadNewsSourcesFromBackend();
    toast('已删除新闻源');
  }catch(err){
    toast('删除失败：'+err.message);
  }
}
async function nsToggle(id){
  const s=Store.newsSources.find(x=>x.id===id);
  if(!s) return;
  try{
    const res=await fetch(`${BACKEND_URL}/api/news-sources/${id}`, {method:'PATCH', headers:{'Content-Type':'application/json'}, body:JSON.stringify({enabled:!s.enabled})});
    const data=await res.json();
    if(!data.ok){ toast(data.error||'操作失败'); return; }
    Object.assign(s,data.source);
    refreshNsTable();
  }catch(err){
    toast('操作失败：'+err.message);
  }
}

function renderNsWizard(){
  if(!NewsWizard) return openNewsSourceManager();
  if(NewsWizard.step===1) return renderNsStep1();
  if(NewsWizard.step===2) return renderNsStep2();
  return renderNsStep3();
}
function renderNsStep1(){
  openModal(`
    <div class="modal-head"><h3>添加新闻源</h3><button class="close-x" onclick="closeModal()">✕</button></div>
    <div class="small-note" style="margin-bottom:16px">请选择新闻源类型</div>
    <div style="display:grid; grid-template-columns:repeat(4,1fr); gap:12px">
      ${Object.entries(NEWS_SOURCE_TYPES).map(([key,t])=>`
        <div class="ns-type-card" data-action="ns-select-type" data-type="${key}">
          <span class="ic">${t.icon(22)}</span>
          <div class="t">${t.label}</div>
          <div class="d">${t.desc}</div>
        </div>
      `).join('')}
    </div>
    <div class="weight-hint" style="margin-top:16px">ⓘ 推荐使用 RSS 或官方公告，数据更稳定可靠</div>
    <div style="display:flex; justify-content:flex-end; margin-top:18px">
      <button class="btn" data-action="ns-cancel">取消</button>
    </div>
  `);
}
function renderNsStep2(){
  const t=NEWS_SOURCE_TYPES[NewsWizard.type];
  const f=NewsWizard.form;
  openModal(`
    <div class="modal-head"><h3>${NewsWizard.editingId?'编辑':'添加'} ${t.label} 新闻源</h3><button class="close-x" onclick="closeModal()">✕</button></div>
    <div class="field" style="margin-bottom:14px">
      <label>名称 *</label>
      <input type="text" id="ns-f-name" placeholder="例如：CoinDesk" value="${escapeAttr(f.name)}">
    </div>
    <div class="field" style="margin-bottom:14px">
      <label>${t.urlLabel} *</label>
      <input type="text" id="ns-f-url" placeholder="${escapeAttr(t.urlPlaceholder)}" value="${escapeAttr(f.url)}">
    </div>
    <div class="field" style="margin-bottom:4px">
      <label>分类 *</label>
      <select id="ns-f-category">
        <option value="">选择分类</option>
        ${NEWS_SOURCE_CATEGORIES.map(c=>`<option value="${c}" ${f.category===c?'selected':''}>${c}</option>`).join('')}
      </select>
    </div>
    <div style="display:flex; justify-content:space-between; margin-top:20px">
      <button class="btn" data-action="ns-cancel">取消</button>
      <button class="btn btn-primary" data-action="ns-step2-next">下一步 →</button>
    </div>
  `);
}
function renderNsStep3(){
  const f=NewsWizard.form;
  const t=NEWS_SOURCE_TYPES[NewsWizard.type];
  // For an edit, f.fetchable carries the real per-row truth from the backend (e.g. a Binance
  // preset row is fetchable despite type==='api' being generically not); for a fresh add it's
  // null, so fall back to the type's static default until the source actually exists to check.
  const fetchable = f.fetchable!=null ? f.fetchable : t.fetchable;
  const testResultHtml = NewsWizard.testError
    ? `<div class="empty-hint" style="padding:10px; text-align:left; color:var(--red)">${iconStatusError()} ${escapeAttr(NewsWizard.testError)}</div>`
    : '';
  openModal(`
    <div class="modal-head"><h3>配置抓取设置</h3><button class="close-x" onclick="closeModal()">✕</button></div>
    ${fetchable ? `
    <div class="field" style="margin-bottom:14px">
      <label>抓取频率</label>
      <select id="ns-f-interval">
        ${[5,10,15,30,60].map(m=>`<option value="${m}" ${f.fetchIntervalMinutes===m?'selected':''}>每 ${m<60?m+' 分钟':'1 小时'}</option>`).join('')}
      </select>
    </div>
    <div class="field" style="margin-bottom:14px">
      <label>抓取范围（多久以内的新闻算有效）</label>
      <select id="ns-f-lookback">
        ${[24,72,168].map(h=>`<option value="${h}" ${f.lookbackHours===h?'selected':''}>${h===24?'最近 24 小时':h===72?'最近 3 天':'最近 7 天'}</option>`).join('')}
      </select>
    </div>
    ` : `<div class="weight-hint" style="margin-bottom:14px">ⓘ ${t.label} 类型暂无真实抓取实现，这里只保存配置，不会实际抓取新闻</div>`}
    <div class="foot-row" style="padding:8px 0 4px">
      <span style="font-weight:600; color:var(--text)">启用该新闻源</span>
      <button class="switch ${f.enabled?'on':''}" data-action="ns-toggle-enabled"></button>
    </div>
    ${testResultHtml}
    <div style="display:flex; justify-content:space-between; margin-top:18px">
      <button class="btn" data-action="ns-step3-back">← 上一步</button>
      <button class="btn btn-primary" data-action="ns-test-save" ${NewsWizard.testing?'disabled':''}>${NewsWizard.testing?'保存中…':(fetchable?'测试并保存':'保存')}</button>
    </div>
  `);
}
function nsReadStep2Fields(){
  NewsWizard.form.name=document.getElementById('ns-f-name').value.trim();
  NewsWizard.form.url=document.getElementById('ns-f-url').value.trim();
  NewsWizard.form.category=document.getElementById('ns-f-category').value;
}
function nsReadStep3Fields(){
  const f=NewsWizard.form;
  const fetchable = f.fetchable!=null ? f.fetchable : NEWS_SOURCE_TYPES[NewsWizard.type].fetchable;
  if(fetchable){
    NewsWizard.form.fetchIntervalMinutes=Number(document.getElementById('ns-f-interval').value);
    NewsWizard.form.lookbackHours=Number(document.getElementById('ns-f-lookback').value);
  }
}
/** Real POST (add) / PATCH (edit) to the backend — the backend itself runs the actual RSS
 * reachability test for rss/official types before persisting (server.ts), so a failed test never
 * gets saved; this function just reflects whatever the backend genuinely did. */
async function nsTestAndSave(){
  nsReadStep3Fields();
  const f=NewsWizard.form;
  if(!f.name||!f.url||!f.category){ toast('请填写完整信息'); return; }
  NewsWizard.testing=true; NewsWizard.testError=null; renderNsStep3();
  const payload={
    name:f.name, url:f.url, type:NewsWizard.type, category:f.category, enabled:f.enabled,
    fetch_interval_minutes:f.fetchIntervalMinutes||15, lookback_hours:f.lookbackHours||24,
  };
  try{
    const method=NewsWizard.editingId?'PATCH':'POST';
    const endpoint=NewsWizard.editingId?`${BACKEND_URL}/api/news-sources/${NewsWizard.editingId}`:`${BACKEND_URL}/api/news-sources`;
    const res=await fetch(endpoint,{method,headers:{'Content-Type':'application/json'},body:JSON.stringify(payload)});
    const data=await res.json();
    if(!data.ok){ NewsWizard.testing=false; NewsWizard.testError=data.error||'保存失败'; renderNsStep3(); toast(data.error||'保存失败'); return; }
  }catch(err){
    NewsWizard.testing=false; NewsWizard.testError='本地后端未启动或不可达（'+BACKEND_URL+'）：'+err.message; renderNsStep3(); toast('保存失败'); return;
  }
  NewsWizard=null;
  await loadNewsSourcesFromBackend();
  openNewsSourceManager();
  toast('新闻源已保存');
}

function openSourceDetailModal(key){
  // DATA_SOURCE_SPEC.md: Market and Liquidation are the reference modules built so far for the
  // richer per-source "Detail Page" (Overview → Historical Charts → Statistics → Latest
  // Updates → Raw Values). Other 9 modules still use the generic item-list modal below until
  // they get the same treatment.
  if(key==='market'){ openMarketDetail(Store.marketDetailSymbol||'BTCUSDT'); return; }
  if(key==='liquidation'){ openLiquidationDetail(); return; }
  const s=DASHBOARD_SOURCES.find(x=>x.key===key);
  const live=Store.live[key];
  const meta=Store.liveMeta[key];
  const liveOk=live && meta && meta.status==='ok' && live.itemsRaw && live.itemsRaw.length>0;
  const statusText = !meta||meta.status==='loading' ? `${iconStatusLoading()} 正在获取实时数据…`
    : meta.status==='ok' ? `${iconStatusLive()} 实时，更新于 ${fmtClock(meta.updatedAt)}`
    : meta.status==='stub' ? `${iconStatusStub()} 暂未接入真实数据`
    : `${iconStatusError()} 连接失败`;

  const itemsHtml = liveOk ? live.itemsRaw.map(it=>`
    <div style="border:1px solid var(--border); border-radius:10px; padding:12px 14px">
      <div style="display:flex; flex-wrap:wrap; justify-content:space-between; gap:2px 12px; align-items:baseline">
        <span style="font-weight:700; font-size:13px; min-width:0; overflow-wrap:break-word; flex:1 1 auto">${it.label}</span>
        <span class="mono fw ${it.polarity==='bullish'?'up':it.polarity==='bearish'?'down':''}" style="text-align:right; min-width:0; overflow-wrap:break-word; flex:0 1 auto">${it.value}</span>
      </div>
      ${it.detail?`<div class="small-note" style="margin-top:6px">${it.detail}</div>`:''}
      <div style="margin-top:6px; display:flex; justify-content:space-between; align-items:center">
        ${it.sourceUrl?`<a href="${it.sourceUrl}" target="_blank" rel="noopener" style="font-size:11.5px; color:var(--primary); text-decoration:none">来源链接 ↗</a>`:'<span></span>'}
        ${key==='news'&&it.timestamp?`<span style="font-size:10.5px;color:var(--text-3)">${relTimeReal(it.timestamp)}</span>`:''}
      </div>
    </div>
  `).join('') : `<div class="empty-hint" style="padding:24px 8px">${statusText}${meta&&meta.error?`<div style="font-size:11.5px;color:var(--text-3);margin-top:8px">${escapeAttr(meta.error)}</div>`:''}</div>`;

  openModal(`
    <div class="modal-head"><h3>${s.icon} ${s.name}</h3><button class="close-x" onclick="closeModal()">✕</button></div>
    <div class="small-note" style="margin-bottom:14px">${s.desc}</div>
    <div class="kv-list" style="margin-bottom:16px">
      <div class="row"><span class="k">状态</span><span class="v">${statusText}</span></div>
      ${liveOk?`<div class="row"><span class="k">条目数</span><span class="v">${live.itemsRaw.length}</span></div>`:''}
    </div>
    <div style="display:flex; flex-direction:column; gap:10px; max-height:50vh; overflow-y:auto">${itemsHtml}</div>
  `);
}
